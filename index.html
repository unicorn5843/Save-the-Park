            game.camera.x = Math.max(0, Math.min(maxX, game.camera.x));
            game.camera.y = Math.max(0, Math.min(maxY, game.camera.y));
        }

        // ========== CAMERA FOLLOW ==========
        function updateCamera(dt) {
            if (game.cameraUserLock > 0) { game.cameraUserLock -= dt; return; }
            if (game.mouse.down) return;
            const idx = game.selectedSyndicate;
            let cx = 0, cy = 0, n = 0;
            for (const o of game.officers) {
                if (o.alive && o.syndicateIndex === idx && o.state === 'active') { cx += o.x; cy += o.y; n++; }
            }
            if (n === 0) return;
            cx /= n; cy /= n;
            const targetX = cx - game.width / 2;
            const targetY = cy - game.height / 2;
            const k = Math.min(1, dt * 3.2);
            game.camera.x += (targetX - game.camera.x) * k;
            game.camera.y += (targetY - game.camera.y) * k;
            clampCamera();
        }

        // ========== LEFT PANEL UI ==========
        const FORMATION_DEFS = [
            { key: 'rest', label: '😌 Rest', desc: 'Shields down, spaced out for recovery. HP regenerates, but officers take more damage if hit.' },
            { key: 'reform', label: '🛡️ Reform', desc: 'Shields up, standard block. Assembles on the command marker.' },
            { key: 'closedwall', label: '🧱 Closed Wall', desc: 'Fills the ENTIRE road width, edge to edge. Extra officers backfill behind the front line. Nothing gets past.' },
            { key: 'staggeredwall', label: '🧱 Staggered Wall', desc: 'Full-width line with alternate rows offset. Officers reach further, but a gap can open up.' },
            { key: 'stackleft', label: '⬅️ Stack Left', desc: 'Press up against the left kerb, leaving the right half of the road clear.' },
            { key: 'stackright', label: '➡️ Stack Right', desc: 'Press up against the right kerb, leaving the left half of the road clear.' },
            { key: 'box', label: '📦 Box', desc: 'Three-sided box. Front row faces direction of travel, sides extend back. Rigid alignment.' },
        ];
        const ORDER_DEFS = [
            { key: 'batonsfree', label: '🏏 Batons Free', desc: 'Standing order — keeps the current formation and lets officers strike any raider in reach.' },
            { key: 'disperse', label: '💨 Disperse', desc: 'Standing order — 10 seconds of triple damage and aggression. Formation is unchanged.' },
        ];

        function renderOptionsPanel() {
            const panel = document.getElementById('options-panel');
            panel.innerHTML = '';
            const sy = ensureSyndicateState(game.selectedSyndicate);

            const flabel = document.createElement('div');
            flabel.className = 'section-label';
            flabel.textContent = 'Formation';
            panel.appendChild(flabel);

            FORMATION_DEFS.forEach(t => {
                const b = document.createElement('button');
                b.textContent = t.label;
                if (sy.tactic === t.key) b.classList.add('active-choice');
                b.addEventListener('click', () => applyTactic(t.key));
                panel.appendChild(b);
            });

            const found = FORMATION_DEFS.find(t => t.key === sy.tactic);
            if (found) {
                const d = document.createElement('div');
                d.className = 'info-line'; d.textContent = found.desc;
                panel.appendChild(d);
            }

            const olabel = document.createElement('div');
            olabel.className = 'section-label';
            olabel.textContent = 'Standing Orders';
            panel.appendChild(olabel);

            ORDER_DEFS.forEach(o => {
                const b = document.createElement('button');
                b.className = 'order-btn';
                b.textContent = o.label;
                if (o.key === 'batonsfree' && sy.batonsFree) b.classList.add('active-choice');
                if (o.key === 'disperse' && sy.disperseTimer > 0) b.classList.add('active-choice');
                if (o.key === 'disperse' && sy.disperseTimer > 0) b.disabled = true;
                b.addEventListener('click', () => applyOrder(o.key));
                panel.appendChild(b);
            });

            if (sy.disperseTimer > 0) {
                const d = document.createElement('div');
                d.className = 'info-line';
                d.style.color = '#ffcc33';
                d.textContent = '🔥 DISPERSE ACTIVE: ' + Math.ceil(sy.disperseTimer) + 's';
                panel.appendChild(d);
            }

            const kb = document.createElement('button');
            kb.textContent = '🐕 K9 Unit';
            kb.disabled = true;
            panel.appendChild(kb);
        }

        // ========== BOTTOM-RIGHT UI ==========
        function renderSyndicateTabs() {
            const tabs = document.querySelectorAll('#syndicate-tabs .syn-btn');
            tabs.forEach((b, idx) => {
                const exists = idx < game.syndicatesDeployed;
                const count = game.officers.filter(o => o.alive && o.syndicateIndex === idx && o.state === 'active').length;
                b.disabled = !exists;
                b.textContent = 'Synd. ' + (idx + 1) + (exists ? ' (' + count + ')' : '');
                b.classList.toggle('active', idx === game.selectedSyndicate && exists);
            });
        }

        function setupBottomRightUI() {
            document.querySelectorAll('#syndicate-tabs .syn-btn').forEach(b => {
                b.addEventListener('click', () => {
                    const idx = parseInt(b.dataset.idx, 10);
                    if (idx >= game.syndicatesDeployed) return;
                    game.selectedSyndicate = idx;
                    renderSyndicateTabs();
                    renderOptionsPanel();
                    updateSelectionUI();
                    game.cameraUserLock = 0;
                });
            });

            document.getElementById('btn-up').addEventListener('click', () => commandMove(0, -1));
            document.getElementById('btn-down').addEventListener('click', () => commandMove(0, 1));
            document.getElementById('btn-left').addEventListener('click', () => commandMove(-1, 0));
            document.getElementById('btn-right').addEventListener('click', () => commandMove(1, 0));
        }

        function updateMoveButtons() {
            document.getElementById('btn-up').disabled = !canMove(0, -1);
            document.getElementById('btn-down').disabled = !canMove(0, 1);
            document.getElementById('btn-left').disabled = !canMove(-1, 0);
            document.getElementById('btn-right').disabled = !canMove(1, 0);
        }

        function updateSelectionUI() {
            const idx = game.selectedSyndicate;
            const count = game.officers.filter(o => o.alive && o.syndicateIndex === idx && o.state === 'active').length;
            const sy = game.syndicates[idx];
            const el = document.getElementById('selection-info');
            if (!sy || count === 0) { el.textContent = ''; return; }
            const tacticLabel = (FORMATION_DEFS.find(t => t.key === sy.tactic) || {}).label || sy.tactic;
            let extra = '';
            if (sy.batonsFree) extra += ' · 🏏 Batons Free';
            if (sy.disperseTimer > 0) extra += ' · 💨 ' + Math.ceil(sy.disperseTimer) + 's';
            el.textContent = 'Syndicate ' + (idx + 1) + ' — ' + count + ' officers — ' + tacticLabel + extra;
        }

        // ========== HUD ==========
        function updateStats() {
            document.getElementById('wave').textContent = game.waveNumber;
            document.getElementById('routed').textContent = game.routed;
            const objEl = document.getElementById('objective');
            if (objEl) objEl.textContent = OBJECTIVE_SHORT[game.raidAI.objective] || '—';

            const baseFill = document.getElementById('base-hp-fill');
            const basePct = game.baseHp / BASE_MAX_HP;
            baseFill.style.width = Math.round(basePct * 100) + '%';
            baseFill.className = 'stat-fill' + (basePct < 0.3 ? ' crit' : basePct < 0.6 ? ' low' : '');
            document.getElementById('base-hp-num').textContent = Math.ceil(game.baseHp) + '/' + BASE_MAX_HP;

            const aliveOfficers = game.officers.filter(o => o.alive).length;
            const cap = MAX_SYNDICATES * OFFICERS_PER_SYNDICATE;
            document.getElementById('troop-fill').style.width = Math.round(100 * aliveOfficers / cap) + '%';
            document.getElementById('troop-num').textContent = aliveOfficers + '/' + cap;

            const moraleFill = document.getElementById('morale-fill');
            moraleFill.style.width = Math.round(game.waveMoralePct) + '%';
            document.getElementById('morale-num').textContent = Math.round(game.waveMoralePct) + '%';

            renderSyndicateTabs();
            updateMoveButtons();
        }

        // ========== RENDER ==========
        function render() {
            const ctx = game.ctx;
            ctx.clearRect(0, 0, game.width, game.height);
            if (game.terrainCanvas) {
                ctx.drawImage(game.terrainCanvas, game.camera.x, game.camera.y, game.width, game.height, 0, 0, game.width, game.height);
            }
            const all = [];
            game.officers.forEach(o => { if (o.alive) all.push(o); });
            game.raiders.forEach(r => { if (r.alive) all.push(r); });
            all.sort((a, b) => a.y - b.y);
            all.forEach(u => u.draw(ctx));
            drawEffects(ctx);

            // Command marker
            const sy = game.syndicates[game.selectedSyndicate];
            if (sy) {
                const sx = sy.commandX - game.camera.x;
                const sy_ = sy.commandY - game.camera.y;
                ctx.strokeStyle = 'rgba(255, 204, 51, 0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(sx, sy_, 12, 0, Math.PI * 2);
                ctx.stroke();
                const fx = sy.facingX || 1, fy = sy.facingY || 0;
                ctx.beginPath();
                ctx.moveTo(sx, sy_);
                ctx.lineTo(sx + fx * 18, sy_ + fy * 18);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawMinimap() {
            const mm = document.getElementById('minimap');
            if (mm.width !== MINIMAP_W || mm.height !== MINIMAP_H) { mm.width = MINIMAP_W; mm.height = MINIMAP_H; }
            const ctx = game.minimapCtx;
            ctx.clearRect(0, 0, MINIMAP_W, MINIMAP_H);
            if (game.minimapTerrainCanvas) ctx.drawImage(game.minimapTerrainCanvas, 0, 0);
            game.officers.forEach(o => {
                if (!o.alive || o.state !== 'active') return;
                ctx.fillStyle = '#6cc4ff';
                ctx.fillRect((o.x / TILE) * MINIMAP_SCALE, (o.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.raiders.forEach(r => {
                if (!r.alive || r.state === 'fleeing') return;
                ctx.fillStyle = r.routeKey === 'north' ? '#ffb45c' : '#ff8a5c';
                ctx.fillRect((r.x / TILE) * MINIMAP_SCALE, (r.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            // Building attack markers
            sceneryBuildings.forEach(b => {
                if (!b.alive || b.hp >= b.maxHp) return;
                ctx.fillStyle = '#e86858';
                ctx.fillRect((b.tx) * MINIMAP_SCALE - 1, (b.ty) * MINIMAP_SCALE - 1, 3, 3);
            });
            ctx.strokeStyle = 'rgba(255,204,51,0.8)'; ctx.lineWidth = 1;
            ctx.strokeRect(game.camera.x / TILE * MINIMAP_SCALE, game.camera.y / TILE * MINIMAP_SCALE,
                game.width / TILE * MINIMAP_SCALE, game.height / TILE * MINIMAP_SCALE);
        }

        // ========== GAME OVER ==========
        function endGame(win) {
            game.gameOver = true;
            const overlay = document.getElementById('gameover-overlay');
            document.getElementById('gameover-title').textContent = win ? '🏆 Order Restored' : '💥 Line Broken';
            document.getElementById('gameover-stats').textContent =
                'Waves held: ' + (game.waveNumber - 1) +
                '  •  Raiders routed: ' + game.routed +
                '  •  Buildings lost: ' + game.buildingsDestroyed;
            overlay.classList.add('show');
        }
        function restartGame() {
            document.getElementById('gameover-overlay').classList.remove('show');
            initGameState();
            generateMap();
            buildTerrainCanvas();
            buildMinimapTerrainCanvas();
            spawnSyndicate();
            renderSyndicateTabs();
            renderOptionsPanel();
            updateSelectionUI();
        }

        // ========== MAIN LOOP ==========
        function loop(t) {
            const dt = Math.min(0.05, (t - (game.lastTime || t)) / 1000);
            game.lastTime = t;
            if (!game.gameOver) {
                updateTraining(dt);
                updateWaves(dt);
                updateRaidAI(dt);

                game.syndicates.forEach(sy => {
                    if (sy && sy.disperseTimer > 0) {
                        sy.disperseTimer -= dt;
                        if (sy.disperseTimer <= 0) {
                            sy.disperseTimer = 0;
                            renderOptionsPanel();
                            updateSelectionUI();
                        }
                    }
                });

                assignFormation();
                game.attackerCounts.clear();
                game.officers.forEach(o => o.update(dt));
                game.raiders.forEach(r => r.update(dt));
                updateEffects(dt);
                updateCamera(dt);
                updateStats();
            }
            render();
            drawMinimap();
            requestAnimationFrame(loop);
        }

        // ========== INIT ==========
        function initGameState() {
            game.officers = []; game.raiders = []; game.effects = [];
            game.syndicates = [];
            game.selectedSyndicate = 0;
            game.baseHp = BASE_MAX_HP;
            game.syndicatesDeployed = 0;
            game.syndicateQueue = 0;
            game.syndicateTimer = 0;
            game.waveNumber = 1;
            game.waveState = 'intermission';
            game.waveTimer = 10;
            game.waveMoralePct = 100;
            game.waveTotalHp = 0;
            game.waveSpawnQueue = [];
            game.routed = 0;
            game.gameOver = false;
            game.cameraUserLock = 0;
            game.attackerCounts.clear();
            game.totalRaidersInWave = 0;
            game.raidersDefeated = 0;
            game.raiderGroupMorale = 100;
            game.buildingsDestroyed = 0;
            game.raidAI = { objective: 'base', stance: 'push', timer: 8, holdTimer: 0 };
        }

        function resizeCanvas() {
            const c = game.canvas;
            game.width = window.innerWidth;
            game.height = window.innerHeight - document.getElementById('ad-banner').offsetHeight;
            const dpr = window.devicePixelRatio || 1;
            c.width = game.width * dpr; c.height = game.height * dpr;
            c.style.width = game.width + 'px'; c.style.height = game.height + 'px';
            game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            clampCamera();
        }

        function setupMinimapDPR() {
            const mm = document.getElementById('minimap');
            game.minimapCtx = mm.getContext('2d');
        }
        function handleOrientationChange() { setTimeout(rebuildWorldForScreenSize, 300); }
        function rebuildWorldForScreenSize() {
            resizeCanvas();
            computeMapSize();
            computeMinimapSize();
            generateMap();
            buildTerrainCanvas();
            buildMinimapTerrainCanvas();
            game.syndicates.forEach(sy => {
                if (!sy) return;
                sy.commandX = Math.max(0, Math.min(MAP_W * TILE, sy.commandX));
                sy.commandY = Math.max(0, Math.min(MAP_H * TILE, sy.commandY));
            });
            assignFormation();
            clampCamera();
        }
        function isLandscapeReady() { return window.innerWidth > window.innerHeight; }

        function init() {
            game.canvas = document.getElementById('game');
            game.ctx = game.canvas.getContext('2d');
            setupMinimapDPR();
            setupEvents();
            setupBottomRightUI();
            document.getElementById('train-syndicate').addEventListener('click', trainSyndicate);
            document.getElementById('train-arrest').addEventListener('click', () => showToast('Arrest teams — coming in the next update!'));
            document.getElementById('gameover-restart').addEventListener('click', restartGame);
            window.addEventListener('resize', () => setTimeout(rebuildWorldForScreenSize, 50));
            window.addEventListener('orientationchange', handleOrientationChange);

            initGameState();
            resizeCanvas();
            computeMapSize();
            computeMinimapSize();
            loadAssets(() => {
                generateMap();
                buildTerrainCanvas();
                buildMinimapTerrainCanvas();
                spawnSyndicate();
                renderSyndicateTabs();
                renderOptionsPanel();
                updateSelectionUI();
                requestAnimationFrame(loop);
            });
        }
        function bootWhenReady() {
            if (isLandscapeReady()) init();
            else {
                const check = setInterval(() => {
                    if (isLandscapeReady()) { clearInterval(check); init(); }
                }, 300);
            }
        }
        bootWhenReady();
    </script>
</body>
