        // ========== WAVES ==========
        const OBJECTIVE_LABELS = { base: 'Reach the Station', buildings: 'Vandalize the City', hunt: 'Attack the Officers' };
        const OBJECTIVE_SHORT = { base: 'Station', buildings: 'Vandalism', hunt: 'Hunt Officers' };

        // Every gate is a valid way in. Tactics are now built around *how many* entrances
        // are used and *where the pressure is applied*, not a fixed list.
        const ALL_EXITS = ['N18', 'N30', 'N54', 'N78', 'N90', 'S12', 'S96'];

        const WAVE_TONES = {
            1: 'Probing Advance',
            2: 'Twin Thrust',
            3: 'Coordinated Push',
            4: 'Widening Assault',
            5: 'Massed Assault',
            6: 'Rolling Offensive',
        };

        // Scores how heavily a gate's approach corridor is defended.
        function exitDefence(exitId) {
            const n = getNode(exitId);
            if (!n) return 1;
            let score = 0;
            const path = findPathWeighted(exitId, 'B54', null);
            const pts = [];
            if (path && path.length > 1) {
                for (let i = 0; i < path.length - 1; i++) {
                    const a = getNode(path[i]), b = getNode(path[i + 1]);
                    if (!a || !b) continue;
                    pts.push({ x: (a.x + b.x) / 2 * TILE, y: (a.y + b.y) / 2 * TILE });
                }
            }
            if (!pts.length) pts.push({ x: n.x * TILE, y: n.y * TILE });
            let samples = 0;
            for (const p of pts) {
                samples++;
                for (const o of game.officers) {
                    if (!o.alive || o.isAllOut || o.state !== 'active') continue;
                    const sy = game.syndicates[o.syndicateIndex];
                    const alert = sy ? !syndicateIsPassive(sy) : true;
                    const d = Math.hypot(o.x - p.x, o.y - p.y);
                    if (d < TILE * 16) score += (alert ? 1.8 : 0.5) * (1 - d / (TILE * 16));
                }
                // a parked water cannon on the corridor also counts
                if (game.vehicle && game.vehicle.alive) {
                    const d = Math.hypot(game.vehicle.x - p.x, game.vehicle.y - p.y);
                    if (d < TILE * 12) score += 2.0 * (1 - d / (TILE * 12));
                }
            }
            return 1 + score / Math.max(1, samples);
        }

        function startWave() {
            game.waveState = 'active';
            game.waveMoralePct = 100;
            game.routed = 0;
            game.raidersDefeated = 0;
            game.raiderGroupMorale = 100;

            const wave = game.waveNumber;
            game.waveIntensity = 1 + (wave - 1) * 0.045;

            const ai = game.raidAI;
            const roll = Math.random();
            if (wave <= 1) ai.objective = 'base';
            else if (roll < 0.42) ai.objective = 'base';
            else if (roll < 0.74) ai.objective = 'buildings';
            else ai.objective = 'hunt';

            const raiderCount = 20 + wave * 6;
            const crowdCount = wave <= 1 ? 0 : Math.min(24, 5 + wave * 2);

            // ---- Choose how many gates and which ones. More gates as the waves go on. ----
            const maxGates = wave <= 1 ? 1 : wave <= 2 ? 2 : wave <= 4 ? 3 : wave <= 6 ? 4 : wave <= 9 ? 5 : 6;
            const gateCount = Math.max(1, Math.min(ALL_EXITS.length, 1 + Math.floor(Math.random() * maxGates)));
            const shuffled = ALL_EXITS.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const exits = shuffled.slice(0, gateCount);

            // ---- Weight the allocation toward the least-defended gates. ----
            const weights = exits.map(e => 1 / exitDefence(e));
            const wSum = weights.reduce((a, b) => a + b, 0) || 1;

            game.squads = new Map();
            game.nextSquadId = 1;
            const createdSquads = [];
            let assigned = 0;

            for (let i = 0; i < exits.length; i++) {
                let share = (i === exits.length - 1)
                    ? (raiderCount - assigned)
                    : Math.round(raiderCount * weights[i] / wSum);
                share = Math.max(4, share);
                if (i === exits.length - 1) share = Math.max(1, raiderCount - assigned);
                if (share <= 0) continue;
                const squad = new RaiderSquad(game.nextSquadId++, exits[i], pickPersonality());
                game.squads.set(squad.id, squad);
                createdSquads.push({ squad, count: share });
                assigned += share;
                const r = Math.random();
                squad.role = (r < 0.55) ? 'main' : (r < 0.8) ? 'flank' : 'distraction';
                squad.targetSyndicate = Math.floor(Math.random() * OFFICER_SYNDICATES);
            }

            game.waveSpawnQueue = [];
            let totalHp = 0;
            for (const { squad, count } of createdSquads) {
                for (let i = 0; i < count; i++) {
                    const roll2 = Math.random();
                    let kind = 'standard';
                    if (roll2 < 0.15) kind = 'brickthrower';
                    else if (roll2 < 0.40) kind = 'bruiser';
                    game.waveSpawnQueue.push({ kind, squadId: squad.id });
                    totalHp += RAIDER_TYPES[kind].hp;
                }
            }
            // ---- Peaceful protesters: their own squads, one per pair of gates. ----
            if (crowdCount > 0) {
                const crowdSquads = Math.min(2, Math.max(1, Math.floor(gateCount / 2)));
                for (let c = 0; c < crowdSquads; c++) {
                    const exit = exits[Math.floor(Math.random() * exits.length)];
                    const squad = new RaiderSquad(game.nextSquadId++, exit, 'sneaky');
                    squad.isCrowd = true;
                    squad.role = 'crowd';
                    game.squads.set(squad.id, squad);
                    const per = Math.max(3, Math.floor(crowdCount / crowdSquads));
                    for (let i = 0; i < per; i++) game.waveSpawnQueue.push({ kind: 'crowd', squadId: squad.id });
                }
            }

            for (let i = game.waveSpawnQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [game.waveSpawnQueue[i], game.waveSpawnQueue[j]] = [game.waveSpawnQueue[j], game.waveSpawnQueue[i]];
            }

            game.waveTotalHp = totalHp;
            game.totalRaidersInWave = raiderCount;
            game.waveSpawnTimer = 0;
            announceWave(exits.length, gateCount);
        }

        function updateWaves(dt) {
            if (game.testMode) return;
            if (game.waveState === 'intermission') {
                game.waveTimer -= dt;
                if (game.waveTimer <= 0) startWave();
                return;
            }
            game.waveSpawnTimer -= dt;
            if (game.waveSpawnQueue.length > 0 && game.waveSpawnTimer <= 0) {
                const entry = game.waveSpawnQueue.shift();
                const squad = game.squads.get(entry.squadId);
                if (squad) {
                    const startNode = getNode(squad.spawnNodeId);
                    if (startNode) {
                        let sx = startNode.x * TILE + (Math.random() - 0.5) * TILE * 2;
                        let sy = startNode.y * TILE + (Math.random() - 0.5) * TILE;
                        sx = Math.max(TILE, Math.min(MAP_W * TILE - TILE, sx));
                        sy = Math.max(TILE, Math.min(MAP_H * TILE - TILE, sy));
                        if (!isValidPosition(sx, sy)) {
                            sx = startNode.x * TILE;
                            sy = startNode.y * TILE;
                        }
                        const r = new Raider(entry.kind, squad.spawnNodeId, squad.id, sx, sy);
                        r.goalNodeId = r.pickGoalNode();
                        r.recomputeRoute();
                        r.routeIdx = Math.min(1, Math.max(0, r.route.length - 1));
                        game.raiders.push(r);
                    }
                }
                game.waveSpawnTimer = 0.10 + Math.random() * 0.18;
            }

            const anyCombat = game.raiders.some(r => r.alive && r.kind !== 'crowd');
            // Once the fighting element is done, the crowd melts away.
            if (!anyCombat) {
                for (const r of game.raiders) {
                    if (r.alive && r.kind === 'crowd' && r.state !== 'fleeing') r.startFleeing();
                }
            }

            const anyLeft = game.raiders.some(r => r.alive) || game.waveSpawnQueue.length > 0;
            const moraleBroken = game.waveMoralePct <= 0;
            const routedEnough = (game.raidersDefeated / Math.max(1, game.totalRaidersInWave)) >= 0.95;

            if (moraleBroken || routedEnough) {
                game.waveSpawnQueue = [];
                for (const r of game.raiders) {
                    if (r.alive && r.state !== 'fleeing' && !r.beingArrested) { r.startFleeing(); if (r.kind !== 'crowd') game.routed++; }
                }
            }

            if (!anyLeft || moraleBroken || routedEnough) {
                const stillFleeing = game.raiders.some(r => r.alive);
                if (!stillFleeing) {
                    game.raiders = [];
                    game.waveState = 'intermission';
                    game.waveNumber++;
                    game.waveTimer = 8;
                    showToast('Wave cleared — raiders dispersed!');
                }
            }
            if (game.baseHp <= 0 && !game.gameOver) endGame(false);
        }

        // ========== SQUAD AI DIRECTOR ==========
        function enterWallState(squad) {
            squad.state = 'wall';
            squad.stateTimer = 3 + Math.random() * 2;
            const c = squad.centroid;
            const obj = getNode('B54');
            const ox = obj ? obj.x * TILE : c.x;
            const oy = obj ? obj.y * TILE : c.y;
            const dx = ox - c.x, dy = oy - c.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                squad.wallPerpX = 0; squad.wallPerpY = 1;
                squad.wallTravelX = Math.sign(dx) || 1; squad.wallTravelY = 0;
            } else {
                squad.wallPerpX = 1; squad.wallPerpY = 0;
                squad.wallTravelX = 0; squad.wallTravelY = Math.sign(dy) || 1;
            }
            const members = squad.members();
            members.sort((a, b) => a.id - b.id);
            const n = members.length;
            const front = Math.min(6, n);
            const rows = Math.ceil(n / front);
            let i = 0;
            for (let row = 0; row < rows; row++) {
                const countThisRow = Math.min(front, n - i);
                for (let cIdx = 0; cIdx < countThisRow; cIdx++) {
                    const off = cIdx - (countThisRow - 1) / 2;
                    members[i].wallOffset = off;
                    members[i].wallBack = row * 1.4;
                    i++;
                }
            }
        }

        function updateSquadAI(dt) {
            const officers = game.officers.filter(o => o.alive && o.state === 'active');
            const wave = game.waveNumber;
            for (const squad of game.squads.values()) {
                if (squad.isCrowd) continue;
                const members = squad.members();
                if (members.length === 0) continue;
                squad.stateTimer -= dt;
                const c = squad.computeCentroid();
                if (c.count === 0) continue;

                if (squad.state === 'wall') {
                    const n = members.length;
                    const front = Math.min(6, n);
                    const rows = Math.ceil(n / front);
                    let i = 0;
                    const sorted = [...members].sort((a, b) => a.id - b.id);
                    for (let row = 0; row < rows; row++) {
                        const countThisRow = Math.min(front, n - i);
                        for (let cIdx = 0; cIdx < countThisRow; cIdx++) {
                            sorted[i].wallOffset = cIdx - (countThisRow - 1) / 2;
                            sorted[i].wallBack = row * 1.4;
                            i++;
                        }
                    }
                }

                let inContact = false;
                let nearestOfficerDist = Infinity;
                for (const r of members) {
                    for (const o of officers) {
                        const d = Math.hypot(r.x - o.x, r.y - o.y);
                        if (d < nearestOfficerDist) nearestOfficerDist = d;
                        if (d < TILE * 3.5) inContact = true;
                    }
                }
                squad.contactTimer = inContact ? 2.0 : Math.max(0, squad.contactTimer - dt);
                const officerDistTiles = nearestOfficerDist / TILE;

                if (squad.stateTimer > 0) continue;

                const avgHp = squad.avgHpPct();
                const spawnNode = getNode(squad.spawnNodeId);
                const spawnDist = spawnNode ? Math.hypot(spawnNode.x * TILE - c.x, spawnNode.y * TILE - c.y) : 999;

                if (squad.role === 'distraction' && !inContact && spawnDist > TILE * 14 &&
                    officerDistTiles < 12 && officerDistTiles > 4) {
                    squad.state = 'ambush';
                    squad.stateTimer = 4 + Math.random() * 3;
                    continue;
                }

                if (avgHp < 0.15 && squad.contactTimer <= 0 && spawnNode) {
                    squad.state = 'withdraw';
                    squad.rallyX = spawnNode.x * TILE;
                    squad.rallyY = spawnNode.y * TILE;
                    squad.stateTimer = 8 + Math.random() * 5;
                    continue;
                }
                const restBias = squad.personality === 'cautious' ? 0.55 : squad.personality === 'sneaky' ? 0.45 : 0.35;
                if (avgHp < restBias && squad.contactTimer <= 0) {
                    squad.state = 'rest';
                    squad.stateTimer = 5 + Math.random() * 3;
                    squad.rallyX = c.x; squad.rallyY = c.y;
                    continue;
                }
                // Later waves press harder and are more willing to form up and push.
                const wallChance = Math.min(0.85, 0.35 + wave * 0.04);
                if (!inContact && officerDistTiles < 6 + Math.min(6, wave) && members.length >= 2 && Math.random() < wallChance) {
                    enterWallState(squad);
                    continue;
                }
                squad.state = 'advance';
                squad.stateTimer = 9 + Math.random() * 4;
            }
        }

        function startInput(x, y) {
            game.mouse.down = true; game.mouse.moved = false;
            game.mouse.startX = x; game.mouse.startY = y; game.mouse.curX = x; game.mouse.curY = y;

        function moveInput(x, y) {
            if (!game.mouse.down) return;
            const dx = x - game.mouse.curX, dy = y - game.mouse.curY;
            if (Math.abs(x - game.mouse.startX) > 4 || Math.abs(y - game.mouse.startY) > 4) game.mouse.moved = true;
            game.camera.x -= dx; game.camera.y -= dy;
            game.cameraUserLock = 2.5;
            clampCamera();
            const tc = tightCamera(game.camera.x, game.camera.y);
            if (tc.x !== game.camera.x || tc.y !== game.camera.y) game.cameraUserLock = 8;
            game.mouse.curX = x; game.mouse.curY = y;
        }

        function handleTap(clientX, clientY) {
            if (game.gameOver) return;
            const wx = Math.max(TILE, Math.min(MAP_W * TILE - TILE, clientX + game.camera.x));
            const wy = Math.max(TILE, Math.min(MAP_H * TILE - TILE, clientY + game.camera.y));

            if (game.selectedSyndicate === VEHICLE_SYNDICATE) {
                let best = null, bestD = Infinity;
                for (const s of BLOCKADE_SPOTS) {
                    const d = Math.hypot(s.x - wx, s.y - wy);
                    if (d < bestD) { bestD = d; best = s; }

                if (best && bestD < TILE * 5) setVehicleTarget(best);
                else showToast('Tap near a road to move the water cannon vehicle.');

        function jumpCameraFromMinimap(x, y) {
            const rect = document.getElementById('minimap').getBoundingClientRect();
            const mx = (x - rect.left) / MINIMAP_SCALE, my = (y - rect.top) / MINIMAP_SCALE;
            game.camera.x = mx * TILE - game.width / 2;
            game.camera.y = my * TILE - game.height / 2;
            game.cameraUserLock = 2.5;
            clampCamera();
        }
        const CLOUD_M = 320;
        const CAMERA_PAD = { l: 150, r: 230, t: 80, b: 30 };
        function computeCameraPad() {
            const r = id => { const e = document.getElementById(id); return e ? e.getBoundingClientRect() : null; };
            const ld = r('left-dock'), rd = r('right-dock'), br = r('bottom-right-ui');
            const hud = r('hud-topleft'), tb = r('top-bar');
            const W = window.innerWidth;
            let l = ld && ld.width ? ld.right : 128;
            let rr = 0;
            if (rd && rd.width) rr = Math.max(rr, W - rd.left);
            if (br && br.width) rr = Math.max(rr, W - br.left);
            let t = 0;
            if (hud && hud.height) t = Math.max(t, hud.bottom);
            if (tb && tb.height) t = Math.max(t, tb.bottom);
            const cap = CLOUD_M - 40;
            CAMERA_PAD.l = Math.min(cap, Math.max(40, l + 20));
            CAMERA_PAD.r = Math.min(cap, Math.max(40, rr + 20));
            CAMERA_PAD.t = Math.min(cap, Math.max(40, t + 14));
            CAMERA_PAD.b = 30;
        }
        function tightCamera(x, y) {
            const maxX = Math.max(0, MAP_W * TILE - game.width);
            const maxY = Math.max(0, MAP_H * TILE - game.height);
            return { x: Math.max(0, Math.min(maxX, x)), y: Math.max(0, Math.min(maxY, y)) };
        }
        function clampCamera() {
            const minX = -CAMERA_PAD.l, minY = -CAMERA_PAD.t;
            const maxX = Math.max(minX, MAP_W * TILE - game.width + CAMERA_PAD.r);
            const maxY = Math.max(minY, MAP_H * TILE - game.height + CAMERA_PAD.b);
            game.camera.x = Math.max(minX, Math.min(maxX, game.camera.x));
            game.camera.y = Math.max(minY, Math.min(maxY, game.camera.y));
        }
        function followCameraTo(wx, wy, k) {
            const t = tightCamera(wx - game.width / 2, wy - game.height / 2);
            game.camera.x += (t.x - game.camera.x) * k;
            game.camera.y += (t.y - game.camera.y) * k;
            clampCamera();
        }

        // ========== CAMERA FOLLOW ==========
        function updateCamera(dt) {
            if (game.cameraUserLock > 0) { game.cameraUserLock -= dt; return; }
            if (game.mouse.down) return;

            const idx = game.selectedSyndicate;
            const k = Math.min(1, dt * 3.2);

            if (idx === VEHICLE_SYNDICATE && game.vehicle) {
                followCameraTo(game.vehicle.x, game.vehicle.y, k);
                return;
            }

            let cx = 0, cy = 0, n = 0;

            for (const o of game.officers) {
                if (!o.alive || o.isAllOut) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && o.syndicateIndex !== idx) continue;
                const w = (o.state === 'active') ? 1 : 0.3;
                cx += o.x * w; cy += o.y * w; n += w;
            }
            for (const a of game.arrestOfficers) {
                if (!a.alive) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && a.syndicateIndex !== idx) continue;
                cx += a.x; cy += a.y; n += 1;
            }
            for (const h of game.handlers) {
                if (!h.alive) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && h.syndicateIndex !== idx) continue;
                cx += h.x; cy += h.y; n += 1;
            }
            for (const t of game.tearGasOfficers) {
                if (!t.alive) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && t.syndicateIndex !== idx) continue;
                cx += t.x; cy += t.y; n += 1;
            }
            if (idx === STATION_INDEX) {
                for (const rp of game.repairOfficers) {
                    if (!rp.alive) continue;
                    cx += rp.x; cy += rp.y; n += 1;
                }
                for (const re of game.repairEscorts) {
                    if (!re.alive) continue;
                    cx += re.x; cy += re.y; n += 1;
                }
            }

            if (n <= 0) {
                for (const o of game.officers) {
                    if (o.alive && !o.isAllOut) { cx += o.x; cy += o.y; n++; }
                }
            }
            if (n <= 0) return;

            cx /= n; cy /= n;
            followCameraTo(cx, cy, k);
        }

            const resist = Math.round(formationResistance(activeTacticOf(sy)) * 100);
            const bits = [prefix + ' — ' + count + ' officers — ' + tacticLabel + ' · 🛡 ' + resist + '%'];
            if (tacticIsPassive(sy.tactic) && sy.provokedTimer <= 0) bits.push('🕊 holding fire');
            if (sy.provokedTimer > 0 && tacticIsPassive(sy.tactic)) bits.push('⚔ provoked ' + Math.ceil(sy.provokedTimer) + 's');
            if (sy.tactic === 'rest' && sy.autoWallTimer > 0) bits.push('🧱 wall ' + Math.ceil(sy.autoWallTimer) + 's');
            if (sy.disperseTimer > 0) bits.push('🔥 ' + Math.ceil(sy.disperseTimer) + 's');
            if (sy.path) bits.push('➤ moving');
            el.textContent = bits.join(' · ');
        }

        // ========== CLOUD BORDER ==========
        const CLOUD_SCALE = 0.5;
        const CLOUD_SKY = '#8db4d9';
        function makeCloudLayer(seed, spacing, keepInside, tint) {
            const mw = MAP_W * TILE, mh = MAP_H * TILE, M = CLOUD_M, S = CLOUD_SCALE;
            const c = document.createElement('canvas');
            c.width = Math.ceil((mw + 2 * M) * S); c.height = Math.ceil((mh + 2 * M) * S);
            const g = c.getContext('2d');
            g.scale(S, S); g.translate(M, M);
            const rnd = mulberry32(seed);
            const D = TILE * 3.5;
            const puffs = [];
            for (let gy = -M; gy <= mh + M; gy += spacing) {
                for (let gx = -M; gx <= mw + M; gx += spacing) {
                    const x = gx + (rnd() - 0.5) * spacing * 1.2, y = gy + (rnd() - 0.5) * spacing * 1.2;
                    const dIn = Math.min(x, mw - x, y, mh - y);
                    if (dIn > D) continue;
                    let prob = 1, sizeK = 1;
                    if (dIn > 0) { const f = 1 - dIn / D; prob = Math.pow(f, 1.3) * keepInside; sizeK = 0.55 + 0.45 * f; }
                    if (rnd() > prob) continue;
                    const r = (13 + rnd() * 17) * sizeK;
                    puffs.push({ x, y, r, a: rnd() < 0.5 ? 1 : -1 });
                }
            }
            puffs.sort((a, b) => a.y - b.y);
            const cluster = (p, fn) => {
                fn(p.x, p.y, p.r);
                fn(p.x - p.r * 0.85 * p.a, p.y + p.r * 0.2, p.r * 0.7);
                fn(p.x + p.r * 0.8 * p.a, p.y + p.r * 0.25, p.r * 0.62);
            };
            const disc = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
            g.fillStyle = tint.shadow; puffs.forEach(p => cluster(p, (x, y, r) => disc(x, y + r * 0.28, r)));
            g.fillStyle = tint.base;   puffs.forEach(p => cluster(p, (x, y, r) => disc(x, y, r * 0.93)));
            g.fillStyle = tint.light;  puffs.forEach(p => cluster(p, (x, y, r) => disc(x - r * 0.1, y - r * 0.28, r * 0.55)));
            return c;
        }
        function buildCloudLayers() {
            const seed = MAP_W * 31 + MAP_H * 17 + 7;
            game.cloudBase = makeCloudLayer(seed, 17, 0.95, { shadow: '#9db3cc', base: '#dde9f5', light: '#ffffff' });
            game.cloudWisp = makeCloudLayer(seed + 99, 34, 0.7, { shadow: 'rgba(160,185,215,0.5)', base: 'rgba(240,247,255,0.78)', light: 'rgba(255,255,255,0.85)' });
        }
        function drawCloudLayer(ctx, layer, driftX, driftY) {
            if (!layer) return;
            const S = CLOUD_SCALE;
            const sx = Math.max(0, (game.camera.x - driftX + CLOUD_M) * S);
            const sy = Math.max(0, (game.camera.y - driftY + CLOUD_M) * S);
            const sw = Math.min(layer.width - sx, game.width * S), sh = Math.min(layer.height - sy, game.height * S);
            if (sw <= 0 || sh <= 0) return;
            const smooth = ctx.imageSmoothingEnabled;
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(layer, sx, sy, sw, sh, 0, 0, sw / S, sh / S);
            ctx.imageSmoothingEnabled = smooth;
        }
        function drawWorldAndClouds(ctx) {
            const cam = game.camera, mw = MAP_W * TILE, mh = MAP_H * TILE;
            const outside = cam.x < 0 || cam.y < 0 || cam.x + game.width > mw || cam.y + game.height > mh;
            if (outside) { ctx.fillStyle = CLOUD_SKY; ctx.fillRect(0, 0, game.width, game.height); }
            if (game.terrainCanvas) {
                const sx = Math.max(0, cam.x), sy = Math.max(0, cam.y);
                const ex = Math.min(mw, cam.x + game.width), ey = Math.min(mh, cam.y + game.height);
                if (ex > sx && ey > sy) ctx.drawImage(game.terrainCanvas, sx, sy, ex - sx, ey - sy, sx - cam.x, sy - cam.y, ex - sx, ey - sy);
            }
            if (!game.cloudBase) return;
            const now = performance.now() / 1000;
            drawCloudLayer(ctx, game.cloudBase, 0, 0);
            drawCloudLayer(ctx, game.cloudWisp, Math.sin(now * 0.18) * 9, Math.cos(now * 0.11) * 4);
        }

        // ========== RENDER ==========
        function drawBuildingStatus(ctx) {
            const now = performance.now() / 1000;
            for (const b of sceneryBuildings) {
                if (b.hp >= b.maxHp) continue;
                const w = b.wT * TILE, h = b.hT * TILE;
                const px = b.x0 * TILE - game.camera.x, py = b.y0 * TILE - game.camera.y;
                if (px > game.width || py > game.height || px + w < 0 || py + h < 0) continue;
                const pct = Math.max(0, Math.min(1, b.hp / b.maxHp));
                if (!b.alive && pct > 0) drawBuildingImg(ctx, b, px, py, 0.15 + 0.7 * pct);
                if (b.alive && pct < 0.75) {
                    const rnd = mulberry32(b.x0 * 31 + b.y0 * 17);
                    const n = Math.floor((1 - pct) * 9);
                    for (let i = 0; i < n; i++) {
                        const cx = px + 3 + rnd() * (w - 6), cy = py + h * 0.3 + rnd() * h * 0.65;
                        ctx.fillStyle = 'rgba(10,8,8,0.45)';
                        ctx.fillRect(cx, cy, 3 + rnd() * 4, 2 + rnd() * 3);
                        ctx.strokeStyle = 'rgba(10,8,8,0.5)'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + (rnd() - 0.5) * 10, cy + 5 + rnd() * 6); ctx.stroke();
                    }
                }
                const smoking = (b.alive && pct < 0.5) || (!b.alive);
                if (smoking) {
                    const seed = b.x0 * 13 + b.y0;
                    for (let i = 0; i < 3; i++) {
                        const ph = (now * 0.45 + i / 3 + (seed % 7) * 0.13) % 1;
                        ctx.fillStyle = `rgba(45,42,40,${(1 - ph) * 0.55})`;
                        ctx.beginPath();
                        ctx.arc(px + w * (0.3 + 0.2 * i) + Math.sin(ph * 6 + i) * 3, py + h * 0.5 - ph * 26, 3 + ph * 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                if (b.alive && pct < 0.25) {
                    for (let i = 0; i < 3; i++) {
                        const fl = 0.6 + 0.4 * Math.sin(now * 11 + i * 2.3 + b.x0);
                        const fx = px + w * (0.25 + 0.25 * i), fy = py + h * 0.55;
                        ctx.fillStyle = `rgba(255,${120 + Math.floor(fl * 80)},40,0.85)`;
                        ctx.beginPath(); ctx.moveTo(fx - 3, fy); ctx.lineTo(fx, fy - 7 * fl - 3); ctx.lineTo(fx + 3, fy); ctx.closePath(); ctx.fill();
                    }
                }
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(px + w * 0.2, py + h - 7, w * 0.6, 4);
                ctx.fillStyle = pct > 0.5 ? '#e8b24e' : '#e86858';
                ctx.fillRect(px + w * 0.2, py + h - 7, w * 0.6 * pct, 4);
            }
        }

        function render() {
            const ctx = game.ctx;
            ctx.clearRect(0, 0, game.width, game.height);
            drawWorldAndClouds(ctx);
            drawBuildingStatus(ctx);

            game.k9s.forEach(k => { if (k.alive) k.drawLead(ctx); });

            const all = [];
            game.officers.forEach(o => { if (o.alive) all.push(o); });
            game.arrestOfficers.forEach(a => { if (a.alive) all.push(a); });
            game.handlers.forEach(h => { if (h.alive) all.push(h); });

            game.repairOfficers.forEach(r => { if (r.alive) all.push(r); });
            game.repairEscorts.forEach(r => { if (r.alive) all.push(r); });
            game.raiders.forEach(r => { if (r.alive) all.push(r); });
            game.k9s.forEach(k => { if (k.alive) all.push(k); });
            all.sort((a, b) => a.y - b.y);
            all.forEach(u => u.draw(ctx));

            if (game.vehicle && game.vehicle.alive) game.vehicle.draw(ctx);

            drawProjectiles(ctx);
            drawEffects(ctx);

            game.tearGasOfficers.forEach(t => { if (t.alive) t.drawGasCloud(ctx); });

            if (game.selectedSyndicate === VEHICLE_SYNDICATE && game.vehicle) {
                for (const s of BLOCKADE_SPOTS) {
                    const sx = s.x - game.camera.x, sy = s.y - game.camera.y;
                    if (sx < -20 || sy < -20 || sx > game.width + 20 || sy > game.height + 20) continue;
                    const isTarget = game.vehicle.targetSpot === s;
                    const isBlocked = game.blockedEdges.has(s.edgeKey);
                    ctx.beginPath();
                    ctx.arc(sx, sy, isTarget ? 7 : 3, 0, Math.PI * 2);
                    ctx.fillStyle = isBlocked ? 'rgba(255,90,60,0.9)'
                        : isTarget ? 'rgba(255,204,51,0.95)'
                        : 'rgba(110,230,140,0.55)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1; ctx.stroke();
                    if (isBlocked) {
                        ctx.strokeStyle = 'rgba(255,90,60,0.9)'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2); ctx.stroke();
                    }
                }
            }

            if (game.selectedSyndicate === VEHICLE_SYNDICATE) {
                const v = game.vehicle;
                if (v) {
                    if (v.route && v.routeIdx < v.route.length) {
                        ctx.strokeStyle = 'rgba(120,200,255,0.55)';
                        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
                        ctx.beginPath();
                        ctx.moveTo(v.x - game.camera.x, v.y - game.camera.y);
                        for (let i = v.routeIdx; i < v.route.length; i++) {
                            ctx.lineTo(v.route[i].x - game.camera.x, v.route[i].y - game.camera.y);
                        }
                        ctx.stroke(); ctx.setLineDash([]);
                    }
                    const sx = (v.targetSpot ? v.targetSpot.x : v.x) - game.camera.x;
                    const sy = (v.targetSpot ? v.targetSpot.y : v.y) - game.camera.y;
                    ctx.strokeStyle = 'rgba(120,200,255,0.85)';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2); ctx.stroke();
                    ctx.setLineDash([]);
                }
            } else if (game.selectedSyndicate === STATION_INDEX) {
                for (const r of game.repairOfficers) {
                    if (!r.alive) continue;
                    if (r._route && r._routeIdx < r._route.length) {
                        ctx.strokeStyle = 'rgba(255, 200, 80, 0.55)';
                        ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(r.x - game.camera.x, r.y - game.camera.y);
                        for (let i = r._routeIdx; i < r._route.length; i++) {
                            ctx.lineTo(r._route[i].x - game.camera.x, r._route[i].y - game.camera.y);
                        }
                        ctx.stroke(); ctx.setLineDash([]);
                    }
                    if (r.targetBuilding && r.targetBuilding.hp < r.targetBuilding.maxHp) {
                        const bx = r.targetBuilding.tx * TILE - game.camera.x;
                        const by = r.targetBuilding.ty * TILE - game.camera.y;
                        ctx.strokeStyle = 'rgba(255,200,80,0.9)';
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(bx, by, 18, 0, Math.PI * 2); ctx.stroke();
                    }
                    for (const e of r.escorts) {
                        if (!e.alive) continue;
                        const sx = e.slotX - game.camera.x, sy = e.slotY - game.camera.y;
                        ctx.strokeStyle = 'rgba(168,208,96,0.30)';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.arc(sx, sy, 4, 0, Math.PI * 2); ctx.stroke();
                    }
                }
            } else {
                const sy = game.syndicates[game.selectedSyndicate];
                if (sy) {
                    if (sy.path && sy.pathIdx < sy.path.length) {
                        ctx.strokeStyle = 'rgba(255, 204, 51, 0.45)';
                        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
                        ctx.beginPath();
                        ctx.moveTo(sy.commandX - game.camera.x, sy.commandY - game.camera.y);
                        for (let i = sy.pathIdx; i < sy.path.length; i++) {
                            ctx.lineTo(sy.path[i].x - game.camera.x, sy.path[i].y - game.camera.y);
                        }
                        ctx.stroke(); ctx.setLineDash([]);

                        const dest = sy.path[sy.path.length - 1];
                        const dx2 = dest.x - game.camera.x, dy2 = dest.y - game.camera.y;
                        ctx.strokeStyle = 'rgba(255, 204, 51, 0.9)';
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(dx2, dy2, 9, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(dx2 - 13, dy2); ctx.lineTo(dx2 + 13, dy2);
                        ctx.moveTo(dx2, dy2 - 13); ctx.lineTo(dx2, dy2 + 13);
                        ctx.stroke();
                    }
                    const sx = sy.commandX - game.camera.x, sy_ = sy.commandY - game.camera.y;
                    const passive = syndicateIsPassive(sy);
                    ctx.strokeStyle = game.mergedMode ? 'rgba(255,138,92,0.9)'
                        : passive ? 'rgba(140,200,255,0.85)' : 'rgba(255, 204, 51, 0.8)';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(sx, sy_, 12, 0, Math.PI * 2); ctx.stroke();
                    const fx = sy.facingX || 1, fy = sy.facingY || 0;
                    ctx.beginPath(); ctx.moveTo(sx, sy_); ctx.lineTo(sx + fx * 18, sy_ + fy * 18); ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }

        // ========== MAIN LOOP ==========
        const _loopErrorsSeen = {};
        function reportLoopError(err) {
            const key = String(err && err.message);
            if (!_loopErrorsSeen[key]) {
                _loopErrorsSeen[key] = true;
                console.error('Game loop error (game keeps running):', err);
            }
        }
        function loop(t) {
            const dt = Math.min(0.05, (t - (game.lastTime || t)) / 1000);
            game.lastTime = t;
            if (!game.gameOver) {
              try {
                updateWaves(dt);
                updateSquadAI(dt);

                // road danger is refreshed a few times a second so raiders can spot weak spots
                game.dangerTimer -= dt;
                if (game.dangerTimer <= 0) { game.dangerTimer = 0.7; computeRoadDanger(); }

                if (game.allOutCooldown > 0) game.allOutCooldown = Math.max(0, game.allOutCooldown - dt);
                for (let i = 0; i < game.arrestCooldown.length; i++) {
                    if (game.arrestCooldown[i] > 0) game.arrestCooldown[i] = Math.max(0, game.arrestCooldown[i] - dt);
                }
                for (let i = 0; i < game.tearGasCooldown.length; i++) {
                    if (game.tearGasCooldown[i] > 0) game.tearGasCooldown[i] = Math.max(0, game.tearGasCooldown[i] - dt);
                }
                for (let i = 0; i < game.manualDisperseCooldown.length; i++) {
                    if (game.manualDisperseCooldown[i] > 0) game.manualDisperseCooldown[i] = Math.max(0, game.manualDisperseCooldown[i] - dt);
                }
                for (let i = 0; i < REPAIR_TEAM_COUNT; i++) {
                    if (game.repairCooldowns[i] > 0) game.repairCooldowns[i] = Math.max(0, game.repairCooldowns[i] - dt);
                }

                // ---- repair team bookkeeping & auto-repair ----
                const anyRepair = game.repairOfficers.some(r => r.alive);
                if (game.repairWasActive && !anyRepair) {
                    // any team that just died starts its own cooldown
                    for (let i = 0; i < REPAIR_TEAM_COUNT; i++) {
                        if (!repairTeamActive(i) && game.repairCooldowns[i] <= 0 && game._repairWasOut && game._repairWasOut[i]) {
                            game.repairCooldowns[i] = REPAIR_COOLDOWN;
                        }
                    }
                }
                game._repairWasOut = [repairTeamActive(0), repairTeamActive(1)];
                game.repairWasActive = anyRepair;

                if (game.autoRepair) {
                    game.autoRepairTimer = (game.autoRepairTimer || 0) - dt;
                    if (game.autoRepairTimer <= 0) {
                        game.autoRepairTimer = 2.5;
                        const badly = sceneryBuildings.some(b => b.frontX !== undefined && b.hp < b.maxHp * (1 - AUTO_REPAIR_THRESHOLD));
                        if (badly) {
                            const t2 = freeRepairTeam();
                            if (t2 >= 0) deployRepairTeam(t2, true);
                        }
                    }
                }

                // ---- public morale ----
                if (game.moraleHoldTimer > 0) game.moraleHoldTimer -= dt;
                if (game.moraleDrain > 0) {
                    const applied = Math.min(game.moraleDrain, 30 * dt + 0.05);
                    game.morale = Math.max(0, game.morale - applied);
                    game.moraleDrain = Math.max(0, game.moraleDrain - applied);
                    game.moraleHoldTimer = 5;
                } else if (game.moraleHoldTimer <= 0 && game.morale < MORALE_MAX) {
                    game.morale = Math.min(MORALE_MAX, game.morale + MORALE_RECOVERY_RATE * dt);
                }

                // ---- station self-repair ----
                if (game.baseRegenTimer > 0) game.baseRegenTimer -= dt;
                else if (game.baseHp < BASE_MAX_HP) {
                    game.baseHp = Math.min(BASE_MAX_HP, game.baseHp + BASE_REGEN_RATE * dt);
                }

                game.syndicates.forEach(sy => {
                    if (sy && sy.disperseTimer > 0) {
                        sy.disperseTimer -= dt;
                        if (sy.disperseTimer <= 0) {
                            sy.disperseTimer = 0;
                            renderOptionsPanel(); updateSelectionUI();
                        }
                    }
                });

                for (let pi = 0; pi < OFFICER_SYNDICATES; pi++) updatePulse(game.syndicates[pi], pi, dt);
                updateSyndicateMovement(dt);
                assignFormation();
                game.attackerCounts.clear();
                const withSpeed = (u) => {
                    const px = u.x, py = u.y;
                    u.update(dt);
                    u.curSpeed = dt > 0 ? Math.hypot(u.x - px, u.y - py) / dt : 0;
                    updateGait(u, dt);
                };
                game.officers.forEach(withSpeed);
                game.arrestOfficers.forEach(withSpeed);
                game.handlers.forEach(withSpeed);
                game.tearGasOfficers.forEach(withSpeed);
                game.repairOfficers.forEach(r => { withSpeed(r); r.updateEscortFormation(); });
                game.repairEscorts.forEach(withSpeed);
                game.k9s.forEach(withSpeed);
                game.raiders.forEach(r => r.update(dt));
                applyRaiderSeparation(dt);
                if (game.vehicle) game.vehicle.update(dt);
                updateProjectiles(dt);

                if (game.raiders.length > 0 && game.raiders.some(r => !r.alive)) {
                    game.raiders = game.raiders.filter(r => r.alive);
                }
                if (game.arrestOfficers.length > 0 && game.arrestOfficers.some(a => !a.alive)) {
                    game.arrestOfficers = game.arrestOfficers.filter(a => a.alive);
                }
                if (game.handlers.length > 0 && game.handlers.some(h => !h.alive)) {
                    game.handlers = game.handlers.filter(h => h.alive);
                }
                if (game.k9s.length > 0 && game.k9s.some(k => !k.alive)) {
                    game.k9s = game.k9s.filter(k => k.alive);
                }
                if (game.tearGasOfficers.length > 0 && game.tearGasOfficers.some(t => !t.alive)) {
                    game.tearGasOfficers = game.tearGasOfficers.filter(t => t.alive);
                }
                if (game.repairOfficers.length > 0 && game.repairOfficers.some(r => !r.alive)) {
                    game.repairOfficers = game.repairOfficers.filter(r => r.alive);
                }
                if (game.repairEscorts.length > 0 && game.repairEscorts.some(e => !e.alive)) {
                    game.repairEscorts = game.repairEscorts.filter(e => e.alive);
                }

                updateEffects(dt);
                updateCamera(dt);
                updateStats();
              } catch (err) { reportLoopError(err); }
            }
            try {
                if (sceneryDirty && game.baseCanvas && t - lastSceneryCompose > 220) {
                    composeTerrain(); sceneryDirty = false; lastSceneryCompose = t;
                }
                render();
                drawMinimap();
            } catch (err) { reportLoopError(err); }
            requestAnimationFrame(loop);
        }

        // ========== INIT ==========
        function initGameState() {
            game.officers = []; game.raiders = []; game.effects = [];
            game.arrestOfficers = []; game.k9s = []; game.handlers = [];
            game.tearGasOfficers = [];
            game.projectiles = [];
            game.syndicates = [];
            game.selectedSyndicate = 0;
            game.baseHp = BASE_MAX_HP;
            game.baseRegenTimer = BASE_REGEN_DELAY;
            game.syndicatesDeployed = 0;
            game.mergedMode = false;
            game.mergedIntoIndex = 0;
            game.allOutCooldown = 0;
            game.allOutActive = 0;
            game.arrestCooldown = [0, 0, 0, 0];
            game.tearGasCooldown = [0, 0, 0, 0];
            game.gasTargets = [null, null, null, null];
            game.manualDisperseCooldown = [0, 0, 0, 0];
            game.repairOfficers = [];
            game.repairEscorts = [];
            game.repairCooldowns = [0, 0];
            game.autoRepair = false;
            game.autoRepairTimer = 0;
            game.repairWasActive = false;
            game._repairWasOut = [false, false];
            game.morale = MORALE_MAX;
            game.moraleHoldTimer = 0;
            game.moraleDrain = 0;
            game.roadDanger = new Map();
            game.dangerTimer = 0;
            game.squads = new Map();
            game.nextSquadId = 1;
            game.waveNumber = 1;
            game.waveState = 'intermission';
            game.waveTimer = 3;
            game.waveMoralePct = 100;
            game.waveTotalHp = 0;
            game.waveSpawnQueue = [];
            game.routed = 0;
            game.arrested = 0;
            game.gameOver = false;
            game.cameraUserLock = 0;
            game.attackerCounts.clear();
            game.totalRaidersInWave = 0;
            game.raidersDefeated = 0;
            game.raiderGroupMorale = 100;
            game.buildingsDestroyed = 0;
            game.furnitureDestroyed = 0;
            game.waveIntensity = 1;
            game.raidAI = { objective: 'base' };
            game.vehicle = null;
            game.blockedEdges = new Set();
            game.blockadeVersion = 0;
        }
        function resizeCanvas() {
            const c = game.canvas;
            game.width = window.innerWidth;
            game.height = window.innerHeight - document.getElementById('ad-banner').offsetHeight;
            const dpr = window.devicePixelRatio || 1;
            c.width = game.width * dpr; c.height = game.height * dpr;
            c.style.width = game.width + 'px'; c.style.height = game.height + 'px';
            game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            computeCameraPad();
            clampCamera();
        }
        function setupMinimapDPR() {
            const mm = document.getElementById('minimap');
            game.minimapCtx = mm.getContext('2d');
        }
        function handleOrientationChange() { setTimeout(rebuildWorldForScreenSize, 300); }
        function rebuildWorldForScreenSize() {
            resizeCanvas();
            computeMapSize(); computeMinimapSize();
            rebuildRoadNetwork();
            generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();

            if (game.vehicle) {
                const oldKey = game.vehicle.targetSpot ? game.vehicle.targetSpot.key : null;
                if (oldKey) {
                    const s = BLOCKADE_SPOTS.find(sp => sp.key === oldKey);
                    if (s) {
                        game.vehicle.targetSpot = s;
                        game.vehicle.x = s.x; game.vehicle.y = s.y;
                        game.vehicle.parked = true;
                        game.vehicle.route = null;
                    } else {
                        game.vehicle.clearTarget();
                    }
                }
                game.blockadeVersion++;
            }

            game.syndicates.forEach(sy => {
                if (!sy) return;
                sy.commandX = Math.max(0, Math.min(MAP_W * TILE, sy.commandX));
                sy.commandY = Math.max(0, Math.min(MAP_H * TILE, sy.commandY));
                if (!isValidOfficerPosition(sy.commandX, sy.commandY)) {
                    sy.commandX = BASE_TILE_X * TILE; sy.commandY = BASE_TILE_Y * TILE;
                }
            });
            game.syndicates.forEach(sy => { if (sy) { sy.path = null; sy.pathIdx = 0; } });
            assignFormation();
            clampCamera();
        }
        function isLandscapeReady() { return window.innerWidth > window.innerHeight; }
        function init() {
            game.canvas = document.getElementById('game');
            game.ctx = game.canvas.getContext('2d');
            setupMinimapDPR();
            setupEvents();
            setupBottomRightUI();
            document.getElementById('gameover-restart').addEventListener('click', restartGame);
            window.addEventListener('resize', () => setTimeout(rebuildWorldForScreenSize, 50));
            window.addEventListener('orientationchange', handleOrientationChange);

            initGameState();
            resizeCanvas();
            computeMapSize(); computeMinimapSize();
            rebuildRoadNetwork();
            loadAssets(() => {
                generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();
                for (let i = 0; i < OFFICER_SYNDICATES; i++) spawnSyndicate();
                spawnVehicleSyndicate();
                game.selectedSyndicate = 0;
                renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI();
                updateMergedButton(); updateAllOutButton();
                updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
                updateStationButton();
                requestAnimationFrame(loop);
            });
        }
        function bootWhenReady() {
            if (isLandscapeReady()) init();
            else {
                const check = setInterval(() => {
                    if (isLandscapeReady()) { clearInterval(check); init(); }
                }, 300);
            }
        }
        bootWhenReady();
    </script>
