                                if (d < this.range && d < nbd2 && canSee) { nbd2 = d; nearestB = b; }
                            }
                        }
                        if (nearestB) { target = nearestB; isBuilding = true; }
                        else if (this.owner === 0 && !this.holding && !this.moveGoal && (this.type === 'dog' || !game.lastTactic)) {
                            const seekRadius = this.type === 'dog' ? Infinity : 22;
                            let seekTarget = null, sd = Infinity;
                            for (const e of game.units) {
                                if (e.owner !== this.owner && e.hp > 0) {
                                    const d = Math.hypot(e.x - this.x, e.y - this.y);
                                    if (d < seekRadius && d < sd) { sd = d; seekTarget = e; }
                                }
                            }
                            if (seekTarget) target = seekTarget;
                        }
                    }
                }

                if (target) {
                    const tx = isBuilding ? target.x + target.size / 2 : target.x;
                    const ty = isBuilding ? target.y + target.size / 2 : target.y;
                    const d = Math.sqrt((tx - this.x) ** 2 + (ty - this.y) ** 2);
                    if (isBuilding) this.targetBuilding = target;
                    else this.targetUnit = target;
                    if (d < this.range + 1 && this.atkCooldown <= 0) {
                        const dlen = Math.hypot(tx - this.x, ty - this.y) || 1;
                        this.attackDirX = (tx - this.x) / dlen;
                        this.attackDirY = (ty - this.y) / dlen;
                        this.attackFlash = 0.22;
                        if (this.type === 'archer') {
                            game.projectiles.push({
                                x: this.x, y: this.y, target: target, speed: 55, dmg: this.attack,
                                kind: 'bullet', tint: this.owner === 0 ? '#ffe9a8' : '#ff5a4a'
                            });
                            game.effects.push({ x: this.x, y: this.y, timer: 0.1, maxTimer: 0.1, color: '#fff6c8' });
                        } else if (this.type === 'sword') {
                            target.hp -= this.attack;
                            target.hitFlash = 0.18;
                            game.effects.push({
                                x: tx, y: ty, fromX: this.x, fromY: this.y, timer: 0.3, maxTimer: 0.3,
                                weapon: 'sword', owner: this.owner
                            });
                        } else if (this.type === 'spear') {
                            target.hp -= this.attack;
                            target.hitFlash = 0.18;
                            game.effects.push({
                                x: tx, y: ty, fromX: this.x, fromY: this.y, timer: 0.3, maxTimer: 0.3,
                                weapon: 'spear', owner: this.owner
                            });
                        } else {
                            target.hp -= this.attack;
                            target.hitFlash = 0.18;
                            game.effects.push({ x: tx, y: ty, timer: 0.15, maxTimer: 0.15, color: '#e04030' });
                        }
                        this.atkCooldown = this.def.atkSpeed;
                    } else if (d > this.range) {
                        steerTowards(this, tx, ty, dt);
                    }
                } else if (this.moveGoal) {
                    steerTowards(this, this.moveGoal.x, this.moveGoal.y, dt);
                }

                const dx0 = this.targetX - this.x;
                const dy0 = this.targetY - this.y;
                const dist0 = Math.sqrt(dx0 * dx0 + dy0 * dy0);
                this.isMoving = dist0 > 0.5;
                if (this.isMoving) {
                    moveWithCollision(this, (dx0 / dist0) * this.speed * dt, (dy0 / dist0) * this.speed * dt);
                    if (Math.abs(dx0) > 0.05) this.facingLeft = dx0 < 0;
                }

                if (this.stuckCounter > 15 && this.owner === 1) {
                    let nearestB = null;
                    let nbd = 3;
                    for (const b of game.buildings) {
                        if (b.owner !== this.owner && b.hp > 0 && b.type !== 'trench') {
                            const bx = b.x + b.size / 2;
                            const by = b.y + b.size / 2;
                            const d = Math.sqrt((bx - this.x) ** 2 + (by - this.y) ** 2);
                            if (d < nbd) { nbd = d; nearestB = b; }
                        }
                    }
                    if (nearestB) {
                        this.targetBuilding = nearestB;
                        this.targetUnit = null;
                        this.moveGoal = null;
                        this.path = null;
                    }
                    this.stuckCounter = 0;
                }

                const minDist = 0.75;
                const closeBy = nearbyUnits(this.x, this.y, minDist + 0.3);
                let sepX = 0, sepY = 0;
                for (const other of closeBy) {
                    if (other === this || other.hp <= 0) continue;
                    const ddx = this.x - other.x;
                    const ddy = this.y - other.y;
                    const d2 = ddx * ddx + ddy * ddy;
                    if (d2 > 0.0001 && d2 < minDist * minDist) {
                        const d = Math.sqrt(d2);
                        sepX += (ddx / d) * (minDist - d);
                        sepY += (ddy / d) * (minDist - d);
                    } else if (d2 <= 0.0001) {
                        sepX += (seedFromXY(this.x, this.y) - 0.5) * 0.05;
                        sepY += (seedFromXY(this.y, this.x) - 0.5) * 0.05;
                    }
                }
                if (sepX !== 0 || sepY !== 0) {
                    moveWithCollision(this, sepX * 0.5, sepY * 0.5);
                }
            }

            draw(ctx, cam) {
                const px0 = this.x * TILE - cam.x;
                const py0 = this.y * TILE - cam.y;
                if (px0 < -30 || py0 < -30 || px0 > game.width + 30 || py0 > game.height + 30) return;

                const bobAmp = this.isMoving ? 1.6 : 0.5;
                const bobSpeed = this.isMoving ? 9 : 2.2;
                const bob = Math.sin(this.animTimer * bobSpeed) * bobAmp;
                let lungeX = 0, lungeY = 0;
                if (this.attackFlash > 0) {
                    const k = this.attackFlash / 0.22;
                    const mag = Math.sin((1 - k) * Math.PI) * (this.type === 'archer' ? -1.6 : 2.6);
                    lungeX = this.attackDirX * mag;
                    lungeY = this.attackDirY * mag;
                }
                const px = px0 + lungeX;
                const py = py0 + lungeY - bob;
                const footY = py + 7;

                if (this.owner === 1) {
                    ctx.fillStyle = 'rgba(200,30,30,0.45)';
                    ctx.beginPath();
                    ctx.ellipse(px0, py0 + 7, 8, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(px0, py0 + 7, this.type === 'dog' ? 9 : 7, this.type === 'dog' ? 2.8 : 2.3, 0, 0, Math.PI * 2);
                ctx.fill();

                const sprites = getUnitSpriteKeys(this);
                const idleKey = sprites && sprites.idle && sprites.idle[0];
                const idleImg = idleKey && assets[idleKey];
                let barTopY, hitFlashY, hitFlashR;

                if (idleImg) {
                    let frameKey = idleKey;
                    if (this.attackFlash > 0 && sprites.attack && sprites.attack.length) {
                        const progress = 1 - this.attackFlash / 0.22;
                        const idx = Math.min(sprites.attack.length - 1, Math.floor(progress * sprites.attack.length));
                        frameKey = sprites.attack[idx];
                    } else if (this.isMoving && sprites.walk && sprites.walk.length) {
                        const idx = Math.floor(this.animTimer * 7) % sprites.walk.length;
                        frameKey = sprites.walk[idx];
                    }
                    const img = assets[frameKey] || idleImg;
                    const h = this.type === 'dog' ? 22 : Math.max(22, Math.min(40, Math.round(img.height * 1.6)));
                    const w = h * (img.width / img.height);
                    ctx.save();
                    ctx.translate(px, footY);
                    if (this.facingLeft) ctx.scale(-1, 1);
                    ctx.drawImage(img, -w / 2, -h, w, h);
                    ctx.restore();
                    barTopY = footY - h - 4;
                    hitFlashY = footY - h * 0.5;
                    hitFlashR = h * 0.32;
                } else {
                    ctx.save();
                    ctx.translate(px, footY);
                    if (this.facingLeft) ctx.scale(-1, 1);
                    if (this.type === 'dog') drawDogFigure(ctx, this);
                    else drawHumanFigure(ctx, this);
                    ctx.restore();
                    barTopY = footY - (this.type === 'dog' ? 18 : 25);
                    hitFlashY = footY - (this.type === 'dog' ? 6 : 15);
                    hitFlashR = this.type === 'dog' ? 5 : 7;
                }

                if (this.hitFlash > 0) {
                    ctx.fillStyle = `rgba(255,255,255,${(this.hitFlash / 0.18) * 0.55})`;
                    ctx.beginPath();
                    ctx.arc(px, hitFlashY, hitFlashR, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.selected) {
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(px, footY, 9, 3, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(px - 7, barTopY, 14, 3);
                const pct = this.hp / this.maxHp;
                ctx.fillStyle = pct > 0.5 ? '#4caf50' : (pct > 0.25 ? '#ffb300' : '#e53935');
                ctx.fillRect(px - 6, barTopY + 0.5, 12 * pct, 2);
            }
        }

        class Building {
            constructor(type, x, y, owner) {
                this.type = type;
                this.def = BUILDING_TYPES[type];
                this.x = x;
                this.y = y;
                this.owner = owner;
                this.hp = this.def.hp;
                this.maxHp = this.def.hp;
                this.size = this.def.size;
                this.cooldown = 0;
                this.pulseTimer = Math.random() * 2;
                this.isHub = type === 'hub';
                this.lastHp = this.hp;
                this.regenCooldown = 0;
                this.wallOrientation = 'h';
            }

            update(dt) {
                if (this.cooldown > 0) this.cooldown -= dt;

                if (this.type === 'tower' && this.cooldown <= 0 && this.hp > 0) {
                    const mode = this.owner === 0 ? game.targetMode : 'closest';
                    const candidates = nearbyUnits(this.x + this.size / 2, this.y + this.size / 2, 9)
                        .filter(u => u.owner !== this.owner && u.hp > 0);
                    const target = pickEnemyTarget(candidates, this.x + this.size / 2, this.y + this.size / 2, 9, mode);
                    if (target) {
                        game.projectiles.push({
                            x: this.x + this.size / 2,
                            y: this.y + this.size / 2,
                            target: target,
                            speed: 65,
                            dmg: 16,
                            kind: 'bullet',
                            tint: this.owner === 0 ? '#c9d8ff' : '#ff5a4a'
                        });
                        this.cooldown = 0.35;
                        game.effects.push({ x: this.x + this.size / 2, y: this.y + this.size / 2, timer: 0.1, maxTimer: 0.1, color: '#a8f' });
                    }
                }

                if (this.type === 'triage' && this.hp > 0) {
                    for (const u of nearbyUnits(this.x + this.size / 2, this.y + this.size / 2, HEAL_RADIUS)) {
                        if (u.owner === this.owner && u.hp < u.maxHp && u.hp > 0) {
                            const d = Math.sqrt((u.x - this.x - this.size / 2) ** 2 + (u.y - this.y - this.size / 2) ** 2);
                            if (d < HEAL_RADIUS) {
                                u.hp += 5 * dt;
                                if (u.hp > u.maxHp) u.hp = u.maxHp;
                            }
                        }
                    }
                    this.pulseTimer += dt;
                    if (this.pulseTimer >= 2.5) {
                        this.pulseTimer = 0;
                        game.pulseRings.push({
                            x: this.x + this.size / 2, y: this.y + this.size / 2,
                            radius: 2, maxRadius: HEAL_RADIUS, timer: 1.2, maxTimer: 1.2,
                            color: 'rgba(74,200,120,'
                        });
                    }
                }

                if (this.isHub && this.hp > 0) {
                    this.pulseTimer += dt;
                    if (this.pulseTimer >= 3.5) {
                        this.pulseTimer = 0;
                        game.pulseRings.push({
                            x: this.x + this.size / 2, y: this.y + this.size / 2,
                            radius: 2, maxRadius: 8, timer: 1.5, maxTimer: 1.5,
                            color: 'rgba(255,215,106,'
                        });
                    }
                }

                if ((this.isHub || this.type === 'tower' || this.type === 'wall') && this.hp > 0) {
                    const delay = this.isHub ? HUB_REGEN_DELAY : STRUCTURE_REGEN_DELAY;
                    const rate = this.isHub ? HUB_REGEN_RATE : STRUCTURE_REGEN_RATE;
                    if (this.hp < this.lastHp) {
                        this.regenCooldown = delay;
                    } else {
                        this.regenCooldown = Math.max(0, this.regenCooldown - dt);
                        if (this.regenCooldown <= 0 && this.hp < this.maxHp) {
                            this.hp = Math.min(this.maxHp, this.hp + rate * dt);
                        }
                    }
                    this.lastHp = this.hp;
                }
            }

            draw(ctx, cam) {
                const px = this.x * TILE - cam.x;
                const py = this.y * TILE - cam.y;
                const s = this.size * TILE;
                if (px < -80 || py < -80 || px > game.width + 80 || py > game.height + 80) return;

                if (this.owner !== 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(px + 3, py + 3, s, s);
                    const g = ctx.createLinearGradient(px, py, px, py + s);
                    g.addColorStop(0, lighten('#a05050', 0.3));
                    g.addColorStop(1, '#a05050');
                    ctx.fillStyle = g;
                    ctx.fillRect(px, py, s, s);
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(px, py, s, s);
                } else if (this.type === 'wall') {
                    // drawBarricade already checks for wall_h/wall_v itself.
                    drawBarricade(ctx, px, py, s, this.x, this.y, this.wallOrientation);
                } else if (this.type === 'trench') {
                    const img = assets.building_trench;
                    if (img) ctx.drawImage(img, px, py, s, s);
                    else drawTrench(ctx, px, py, s, this.x, this.y);
                } else if (this.type === 'tower') {
                    const img = assets.building_tower;
                    if (img) ctx.drawImage(img, px, py, s, s);
                    else drawWatchtower(ctx, px, py, s, this.x, this.y);
                } else if (this.type === 'triage') {
                    const img = assets.building_triage;
                    if (img) ctx.drawImage(img, px, py, s, s);
                    else drawTriageHut(ctx, px, py, s, this.x, this.y);
                } else if (this.type === 'hub') {
                    const img = assets.building_hub;
                    if (img) ctx.drawImage(img, px, py, s, s);
                    else drawCommunityHub(ctx, px, py, s, this.x, this.y);
                }

                if (this.hp < this.maxHp) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(px, py - 5, s, 3);
                    const pct = this.hp / this.maxHp;
                    ctx.fillStyle = pct > 0.5 ? '#4caf50' : (pct > 0.25 ? '#ffb300' : '#e53935');
                    ctx.fillRect(px, py - 4.5, s * pct, 2);
                }

                if (this.isHub && this.owner === 0) {
                    const isSelected = game.selected.includes(this);
                    ctx.strokeStyle = isSelected ? 'rgba(255,215,0,0.8)' : 'rgba(255,215,106,0.3)';
                    ctx.lineWidth = isSelected ? 3 : 1.5;
                    ctx.setLineDash([4, 4]);
                    ctx.strokeRect(px - 4, py - 4, s + 8, s + 8);
                    ctx.setLineDash([]);
                }
            }
        }

        // ========== MENU / BUTTON ICON HELPERS ==========
        // Swaps an emoji for the matching SVG icon as soon as that icon has loaded. Any icon
        // that's missing just leaves the emoji in place, so nothing ever renders blank.
        function iconHTML(assetKey, fallback) {
            const img = assetKey && assets[assetKey];
            if (!img) return fallback;
            return '<img class="btn-icon" src="' + ASSET_PATHS[assetKey] + '" alt="">';
        }

        function applyMenuIcons() {
            const pairs = [
                ['tab-build', 'menu_build'],
                ['tab-tactics', 'menu_tactics'],
                ['tab-units', 'menu_units'],
            ];
            for (const [btnId, key] of pairs) {
                const img = assets[key];
                if (!img) continue;
                const iconEl = document.querySelector('#' + btnId + ' .icon');
                if (!iconEl) continue;
                iconEl.textContent = '';
                const el = document.createElement('img');
                el.src = ASSET_PATHS[key];
                el.alt = '';
                iconEl.appendChild(el);
            }
        }

        // ========== INIT ==========
        function init() {
            game.canvas = document.getElementById('game');
            game.ctx = game.canvas.getContext('2d');
            game.ctx.imageSmoothingEnabled = false;
            game.minimapCtx = document.getElementById('minimap').getContext('2d');
            game.optionsPanel = document.getElementById('options-panel');
            game.waveBanner = document.getElementById('wave-banner');

            loadAssets(() => {
                if (map && map.length) game.terrainCanvas = buildTerrainCanvas();
                applyMenuIcons();
                renderOptionsPanel();
            });
            resizeCanvas();
            computeMapSize();
            computeMinimapSize();
            setupMinimapDPR();
            generateMap();
            game.terrainCanvas = buildTerrainCanvas();
            game.minimapTerrainCanvas = buildMinimapTerrainCanvas();

            const hubOrigin = getHubOrigin();
            game.hub = new Building('hub', hubOrigin.x, hubOrigin.y, 0);
            game.buildings.push(game.hub);
            rebuildBlockedGrids();
            game.gridRebuildTimer = 1.0;

            const startUnits = [
                { x: hubOrigin.x + 5, y: hubOrigin.y + 1, type: 'sword' },
                { x: hubOrigin.x + 4, y: hubOrigin.y + 2, type: 'sword' },
                { x: hubOrigin.x + 5, y: hubOrigin.y + 3, type: 'spear' },
                { x: hubOrigin.x + 6, y: hubOrigin.y + 3, type: 'spear' },
                { x: hubOrigin.x + 6, y: hubOrigin.y + 1, type: 'archer' },
                { x: hubOrigin.x + 7, y: hubOrigin.y + 2, type: 'archer' },
            ];
            for (const s of startUnits) {
                game.units.push(new Unit(s.type, s.x, s.y, 0));
            }
            game.unitCount = playerUnitCount();

            game.camera.x = 0;
            game.camera.y = 0;

            setupEvents();
            setupTabBar();
            attachGlobalListeners();
            updateStats();
            requestAnimationFrame(loop);
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const adH = document.getElementById('ad-banner').offsetHeight;
            game.width = window.innerWidth;
            game.height = window.innerHeight - adH;

            const canvas = game.canvas;
            canvas.width = Math.round(game.width * dpr);
            canvas.height = Math.round(game.height * dpr);
            canvas.style.width = game.width + 'px';
            canvas.style.height = game.height + 'px';
            game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            game.ctx.imageSmoothingEnabled = false;
            clampCamera();
        }

        function handleOrientationChange() { setTimeout(resizeCanvas, 300); }

        function attachGlobalListeners() {
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', handleOrientationChange);
        }

        function setupMinimapDPR() {
            const dpr = window.devicePixelRatio || 1;
            const mm = document.getElementById('minimap');
            mm.width = MINIMAP_W * dpr;
            mm.height = MINIMAP_H * dpr;
            mm.style.width = MINIMAP_W + 'px';
            mm.style.height = MINIMAP_H + 'px';
            game.minimapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function clampCamera() {
            const maxX = Math.max(0, MAP_W * TILE - game.width);
            const maxY = Math.max(0, MAP_H * TILE - game.height);
            game.camera.x = Math.max(0, Math.min(game.camera.x, maxX));
            game.camera.y = Math.max(0, Math.min(game.camera.y, maxY));
        }

        // ========== INPUT ==========
        function setupEvents() {
            const c = game.canvas;

            c.addEventListener('touchstart', e => {
                e.preventDefault();
                startInput(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            c.addEventListener('touchmove', e => {
                e.preventDefault();
                moveInput(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            c.addEventListener('touchend', e => {
                e.preventDefault();
                endInput();
            }, { passive: false });

            c.addEventListener('mousedown', e => startInput(e.clientX, e.clientY));
            c.addEventListener('mousemove', e => moveInput(e.clientX, e.clientY));
            c.addEventListener('mouseup', e => endInput());
            c.addEventListener('contextmenu', e => e.preventDefault());
        }

        function startInput(x, y) {
            game.mouse.down = true;
            game.mouse.startX = x;
            game.mouse.startY = y;
            game.mouse.curX = x;
            game.mouse.curY = y;

            if (game.isBuildMode && isLineBuildType(game.buildType)) {
                const wx = (x + game.camera.x) / TILE;
                const wy = (y + game.camera.y) / TILE;
                game.wallDragStart = { x: Math.floor(wx), y: Math.floor(wy) };
                return;
            }
            game.wallDragStart = null;
            if (game.isBuildMode) { game.dragMode = null; return; }
            game.dragMode = 'select';
        }

        function moveInput(x, y) {
            if (!game.mouse.down) return;
            game.mouse.curX = x;
            game.mouse.curY = y;

            if (game.isBuildMode && isLineBuildType(game.buildType) && game.wallDragStart) {
                const wx = (x + game.camera.x) / TILE;
                const wy = (y + game.camera.y) / TILE;
                const tiles = computeWallDragTiles(game.wallDragStart.x, game.wallDragStart.y, Math.floor(wx), Math.floor(wy), game.buildType);
                game.wallPreview = tiles;
                game.wallAnchor = game.wallDragStart;
                document.getElementById('selection-info').textContent = tiles.every(t => t.valid)
                    ? '✅ Clear — lift your finger to build'
                    : '⚠️ Red tiles are blocked';
            }
        }

        function endInput() {
            if (!game.mouse.down) return;
            game.mouse.down = false;

            if (game.isBuildMode && isLineBuildType(game.buildType) && game.wallDragStart) {
                const dx = game.mouse.curX - game.mouse.startX;
                const dy = game.mouse.curY - game.mouse.startY;
                const movedTiles = Math.max(Math.abs(dx), Math.abs(dy)) / TILE;
                game.wallDragStart = null;
                if (movedTiles < 0.6) {
                    setWallPreview(Math.floor((game.mouse.curX + game.camera.x) / TILE), Math.floor((game.mouse.curY + game.camera.y) / TILE));
                } else if (game.wallPreview && game.wallPreview.every(t => t.valid)) {
                    placeWallPreview();
                } else {
                    document.getElementById('selection-info').textContent = '⚠️ Blocked — try drawing it somewhere clear';
                    game.wallPreview = null;
                    game.wallAnchor = null;
                }
                renderOptionsPanel();
                return;
            }

            const dx = game.mouse.curX - game.mouse.startX;
            const dy = game.mouse.curY - game.mouse.startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 10) {
                handleTap(game.mouse.curX, game.mouse.curY);
            } else if (!game.isBuildMode && game.dragMode === 'select') {
                const minX = Math.min(game.mouse.startX, game.mouse.curX) + game.camera.x;
                const maxX = Math.max(game.mouse.startX, game.mouse.curX) + game.camera.x;
                const minY = Math.min(game.mouse.startY, game.mouse.curY) + game.camera.y;
                const maxY = Math.max(game.mouse.startY, game.mouse.curY) + game.camera.y;
                game.selected = game.units.filter(u => u.owner === 0 && u.x * TILE >= minX && u.x * TILE <= maxX && u.y * TILE >= minY && u.y * TILE <= maxY);
                updateSelectionUI();
            }
            game.dragMode = null;
        }

        function buildCountOf(type) {
            return game.buildings.filter(b => b.type === type && b.owner === 0 && b.hp > 0).length;
        }

        function playerUnitCount() {
            let n = 0;
            for (const u of game.units) if (u.owner === 0 && u.hp > 0) n++;
            return n;
        }

        function handleTap(sx, sy) {
            const wx = (sx + game.camera.x) / TILE;
            const wy = (sy + game.camera.y) / TILE;

            if (game.isBuildMode && isLineBuildType(game.buildType)) {
                setWallPreview(Math.floor(wx), Math.floor(wy));
                return;
            }

            if (game.isBuildMode && game.buildType) {
                const type = game.buildType;
                const bx = Math.floor(wx);
                const by = Math.floor(wy);
                if (buildCountOf(type) >= BUILD_LIMITS[type]) {
                    document.getElementById('selection-info').textContent = '⚠️ Max ' + BUILDING_TYPES[type].name + ' reached (' + BUILD_LIMITS[type] + ')';
                    return;
                }
                if (isBuildable(bx, by, type)) {
                    game.buildings.push(new Building(type, bx, by, 0));
                    rebuildBlockedGrids();
                    game.effects.push({ x: bx + 0.5, y: by + 0.5, timer: 0.3, maxTimer: 0.3, color: '#4af' });
                    document.getElementById('selection-info').textContent = '🎯 Tap to place another ' + BUILDING_TYPES[type].name +
                        ' (' + buildCountOf(type) + '/' + BUILD_LIMITS[type] + ')';
                    renderOptionsPanel();
                } else {
                    document.getElementById('selection-info').textContent = '⚠️ Cannot build there — try another spot';
                }
                return;
            }

            let found = null;
            for (const u of game.units) {
                if (u.hp <= 0) continue;
                const d = Math.sqrt((u.x - wx) ** 2 + (u.y - wy) ** 2);
                if (d < 1.2) { found = u; break; }
            }
            if (!found) {
                for (const b of game.buildings) {
                    if (b.hp <= 0) continue;
                    if (wx >= b.x - 0.5 && wx < b.x + b.size + 0.5 && wy >= b.y - 0.5 && wy < b.y + b.size + 0.5) {
                        found = b;
                        break;
                    }
                }
            }

            if (found && found.owner === 0) {
                game.selected = [found];
                updateSelectionUI();
            } else if (found && found.owner === 1) {
                const selUnits = game.selected.filter(u => u instanceof Unit && u.owner === 0);
                for (const u of selUnits) {
                    u.moveGoal = null;
                    u.path = null;
                    if (found instanceof Unit) {
                        u.targetUnit = found;
                        u.targetBuilding = null;
                    } else {
                        u.targetBuilding = found;
                        u.targetUnit = null;
                    }
                }
            } else {
                const selUnits = game.selected.filter(u => u instanceof Unit && u.owner === 0);
                for (const u of selUnits) {
                    issueMoveOrder(u, wx, wy);
                }
                if (selUnits.length > 0) {
                    game.lastTactic = null;
                    game.lastMoveTarget = { x: wx, y: wy };
                } else if (game.selected.length > 0) {
                    game.selected = [];
                    updateSelectionUI();
                }
            }
        }

        function isBuildable(x, y, type) {
            const size = (BUILDING_TYPES[type] && BUILDING_TYPES[type].size) || 1;
            for (let dy = 0; dy < size; dy++) {
                for (let dx = 0; dx < size; dx++) {
                    const tx = x + dx, ty = y + dy;
                    if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return false;
                    const tile = map[ty][tx];
                    if (tile === TILE_WATER || tile === TILE_HUB || tile === TILE_MOUNTAIN) return false;
                }
            }
            for (const b of game.buildings) {
                if (b.hp <= 0) continue;
                if (x < b.x + b.size && x + size > b.x && y < b.y + b.size && y + size > b.y) return false;
            }
            return true;
        }

        function computeWallDragTiles(startX, startY, curX, curY, type) {
            const maxLen = LINE_BUILD[type].maxLen;
            const dx = curX - startX, dy = curY - startY;
            const horizontal = Math.abs(dx) >= Math.abs(dy);
            const rawLen = horizontal ? Math.abs(dx) : Math.abs(dy);
            const len = Math.min(maxLen, Math.max(1, rawLen + 1));
            const stepX = horizontal ? (dx < 0 ? -1 : 1) : 0;
            const stepY = horizontal ? 0 : (dy < 0 ? -1 : 1);
            const tiles = [];
            for (let i = 0; i < len; i++) tiles.push({ x: startX + stepX * i, y: startY + stepY * i });
            tiles.forEach(t => { t.valid = isBuildable(t.x, t.y, type); });
            return tiles;
        }

        function setWallPreview(tileX, tileY, type) {
            type = type || game.buildType;
            const maxLen = LINE_BUILD[type].maxLen;
            const tiles = [];
            for (let i = 0; i < maxLen; i++) {
                if (game.wallOrientation === 'horizontal') tiles.push({ x: tileX + i, y: tileY });
                else tiles.push({ x: tileX, y: tileY + i });
            }
            tiles.forEach(t => { t.valid = isBuildable(t.x, t.y, type); });
            game.wallPreview = tiles;
            game.wallAnchor = { x: tileX, y: tileY };
            document.getElementById('selection-info').textContent = tiles.every(t => t.valid)
                ? '✅ Clear — tap Place to build'
                : '⚠️ Red tiles are blocked — tap elsewhere';
        }

        function setWallOrientation(dir) {
            game.wallOrientation = dir;
            if (game.wallAnchor) setWallPreview(game.wallAnchor.x, game.wallAnchor.y);
            renderOptionsPanel();
        }

        function placeWallPreview() {
            const type = game.buildType;
            if (!game.wallPreview || !game.wallPreview.every(t => t.valid)) {
                document.getElementById('selection-info').textContent = '⚠️ Blocked — move the preview to a clear area';
                return;
            }
            if (buildCountOf(type) + game.wallPreview.length > BUILD_LIMITS[type]) {
                document.getElementById('selection-info').textContent = '⚠️ Max ' + BUILDING_TYPES[type].name + ' reached (' + BUILD_LIMITS[type] + ')';
                return;
            }
            const preview = game.wallPreview;
            const orientation = (preview.length > 1 && preview[1].x !== preview[0].x) ? 'h' : 'v';
            for (const t of preview) {
                const b = new Building(type, t.x, t.y, 0);
                b.wallOrientation = preview.length > 1 ? orientation : 'h';
                game.buildings.push(b);
                game.effects.push({ x: t.x + 0.5, y: t.y + 0.5, timer: 0.2, maxTimer: 0.2, color: '#ccc' });
            }
            game.wallPreview = null;
            game.wallAnchor = null;
            rebuildBlockedGrids();
            document.getElementById('selection-info').textContent = '🎯 Tap the map to place another ' + BUILDING_TYPES[type].name.toLowerCase() + ' (' + buildCountOf(type) + '/' + BUILD_LIMITS[type] + ')';
            renderOptionsPanel();
        }

        function cancelBuildMode() {
            game.isBuildMode = false;
            game.buildType = null;
            game.wallPreview = null;
            game.wallAnchor = null;
            game.wallDragStart = null;
            document.getElementById('selection-info').textContent = '';
            renderOptionsPanel();
        }

        // ========== SELECTION / TAB UI ==========
        function updateSelectionUI() {
            const sel = game.selected;
            const info = document.getElementById('selection-info');
            if (sel.length === 0) {
                info.textContent = '';
                return;
            }
            if (sel.length === 1 && sel[0] instanceof Building) {
                info.textContent = sel[0].def.icon + ' ' + sel[0].def.name + ' — HP: ' + Math.ceil(sel[0].hp) + '/' + sel[0].maxHp;
                return;
            }
            if (sel.length > 0 && sel[0] instanceof Unit) {
                info.textContent = '👥 ' + sel.length + ' unit(s) selected — tap ground to move, enemy to attack';
                return;
            }
            info.textContent = 'Selection';
        }

        function setupTabBar() {
            document.getElementById('tab-build').onclick = () => selectTab('build');
            document.getElementById('tab-tactics').onclick = () => selectTab('tactics');
            document.getElementById('tab-units').onclick = () => selectTab('units');
            document.getElementById('gameover-restart').onclick = () => location.reload();
        }

        function selectTab(tab) {
            if (game.activeTab === tab) {
                game.activeTab = null;
                if (game.isBuildMode) cancelBuildMode();
            } else {
                game.activeTab = tab;
                if (tab !== 'build' && game.isBuildMode) cancelBuildMode();
            }
            updateTabHighlights();
            renderOptionsPanel();
        }

        function updateTabHighlights() {
            ['build', 'tactics', 'units'].forEach(t => {
                document.getElementById('tab-' + t).classList.toggle('active-tab', game.activeTab === t);
            });
        }

        function renderOptionsPanel() {
            const panel = game.optionsPanel;
            panel.innerHTML = '';
            if (!game.activeTab) { panel.classList.remove('show'); return; }
            panel.classList.add('show');
            if (game.activeTab === 'build') renderBuildOptions(panel);
            else if (game.activeTab === 'tactics') renderTacticsOptions(panel);
            else if (game.activeTab === 'units') renderUnitOptions(panel);
        }

        function addInfoLine(panel, text) {
            const info = document.createElement('div');
            info.style.cssText = 'grid-column:1/-1;width:100%;text-align:center;color:#e8d9b0;font-size:10px;margin-bottom:2px;line-height:1.35;';
            info.textContent = text;
            panel.appendChild(info);
        }

        function renderBuildOptions(panel) {
            if (game.isBuildMode && isLineBuildType(game.buildType)) {
                const type = game.buildType;
                addInfoLine(panel, 'Drag to draw a ' + BUILDING_TYPES[type].name.toLowerCase() + ' (or tap for a straight run) — ' +
                    buildCountOf(type) + '/' + BUILD_LIMITS[type] + ' built');

                const hBtn = document.createElement('button');
                hBtn.textContent = '↔ Horizontal';
                if (game.wallOrientation === 'horizontal') hBtn.classList.add('active-build');
                hBtn.onclick = () => setWallOrientation('horizontal');
                panel.appendChild(hBtn);

                const vBtn = document.createElement('button');
                vBtn.textContent = '↕ Vertical';
                if (game.wallOrientation === 'vertical') vBtn.classList.add('active-build');
                vBtn.onclick = () => setWallOrientation('vertical');
                panel.appendChild(vBtn);

                const placeBtn = document.createElement('button');
                placeBtn.textContent = '✅ Place';
                placeBtn.onclick = placeWallPreview;
                panel.appendChild(placeBtn);

                const stopBtn = document.createElement('button');
                stopBtn.textContent = '❌ Stop Placing';
                stopBtn.onclick = cancelBuildMode;
                panel.appendChild(stopBtn);
                return;
            }

            if (game.isBuildMode && game.buildType) {
                const type = game.buildType;
                addInfoLine(panel, 'Tap the map to place ' + BUILDING_TYPES[type].name + ' (' + buildCountOf(type) + '/' + BUILD_LIMITS[type] + ')');
                const stopBtn = document.createElement('button');
                stopBtn.textContent = '❌ Stop Placing';
                stopBtn.onclick = cancelBuildMode;
                panel.appendChild(stopBtn);
                return;
            }

            const types = ['wall', 'trench', 'tower', 'triage'];
            types.forEach(t => {
                const btn = document.createElement('button');
                const count = buildCountOf(t);
                const limit = BUILD_LIMITS[t];
                btn.innerHTML = BUILDING_TYPES[t].icon + ' ' + BUILDING_TYPES[t].name + '<br>(' + count + '/' + limit + ')';
                if (count >= limit) btn.disabled = true;
                btn.onclick = () => {
                    game.isBuildMode = true;
                    game.buildType = t;
                    if (isLineBuildType(t)) {
                        game.wallPreview = null;
                        game.wallAnchor = null;
                        game.wallDragStart = null;
                        document.getElementById('selection-info').textContent = '🎯 Drag to draw a ' + BUILDING_TYPES[t].name.toLowerCase();
                    } else {
                        document.getElementById('selection-info').textContent = '🎯 Tap a location to place ' + BUILDING_TYPES[t].name;
                    }
                    renderOptionsPanel();
                };
                panel.appendChild(btn);
            });
        }

        function renderTacticsOptions(panel) {
            const defs = [
                { key: 'withdraw', label: '↩ Withdraw' },
                { key: 'closed', label: '▬ Wall' },
                { key: 'staggered', label: '▦ Staggered Wall' },
                { key: 'defence', label: '🛡️ Defence' },
                { key: 'offensive', label: '⚔️ Offensive' },
                { key: 'open', label: '▢ Open Wall' },
                { key: 'circle', label: '⭕ Ring Formation' },
                { key: 'focus', label: '🎯 Focus Fire' },
                { key: 'hold', label: '✋ Hold Position' },
            ];
            defs.forEach(d => {
                const btn = document.createElement('button');
                btn.textContent = d.label;
                btn.onclick = () => applyTactic(d.key);
                panel.appendChild(btn);
            });
            const targetBtn = document.createElement('button');
            targetBtn.textContent = game.targetMode === 'strongest' ? '💪 Target: Strongest' : '🎯 Target: Closest';
            targetBtn.onclick = () => {
                game.targetMode = game.targetMode === 'strongest' ? 'closest' : 'strongest';
                showToast('Targeting mode: ' + game.targetMode);
                renderOptionsPanel();
            };
            panel.appendChild(targetBtn);
        }

        function renderUnitOptions(panel) {
            const types = ['sword', 'spear', 'archer', 'dog'];
            types.forEach(t => {
                const def = UNIT_TYPES[t];
                const btn = document.createElement('button');
                btn.innerHTML = iconHTML(def.iconAsset, def.icon) + ' ' + def.name + '<br>(' + def.trainTime + 's)';
                btn.onclick = () => {
                    if (game.unitCount + game.queue.length >= game.maxUnits) {
                        showToast('⚠️ Unit limit reached!');
                        return;
                    }
                    game.queue.push(t);
                    game.lastTrainedType = t;
                    updateHubUI();
                };
                panel.appendChild(btn);
            });
            const autoBtn = document.createElement('button');
            autoBtn.id = 'auto-reinforce-btn';
            autoBtn.style.cssText = 'grid-column:1/-1;';
            autoBtn.onclick = () => {
                game.autoReinforce = !game.autoReinforce;
                updateHubUI();
            };
            panel.appendChild(autoBtn);
            const info = document.createElement('div');
            info.id = 'queue-info';
            info.style.cssText = 'grid-column:1/-1;width:100%;text-align:center;color:#e8d9b0;font-size:10px;margin-top:2px;line-height:1.35;word-break:break-word;';
            panel.appendChild(info);
            updateHubUI();
        }

        function updateHubUI() {
            const q = document.getElementById('queue-info');
            if (!q) return;
            q.textContent = 'Queue: ' + (game.queue.length === 0 ? 'empty' : game.queue.map(t => UNIT_TYPES[t].icon).join(' '));
            const autoBtn = document.getElementById('auto-reinforce-btn');
            if (autoBtn) {
                autoBtn.textContent = (game.autoReinforce ? '🔁 Auto-Reinforce: ON' : '🔁 Auto-Reinforce: OFF');
                autoBtn.style.background = game.autoReinforce ? '#3a5a2e' : '';
            }
        }

        // ========== TACTICS / FORMATIONS ==========
        function applyTactic(kind) {
            game.lastTactic = kind;
            game.lastMoveTarget = null;
            const units = game.units.filter(u => u.owner === 0 && u.hp > 0);
            if (units.length === 0) return;
            units.forEach(u => { u.holding = false; });

            if (kind === 'hold') {
                units.forEach(u => {
                    u.moveGoal = null;
                    u.path = null;
                    u.targetX = u.x;
                    u.targetY = u.y;
                    u.targetUnit = null;
                    u.targetBuilding = null;
                    u.holding = true;
                });
                showToast('✋ All units holding position');
                return;
            }

            const hub = game.hub;
            const cx = hub.x + hub.size / 2;
            const cy = hub.y + hub.size / 2;

            if (kind === 'focus') {
                let target = null, bestD = Infinity;
                for (const e of game.units) {
                    if (e.owner === 1 && e.hp > 0) {
                        const d = Math.hypot((e.x) - cx, (e.y) - cy);
                        if (d < bestD) { bestD = d; target = e; }
                    }
                }
                if (!target) {
                    showToast('🎯 No enemies in sight to focus on');
                    return;
                }
                units.forEach(u => {
                    u.targetUnit = target;
                    u.targetBuilding = null;
                });
                showToast('🎯 Focusing fire on the closest threat');
                return;
            }

            if (kind === 'withdraw') {
                assignPositions(units, getWithdrawPositions(cx, cy, units.length));
                showToast('↩ Units withdrawing to the Hub');
                return;
            }
            const dogs = units.filter(u => u.type === 'dog');
            const rest = units.filter(u => u.type !== 'dog');
            if (kind === 'closed' || kind === 'staggered' || kind === 'defence' || kind === 'offensive') {
                const play = getPlayAreaXRange();
                const stagger = kind === 'staggered';
                const rowGap = (kind === 'closed' || kind === 'staggered') ? 3 : 4;
                let frontX;
                if (kind === 'closed' || kind === 'staggered') {
                    frontX = hub.x + hub.size + 1 + rowGap * 2;
                } else if (kind === 'defence') {
                    frontX = Math.round((play.start + play.end) / 2);
                } else {
                    frontX = Math.max(Math.round((play.start + play.end) / 2) + 4, play.end - 6);
                }
                if (rest.length > 0) {
                    buildEastFacingLine(rest, frontX, cy, { rowGap, unitGap: stagger ? 1.6 : 1.1, stagger });
                }
                placeDogsAheadEast(dogs, Math.min(frontX + 3, play.end - 1), cy);
                const labels = {
                    closed: '▬ Firing line formed, facing east',
                    staggered: '▦ Staggered firing line formed, facing east',
                    defence: '🛡️ Defensive line holding the middle of the map',
                    offensive: '⚔️ Offensive line pushed forward toward the raiders',
                };
                showToast(labels[kind]);
                return;
            }
            if (kind === 'open') {
                if (rest.length > 0) assignPositions(rest, getRingPositions(cx, cy, hub.size, 6));
                placeDogsOutside(dogs, cx, cy, Math.round(hub.size / 2) + 9);
                showToast('▢ Wide box formed — dogs prowling the outside');
                return;
            }
            if (kind === 'circle') {
                if (rest.length > 0) assignCircleFormation(rest, cx, cy, hub.size);
                placeDogsOutside(dogs, cx, cy, Math.round(hub.size / 2) + 8);
                showToast('⭕ Ring formed — Shotgun & Rifle outside, Sniper within');
            }
        }

        function assignCircleFormation(units, cx, cy, hubSize) {
            const melee = units.filter(u => u.type === 'sword' || u.type === 'spear');
            const archers = units.filter(u => u.type === 'archer');
            const outerRadius = Math.round(hubSize / 2) + 5;
            const innerRadius = Math.round(hubSize / 2) + 2;
            assignPositions(melee, getCirclePositions(cx, cy, outerRadius, melee.length));
            assignPositions(archers, getCirclePositions(cx, cy, innerRadius, archers.length));
        }

        function placeDogsOutside(dogs, cx, cy, radius) {
            if (dogs.length === 0) return;
            assignPositions(dogs, getCirclePositions(cx, cy, radius, dogs.length));
        }

        function getCirclePositions(cx, cy, radius, count) {
            if (count <= 0) return [];
            const positions = [];
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                let r = radius;
                let x = cx + Math.cos(angle) * r;
                let y = cy + Math.sin(angle) * r;
                let tries = 0;
                while (tileBlocked(Math.floor(x), Math.floor(y)) && tries < 5) {
                    r += 1;
                    x = cx + Math.cos(angle) * r;
                    y = cy + Math.sin(angle) * r;
                    tries++;
                }
                positions.push({ x, y });
            }
            return positions;
        }

        function getWithdrawPositions(cx, cy, count) {
            const positions = [];
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const ring = 2 + (i % 3);
                let x = cx + Math.cos(angle) * ring;
                let y = cy + Math.sin(angle) * ring;
                if (tileBlocked(Math.floor(x), Math.floor(y))) { x = cx; y = cy; }
                positions.push({ x, y });
            }
            return positions;
        }

        function buildEastFacingLine(units, frontX, cy, opts) {
            opts = opts || {};
            const rowGap = opts.rowGap || 4;
            const unitGap = opts.unitGap || 1.1;
            const stagger = !!opts.stagger;
            layoutEastRow(units.filter(u => u.type === 'sword'), frontX, cy, unitGap, stagger);
            layoutEastRow(units.filter(u => u.type === 'spear'), frontX - rowGap, cy, unitGap, stagger);
            layoutEastRow(units.filter(u => u.type === 'archer'), frontX - rowGap * 2, cy, unitGap, stagger);
        }

        function layoutEastRow(units, x, cy, gap, stagger) {
            if (units.length === 0) return;
            const positions = [];
            for (let i = 0; i < units.length; i++) {
                const offset = i - (units.length - 1) / 2;
                let px = x;
                if (stagger) px += (i % 2 === 0) ? 0.9 : -0.9;
                let py = cy + offset * gap;
                let tries = 0;
                while (tileBlocked(Math.floor(px), Math.floor(py)) && tries < 6) {
                    px -= 1;
                    tries++;
                }
                positions.push({ x: px, y: py });
            }
            assignPositions(units, positions);
        }

        function placeDogsAheadEast(dogs, x, cy) {
            if (dogs.length === 0) return;
            const positions = [];
            for (let i = 0; i < dogs.length; i++) {
                const offset = i - (dogs.length - 1) / 2;
                positions.push({ x, y: cy + offset * 1.4 });
            }
            assignPositions(dogs, positions);
        }

        function getPlayAreaXRange() {
            return { start: MOUNTAIN_DEPTH, end: MAP_W - TREELINE_DEPTH };
        }

        function getRingPositions(cx, cy, hubSize, gap) {
            const half = Math.round(hubSize / 2 + gap);
            const sides = squareRingSides(Math.round(cx), Math.round(cy), half);
            return sidesToArray(sides).filter(p => !tileBlocked(Math.floor(p.x), Math.floor(p.y)));
        }

        function squareRingSides(cx, cy, half) {
            const sides = { top: [], right: [], bottom: [], left: [] };
            for (let x = -half; x <= half; x++) sides.top.push({ x: cx + x, y: cy - half });
            for (let y = -half + 1; y <= half; y++) sides.right.push({ x: cx + half, y: cy + y });
            for (let x = half - 1; x >= -half; x--) sides.bottom.push({ x: cx + x, y: cy + half });
            for (let y = half - 1; y >= -half + 1; y--) sides.left.push({ x: cx - half, y: cy + y });
            return sides;
        }

        function sidesToArray(sides) {
            return [...sides.top, ...sides.right, ...sides.bottom, ...sides.left];
        }

        function assignPositions(units, positions) {
            if (positions.length === 0) return;
            const avail = positions.slice();
            for (const u of units) {
                let p;
                if (avail.length > 0) {
                    let bestIdx = 0, bestD = Infinity;
                    for (let i = 0; i < avail.length; i++) {
                        const d = (avail[i].x - u.x) ** 2 + (avail[i].y - u.y) ** 2;
                        if (d < bestD) { bestD = d; bestIdx = i; }
                    }
                    p = avail.splice(bestIdx, 1)[0];
                } else {
                    const src = positions[Math.floor(Math.random() * positions.length)];
                    p = { x: src.x + (Math.random() - 0.5), y: src.y + (Math.random() - 0.5) };
                }
                issueMoveOrder(u, p.x, p.y);
            }
        }

        // ========== TRAINING ==========
        function updateTraining(dt) {
            if (game.queue.length > 0) {
                game.queueTimer += dt;
                const type = game.queue[0];
                if (game.queueTimer >= UNIT_TYPES[type].trainTime) {
                    game.queue.shift();
                    game.queueTimer = 0;
                    const hx = game.hub.x + game.hub.size + 1;
                    const hy = game.hub.y + Math.floor(game.hub.size / 2) + (Math.random() - 0.5) * 2;
                    const recruit = new Unit(type, hx, hy, 0);
                    game.units.push(recruit);
                    game.unitCount = playerUnitCount();
                    game.totalUnitsTrained++;
                    game.effects.push({ x: hx, y: hy, timer: 0.3, maxTimer: 0.3, color: '#ffd76a' });
                    if (game.lastTactic) {
                        applyTactic(game.lastTactic);
                    } else if (game.lastMoveTarget) {
                        issueMoveOrder(recruit, game.lastMoveTarget.x + (Math.random() - 0.5), game.lastMoveTarget.y + (Math.random() - 0.5));
                    }
                    updateHubUI();
                }
            } else {
                game.queueTimer = 0;
                if (game.autoReinforce && game.unitCount + game.queue.length < game.maxUnits) {
                    game.queue.push(game.lastTrainedType);
                    updateHubUI();
                }
            }
        }

        // ========== WAVES ==========
        const WAVE_TACTIC_INFO = {
            hub: { label: 'Storming the Hub' },
            units: { label: 'Hunting your troops' },
            walls: { label: 'Breaking your walls' },
        };

        function pickWaveTactic(prevTactic) {
            const options = Object.keys(WAVE_TACTIC_INFO);
            let choice = options[Math.floor(Math.random() * options.length)];
            if (choice === prevTactic && Math.random() < 0.7) {
                const others = options.filter(o => o !== prevTactic);
                choice = others[Math.floor(Math.random() * others.length)];
            }
            return choice;
        }

        function spawnPointEast() {
            const marginTop = WATER_BAND_TOP + 1;
            const marginBottom = WATER_BAND_BOTTOM + 1;
            const span = Math.max(1, MAP_H - marginTop - marginBottom);
            const y = marginTop + Math.floor(Math.random() * span);
            const x = MAP_W - 2;
            if (!tileBlocked(x, y)) return { x, y };
            const open = nearestOpenTile(x, y, game.blockedGrid || buildBlockedGrid());
            return open || { x: Math.max(MOUNTAIN_DEPTH + 1, MAP_W - TREELINE_DEPTH - 1), y };
        }

        function initialGoalForTactic(tactic, fromX, fromY) {
            if (tactic === 'units') {
                let best = null, bd = Infinity;
                for (const u of game.units) {
                    if (u.owner === 0 && u.hp > 0) {
                        const d = Math.hypot(u.x - fromX, u.y - fromY);
                        if (d < bd) { bd = d; best = u; }
                    }
                }
                if (best) return { x: best.x, y: best.y };
            } else if (tactic === 'walls') {
                let best = null, bd = Infinity;
                for (const b of game.buildings) {
                    if (b.owner === 0 && b.hp > 0 && b.type === 'wall') {
                        const bx = b.x + b.size / 2, by = b.y + b.size / 2;
                        const d = Math.hypot(bx - fromX, by - fromY);
                        if (d < bd) { bd = d; best = b; }
                    }
                }
                if (best) return { x: best.x + best.size / 2, y: best.y + best.size / 2 };
            }
            return { x: game.hub.x + game.hub.size / 2, y: game.hub.y + game.hub.size / 2 };
        }

        function updateWaves(dt) {
            game.waveTimer -= dt;
            if (game.waveTimer <= 0 && !game.gameOver) {
                const waveSize = 6 + Math.floor(game.waveNumber * 1.3);
                const tactic = pickWaveTactic(game.lastWaveTactic);
                game.lastWaveTactic = tactic;
                const availableTypes = ['sword', 'spear', 'archer'];
                for (let i = 0; i < waveSize; i++) {
                    const spawn = spawnPointEast();
                    const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
                    const e = new Unit(type, spawn.x, spawn.y, 1);
                    e.waveTactic = tactic;
                    const goal = initialGoalForTactic(tactic, spawn.x, spawn.y);
                    issueMoveOrder(e, goal.x, goal.y);
                    e.hp = e.maxHp = Math.round(e.def.hp * (1 + game.waveNumber * 0.05));
                    game.units.push(e);
                }
                game.waveNumber++;
                game.waveTimer = Math.max(14, 26 - game.waveNumber * 0.3);
                announceWave(tactic);
                if (game.waveNumber % 5 === 0) showInterstitialAd();
            }
        }

        function announceWave(tactic) {
            const banner = game.waveBanner;
            const info = WAVE_TACTIC_INFO[tactic];
            banner.textContent = '🌊 WAVE ' + (game.waveNumber - 1) + (info ? ' — ' + info.label : '');
            banner.classList.remove('show');
            void banner.offsetWidth;
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 1500);
        }

        // ========== PROJECTILES ==========
        function updateProjectiles(dt) {
            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                const p = game.projectiles[i];
                if (!p.target || p.target.hp <= 0) {
                    game.projectiles.splice(i, 1);
                    continue;
                }
                let tx, ty;
                if (p.target instanceof Building) {
                    tx = p.target.x + p.target.size / 2;
                    ty = p.target.y + p.target.size / 2;
                } else {
                    tx = p.target.x;
                    ty = p.target.y;
                }
                const dx = tx - p.x;
                const dy = ty - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                p.angle = Math.atan2(dy, dx);
                if (dist < 0.6) {
                    p.target.hp -= (p.dmg || 10);
                    p.target.hitFlash = 0.18;
                    game.effects.push({ x: tx, y: ty, timer: 0.15, maxTimer: 0.15, color: '#ff8' });
                    game.projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed * dt;
                    p.y += (dy / dist) * p.speed * dt;
                }
            }
        }

        // ========== EFFECTS & PULSE RINGS ==========
        function updateEffects(dt) {
            for (let i = game.effects.length - 1; i >= 0; i--) {
                game.effects[i].timer -= dt;
                if (game.effects[i].timer <= 0) game.effects.splice(i, 1);
            }
            for (let i = game.pulseRings.length - 1; i >= 0; i--) {
                const ring = game.pulseRings[i];
                ring.timer -= dt;
                ring.radius += (ring.maxRadius - ring.radius) * dt * 3;
                if (ring.timer <= 0) game.pulseRings.splice(i, 1);
            }
        }

        // ========== MAIN LOOP ==========
        function loop(t) {
            const dt = Math.min((t - game.lastTime) / 1000, 0.05);
            game.lastTime = t;

            if (!game.gameOver) {
                game.gridRebuildTimer -= dt;
                if (game.gridRebuildTimer <= 0) {
                    rebuildBlockedGrids();
                    game.gridRebuildTimer = 1.0;
                }

                buildSpatialHash();
                for (const u of game.units) u.update(dt);
                for (const u of game.units) {
                    if (u.hp <= 0 && u.owner === 1) game.kills++;
                }
                game.units = game.units.filter(u => u.hp > 0);
                game.unitCount = playerUnitCount();

                for (const b of game.buildings) b.update(dt);
                const buildingsBefore = game.buildings.length;
                game.buildings = game.buildings.filter(b => b.hp > 0 || b === game.hub);
                if (game.buildings.length !== buildingsBefore) rebuildBlockedGrids();
                if (game.hub.hp <= 0) {
                    game.gameOver = true;
                    gameOver(false);
                }

                updateTraining(dt);
                updateWaves(dt);
                updateProjectiles(dt);
                updateEffects(dt);
                updateStats();
            }

            render();
            requestAnimationFrame(loop);
        }

        // ========== RENDER ==========
        function render() {
            const ctx = game.ctx;
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, game.width, game.height);

            if (game.terrainCanvas) {
                const camX = Math.max(0, Math.min(game.camera.x, game.terrainCanvas.width - 1));
                const camY = Math.max(0, Math.min(game.camera.y, game.terrainCanvas.height - 1));
                const sw = Math.min(game.width, game.terrainCanvas.width - camX);
                const sh = Math.min(game.height, game.terrainCanvas.height - camY);
                if (sw > 0 && sh > 0) ctx.drawImage(game.terrainCanvas, camX, camY, sw, sh, 0, 0, sw, sh);
            } else {
                for (let y = 0; y < MAP_H; y++) {
                    for (let x = 0; x < MAP_W; x++) {
                        const px = x * TILE - game.camera.x;
                        const py = y * TILE - game.camera.y;
                        if (px < -TILE || py < -TILE || px > game.width + TILE || py > game.height + TILE) continue;
                        const tile = map[y][x];
                        if (tile === TILE_TREE) {
                            paintGrass(ctx, px, py, x, y);
                            drawTree(ctx, px, py, x, y);
                        } else {
                            paintTerrainTile(ctx, px, py, tile, x, y);
                        }
                    }
                }
            }

            if (game.wallPreview) {
                for (const wt of game.wallPreview) {
                    const px = wt.x * TILE - game.camera.x;
                    const py = wt.y * TILE - game.camera.y;
                    ctx.fillStyle = wt.valid ? 'rgba(80,220,120,0.4)' : 'rgba(220,80,80,0.45)';
                    ctx.fillRect(px, py, TILE, TILE);
                    ctx.strokeStyle = wt.valid ? '#5adf82' : '#e05a5a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
                }
            }

            for (const ring of game.pulseRings) {
                const px = ring.x * TILE - game.camera.x;
                const py = ring.y * TILE - game.camera.y;
                const alpha = ring.timer / ring.maxTimer;
                ctx.strokeStyle = ring.color + (alpha * 0.7) + ')';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.arc(px, py, ring.radius * TILE, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = ring.color + (alpha * 0.1) + ')';
                ctx.beginPath();
                ctx.arc(px, py, ring.radius * TILE, 0, Math.PI * 2);
                ctx.fill();
            }

            for (const b of game.buildings) b.draw(ctx, game.camera);
            for (const u of game.units) u.draw(ctx, game.camera);

            for (const p of game.projectiles) {
                const px = p.x * TILE - game.camera.x;
                const py = p.y * TILE - game.camera.y;
                if (p.kind === 'bullet') drawBullet(ctx, px, py, p.angle || 0, p.tint || '#ffe9a8');
                else drawArrow(ctx, px, py, p.angle || 0, p.tint || '#e8d9b0');
            }

            for (const e of game.effects) drawEffect(ctx, e, game.camera);

            if (game.mouse.down && game.dragMode === 'select' && Math.abs(game.mouse.curX - game.mouse.startX) > 5 && !game.isBuildMode) {
                const minX = Math.min(game.mouse.startX, game.mouse.curX);
                const minY = Math.min(game.mouse.startY, game.mouse.curY);
                const w = Math.abs(game.mouse.curX - game.mouse.startX);
                const h = Math.abs(game.mouse.curY - game.mouse.startY);
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);
                ctx.strokeRect(minX, minY, w, h);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(0,255,0,0.12)';
                ctx.fillRect(minX, minY, w, h);
            }

            drawMinimap();
        }

        function buildMinimapTerrainCanvas() {
            const c = document.createElement('canvas');
            c.width = MAP_W * MINIMAP_SCALE;
            c.height = MAP_H * MINIMAP_SCALE;
            const t = c.getContext('2d');
            const scale = MINIMAP_SCALE;
            const colors = {
                [TILE_GRASS]: '#3d6b2e',
                [TILE_WATER]: '#3a6a8a',
                [TILE_TREE]: '#4a5a38',
                [TILE_PATH]: '#a8894f',
                [TILE_HUB]: '#c4a35a',
                [TILE_MOUNTAIN]: '#6b6355'
            };
            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    t.fillStyle = colors[map[y][x]] || '#333';
                    t.fillRect(x * scale, y * scale, scale + 0.5, scale + 0.5);
                }
            }
            return c;
        }

        function drawMinimap() {
            const mctx = game.minimapCtx;
            mctx.fillStyle = '#181510';
            mctx.fillRect(0, 0, MINIMAP_W, MINIMAP_H);
            const scale = MINIMAP_SCALE;
            if (game.minimapTerrainCanvas) {
                mctx.drawImage(game.minimapTerrainCanvas, 0, 0);
            } else {
                const colors = {
                    [TILE_GRASS]: '#3d6b2e',
                    [TILE_WATER]: '#3a6a8a',
                    [TILE_TREE]: '#4a5a38',
                    [TILE_PATH]: '#a8894f',
                    [TILE_HUB]: '#c4a35a',
                    [TILE_MOUNTAIN]: '#6b6355'
                };
                for (let y = 0; y < MAP_H; y++) {
                    for (let x = 0; x < MAP_W; x++) {
                        mctx.fillStyle = colors[map[y][x]] || '#333';
                        mctx.fillRect(x * scale, y * scale, scale + 0.5, scale + 0.5);
                    }
                }
            }
            for (const b of game.buildings) {
                if (b.hp <= 0) continue;
                mctx.fillStyle = b.type === 'trench' ? '#8a7550' : (b.owner === 0 ? '#ffd700' : '#cc3333');
                mctx.fillRect(b.x * scale, b.y * scale, b.size * scale, b.size * scale);
            }
            for (const u of game.units) {
                if (u.hp <= 0) continue;
                mctx.fillStyle = u.owner === 0 ? '#44cc44' : '#ee3333';
                mctx.fillRect(u.x * scale - 1.5, u.y * scale - 1.5, 3, 3);
            }
        }

        // ========== GAME OVER ==========
        function gameOver(win) {
            const overlay = document.getElementById('gameover-overlay');
            document.getElementById('gameover-title').textContent = win ? '🎉 Victory!' : '💀 Game Over';
            document.getElementById('gameover-stats').textContent = win
                ? ('Waves survived: ' + Math.max(1, game.waveNumber - 1))
                : ('Waves survived: ' + Math.max(1, game.waveNumber - 1) + '  •  Kills: ' + game.kills);
            overlay.classList.add('show');
        }

        // ========== ADS ==========
        function showInterstitialAd() {
            console.log('📢 Interstitial ad shown (wave ' + game.waveNumber + ')');
        }

        // ========== STATS ==========
        // The top-left HUD now carries the player's own health stats (hub condition + troop
        // count as bars); the right-hand strip keeps the wave/kill/timer readout.
        function updateStats() {
            const hubFill = document.getElementById('hub-hp-fill');
            const hubNum = document.getElementById('hub-hp-num');
            if (hubFill && game.hub) {
                const pct = Math.max(0, Math.min(1, game.hub.hp / game.hub.maxHp));
                hubFill.style.width = (pct * 100) + '%';
                hubFill.className = 'stat-fill' + (pct <= 0.25 ? ' crit' : pct <= 0.5 ? ' low' : '');
                hubNum.textContent = Math.ceil(game.hub.hp) + '/' + game.hub.maxHp;
            }
            const troopFill = document.getElementById('troop-fill');
            const troopNum = document.getElementById('troop-num');
            if (troopFill) {
                const pct = Math.max(0, Math.min(1, game.unitCount / game.maxUnits));
                troopFill.style.width = (pct * 100) + '%';
                troopNum.textContent = game.unitCount + '/' + game.maxUnits;
            }
            document.getElementById('wave').textContent = Math.max(1, game.waveNumber - 1);
            document.getElementById('kills').textContent = game.kills;
            document.getElementById('next-wave').textContent = Math.max(0, Math.ceil(game.waveTimer));
        }

        // ========== START ==========
        function isLandscapeReady() {
            return window.innerWidth > window.innerHeight;
        }
        function bootWhenReady() {
            if (!isLandscapeReady()) return;
            window.removeEventListener('resize', bootWhenReady);
            window.removeEventListener('orientationchange', bootWhenReady);
            init();
            setTimeout(() => {
                const wMismatch = Math.abs(MAP_W * TILE - window.innerWidth) > TILE * 2;
                const hMismatch = Math.abs(MAP_H * TILE - (window.innerHeight - document.getElementById('ad-banner').offsetHeight)) > TILE * 2;
                if ((wMismatch || hMismatch) && game.buildings.length <= 1 && isLandscapeReady()) {
                    rebuildWorldForScreenSize();
                }
                resizeCanvas();
            }, 400);
        }
        function rebuildWorldForScreenSize() {
            resizeCanvas();
            computeMapSize();
            computeMinimapSize();
            setupMinimapDPR();
            generateMap();
            game.terrainCanvas = buildTerrainCanvas();
            game.minimapTerrainCanvas = buildMinimapTerrainCanvas();
            const hubOrigin = getHubOrigin();
            const dx = hubOrigin.x - game.hub.x, dy = hubOrigin.y - game.hub.y;
            game.hub.x = hubOrigin.x;
            game.hub.y = hubOrigin.y;
            for (const u of game.units) { u.x += dx; u.y += dy; }
            rebuildBlockedGrids();
            game.camera.x = 0;
            game.camera.y = 0;
        }
        window.onload = () => {
            if (isLandscapeReady()) {
                bootWhenReady();
            } else {
                window.addEventListener('resize', bootWhenReady);
                window.addEventListener('orientationchange', bootWhenReady);
            }
        };
    </script>
</body>
</html>
