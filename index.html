<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Park Defense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: monospace;
            touch-action: none;
            position: fixed;
            overscroll-behavior: none;
        }
        #ad-banner {
            width: 100%; height: 48px;
            background: linear-gradient(180deg, #2a2a2a, #161616);
            color: #ccc;
            text-align: center;
            line-height: 48px;
            font-size: 14px;
            position: fixed; bottom: 0; left: 0; z-index: 100;
            border-top: 1px solid #444;
        }
        #rotate-overlay {
            display: none; position: fixed; inset: 0;
            background: #000; color: #fff;
            text-align: center; padding-top: 40%; font-size: 24px;
            z-index: 999;
        }
        @media (orientation: portrait) {
            #rotate-overlay { display: block; }
        }
        canvas { display: block; }
        #ui-panel {
            position: fixed; left: 0; bottom: 48px; right: 0;
            height: 70px;
            background: linear-gradient(180deg, #3a3226, #201a11);
            display: flex; align-items: center;
            padding: 5px; gap: 5px; z-index: 90;
            border-top: 2px solid #6b5a3a;
            overflow-x: auto;
        }
        .stat {
            padding: 4px 10px;
            background: linear-gradient(180deg, #4a3f2e, #2c2419);
            border: 1px solid #6b5a3a;
            border-radius: 6px;
            color: #e8d9b0;
            font-size: 14px;
            white-space: nowrap;
        }
        .stat span { color: #ffd76a; font-weight: bold; }
        #cmd-card {
            position: fixed; bottom: 118px; left: 50%; transform: translateX(-50%);
            display: none;
            background: linear-gradient(180deg, #4a3f2e, #2c2419);
            border: 2px solid #6b5a3a; padding: 5px; border-radius: 6px; z-index: 100;
            grid-template-columns: repeat(3, 1fr); gap: 4px;
        }
        #cmd-card button {
            padding: 12px;
            background: linear-gradient(180deg, #6b5a3a, #4a3f2e);
            border: 1px solid #8a7550; border-radius: 4px;
            color: #f0e4c0; text-shadow: 0 1px 1px rgba(0,0,0,0.5);
            font-size: 12px; cursor: pointer;
        }
        #cmd-card button:active { background: linear-gradient(180deg, #4a3f2e, #6b5a3a); }
        #minimap {
            position: fixed; top: 10px; right: 10px;
            background: #1a1710; border: 2px solid #6b5a3a; border-radius: 3px;
            z-index: 95; touch-action: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        #selection-info {
            position: fixed; top: 10px; left: 10px; color: #f0e4c0;
            background: rgba(20,15,8,0.8); border: 1px solid #6b5a3a;
            padding: 8px; border-radius: 4px; font-size: 14px; z-index: 95;
            max-width: 55%;
        }
        #pan-hint {
            position: fixed; top: 165px; right: 10px; width: 150px; text-align: center;
            color: #b0a480; background: rgba(20,15,8,0.7); border: 1px solid #6b5a3a;
            padding: 4px; border-radius: 4px; font-size: 10px; z-index: 95;
        }
        #build-menu {
            position: fixed; bottom: 118px; right: 10px;
            display: none;
            background: linear-gradient(180deg, #4a3f2e, #2c2419);
            border: 2px solid #6b5a3a; padding: 5px; border-radius: 6px; z-index: 100;
            flex-direction: column; gap: 4px;
        }
        #build-menu button {
            padding: 10px;
            background: linear-gradient(180deg, #6b5a3a, #4a3f2e);
            border: 1px solid #8a7550; border-radius: 4px;
            color: #f0e4c0; text-shadow: 0 1px 1px rgba(0,0,0,0.5);
            font-size: 12px; cursor: pointer;
        }
        #build-menu button:active { background: linear-gradient(180deg, #4a3f2e, #6b5a3a); }
    </style>
</head>
<body>
    <div id="rotate-overlay">Please rotate your device to landscape!</div>
    <canvas id="game"></canvas>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="pan-hint">Tap minimap to jump camera · 2-finger drag to pan</div>
    <div id="selection-info">No selection</div>
    <div id="ui-panel">
        <div class="stat">❤️ <span id="hub-hp">100</span></div>
        <div class="stat">👥 <span id="unit-count">0/20</span></div>
        <div class="stat">🌊 <span id="wave">1</span></div>
        <div class="stat">💀 <span id="kills">0</span></div>
    </div>
    <div id="cmd-card"></div>
    <div id="build-menu"></div>
    <div id="ad-banner">AD SPACE – replace with your ad code</div>

    <script>
        // ========== GAME STATE ==========
        const MAP_W = 48, MAP_H = 48, TILE = 16;
        const TILE_GRASS = 0, TILE_WATER = 1, TILE_TREE = 2, TILE_PATH = 3, TILE_HUB = 4;
        const CHUNK = 4; // spatial hash chunk size, in tiles
        const WALL_MAX_LEN = 4;
        let map = [];
        let tileCanvases = {};
        let game = {
            canvas: null, ctx: null, minimapCtx: null,
            cmdCard: null, buildMenu: null,
            width: 0, height: 0,
            units: [], buildings: [], projectiles: [], effects: [],
            unitGrid: {},
            hub: null, // central building (also in buildings array)
            selected: [],
            camera: { x: 0, y: 0 },
            mouse: { down: false, startX: 0, startY: 0, curX: 0, curY: 0 },
            panning: false, panStart: null,
            queue: [], // training queue of unit types (strings)
            queueTimer: 0,
            waveNumber: 1,
            waveTimer: 18,
            kills: 0,
            lastTime: 0,
            isBuildMode: false,
            buildType: null,
            wallPreview: null,
            maxUnits: 20,
            unitCount: 0
        };

        // ========== UNIT DEFINITIONS ==========
        // Ranges are in map tiles (same scale buildings/towers use). atkSpeed is seconds between hits.
        const UNIT_TYPES = {
            sword:  { name: 'Sword',  hp: 80, attack: 10, range: 12, speed: 28, atkSpeed: 1.0, trainTime: 10, color: '#8b6f3a' },
            spear:  { name: 'Spear',  hp: 60, attack: 8,  range: 10, speed: 32, atkSpeed: 0.85, trainTime: 7,  color: '#6a5a3a' },
            archer: { name: 'Archer', hp: 40, attack: 14, range: 20, speed: 24, atkSpeed: 1.3, trainTime: 12, color: '#4a7c2e' },
            builder:{ name: 'Builder',hp: 50, attack: 3,  range: 8,  speed: 22, atkSpeed: 1.5, trainTime: 15, color: '#7a7a7a' }
        };

        // ========== BUILDING DEFINITIONS ==========
        const BUILDING_TYPES = {
            hub:     { name: 'Hub',      hp: 300, size: 3, color: '#c4a35a' },
            wall:    { name: 'Wall',     hp: 150, size: 1, color: '#8a8a8a' },
            tower:   { name: 'Tower',    hp: 120, size: 1, color: '#6b4a8a' },
            triage:  { name: 'Triage',   hp: 80,  size: 2, color: '#4a8ab0' }
        };

        // ========== COLOR HELPER ==========
        function lighten(hex, amt) {
            const num = parseInt(hex.slice(1), 16);
            let r = Math.min(255, (num >> 16) + Math.round(255 * amt));
            let g = Math.min(255, ((num >> 8) & 0xff) + Math.round(255 * amt));
            let b = Math.min(255, (num & 0xff) + Math.round(255 * amt));
            return `rgb(${r},${g},${b})`;
        }

        // ========== TILE TEXTURES (baked once, then blitted — cheap & crisp) ==========
        function buildTileTextures() {
            function make(drawFn) {
                const c = document.createElement('canvas');
                c.width = TILE; c.height = TILE;
                drawFn(c.getContext('2d'));
                return c;
            }
            tileCanvases[TILE_GRASS] = make(t => {
                const g = t.createLinearGradient(0, 0, 0, TILE);
                g.addColorStop(0, '#5a8f38'); g.addColorStop(1, '#3f6b23');
                t.fillStyle = g; t.fillRect(0, 0, TILE, TILE);
                t.fillStyle = 'rgba(255,255,255,0.08)';
                t.fillRect(2, 3, 2, 1); t.fillRect(9, 7, 2, 1); t.fillRect(5, 12, 2, 1);
                t.fillStyle = 'rgba(0,0,0,0.1)';
                t.fillRect(11, 2, 2, 1); t.fillRect(3, 9, 2, 1); t.fillRect(13, 13, 2, 1);
            });
            tileCanvases[TILE_WATER] = make(t => {
                const g = t.createLinearGradient(0, 0, 0, TILE);
                g.addColorStop(0, '#5fa2c9'); g.addColorStop(1, '#356e93');
                t.fillStyle = g; t.fillRect(0, 0, TILE, TILE);
                t.strokeStyle = 'rgba(255,255,255,0.3)'; t.lineWidth = 1;
                t.beginPath(); t.moveTo(1, 5); t.quadraticCurveTo(8, 3, 15, 6); t.stroke();
                t.beginPath(); t.moveTo(1, 12); t.quadraticCurveTo(8, 10, 15, 13); t.stroke();
            });
            tileCanvases[TILE_PATH] = make(t => {
                const g = t.createLinearGradient(0, 0, 0, TILE);
                g.addColorStop(0, '#d4b06a'); g.addColorStop(1, '#b58c4a');
                t.fillStyle = g; t.fillRect(0, 0, TILE, TILE);
                t.fillStyle = 'rgba(0,0,0,0.12)';
                [[4,4,1.3],[11,9,1.1],[7,13,1.2],[13,3,1]].forEach(([x,y,r]) => {
                    t.beginPath(); t.arc(x, y, r, 0, Math.PI*2); t.fill();
                });
            });
            tileCanvases[TILE_HUB] = make(t => {
                const g = t.createLinearGradient(0, 0, 0, TILE);
                g.addColorStop(0, '#a8894f'); g.addColorStop(1, '#8a6f3a');
                t.fillStyle = g; t.fillRect(0, 0, TILE, TILE);
            });
        }

        function drawTree(ctx, px, py) {
            // grass base already drawn by caller; draw trunk + canopy on top
            ctx.fillStyle = '#4a3420';
            ctx.fillRect(px + 7, py + 9, 2, 6);
            ctx.beginPath();
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.ellipse(px + 9, py + 14, 6, 2.3, 0, 0, Math.PI * 2);
            ctx.fill();
            const g = ctx.createRadialGradient(px + 6, py + 5, 1, px + 8, py + 7, 7);
            g.addColorStop(0, '#3f7a34'); g.addColorStop(1, '#1c451c');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(px + 8, py + 7, 6.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath(); ctx.arc(px + 6, py + 5, 2, 0, Math.PI * 2); ctx.fill();
        }

        // ========== MAP GENERATION ==========
        function generateMap() {
            map = [];
            for (let y = 0; y < MAP_H; y++) {
                let row = [];
                for (let x = 0; x < MAP_W; x++) {
                    // Create irregular park outline: mostly grass, edges are water/trees
                    let tile = TILE_GRASS;
                    // Left side water (lake)
                    if (x < 6 && y > 8 && y < 38) tile = TILE_WATER;
                    // Right side trees
                    if (x > 38 && y > 5 && y < 42) tile = TILE_TREE;
                    // Top trees
                    if (y < 5 && x > 8 && x < 40) tile = TILE_TREE;
                    // Bottom water/river
                    if (y > 42 && x > 10 && x < 35) tile = TILE_WATER;
                    // A few internal trees
                    if (Math.random() < 0.05 && (x > 10 && x < 38 && y > 10 && y < 38)) tile = TILE_TREE;
                    // Paths – horizontal and vertical lines connecting entrances (always passable)
                    if (y === 24 || x === 24) tile = TILE_PATH;
                    row.push(tile);
                }
                map.push(row);
            }
            // Place hub at center
            const hx = Math.floor(MAP_W / 2) - 1;
            const hy = Math.floor(MAP_H / 2) - 1;
            for (let dy = 0; dy < 3; dy++)
                for (let dx = 0; dx < 3; dx++)
                    map[hy + dy][hx + dx] = TILE_HUB;
        }

        // ========== COLLISION ==========
        function tileBlocked(tx, ty) {
            if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
            const t = map[ty][tx];
            if (t === TILE_WATER || t === TILE_TREE) return true;
            for (const b of game.buildings) {
                if (tx >= b.x && tx < b.x + b.size && ty >= b.y && ty < b.y + b.size) return true;
            }
            return false;
        }

        function moveWithCollision(unit, stepX, stepY) {
            const nx = unit.x + stepX;
            const ny = unit.y + stepY;
            if (!tileBlocked(Math.floor(nx), Math.floor(ny))) {
                unit.x = nx; unit.y = ny;
                return;
            }
            // Try sliding along one axis so units don't just freeze at every obstacle corner
            if (!tileBlocked(Math.floor(nx), Math.floor(unit.y))) {
                unit.x = nx;
                return;
            }
            if (!tileBlocked(Math.floor(unit.x), Math.floor(ny))) {
                unit.y = ny;
            }
        }

        // ========== SPATIAL HASH GRID ==========
        // Rebuilt once per frame. Keeps target-search cheap even with lots of units on screen.
        function buildSpatialHash() {
            const grid = {};
            for (const u of game.units) {
                const cx = Math.floor(u.x / CHUNK);
                const cy = Math.floor(u.y / CHUNK);
                const key = cx + ',' + cy;
                (grid[key] = grid[key] || []).push(u);
            }
            game.unitGrid = grid;
        }

        function nearbyUnits(x, y, radiusTiles) {
            const chunkRadius = Math.max(1, Math.ceil(radiusTiles / CHUNK));
            const cx = Math.floor(x / CHUNK);
            const cy = Math.floor(y / CHUNK);
            let result = [];
            for (let dx = -chunkRadius; dx <= chunkRadius; dx++) {
                for (let dy = -chunkRadius; dy <= chunkRadius; dy++) {
                    const key = (cx + dx) + ',' + (cy + dy);
                    const bucket = game.unitGrid[key];
                    if (bucket) result = result.concat(bucket);
                }
            }
            return result;
        }

        // ========== CLASSES ==========
        class Unit {
            constructor(type, x, y, owner) {
                this.type = type;
                this.def = UNIT_TYPES[type];
                this.x = x; this.y = y;
                this.owner = owner; // 0 = player, 1 = enemy
                this.hp = this.def.hp;
                this.maxHp = this.def.hp;
                this.attack = this.def.attack;
                this.range = this.def.range;
                this.speed = this.def.speed;
                this.atkCooldown = 0;
                this.targetX = x; this.targetY = y;
                this.selected = false;
                this.targetUnit = null;
                this.targetBuilding = null;
                this.buildMode = false;
                this.buildType = null;
                this.repairTarget = null;
            }
            update(dt) {
                if (this.atkCooldown > 0) this.atkCooldown -= dt;

                if (!this.buildMode) {
                    // Move toward current order, sliding around obstacles
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 1) {
                        moveWithCollision(this, (dx/dist) * this.speed * dt, (dy/dist) * this.speed * dt);
                    }

                    // Gentle separation so units don't stack on top of each other
                    const closeBy = nearbyUnits(this.x, this.y, 1);
                    let sepX = 0, sepY = 0;
                    const minDist = 0.7;
                    for (const other of closeBy) {
                        if (other === this) continue;
                        const ddx = this.x - other.x, ddy = this.y - other.y;
                        const d2 = ddx*ddx + ddy*ddy;
                        if (d2 > 0.0001 && d2 < minDist*minDist) {
                            const d = Math.sqrt(d2);
                            sepX += (ddx/d) * (minDist - d);
                            sepY += (ddy/d) * (minDist - d);
                        }
                    }
                    if (sepX !== 0 || sepY !== 0) {
                        moveWithCollision(this, sepX * dt * 3, sepY * dt * 3);
                    }

                    // Combat — applies to BOTH sides, so enemies actually fight back
                    let target = null, isBuilding = false;
                    if (this.targetUnit && this.targetUnit.hp > 0) {
                        target = this.targetUnit; isBuilding = false;
                    } else if (this.targetBuilding && this.targetBuilding.hp > 0) {
                        target = this.targetBuilding; isBuilding = true;
                    } else {
                        this.targetUnit = null;
                        this.targetBuilding = null;
                        let nearest = null, nd = Infinity;
                        for (const u of nearbyUnits(this.x, this.y, this.range)) {
                            if (u.owner !== this.owner) {
                                const d = Math.sqrt((u.x - this.x)**2 + (u.y - this.y)**2);
                                if (d < this.range && d < nd) { nd = d; nearest = u; }
                            }
                        }
                        if (nearest) {
                            target = nearest; isBuilding = false;
                        } else {
                            let nearestB = null, nbd = Infinity;
                            for (const b of game.buildings) {
                                if (b.owner !== this.owner) {
                                    const bx = b.x + b.size/2, by = b.y + b.size/2;
                                    const d = Math.sqrt((bx - this.x)**2 + (by - this.y)**2);
                                    if (d < this.range && d < nbd) { nbd = d; nearestB = b; }
                                }
                            }
                            if (nearestB) { target = nearestB; isBuilding = true; }
                        }
                    }
                    if (target) {
                        const tx = isBuilding ? target.x + target.size/2 : target.x;
                        const ty = isBuilding ? target.y + target.size/2 : target.y;
                        const d = Math.sqrt((tx - this.x)**2 + (ty - this.y)**2);
                        this.targetX = tx;
                        this.targetY = ty;
                        if (d < this.range + 1 && this.atkCooldown <= 0) {
                            if (this.type === 'archer') {
                                game.projectiles.push({ x: this.x, y: this.y, target: target, speed: 130, dmg: this.attack });
                            } else {
                                target.hp -= this.attack;
                                game.effects.push({ x: tx, y: ty, timer: 0.15, maxTimer: 0.15 });
                            }
                            this.atkCooldown = this.def.atkSpeed;
                        }
                    }
                }

                // Builder repair: find nearby damaged friendly building
                if (this.type === 'builder' && this.owner === 0 && !this.buildMode) {
                    if (!this.repairTarget || this.repairTarget.hp >= this.repairTarget.maxHp) {
                        let best = null, bd = Infinity;
                        for (const b of game.buildings) {
                            if (b.owner === 0 && b.hp < b.maxHp) {
                                const bx = b.x + b.size/2, by = b.y + b.size/2;
                                const d = Math.sqrt((bx - this.x)**2 + (by - this.y)**2);
                                if (d < 20 && d < bd) { bd = d; best = b; }
                            }
                        }
                        this.repairTarget = best;
                    }
                    if (this.repairTarget) {
                        this.targetX = this.repairTarget.x + this.repairTarget.size/2;
                        this.targetY = this.repairTarget.y + this.repairTarget.size/2;
                        const bx = this.repairTarget.x + this.repairTarget.size/2;
                        const by = this.repairTarget.y + this.repairTarget.size/2;
                        const dist2 = Math.sqrt((bx - this.x)**2 + (by - this.y)**2);
                        if (dist2 < 5) {
                            this.repairTarget.hp += 10 * dt;
                            if (this.repairTarget.hp > this.repairTarget.maxHp) this.repairTarget.hp = this.repairTarget.maxHp;
                        }
                    }
                }
                // If dead, remove (handled in update loop)
            }
            draw(ctx, cam) {
                const px = this.x * TILE - cam.x;
                const py = this.y * TILE - cam.y;
                if (px < -30 || py < -30 || px > game.width + 30 || py > game.height + 30) return;

                // Drop shadow
                ctx.beginPath();
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.ellipse(px, py + 5, 6, 2.3, 0, 0, Math.PI * 2);
                ctx.fill();

                const baseColor = this.owner === 0 ? this.def.color : '#a03030';
                const grad = ctx.createRadialGradient(px - 2, py - 3, 1, px, py, 7);
                grad.addColorStop(0, lighten(baseColor, 0.4));
                grad.addColorStop(1, baseColor);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(px, py, 6, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = this.selected ? '#ff0' : 'rgba(0,0,0,0.6)';
                ctx.lineWidth = this.selected ? 2 : 1;
                ctx.stroke();

                // Type marker so silhouettes read differently at a glance
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                if (this.type === 'sword') {
                    ctx.moveTo(px - 3, py + 3); ctx.lineTo(px + 3, py - 3);
                } else if (this.type === 'spear') {
                    ctx.moveTo(px - 4, py + 4); ctx.lineTo(px + 4, py - 4);
                } else if (this.type === 'archer') {
                    ctx.arc(px, py, 4, -0.9, 0.9);
                } else if (this.type === 'builder') {
                    ctx.moveTo(px - 3, py - 3); ctx.lineTo(px + 3, py + 3);
                    ctx.moveTo(px + 3, py - 3); ctx.lineTo(px - 3, py + 3);
                }
                ctx.stroke();

                // HP bar
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(px - 7, py - 10, 14, 3);
                const pct = this.hp / this.maxHp;
                ctx.fillStyle = pct > 0.5 ? '#4caf50' : (pct > 0.25 ? '#ffb300' : '#e53935');
                ctx.fillRect(px - 6, py - 9.5, 12 * pct, 2);
            }
        }

        class Building {
            constructor(type, x, y, owner) {
                this.type = type;
                this.def = BUILDING_TYPES[type];
                this.x = x; this.y = y;
                this.owner = owner;
                this.hp = this.def.hp;
                this.maxHp = this.def.hp;
                this.size = this.def.size;
                this.cooldown = 0;
            }
            update(dt) {
                // Tower auto-attack
                if (this.type === 'tower' && this.cooldown <= 0) {
                    let target = null, td = Infinity;
                    for (const u of nearbyUnits(this.x, this.y, 8)) {
                        if (u.owner !== this.owner) {
                            const d = Math.sqrt((u.x - this.x)**2 + (u.y - this.y)**2);
                            if (d < 8 && d < td) { td = d; target = u; }
                        }
                    }
                    if (target) {
                        game.projectiles.push({
                            x: this.x, y: this.y,
                            target: target,
                            speed: 120,
                            dmg: 10
                        });
                        this.cooldown = 0.8;
                    }
                }
                // Triage healing
                if (this.type === 'triage') {
                    for (const u of nearbyUnits(this.x, this.y, 6)) {
                        if (u.owner === this.owner) {
                            const d = Math.sqrt((u.x - this.x)**2 + (u.y - this.y)**2);
                            if (d < 6 && u.hp < u.maxHp) u.hp += 5 * dt;
                        }
                    }
                }
                if (this.cooldown > 0) this.cooldown -= dt;
            }
            draw(ctx, cam) {
                const px = this.x * TILE - cam.x;
                const py = this.y * TILE - cam.y;
                const s = this.size * TILE;
                if (px < -80 || py < -80 || px > game.width + 80 || py > game.height + 80) return;

                // Drop shadow
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fillRect(px + 3, py + 3, s, s);

                const baseColor = this.owner === 0 ? this.def.color : '#a05050';
                const g = ctx.createLinearGradient(px, py, px, py + s);
                g.addColorStop(0, lighten(baseColor, 0.25));
                g.addColorStop(1, baseColor);
                ctx.fillStyle = g;
                ctx.fillRect(px, py, s, s);

                // Bevel: light top-left edge, dark bottom-right edge, for a pseudo-3D block look
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(px + 1, py + s - 1); ctx.lineTo(px + 1, py + 1); ctx.lineTo(px + s - 1, py + 1);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.moveTo(px + s - 1, py + 1); ctx.lineTo(px + s - 1, py + s - 1); ctx.lineTo(px + 1, py + s - 1);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(px, py, s, s);

                // Icon
                ctx.fillStyle = '#fff';
                ctx.font = Math.max(10, s * 0.3) + 'px monospace';
                ctx.textAlign = 'center';
                const icons = { hub: '🏛', wall: '▬', tower: '🗼', triage: '⛑' };
                ctx.fillText(icons[this.type] || '?', px + s/2, py + s/2 + 4);

                // HP bar
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(px, py - 4, s, 3);
                const pct = this.hp / this.maxHp;
                ctx.fillStyle = pct > 0.5 ? '#4caf50' : (pct > 0.25 ? '#ffb300' : '#e53935');
                ctx.fillRect(px, py - 3.5, s * pct, 2);
            }
        }

        // ========== GAME INIT ==========
        function init() {
            const canvas = document.getElementById('game');
            game.canvas = canvas;
            game.ctx = canvas.getContext('2d');
            game.minimapCtx = document.getElementById('minimap').getContext('2d');
            game.cmdCard = document.getElementById('cmd-card');
            game.buildMenu = document.getElementById('build-menu');

            buildTileTextures();
            setupMinimapDPR();
            resizeCanvas();

            generateMap();
            // Place hub
            const hx = Math.floor(MAP_W/2) - 1;
            const hy = Math.floor(MAP_H/2) - 1;
            game.hub = new Building('hub', hx, hy, 0);
            game.buildings.push(game.hub);

            // Start units
            const startPos = [
                { x: hx + 5, y: hy + 2, type: 'sword' },
                { x: hx + 4, y: hy + 3, type: 'sword' },
                { x: hx + 5, y: hy + 4, type: 'spear' },
                { x: hx + 6, y: hy + 4, type: 'spear' },
                { x: hx + 6, y: hy + 2, type: 'archer' },
                { x: hx + 7, y: hy + 3, type: 'archer' },
                { x: hx + 3, y: hy + 2, type: 'builder' },
                { x: hx + 3, y: hy + 3, type: 'builder' }
            ];
            for (const s of startPos) {
                game.units.push(new Unit(s.type, s.x, s.y, 0));
            }
            game.unitCount = game.units.length;

            // Camera at hub
            game.camera.x = hx * TILE - game.width/2;
            game.camera.y = hy * TILE - game.height/2;
            clampCamera();

            setupEvents();
            attachGlobalListeners();
            requestAnimationFrame(loop);
        }

        // ========== CANVAS SIZING (fixes blur + fit issues on mobile) ==========
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            game.width = window.innerWidth;
            game.height = window.innerHeight - 48 - 70;
            document.body.style.height = window.innerHeight + 'px';

            const canvas = game.canvas;
            canvas.width = Math.round(game.width * dpr);
            canvas.height = Math.round(game.height * dpr);
            canvas.style.width = game.width + 'px';
            canvas.style.height = game.height + 'px';
            game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            clampCamera();
        }

        function handleOrientationChange() { setTimeout(resizeCanvas, 300); }

        // Named handlers (not anonymous) so they can be cleanly removed with detachGlobalListeners()
        // if this ever gets embedded in something bigger, e.g. an SPA, instead of a standalone page.
        function attachGlobalListeners() {
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', handleOrientationChange);
        }
        function detachGlobalListeners() {
            window.removeEventListener('resize', resizeCanvas);
            window.removeEventListener('orientationchange', handleOrientationChange);
        }

        function setupMinimapDPR() {
            const dpr = window.devicePixelRatio || 1;
            const mm = document.getElementById('minimap');
            mm.width = 150 * dpr;
            mm.height = 150 * dpr;
            mm.style.width = '150px';
            mm.style.height = '150px';
            game.minimapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // ========== CAMERA ==========
        function clampCamera() {
            const maxX = Math.max(0, MAP_W * TILE - game.width);
            const maxY = Math.max(0, MAP_H * TILE - game.height);
            game.camera.x = Math.max(0, Math.min(game.camera.x, maxX));
            game.camera.y = Math.max(0, Math.min(game.camera.y, maxY));
        }

        // ========== INPUT ==========
        function setupEvents() {
            const c = game.canvas;

            c.addEventListener('touchstart', e => {
                e.preventDefault();
                if (e.touches.length === 2) {
                    // Two fingers = pan the camera, cancel any single-finger action
                    game.panning = true;
                    game.mouse.down = false;
                    const t1 = e.touches[0], t2 = e.touches[1];
                    game.panStart = {
                        x: (t1.clientX + t2.clientX) / 2,
                        y: (t1.clientY + t2.clientY) / 2,
                        camX: game.camera.x,
                        camY: game.camera.y
                    };
                } else if (e.touches.length === 1) {
                    game.panning = false;
                    startInput(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive:false});

            c.addEventListener('touchmove', e => {
                e.preventDefault();
                if (game.panning && e.touches.length === 2) {
                    const t1 = e.touches[0], t2 = e.touches[1];
                    const midX = (t1.clientX + t2.clientX) / 2;
                    const midY = (t1.clientY + t2.clientY) / 2;
                    game.camera.x = game.panStart.camX - (midX - game.panStart.x);
                    game.camera.y = game.panStart.camY - (midY - game.panStart.y);
                    clampCamera();
                } else if (!game.panning && e.touches.length === 1) {
                    moveInput(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive:false});

            c.addEventListener('touchend', e => {
                e.preventDefault();
                if (e.touches.length < 2) game.panning = false;
                if (!game.panning) endInput();
            }, {passive:false});

            c.addEventListener('mousedown', e => startInput(e.clientX, e.clientY));
            c.addEventListener('mousemove', e => moveInput(e.clientX, e.clientY));
            c.addEventListener('mouseup', e => endInput());
            c.addEventListener('contextmenu', e => e.preventDefault());

            // Tap/click the minimap to jump the camera there
            const minimap = document.getElementById('minimap');
            const jumpCameraTo = (clientX, clientY) => {
                const rect = minimap.getBoundingClientRect();
                const mx = clientX - rect.left;
                const my = clientY - rect.top;
                const scale = 150 / MAP_W;
                const worldX = mx / scale;
                const worldY = my / scale;
                game.camera.x = worldX * TILE - game.width / 2;
                game.camera.y = worldY * TILE - game.height / 2;
                clampCamera();
            };
            minimap.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();
                jumpCameraTo(e.touches[0].clientX, e.touches[0].clientY);
            }, {passive:false});
            minimap.addEventListener('mousedown', e => {
                e.stopPropagation();
                jumpCameraTo(e.clientX, e.clientY);
            });
        }

        function startInput(x, y) {
            game.mouse.down = true;
            game.mouse.startX = x; game.mouse.startY = y;
            game.mouse.curX = x; game.mouse.curY = y;
        }

        function moveInput(x, y) {
            if (!game.mouse.down) return;
            game.mouse.curX = x; game.mouse.curY = y;
        }

        function endInput() {
            if (!game.mouse.down) return;
            game.mouse.down = false;

            // Dragging out a wall footprint takes priority over normal tap/box-select
            if (game.isBuildMode && game.buildType === 'wall') {
                const startTileX = Math.floor((game.mouse.startX + game.camera.x) / TILE);
                const startTileY = Math.floor((game.mouse.startY + game.camera.y) / TILE);
                const endTileX = Math.floor((game.mouse.curX + game.camera.x) / TILE);
                const endTileY = Math.floor((game.mouse.curY + game.camera.y) / TILE);
                setWallPreview(startTileX, startTileY, endTileX, endTileY);
                return;
            }

            const dx = game.mouse.curX - game.mouse.startX;
            const dy = game.mouse.curY - game.mouse.startY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 10) {
                handleTap(game.mouse.curX, game.mouse.curY);
            } else {
                // Box select
                const minX = Math.min(game.mouse.startX, game.mouse.curX) + game.camera.x;
                const maxX = Math.max(game.mouse.startX, game.mouse.curX) + game.camera.x;
                const minY = Math.min(game.mouse.startY, game.mouse.curY) + game.camera.y;
                const maxY = Math.max(game.mouse.startY, game.mouse.curY) + game.camera.y;
                game.selected = game.units.filter(u => u.owner === 0 && u.x*TILE >= minX && u.x*TILE <= maxX && u.y*TILE >= minY && u.y*TILE <= maxY);
                updateSelectionUI();
            }
        }

        function handleTap(sx, sy) {
            const wx = (sx + game.camera.x) / TILE;
            const wy = (sy + game.camera.y) / TILE;

            // If build mode active (tower/triage — wall has its own drag flow, handled in endInput)
            if (game.isBuildMode && game.buildType && game.buildType !== 'wall') {
                const builder = game.selected.find(u => u.type === 'builder');
                if (builder) {
                    const bx = Math.floor(wx);
                    const by = Math.floor(wy);
                    if (isBuildable(bx, by, game.buildType)) {
                        game.buildings.push(new Building(game.buildType, bx, by, 0));
                    }
                    game.isBuildMode = false;
                    game.buildType = null;
                    updateBuildMenu();
                    return;
                }
            }

            // Select units/buildings
            let found = null;
            for (const u of game.units) {
                const d = Math.sqrt((u.x - wx)**2 + (u.y - wy)**2);
                if (d < 1) { found = u; break; }
            }
            if (!found) {
                for (const b of game.buildings) {
                    if (wx >= b.x && wx < b.x + b.size && wy >= b.y && wy < b.y + b.size) {
                        found = b;
                        break;
                    }
                }
            }

            if (found && found.owner === 0) {
                // Select player unit/building
                game.selected = [found];
                updateSelectionUI();
            } else if (found && found.owner === 1) {
                // Attack enemy
                const selUnits = game.selected.filter(u => u instanceof Unit && u.owner === 0 && u.type !== 'builder');
                for (const u of selUnits) {
                    if (found instanceof Unit) {
                        u.targetUnit = found;
                        u.targetBuilding = null;
                        u.targetX = found.x; u.targetY = found.y;
                    } else {
                        u.targetBuilding = found;
                        u.targetUnit = null;
                        u.targetX = found.x + found.size/2;
                        u.targetY = found.y + found.size/2;
                    }
                }
            } else {
                // Move selected units
                const selUnits = game.selected.filter(u => u instanceof Unit && u.owner === 0);
                for (const u of selUnits) {
                    u.targetX = wx; u.targetY = wy;
                    u.targetUnit = null;
                    u.targetBuilding = null;
                }
            }
        }

        function isBuildable(x, y, type) {
            if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return false;
            const tile = map[y][x];
            if (tile === TILE_WATER || tile === TILE_TREE) return false;
            // Hub area can't build on it
            if (tile === TILE_HUB) return false;
            // Check no building already there
            for (const b of game.buildings) {
                if (x >= b.x && x < b.x + b.size && y >= b.y && y < b.y + b.size) return false;
            }
            return true;
        }

        // ========== WALL DRAG-TO-PLACE ==========
        function setWallPreview(sx, sy, ex, ey) {
            const dxT = ex - sx, dyT = ey - sy;
            let tiles = [];
            if (Math.abs(dxT) >= Math.abs(dyT)) {
                const dir = dxT >= 0 ? 1 : -1;
                const len = Math.min(WALL_MAX_LEN, Math.max(1, Math.abs(dxT) + 1));
                for (let i = 0; i < len; i++) tiles.push({ x: sx + i*dir, y: sy });
            } else {
                const dir = dyT >= 0 ? 1 : -1;
                const len = Math.min(WALL_MAX_LEN, Math.max(1, Math.abs(dyT) + 1));
                for (let i = 0; i < len; i++) tiles.push({ x: sx, y: sy + i*dir });
            }
            game.wallPreview = tiles;
            showWallConfirm();
        }

        function showWallConfirm() {
            const card = game.cmdCard;
            card.style.display = 'grid';
            card.innerHTML = '';
            const confirmBtn = document.createElement('button');
            confirmBtn.textContent = 'Confirm Wall';
            confirmBtn.onclick = placeWallPreview;
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => {
                game.wallPreview = null;
                game.isBuildMode = false;
                game.buildType = null;
                card.style.display = 'none';
                updateBuildMenu();
            };
            card.appendChild(confirmBtn);
            card.appendChild(cancelBtn);
            document.getElementById('selection-info').textContent = 'Wall preview — Confirm or Cancel';
        }

        function placeWallPreview() {
            if (!game.wallPreview) return;
            const allOk = game.wallPreview.every(t => isBuildable(t.x, t.y, 'wall'));
            if (allOk) {
                for (const t of game.wallPreview) {
                    game.buildings.push(new Building('wall', t.x, t.y, 0));
                }
            } else {
                alert('Cannot place wall there — blocked tile in the path.');
            }
            game.wallPreview = null;
            game.isBuildMode = false;
            game.buildType = null;
            game.cmdCard.style.display = 'none';
            updateBuildMenu();
        }

        // ========== UI ==========
        function updateSelectionUI() {
            const sel = game.selected;
            const info = document.getElementById('selection-info');
            if (sel.length === 0) {
                info.textContent = 'No selection';
                game.cmdCard.style.display = 'none';
                game.buildMenu.style.display = 'none';
                return;
            }
            if (sel.length === 1 && sel[0] instanceof Unit && sel[0].type === 'builder') {
                info.textContent = 'Builder selected';
                showBuildMenu();
                game.cmdCard.style.display = 'none';
                return;
            }
            if (sel.length === 1 && sel[0] instanceof Building && sel[0].type === 'hub') {
                info.textContent = 'Hub – Tap unit to train';
                showHubMenu();
                game.buildMenu.style.display = 'none';
                return;
            }
            if (sel.length > 0 && sel[0] instanceof Unit) {
                info.textContent = sel.length + ' unit(s) selected';
                game.buildMenu.style.display = 'none';
                showUnitCommands();
                return;
            }
            info.textContent = 'Building selected';
            game.buildMenu.style.display = 'none';
            game.cmdCard.style.display = 'none';
        }

        function showUnitCommands() {
            const card = document.getElementById('cmd-card');
            card.style.display = 'grid';
            card.innerHTML = '';
            const btn = document.createElement('button');
            btn.textContent = 'Stop';
            btn.onclick = () => { game.selected.forEach(u => { u.targetX = u.x; u.targetY = u.y; u.targetUnit = null; u.targetBuilding = null; }); };
            card.appendChild(btn);
        }

        function showHubMenu() {
            const card = document.getElementById('cmd-card');
            card.style.display = 'grid';
            card.innerHTML = '';
            const types = ['sword', 'spear', 'archer', 'builder'];
            types.forEach(t => {
                const btn = document.createElement('button');
                btn.textContent = UNIT_TYPES[t].name + ' (' + UNIT_TYPES[t].trainTime + 's)';
                btn.onclick = () => {
                    if (game.unitCount >= game.maxUnits) {
                        alert('Unit limit reached! Kill a unit to free a slot.');
                        return;
                    }
                    game.queue.push(t);
                    game.queueTimer = game.queueTimer || 0;
                    updateHubUI();
                };
                card.appendChild(btn);
            });
        }

        function showBuildMenu() {
            updateBuildMenu();
            game.buildMenu.style.display = 'flex';
        }

        function updateBuildMenu() {
            const menu = game.buildMenu;
            menu.innerHTML = '';
            const types = ['wall', 'tower', 'triage'];
            types.forEach(t => {
                const btn = document.createElement('button');
                btn.textContent = t === 'wall' ? 'Wall (drag)' : BUILDING_TYPES[t].name;
                btn.onclick = () => {
                    game.isBuildMode = true;
                    game.buildType = t;
                    updateBuildMenu();
                    if (t === 'wall') {
                        document.getElementById('selection-info').textContent = 'Drag up to 4 tiles to size the wall';
                    }
                };
                if (game.isBuildMode && game.buildType === t) btn.style.background = '#664';
                menu.appendChild(btn);
            });
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => { game.isBuildMode = false; game.buildType = null; updateBuildMenu(); };
            menu.appendChild(cancelBtn);
        }

        function updateHubUI() {
            const info = document.getElementById('selection-info');
            let q = 'Hub – Queue: ';
            if (game.queue.length === 0) q += 'empty';
            else q += game.queue.map(t => UNIT_TYPES[t].name[0]).join(', ');
            info.textContent = q;
        }

        function updateStats() {
            document.getElementById('hub-hp').textContent = Math.ceil(game.hub.hp);
            document.getElementById('unit-count').textContent = game.unitCount + '/' + game.maxUnits;
            document.getElementById('wave').textContent = game.waveNumber;
            document.getElementById('kills').textContent = game.kills;
        }

        // ========== TRAINING & SPAWN ==========
        function updateTraining(dt) {
            if (game.queue.length > 0) {
                game.queueTimer += dt;
                const type = game.queue[0];
                if (game.queueTimer >= UNIT_TYPES[type].trainTime) {
                    game.queue.shift();
                    game.queueTimer = 0;
                    const hx = game.hub.x + 4, hy = game.hub.y + 4;
                    game.units.push(new Unit(type, hx, hy, 0));
                    game.unitCount = game.units.length;
                    updateHubUI();
                }
            } else {
                game.queueTimer = 0;
            }
        }

        // ========== ENEMY WAVES ==========
        function updateWaves(dt) {
            game.waveTimer -= dt;
            if (game.waveTimer <= 0) {
                const entrances = [
                    { x: 2, y: 24 }, // left
                    { x: 24, y: 2 }, // top
                    { x: 46, y: 24 }, // right
                    { x: 24, y: 46 } // bottom
                ];
                const waveSize = 2 + Math.floor(game.waveNumber * 0.6);
                for (let i = 0; i < waveSize; i++) {
                    const entrance = entrances[Math.floor(Math.random() * entrances.length)];
                    const type = ['sword', 'spear', 'archer', 'builder'][Math.floor(Math.random() * 4)];
                    const e = new Unit(type, entrance.x, entrance.y, 1);
                    e.targetX = game.hub.x + 1;
                    e.targetY = game.hub.y + 1;
                    e.targetBuilding = game.hub;
                    game.units.push(e);
                }
                game.waveNumber++;
                game.waveTimer = Math.max(8, 25 - game.waveNumber);
                if (game.waveNumber % 5 === 0) {
                    showInterstitialAd();
                }
            }
        }

        // ========== PROJECTILES ==========
        function updateProjectiles(dt) {
            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                const p = game.projectiles[i];
                if (!p.target || p.target.hp <= 0) {
                    game.projectiles.splice(i, 1);
                    continue;
                }
                const dx = p.target.x - p.x;
                const dy = p.target.y - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 0.5) {
                    p.target.hp -= (p.dmg || 10);
                    game.effects.push({ x: p.x, y: p.y, timer: 0.15, maxTimer: 0.15 });
                    game.projectiles.splice(i, 1);
                } else {
                    p.x += (dx/dist) * p.speed * dt;
                    p.y += (dy/dist) * p.speed * dt;
                }
            }
        }

        // ========== HIT EFFECTS ==========
        function updateEffects(dt) {
            for (let i = game.effects.length - 1; i >= 0; i--) {
                game.effects[i].timer -= dt;
                if (game.effects[i].timer <= 0) game.effects.splice(i, 1);
            }
        }

        // ========== UPDATE LOOP ==========
        function loop(t) {
            const dt = Math.min((t - game.lastTime) / 1000, 0.05);
            game.lastTime = t;

            buildSpatialHash();

            // Update units
            for (const u of game.units) u.update(dt);
            // Count enemy kills, then remove dead units
            for (const u of game.units) {
                if (u.hp <= 0 && u.owner === 1) game.kills++;
            }
            game.units = game.units.filter(u => u.hp > 0);
            game.unitCount = game.units.length;

            // Update buildings
            for (const b of game.buildings) b.update(dt);
            game.buildings = game.buildings.filter(b => b.hp > 0 || b === game.hub);
            if (game.hub.hp <= 0) {
                gameOver(false);
            }

            updateTraining(dt);
            updateWaves(dt);
            updateProjectiles(dt);
            updateEffects(dt);

            updateStats();
            render();

            requestAnimationFrame(loop);
        }

        // ========== RENDER ==========
        function render() {
            const ctx = game.ctx;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, game.width, game.height);

            // Draw map (baked textures, blitted — sharp and cheap)
            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    const px = x * TILE - game.camera.x;
                    const py = y * TILE - game.camera.y;
                    if (px < -TILE || py < -TILE || px > game.width + TILE || py > game.height + TILE) continue;
                    const tile = map[y][x];
                    if (tile === TILE_TREE) {
                        ctx.drawImage(tileCanvases[TILE_GRASS], px, py);
                        drawTree(ctx, px, py);
                    } else {
                        ctx.drawImage(tileCanvases[tile], px, py);
                    }
                }
            }

            // Wall placement preview
            if (game.wallPreview) {
                for (const wt of game.wallPreview) {
                    const px = wt.x * TILE - game.camera.x;
                    const py = wt.y * TILE - game.camera.y;
                    ctx.fillStyle = 'rgba(255,255,0,0.35)';
                    ctx.fillRect(px, py, TILE, TILE);
                    ctx.strokeStyle = '#ff0';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px, py, TILE, TILE);
                }
            }

            // Draw buildings
            game.buildings.forEach(b => b.draw(ctx, game.camera));

            // Draw units
            game.units.forEach(u => u.draw(ctx, game.camera));

            // Draw projectiles
            game.projectiles.forEach(p => {
                const px = p.x * TILE - game.camera.x;
                const py = p.y * TILE - game.camera.y;
                ctx.fillStyle = '#ff0';
                ctx.fillRect(px-2, py-2, 4, 4);
            });

            // Draw hit effects
            game.effects.forEach(e => {
                const px = e.x * TILE - game.camera.x;
                const py = e.y * TILE - game.camera.y;
                const t = Math.max(0, e.timer / e.maxTimer);
                ctx.strokeStyle = `rgba(255,255,255,${t})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, 8 * (1 - t) + 2, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Draw selection box
            if (game.mouse.down && Math.abs(game.mouse.curX - game.mouse.startX) > 5) {
                const minX = Math.min(game.mouse.startX, game.mouse.curX);
                const minY = Math.min(game.mouse.startY, game.mouse.curY);
                const w = Math.abs(game.mouse.curX - game.mouse.startX);
                const h = Math.abs(game.mouse.curY - game.mouse.startY);
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                ctx.strokeRect(minX, minY, w, h);
                ctx.fillStyle = 'rgba(0,255,0,0.2)';
                ctx.fillRect(minX, minY, w, h);
            }

            drawMinimap();
        }

        function drawMinimap() {
            const mctx = game.minimapCtx;
            mctx.fillStyle = '#222';
            mctx.fillRect(0, 0, 150, 150);
            const scale = 150 / MAP_W;
            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    const tile = map[y][x];
                    const c = { [TILE_GRASS]: '#4a7c2e', [TILE_WATER]: '#4a8ab0', [TILE_TREE]: '#2e5c2e', [TILE_PATH]: '#c4a35a', [TILE_HUB]: '#8a6f3a' }[tile];
                    mctx.fillStyle = c;
                    mctx.fillRect(x*scale, y*scale, scale, scale);
                }
            }
            mctx.globalCompositeOperation = 'source-over';
            for (const u of game.units) {
                mctx.fillStyle = u.owner === 0 ? '#0f0' : '#f00';
                mctx.globalAlpha = 0.8;
                mctx.fillRect(u.x*scale - 1, u.y*scale - 1, 2, 2);
            }
            mctx.globalAlpha = 1;
            mctx.fillStyle = '#fff';
            mctx.fillRect(game.hub.x*scale - 2, game.hub.y*scale - 2, 4, 4);
            mctx.strokeStyle = '#fff';
            mctx.lineWidth = 1;
            mctx.strokeRect(
                game.camera.x/TILE*scale, game.camera.y/TILE*scale,
                game.width/TILE*scale, game.height/TILE*scale
            );
        }

        // ========== GAME OVER ==========
        function gameOver(win) {
            alert(win ? 'You survived! Waves: ' + game.waveNumber : 'Game Over – You lost! Waves survived: ' + game.waveNumber);
            location.reload();
        }

        // ========== ADS ==========
        function showInterstitialAd() {
            // For web: you'd embed an ad network here.
            // For APK: Capacitor AdMob would call native interstitial.
        }

        // Start
        window.onload = init;
    </script>
