        // ========== BLOCKADE VEHICLE ==========
        class BlockadeVehicle {
            constructor(syndicateIndex) {
                this.syndicateIndex = syndicateIndex;
                this.x = 44 * TILE + TILE / 2;
                this.y = ROAD_Y_BOTTOM * TILE + TILE / 2;
                this.angle = 0;
                this.targetAngle = 0;
                this.lightPhase = Math.random() * 10;
                this.alive = true;
                this.parked = false;
                this.targetSpot = null;
                this.route = null;
                this.routeIdx = 0;
                this.stuckTimer = 0;

                this.waterCannonOn = false;
                this.waterPhase = 'idle';
                this.waterTimer = 0;
                this.waterTickTimer = 0;
                this.waterAimAngle = 0;
                this.waterAimTarget = 0;
            }
            setSpot(spot) {
                if (!spot || this.targetSpot === spot) return;
                this.targetSpot = spot;
                this.parked = false;
                this.stuckTimer = 0;
                clearBlockades();
                this.recomputeRoute();
            }
            clearTarget() {
                this.targetSpot = null;
                this.route = null;
                this.routeIdx = 0;
                this.parked = false;
                this.stuckTimer = 0;
                clearBlockades();
            }
            recomputeRoute() {
                if (!this.targetSpot) { this.route = null; this.routeIdx = 0; return; }
                const spot = this.targetSpot;

                if (Math.hypot(spot.x - this.x, spot.y - this.y) < TILE * 2) {
                    this.route = [{ x: spot.x, y: spot.y }];
                    this.routeIdx = 0;
                    return;
                }

                const edge = ROAD_EDGES.find(e => e.key === spot.edgeKey);
                const goalIds = edge ? [edge.a, edge.b] : [];
                if (goalIds.length === 0) {
                    this.route = [{ x: spot.x, y: spot.y }];
                    this.routeIdx = 0;
                    return;
                }

                const starts = [];
                const near = nearestRoadNode(this.x, this.y);
                if (near) starts.push(near.id);
                const hereEdge = findEdgeForSpot({ x: this.x, y: this.y });
                if (hereEdge) {
                    const e = ROAD_EDGES.find(ed => ed.key === hereEdge);
                    if (e) {
                        if (!starts.includes(e.a)) starts.push(e.a);
                        if (!starts.includes(e.b)) starts.push(e.b);
                    }
                }
                if (starts.length === 0) starts.push('B54');

                let bestPath = null, bestCost = Infinity;
                for (const sId of starts) {
                    const sNode = getNode(sId);
                    if (!sNode) continue;
                    const toStart = Math.hypot(sNode.x * TILE - this.x, sNode.y * TILE - this.y);
                    for (const gId of goalIds) {
                        const gNode = getNode(gId);
                        if (!gNode) continue;
                        const path = findPathWeighted(sId, gId, null);
                        if (!path) continue;
                        let len = 0;
                        for (let i = 1; i < path.length; i++) {
                            const a = getNode(path[i - 1]), b = getNode(path[i]);
                            if (a && b) len += Math.hypot(b.x - a.x, b.y - a.y) * TILE;
                        }
                        const toSpot = Math.hypot(gNode.x * TILE - spot.x, gNode.y * TILE - spot.y);
                        const cost = toStart + len + toSpot;
                        if (cost < bestCost) { bestCost = cost; bestPath = path; }
                    }
                }

                if (!bestPath) {
                    this.route = [{ x: spot.x, y: spot.y }];
                    this.routeIdx = 0;
                    return;
                }

                const pts = [{ x: this.x, y: this.y }];
                for (const id of bestPath) {
                    const n = getNode(id);
                    if (n) pts.push({ x: n.x * TILE, y: n.y * TILE });
                }
                pts.push({ x: spot.x, y: spot.y });
                this.route = pts;
                this.routeIdx = 0;
            }
            partUnits() {
                const cosA = Math.cos(this.angle), sinA = Math.sin(this.angle);
                const halfL = (ROAD_W + 1) * TILE * 0.94 / 2 + TILE * 0.25;
                const halfW = TILE * 2.05 / 2 + TILE * 0.35;

                const push = (u) => {
                    const dx = u.x - this.x, dy = u.y - this.y;
                    const lx = dx * cosA + dy * sinA;
                    const ly = -dx * sinA + dy * cosA;
                    if (Math.abs(lx) > halfL || Math.abs(ly) > halfW) return;
                    const sign = ly >= 0 ? 1 : -1;
                    const newLy = sign * halfW;
                    const wx = this.x + lx * cosA - newLy * sinA;
                    const wy = this.y + lx * sinA + newLy * cosA;
                    if (isValidPosition(wx, wy)) { u.x = wx; u.y = wy; return; }
                    if (isValidPosition(wx, u.y)) { u.x = wx; return; }
                    if (isValidPosition(u.x, wy)) { u.y = wy; return; }
                    const r = Math.hypot(dx, dy) || 1;
                    const nx = u.x + dx / r * TILE * 1.6;
                    const ny = u.y + dy / r * TILE * 1.6;
                    if (isValidPosition(nx, ny)) { u.x = nx; u.y = ny; }
                };

                for (const o of game.officers) if (o.alive && !o.isAllOut) push(o);
                for (const r of game.raiders) if (r.alive && !r.beingArrested && r.state !== 'fleeing') push(r);
                for (const a of game.arrestOfficers) if (a.alive) push(a);
                for (const h of game.handlers) if (h.alive) push(h);
                for (const t of game.tearGasOfficers) if (t.alive) push(t);
                for (const k of game.k9s) if (k.alive) push(k);
                for (const rp of game.repairOfficers) if (rp.alive) push(rp);
                for (const re of game.repairEscorts) if (re.alive) push(re);
            }
            update(dt) {
                if (!this.alive) return;
                this.lightPhase += dt;

                let da = this.targetAngle - this.angle;
                while (da > Math.PI) da -= Math.PI * 2;
                while (da < -Math.PI) da += Math.PI * 2;
                this.angle += da * Math.min(1, dt * VEHICLE_TURN_RATE);

                if (this.targetSpot) {
                    if (this.route) {
                        while (this.routeIdx < this.route.length &&
                               Math.hypot(this.route[this.routeIdx].x - this.x,
                                          this.route[this.routeIdx].y - this.y) < TILE * 0.7) {
                            this.routeIdx++;
                        }
                    }

                    let tx = this.targetSpot.x, ty = this.targetSpot.y;
                    const routeDone = !this.route || this.routeIdx >= this.route.length;
                    if (!routeDone) { tx = this.route[this.routeIdx].x; ty = this.route[this.routeIdx].y; }

                    const dx = tx - this.x, dy = ty - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (routeDone && dist < 3) {
                        this.parked = true;
                        this.stuckTimer = 0;
                        this.targetAngle = (this.targetSpot.dir === 'h') ? Math.PI / 2 : 0;
                        if (this.targetSpot.edgeKey && !game.blockedEdges.has(this.targetSpot.edgeKey)) {
                            game.blockedEdges.clear();
                            game.blockedEdges.add(this.targetSpot.edgeKey);
                            game.blockadeVersion++;
                            showToast('🚧 Road blocked — raiders are rerouting!');
                            renderOptionsPanel(); updateSelectionUI();
                        }
                    } else {
                        if (this.parked) { this.parked = false; clearBlockades(); }
                        const step = Math.min(dist, VEHICLE_SPEED * TILE * dt);
                        const ux = dx / (dist || 1), uy = dy / (dist || 1);
                        const nx = this.x + ux * step, ny = this.y + uy * step;

                        let moved = false;
                        if (isValidPosition(nx, ny) && isRoadAt(nx, ny)) { this.x = nx; this.y = ny; moved = true; }
                        else if (isValidPosition(nx, this.y) && isRoadAt(nx, this.y)) { this.x = nx; moved = true; }
                        else if (isValidPosition(this.x, ny) && isRoadAt(this.x, ny)) { this.y = ny; moved = true; }

                        if (moved) {
                            this.targetAngle = Math.atan2(uy, ux);
                            const after = Math.hypot(tx - this.x, ty - this.y);
                            if (dist - after < 0.05) this.stuckTimer += dt;
                            else this.stuckTimer = Math.max(0, this.stuckTimer - dt * 2);
                        } else {
                            this.stuckTimer += dt;
                        }

                        if (this.stuckTimer > 1.0) {
                            this.stuckTimer = 0;
                            if (this.route && this.routeIdx < this.route.length) {
                                this.routeIdx++;
                            } else {
                                this.clearTarget();
                                showToast('🚙 No clear route to that blockade point.');
                            }
                        }
                    }
                }

                this.updateWaterCannon(dt);
                this.partUnits();
            }

            updateWaterCannon(dt) {
                if (!this.waterCannonOn) {
                    this.waterPhase = 'idle';
                    this.waterTimer = 0;
                    this.waterTickTimer = 0;
                    return;
                }

                let target = null, bestD = Infinity;
                for (const r of game.raiders) {
                    if (!r.alive || r.state === 'fleeing' || r.beingArrested) continue;
                    const d = Math.hypot(r.x - this.x, r.y - this.y);
                    if (d > WATER_CANNON_RANGE) continue;
                    if (d < bestD) { bestD = d; target = r; }
                }
                if (target) {
                    this.waterAimTarget = Math.atan2(target.y - this.y, target.x - this.x);
                }
                let da = this.waterAimTarget - this.waterAimAngle;
                while (da > Math.PI) da -= Math.PI * 2;
                while (da < -Math.PI) da += Math.PI * 2;
                this.waterAimAngle += da * Math.min(1, dt * 8);

                if (this.waterPhase === 'burst') {
                    this.waterTimer -= dt;
                    if (this.waterTimer <= 0) {
                        this.waterPhase = 'idle';
                        this.waterTimer = WATER_CANNON_IDLE_DURATION;
                    } else {
                        this.waterTickTimer -= dt;
                        if (this.waterTickTimer <= 0) {
                            this.waterTickTimer = WATER_CANNON_TICK_INTERVAL;
                            this.applyWaterHit();
                        }
                    }
                } else {
                    this.waterTimer -= dt;
                    if (this.waterTimer <= 0 && target) {
                        this.waterPhase = 'burst';
                        this.waterTimer = WATER_CANNON_BURST_DURATION;
                        this.waterTickTimer = 0;
                    }
                }
            }

            applyWaterHit() {
                const ang = this.waterAimAngle;
                const half = WATER_CANNON_CONE_HALF;
                for (const r of game.raiders) {
                    if (!r.alive || r.state === 'fleeing' || r.beingArrested) continue;
                    const dx = r.x - this.x, dy = r.y - this.y;
                    const d = Math.hypot(dx, dy);
                    if (d > WATER_CANNON_RANGE) continue;
                    let diff = Math.atan2(dy, dx) - ang;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    if (Math.abs(diff) > half) continue;
                    dealDamageToRaider(r, WATER_CANNON_DAMAGE_PER_TICK);
                    const pushX = Math.cos(ang) * WATER_CANNON_PUSH_PER_TICK;
                    const pushY = Math.sin(ang) * WATER_CANNON_PUSH_PER_TICK;
                    const nx = r.x + pushX, ny = r.y + pushY;
                    if (isValidPosition(nx, ny)) { r.x = nx; r.y = ny; }
                    else if (isValidPosition(nx, r.y)) r.x = nx;
                    else if (isValidPosition(r.x, ny)) r.y = ny;
                }
            }

            drawWaterJet(ctx) {
                if (this.waterPhase !== 'burst') return;
                const sx = this.x - game.camera.x;
                const sy = this.y - game.camera.y;
                if (sx < -200 || sy < -200 || sx > game.width + 200 || sy > game.height + 200) return;
                const ang = this.waterAimAngle;
                const half = WATER_CANNON_CONE_HALF;
                const lifePct = Math.max(0, Math.min(1, this.waterTimer / WATER_CANNON_BURST_DURATION));
                const ramp = Math.min(1, (1 - lifePct) * 6 + 0.3) * Math.min(1, lifePct * 4 + 0.3);
                const alpha = 0.6 * ramp;
                if (alpha < 0.02) return;

                ctx.save();
                const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, WATER_CANNON_RANGE);
                grad.addColorStop(0, `rgba(160, 230, 255, ${alpha})`);
                grad.addColorStop(0.55, `rgba(90, 180, 240, ${alpha * 0.7})`);
                grad.addColorStop(1, `rgba(60, 140, 220, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.arc(sx, sy, WATER_CANNON_RANGE, ang - half, ang + half);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(220, 245, 255, ${alpha * 0.9})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + Math.cos(ang) * WATER_CANNON_RANGE * 0.92,
                           sy + Math.sin(ang) * WATER_CANNON_RANGE * 0.92);
                ctx.stroke();

                for (let i = 0; i < 12; i++) {
                    const t = ((WATER_CANNON_BURST_DURATION - this.waterTimer) * 6 + i * 0.73) % 1;
                    const dist = t * WATER_CANNON_RANGE * 0.95;
                    const spread = (seedFromXY(this.syndicateIndex * 7.3 + i, t * 13.7) - 0.5) * 2 * half * 0.9;
                    const a2 = ang + spread;
                    const px = sx + Math.cos(a2) * dist;
                    const py = sy + Math.sin(a2) * dist;
                    ctx.fillStyle = `rgba(200, 240, 255, ${alpha * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(px, py, 1.6 + (i % 3) * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            draw(ctx) {
                if (!this.alive) return;
                const sx = this.x - game.camera.x, sy = this.y - game.camera.y;
                if (sx < -200 || sy < -200 || sx > game.width + 200 || sy > game.height + 200) return;

                if (this.waterCannonOn) this.drawWaterJet(ctx);

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(this.angle);
                drawBlockadeVehicleFigure(ctx, this);
                ctx.restore();
            }
        }
        function drawBlockadeVehicleFigure(ctx, v) {
            const L = (ROAD_W + 1) * TILE * 0.94;

            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, L * 0.62);
            glow.addColorStop(0, `rgba(90,180,255,${flash ? 0.30 : 0.18})`);
            glow.addColorStop(1, 'rgba(90,180,255,0)');

            ctx.beginPath(); ctx.arc(0, 0, L * 0.62, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = g;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(-halfL, -halfW, L, W, 5);
            else ctx.rect(-halfL, -halfW, L, W);
            ctx.fill();
            ctx.strokeStyle = '#08131f'; ctx.lineWidth = 1.5; ctx.stroke();

            ctx.fillStyle = '#26496c';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(-halfL * 0.60, -halfW * 0.80, L * 0.96, W * 0.80, 3);
            else ctx.rect(-halfL * 0.60, -halfW * 0.80, L * 0.96, W * 0.80);
            ctx.fill();
            ctx.strokeStyle = '#14293f'; ctx.lineWidth = 1; ctx.stroke();

            ctx.fillStyle = '#8ec8f0';
            ctx.fillRect(L * 0.26, -halfW * 0.70, L * 0.085, W * 0.70);
            ctx.fillStyle = '#6fa8d0';
            ctx.fillRect(-halfL * 0.56, -halfW * 0.70, L * 0.065, W * 0.70);
            ctx.fillRect(-L * 0.16, -halfW * 0.84, L * 0.34, 4.5);
            ctx.fillRect(-L * 0.16, halfW * 0.84 - 4.5, L * 0.34, 4.5);

            ctx.fillRect(-halfL * 0.58, -halfW * 0.88, L * 0.94, 3);
            ctx.fillRect(-halfL * 0.58, halfW * 0.88 - 3, L * 0.94, 3);

            ctx.fillStyle = '#0d1218';
            ctx.fillRect(-L * 0.035, -halfW * 0.86, L * 0.07, W * 0.86);
            ctx.fillStyle = flash ? '#59c8ff' : '#17415f';
            ctx.fillRect(-L * 0.035, -halfW * 0.86, L * 0.07, W * 0.43);
            ctx.fillStyle = flash ? '#17415f' : '#59c8ff';
            ctx.fillRect(-L * 0.035, -halfW * 0.43, L * 0.07, W * 0.43);

            ctx.fillStyle = '#ffd98a';
            ctx.beginPath(); ctx.arc(L * 0.46, -halfW * 0.62, 2.4, 0, Math.PI * 2); ctx.fill();

        // ========== RAIDER ==========
        const RAIDER_TYPES = {
            standard:     { name: 'Raider',        hp: 66,  damage: 6,  meleeRange: 1.2,  atkCooldown: 1.10, speed: 1.7, weight: 60, color: '#8a4a34', dark: '#4a2418' },
            bruiser:      { name: 'Bruiser',       hp: 132, damage: 12, meleeRange: 1.35, atkCooldown: 1.30, speed: 1.4, weight: 25, color: '#7a2c2c', dark: '#3f1616' },
            brickthrower: { name: 'Brick Thrower', hp: 100, damage: 5,  meleeRange: 1.1,  atkCooldown: 1.85, speed: 1.2, weight: 10, color: '#a0704a', dark: '#4a2a18' },
        };
        const MAX_ATTACKERS_PER_OFFICER = 3;
        let raiderIdSeq = 1;

        class Raider {
            constructor(kind, spawnNodeId, squadId, spawnX, spawnY) {
                this.id = raiderIdSeq++;
                this.kind = kind;
                this.spawnNodeId = spawnNodeId || 'N18';
                this.squadId = squadId || 0;
                const def = RAIDER_TYPES[kind];
                this.def = def;
                this.hp = def.hp; this.maxHp = def.hp;
                this.x = spawnX; this.y = spawnY;
                this.spawnX = spawnX; this.spawnY = spawnY;
                this.dir = { x: 0, y: 1 };
                this.animTimer = Math.random() * 10;
                this.isMoving = true;
                this.attackFlash = 0;
                this.atkTimer = Math.random() * def.atkCooldown;
                this.alive = true;
                this.engaged = false;
                this.surgeTimer = 1 + Math.random() * 3;
                this.state = 'advancing';
                this.boxedInTimer = 0;
                this.fleeTimer = 0;
                this.targetBuilding = null;
                this.jitterX = (Math.random() - 0.5) * TILE * 1.6;
                this.jitterY = (Math.random() - 0.5) * TILE * 1.6;
                this.timeSinceDamage = 0;
                this.stuckTimer = 0;
                this.wallOffset = 0;
                this.wallBack = 0;
                this.beingArrested = false;
                this.arrestOfficer = null;
                this.throwTimer = Math.random() * 1.5;
                this.gasStunTimer = 0;
                this.fleeExitX = 0;
                this.fleeExitY = 0;

                this.route = null;
                this.routeIdx = 0;
                this.goalNodeId = null;
                this.routeVersion = -1;
                this.repathTimer = Math.random() * 0.6;

                this.sepBiasX = (Math.random() - 0.5) * 0.6;
                this.sepBiasY = (Math.random() - 0.5) * 0.6;
            }
            moveToward(tx, ty, dt, speed) {
                return steerUnit(this, tx, ty, dt, speed);
            }
            nearestActiveOfficer() {
                let best = null, bestD = Infinity;
                for (const o of game.officers) {
                    if (!o.alive || o.state !== 'active') continue;

            startFleeing() {

                this.fleeExitY = exit.y;
            }
            pickGoalNode() {

                if (ai.objective === 'hunt') {
                    const o = this.nearestActiveOfficer();
                    if (o) { const n = nearestRoadNode(o.x, o.y); if (n) return n.id; }
                    return 'B54';
                }
                if (ai.objective === 'buildings') {
                    if (!this.targetBuilding || !this.targetBuilding.alive) this.targetBuilding = pickRaidBuilding(this);
                    if (this.targetBuilding && this.targetBuilding.frontX !== undefined) {
                        const n = nearestRoadNode(this.targetBuilding.frontX, this.targetBuilding.frontY);

            recomputeRoute() {

                if (!start) { this.route = null; return; }

                let path = findPath(start.id, goal, game.blockedEdges);

            update(dt) {

                if (this.state === 'fleeing') {

                    if (d < fallbackD) { fallbackD = d; fallbackTarget = o; }
                    const count = game.attackerCounts.get(o.id) || 0;
                    if (count >= MAX_ATTACKERS_PER_OFFICER) continue;
                    if (d < bestD) { bestD = d; target = o; }
                }
                // Repair escorts are valid targets too.
                for (const e of game.repairEscorts) {
                    if (!e.alive) continue;
                    const d = Math.hypot(e.x - this.x, e.y - this.y);
                    if (d < fallbackD) { fallbackD = d; fallbackTarget = e; }
                    const count = game.attackerCounts.get(e.id) || 0;
                    if (count >= MAX_ATTACKERS_PER_OFFICER) continue;

                            return;
                        }

                }

                if (ai.objective === 'buildings') {
                    if (!this.targetBuilding || !this.targetBuilding.alive) this.targetBuilding = pickRaidBuilding(this);
                    if (this.targetBuilding && this.targetBuilding.frontX !== undefined) {
                        const fx = this.targetBuilding.frontX, fy = this.targetBuilding.frontY;

                    ctx.fillText('👁', sx, sy - 26);

                    ctx.fillStyle = '#a0d0ff'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('↩', sx, sy - 26);

        function drawRaiderFigure(ctx, u) {

            ctx.save();

        function applyRaiderSeparation(dt) {

            const force = RAIDER_SEPARATION_STRENGTH * dt;
            for (let i = 0; i < n; i++) {

                let fx = 0, fy = 0, count = 0;
                for (let j = 0; j < n; j++) {

                    if (d2 > r2 || d2 < 0.0001) continue;

                }
                if (count === 0) continue;
                const nx = a.x + (fx + a.sepBiasX * 0.15) * force;
                const ny = a.y + (fy + a.sepBiasY * 0.15) * force;
                if (isValidPosition(nx, ny)) { a.x = nx; a.y = ny; }
                else if (isValidPosition(nx, a.y)) a.x = nx;
                else if (isValidPosition(a.x, ny)) a.y = ny;
            }
        }

        // ========== BUILDING DAMAGE ==========
        function pickRaidBuilding(r) {
            let best = null, bestD = Infinity;
            for (const b of sceneryBuildings) {
                if (!b.alive || b.frontX === undefined || b.hp <= 0) continue;
                const d = Math.hypot(b.frontX - r.x, b.frontY - r.y);
                if (d < bestD) { bestD = d; best = b; }
            }
            return best;
        }
        function damageBuilding(b, dmg) {
            if (!b || !b.alive) return;
            b.hp -= dmg;
            spawnHitEffect(b.tx * TILE, b.ty * TILE);
            if (b.hp <= 0) {
                b.hp = 0; b.alive = false;
                game.buildingsDestroyed++;
                game.baseHp = Math.max(0, game.baseHp - 6);
                buildTerrainCanvas();
                showToast('🏚️ A building has been wrecked!');
            }
        }

        // ========== COMBAT ==========
        function dealDamageToRaider(r, dmg, moraleMult) {
            if (r.state === 'fleeing' || r.beingArrested) return;
            const mMult = moraleMult || 1.0;
            r.hp -= dmg;
            r.timeSinceDamage = 0;
            spawnHitEffect(r.x, r.y);
            if (game.waveTotalHp > 0) {
                game.waveMoralePct = Math.max(0, game.waveMoralePct - (dmg / game.waveTotalHp) * 100);
            }
            game.raiderGroupMorale = Math.max(0, game.raiderGroupMorale - dmg * 0.025 * mMult);
            if (r.hp <= 0 && r.alive) {
                r.startFleeing();
                game.routed++; game.raidersDefeated++;
                game.raiderGroupMorale = Math.max(0, game.raiderGroupMorale - 5 * mMult);
            }
        }
        function dealDamageToOfficer(o, dmg) {
            const shieldMult = o.shieldUp ? 0.5 : 1.15;
            let resist;
            if (o.formationResist !== undefined) {
                resist = o.formationResist;
            } else {
                const sy = game.syndicates[o.syndicateIndex];
                resist = sy ? formationResistance(sy.tactic) : 0;
            }
            const finalDmg = dmg * shieldMult * (1 - resist);
            o.hp -= finalDmg;

            spawnHitEffect(o.x, o.y);
            if (o.hp <= 0 && o.alive) o.alive = false;
            if (!o.isAllOut && o.syndicateIndex >= 0) {
                const sy = game.syndicates[o.syndicateIndex];
                if (sy && sy.autoDisperse && sy.disperseTimer <= 0) {
                    sy.disperseTimer = MANUAL_DISPERSE_DURATION;
                    showToast('⚡ Auto-disperse! Triple damage for 10s.');
                }

        }
        function spawnHitEffect(x, y) { game.effects.push({ x, y, t: 0, life: 0.25 }); }
        function updateEffects(dt) {
            for (let i = game.effects.length - 1; i >= 0; i--) {
                const e = game.effects[i];
                e.t += dt;
                if (e.t >= e.life) game.effects.splice(i, 1);
            }
        }
        function drawEffects(ctx) {
            for (const e of game.effects) {
                const sx = e.x - game.camera.x, sy = e.y - game.camera.y;
                const p = 1 - e.t / e.life;
                ctx.fillStyle = `rgba(255,220,120,${p * 0.8})`;
                ctx.beginPath(); ctx.arc(sx, sy, 3 + (1 - p) * 5, 0, Math.PI * 2); ctx.fill();
            }
        }

        // ========== PROJECTILES ==========
        function updateProjectiles(dt) {
            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                const p = game.projectiles[i];
                p.t += dt;
                if (p.t >= p.duration) {
                    for (const o of game.officers) {
                        if (!o.alive) continue;
                        if (Math.hypot(o.x - p.tx, o.y - p.ty) < p.aoe) {
                            dealDamageToOfficer(o, p.dmg);
                        }
                    }
                    for (const e of game.repairEscorts) {
                        if (!e.alive) continue;
                        if (Math.hypot(e.x - p.tx, e.y - p.ty) < p.aoe) {
                            dealDamageToOfficer(e, p.dmg);
                        }
                    }
                    spawnHitEffect(p.tx, p.ty);
                    game.projectiles.splice(i, 1);
                }
            }
        }
        function drawProjectiles(ctx) {
            for (const p of game.projectiles) {
                const t = p.t / p.duration;
                const px = p.sx + (p.tx - p.sx) * t;
                const py = p.sy + (p.ty - p.sy) * t - Math.sin(t * Math.PI) * TILE * 4;
                const sx = px - game.camera.x, sy = py - game.camera.y;
                const shadowY = (p.sy + (p.ty - p.sy) * t) - game.camera.y;
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath(); ctx.ellipse(px - game.camera.x, shadowY + 2, 3, 1.5, 0, 0, Math.PI*2); ctx.fill();
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(t * 8);
                ctx.fillStyle = '#a0704a';
                ctx.fillRect(-3, -2, 6, 4);
                ctx.strokeStyle = '#4a2a18'; ctx.lineWidth = 1;
                ctx.strokeRect(-3, -2, 6, 4);
                ctx.restore();
            }
        }

        // ========== FORMATION ==========
        function orderByFrontStrength(list) {
            return list.sort((a, b) => {
                const ba = Math.floor(a.hp / 12), bb = Math.floor(b.hp / 12);
                if (ba !== bb) return bb - ba;
                return a.id - b.id;
            });
        }
        function effectiveTactic(sy, idx) {
            if (sy.tactic !== 'rest') return sy.tactic;
            for (const o of game.officers) {
                if (!o.alive || o.isAllOut || o.syndicateIndex !== idx || o.state !== 'active') continue;
                for (const r of game.raiders) {
                    if (!r.alive || r.state === 'fleeing' || r.beingArrested) continue;
                    if (Math.hypot(r.x - o.x, r.y - o.y) < TILE * 4.5) return 'staggeredwall';
                }
            }
            return 'rest';
        }
        function assignFormation() { for (let idx = 0; idx < OFFICER_SYNDICATES; idx++) assignFormationForSyndicate(idx); }
        function assignFormationForSyndicate(idx) {
            let alive;
            if (game.mergedMode) {
                if (idx !== game.mergedIntoIndex) return;
                alive = game.officers.filter(o => o.alive && !o.isAllOut && o.state === 'active');
            } else {
                alive = game.officers.filter(o => o.alive && !o.isAllOut && o.syndicateIndex === idx && o.state === 'active');
            }
            if (alive.length === 0) return;
            const sy = game.syndicates[idx];
            if (!sy) return;
            orderByFrontStrength(alive);
            const cx = sy.commandX, cy = sy.commandY;
            const tactic = effectiveTactic(sy, idx);
            let fx = sy.facingX || 1, fy = sy.facingY || 0;
            if (Math.abs(fx) > Math.abs(fy)) { fx = Math.sign(fx) || 1; fy = 0; } else { fx = 0; fy = Math.sign(fy) || 1; }
            const px = fy, py = -fx;
            const setSlot = (o, x, y) => {
                const c = clampOfficerTarget(x, y);
                o.targetX = c.x; o.targetY = c.y;
            };

            if (tactic === 'rest') {
                const perRow = 5; let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * COL_SPACING * TILE;
                        const back = row * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'wedge') {
                let i = 0, row = 0;
                while (i < alive.length) {
                    const count = Math.min(row + 1, alive.length - i);
                    for (let c = 0; c < count; c++) {
                        const off = (c - (count - 1) / 2) * COL_SPACING * TILE;
                        const back = row * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'closedwall') {
                const perRow = OFFICERS_PER_ROW, spacing = COL_SPACING * TILE;
                let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * spacing;
                        const back = row * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'staggeredwall') {
                const perRow = OFFICERS_PER_ROW, spacing = COL_SPACING * TILE;
                let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    const stagger = (row % 2 === 0) ? -spacing * 0.25 : spacing * 0.25;
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * spacing + stagger;
                        const back = row * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'stackleft' || tactic === 'stackright') {
                const sign = tactic === 'stackleft' ? -1 : 1;
                const files = 3;
                const edgeOffset = sign * (ROAD_W / 2 - 0.55) * TILE;
                let i = 0, rank = 0;
                while (i < alive.length) {
                    for (let f = 0; f < files && i < alive.length; f++) {
                        const off = edgeOffset - sign * f * COL_SPACING * TILE;
                        const back = rank * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    rank++;
                }
                return;
            }
            if (tactic === 'box') {
                const frontCount = Math.min(OFFICERS_PER_ROW, alive.length);
                const remaining = alive.length - frontCount;
                const leftCount = Math.ceil(remaining / 2), rightCount = remaining - leftCount;
                let i = 0;
                for (let c = 0; c < frontCount; c++) {
                    const off = (c - (frontCount - 1) / 2) * COL_SPACING * TILE;
                    setSlot(alive[i++], cx + px * off, cy + py * off);
                }
                const leftEndX = cx + px * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                const leftEndY = cy + py * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                for (let r = 1; r <= leftCount; r++) {
                    const back = r * ROW_SPACING * TILE;
                    setSlot(alive[i++], leftEndX - fx * back, leftEndY - fy * back);
                }
                const rightEndX = cx - px * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                const rightEndY = cy - py * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                for (let r = 1; r <= rightCount; r++) {
                    const back = r * ROW_SPACING * TILE;
                    setSlot(alive[i++], rightEndX - fx * back, rightEndY - fy * back);
                }
                return;
            }
            let i = 0, row = 0;
            const perRow = 5;
            while (i < alive.length) {
                const countThisRow = Math.min(perRow, alive.length - i);
                for (let c = 0; c < countThisRow; c++) {
                    const off = (c - (countThisRow - 1) / 2) * COL_SPACING * TILE;
                    const back = row * ROW_SPACING * TILE;
                    setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                }
                row++;
            }
        }

        // ========== TACTICS & MOVEMENT ==========
        function ensureSyndicateState(idx) {
            if (!game.syndicates[idx]) {
                const startX = (SYNDICATE_START_X[idx] !== undefined) ? SYNDICATE_START_X[idx] : (BASE_TILE_X + idx * 8);
                const startY = (SYNDICATE_START_Y[idx] !== undefined) ? SYNDICATE_START_Y[idx] : ROAD_Y_BOTTOM;
                game.syndicates[idx] = {
                    tactic: 'rest', commandX: startX * TILE, commandY: startY * TILE,
                    facingX: -1, facingY: 0, disperseTimer: 0, autoDisperse: false,
                    path: null, pathIdx: 0, pathVersion: -1,
                    goalX: startX * TILE, goalY: startY * TILE,
                };
            }
            const sy = game.syndicates[idx];
            if (sy.facingX === undefined) sy.facingX = -1;
            if (sy.facingY === undefined) sy.facingY = 0;
            if (sy.disperseTimer === undefined) sy.disperseTimer = 0;
            if (sy.autoDisperse === undefined) sy.autoDisperse = false;
            if (sy.path === undefined) sy.path = null;
            if (sy.pathIdx === undefined) sy.pathIdx = 0;
            if (sy.pathVersion === undefined) sy.pathVersion = -1;
            if (sy.goalX === undefined) sy.goalX = sy.commandX;
            if (sy.goalY === undefined) sy.goalY = sy.commandY;
            return sy;
        }
        function ensureVehicleSyndicate() {
            game.syndicates[VEHICLE_SYNDICATE] = {
                tactic: 'blockade',
                commandX: 44 * TILE + TILE / 2,
                commandY: ROAD_Y_BOTTOM * TILE + TILE / 2,
                facingX: -1, facingY: 0, disperseTimer: 0, autoDisperse: false,
            };
        }
        function applyTactic(kind) {
            const sy = ensureSyndicateState(game.selectedSyndicate);
            sy.tactic = kind;
            assignFormation(); updateSelectionUI(); renderOptionsPanel();
        }
        function applyOrder(kind) {
            const sy = ensureSyndicateState(game.selectedSyndicate);
            if (kind === 'autoDisperse') {
                sy.autoDisperse = !sy.autoDisperse;
                showToast(sy.autoDisperse ? '⚡ Auto-disperse ON' : 'Auto-disperse OFF');
            }
            renderOptionsPanel(); updateSelectionUI();
        }
        function commandMove(dx, dy) {
            if (game.selectedSyndicate === VEHICLE_SYNDICATE) { commandMoveVehicle(dx, dy); return; }
            if (game.selectedSyndicate === STATION_INDEX) return;
            const sy = ensureSyndicateState(game.selectedSyndicate);
            sy.path = null;
            sy.pathIdx = 0;
            const nx = sy.commandX + dx * TILE, ny = sy.commandY + dy * TILE;
            if (isValidOfficerPosition(nx, ny)) {
                const snapped = snapToTileCenter(nx, ny);
                sy.commandX = snapped.x; sy.commandY = snapped.y;
                sy.goalX = snapped.x; sy.goalY = snapped.y;
                if (dx !== 0) { sy.facingX = dx; sy.facingY = 0; }
                else if (dy !== 0) { sy.facingX = 0; sy.facingY = dy; }
                assignFormation(); updateSelectionUI();
            }
        }
        function commandMoveVehicle(dx, dy) {
            const v = game.vehicle;
            if (!v) return;
            const cur = v.targetSpot || { x: v.x, y: v.y };
            let best = null, bestD = Infinity;
            for (const s of BLOCKADE_SPOTS) {
                const ddx = s.x - cur.x, ddy = s.y - cur.y;
                const dist = Math.hypot(ddx, ddy);
                if (dist < TILE * 0.7 || dist > VEHICLE_STEP_RANGE) continue;
                const dot = (ddx * dx + ddy * dy) / dist;
                if (dot < 0.55) continue;
                if (dist < bestD) { bestD = dist; best = s; }
            }
            if (best) setVehicleTarget(best);
            else showToast('No blockade point that way.');
        }
        function canMove(dx, dy) {
            if (game.selectedSyndicate === VEHICLE_SYNDICATE) return !!game.vehicle;
            if (game.selectedSyndicate === STATION_INDEX) return false;
            const sy = game.syndicates[game.selectedSyndicate];
            if (!sy) return false;
            return isValidOfficerPosition(sy.commandX + dx * TILE, sy.commandY + dy * TILE);
        }
        function setVehicleTarget(spot) {
            const v = game.vehicle;
            if (!v || !spot) return;
            v.setSpot(spot);
            const sy = game.syndicates[VEHICLE_SYNDICATE];
            if (sy) { sy.commandX = spot.x; sy.commandY = spot.y; }
            renderOptionsPanel(); updateSelectionUI();
        }

        // ===== SYNDICATE ROAD MARCH =====
        const SYNDICATE_MARCH_SPEED = 3.0;

        function pathSyndicateTo(sy, worldX, worldY) {
            if (!sy) return;
            const clamped = clampOfficerTarget(worldX, worldY);
            const goalX = clamped.x, goalY = clamped.y;
            sy.goalX = goalX; sy.goalY = goalY;

            const rawPts = [];
            const start = nearestRoadNode(sy.commandX, sy.commandY);
            const goal = nearestRoadNode(goalX, goalY);
            if (start && goal) {
                const path = findPathWeighted(start.id, goal.id, game.blockedEdges)
                          || findPathWeighted(start.id, goal.id, null);
                if (path) {
                    for (const id of path) {
                        const n = getNode(id);
                        if (n) rawPts.push({ x: n.x * TILE, y: n.y * TILE });
                    }
                }
            }
            rawPts.push({ x: goalX, y: goalY });

            sy.path = smoothPath(sy.commandX, sy.commandY, rawPts);
            sy.pathIdx = 0;
            sy.pathVersion = game.blockadeVersion;
        }

        function commandSyndicateTo(worldX, worldY) {
            if (game.selectedSyndicate === VEHICLE_SYNDICATE) return;
            if (game.selectedSyndicate === STATION_INDEX) return;
            const sy = ensureSyndicateState(game.selectedSyndicate);
            pathSyndicateTo(sy, worldX, worldY);
            updateSelectionUI();
        }

        function updateSyndicateMovement(dt) {
            for (let i = 0; i < OFFICER_SYNDICATES; i++) {
                const sy = game.syndicates[i];
                if (!sy) continue;

                if (sy.path && sy.pathVersion !== game.blockadeVersion) {
                    pathSyndicateTo(sy, sy.goalX, sy.goalY);
                }
                if (!sy.path || sy.path.length === 0) continue;

                let budget = SYNDICATE_MARCH_SPEED * TILE * dt;
                let guard = 0;
                while (budget > 0 && guard++ < 64) {
                    if (sy.pathIdx >= sy.path.length) break;
                    const wp = sy.path[sy.pathIdx];
                    const dx = wp.x - sy.commandX, dy = wp.y - sy.commandY;
                    const d = Math.hypot(dx, dy);
                    if (d < 0.6) { sy.pathIdx++; continue; }

                    const step = Math.min(d, budget);
                    const ux = dx / d, uy = dy / d;
                    sy.commandX += ux * step;
                    sy.commandY += uy * step;
                    budget -= step;

                    if (Math.abs(ux) > Math.abs(uy)) {
                        const sx = Math.sign(ux) || 1;
                        if (sy.facingX !== sx || sy.facingY !== 0) { sy.facingX = sx; sy.facingY = 0; }
                    } else {
                        const syDir = Math.sign(uy) || 1;
                        if (sy.facingX !== 0 || sy.facingY !== syDir) { sy.facingX = 0; sy.facingY = syDir; }
                    }

                    if (step >= d - 0.001) sy.pathIdx++;
                }
                if (sy.pathIdx >= sy.path.length) sy.path = null;
            }
        }

        // ========== ALL UNITS ON ME ==========
        function toggleMergedMode() {
            if (game.syndicatesDeployed < 2) { showToast('Need at least 2 syndicates to merge.'); return; }
            if (game.mergedMode) {
                game.mergedMode = false;
                showToast('Units released — syndicates resume their own formations.');
            } else {
                game.mergedIntoIndex = game.selectedSyndicate >= OFFICER_SYNDICATES ? 0 : game.selectedSyndicate;
                game.mergedMode = true;
                showToast('All units converging on Syndicate ' + (game.mergedIntoIndex + 1) + '!');
            }
            assignFormation(); renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI(); updateMergedButton();
        }
        function updateMergedButton() {
            const btn = document.getElementById('all-units-btn');

            else { btn.classList.remove('active'); btn.textContent = '🪖 All Units On Me'; }
        }

        // ========== ALL OUT ==========
        function triggerAllOut() {
            if (game.allOutCooldown > 0 || game.gameOver) return;
            game.allOutCooldown = ALL_OUT_COOLDOWN;
            game.allOutActive = ALL_OUT_DURATION;

            for (const slot of ALL_OUT_BOX_TILES) {

        function updateAllOutButton() {

            } else {

        // ========== ARREST TEAM ==========
        function sendInArrestTeam() {
            const idx = game.selectedSyndicate;
            if (idx >= OFFICER_SYNDICATES) { showToast('The blockade vehicle has no arrest team.'); return; }
            if (game.arrestCooldown[idx] > 0) {
                showToast('Arrest team for S' + (idx + 1) + ' is regrouping.');
                return;
            }
            const sy = ensureSyndicateState(idx);
            if (!sy) return;

            let fx = sy.facingX || 1, fy = sy.facingY || 0;
            if (Math.abs(fx) > Math.abs(fy)) { fx = Math.sign(fx) || 1; fy = 0; }
            else { fx = 0; fy = Math.sign(fy) || 1; }
            const px = fy, py = -fx;
            const back = TILE * 4;
            const baseX = sy.commandX - fx * back;
            const baseY = sy.commandY - fy * back;

            const existing = game.arrestOfficers.filter(a => a.alive && a.syndicateIndex === idx);

            if (existing.length >= ARREST_TEAM_SIZE) {
                existing.forEach((a, i) => {
                    const off = (i - (ARREST_TEAM_SIZE - 1) / 2) * TILE * 1.5;
                    let sx = baseX + px * off;
                    let sy2 = baseY + py * off;
                    if (!isValidOfficerPosition(sx, sy2)) {
                        const snapped = snapToTileCenter(baseX, baseY);
                        sx = snapped.x; sy2 = snapped.y;
                    }
                    a.x = sx; a.y = sy2;
                    a.hp = a.maxHp;
                    if (a.carrying) { a.carrying.beingArrested = false; a.carrying.arrestOfficer = null; a.carrying = null; }
                    a.carrying = null;
                    a.carryTimer = 0;
                    a.state = 'escort';
                    a.lifeTimer = ARREST_TEAM_LIFETIME;
                    a.returningHome = false;
                    a.route = null; a.routeIdx = 0; a.routeStuck = 0;
                    a._lastReturnDist = undefined;
                    a._returnStuckTime = 0;
                });

        // ========== WAVES ==========
        const OBJECTIVE_LABELS = { base: 'Reach the Station', buildings: 'Vandalize the City', hunt: 'Attack the Officers' };
        const OBJECTIVE_SHORT = { base: 'Station', buildings: 'Vandalism', hunt: 'Hunt Officers' };

        const WAVE_TACTICS = {
            'single':        { exits: ['N18'], tone: 'Massed Assault' },
            'pincer':        { exits: ['N18', 'N90'], tone: 'Pincer Movement' },
            'multi_front':   { exits: ['N18', 'N90', 'S12'], tone: 'Multi-Pronged Attack' },
            'flank':         { exits: ['N30', 'N78'], tone: 'Flanking Manoeuvre' },
            'ambush':        { exits: ['N18', 'S96'], tone: 'Ambush & Probe' },
            'mass_charge':   { exits: ['N54'], tone: 'Massing For Charge' },
            'bottom_pincer': { exits: ['S12', 'S96'], tone: 'Rear Pincer' },
            'surround':      { exits: ['N18', 'N90', 'S12', 'S96'], tone: 'Surround & Close' },
            'four_ways':     { exits: ['N30', 'N78', 'S12', 'S96'], tone: 'Four-Pronged Assault' },
            'top_and_bottom':{ exits: ['N18', 'N90', 'S12'], tone: 'Top And Bottom Push' },
            'north_south':   { exits: ['N54', 'S12', 'S96'], tone: 'North-South Squeeze' },
            'all_gates':     { exits: ['N18', 'N30', 'N54', 'N78', 'N90', 'S12', 'S96'], tone: 'All Gates Open' },
        };

        function chooseWaveTactic() {
            const wave = game.waveNumber;
            if (wave <= 1) return 'single';
            if (wave === 2) return 'pincer';
            if (wave === 3) return 'bottom_pincer';
            if (wave === 4) return 'flank';
            const roll = Math.random();
            if (roll < 0.08) return 'single';
            if (roll < 0.16) return 'pincer';
            if (roll < 0.24) return 'multi_front';
            if (roll < 0.32) return 'flank';
            if (roll < 0.40) return 'ambush';
            if (roll < 0.48) return 'bottom_pincer';
            if (roll < 0.57) return 'surround';
            if (roll < 0.64) return 'mass_charge';
            if (roll < 0.72) return 'four_ways';
            if (roll < 0.80) return 'top_and_bottom';
            if (roll < 0.89) return 'north_south';
            return 'all_gates';
        }
        function pickPersonality() {
            const r = Math.random();
            return r < 0.5 ? 'aggressive' : (r < 0.8 ? 'cautious' : 'sneaky');
        }

        function startWave() {
            game.waveState = 'active';
            game.waveMoralePct = 100;
            game.routed = 0;
            game.raidersDefeated = 0;
            game.raiderGroupMorale = 100;

            const ai = game.raidAI;
            const roll = Math.random();
            if (game.waveNumber <= 1) ai.objective = 'base';
            else if (roll < 0.44) ai.objective = 'base';
            else if (roll < 0.76) ai.objective = 'buildings';
            else ai.objective = 'hunt';

            const raiderCount = 20 + game.waveNumber * 6;
            const tactic = chooseWaveTactic();
            const cfg = WAVE_TACTICS[tactic] || WAVE_TACTICS['single'];
            const exits = cfg.exits.slice();

            const ALL_EXITS = ['N18','N30','N54','N78','N90','S12','S96'];
            const extraTries = Math.min(3, Math.floor(game.waveNumber / 2));
            for (let i = 0; i < extraTries; i++) {
                if (Math.random() < 0.55) {
                    const e = ALL_EXITS[Math.floor(Math.random() * ALL_EXITS.length)];
                    if (!exits.includes(e)) exits.push(e);
                }
            }

            game.squads = new Map();
            game.nextSquadId = 1;
            const createdSquads = [];
            let assigned = 0;
            const per = Math.floor(raiderCount / exits.length);

            for (let i = 0; i < exits.length; i++) {
                const share = (i === exits.length - 1) ? (raiderCount - assigned) : per;
                if (share <= 0) continue;
                const squad = new RaiderSquad(game.nextSquadId++, exits[i], pickPersonality());
                game.squads.set(squad.id, squad);
                createdSquads.push({ squad, count: share });
                assigned += share;
                const r = Math.random();
                squad.role = (r < 0.55) ? 'main' : (r < 0.8) ? 'flank' : 'distraction';
                squad.targetSyndicate = Math.floor(Math.random() * OFFICER_SYNDICATES);
            }

            game.waveSpawnQueue = [];
            let totalHp = 0;
            for (const { squad, count } of createdSquads) {
                for (let i = 0; i < count; i++) {
                    const roll2 = Math.random();
                    let kind = 'standard';
                    if (roll2 < 0.15) kind = 'brickthrower';
                    else if (roll2 < 0.40) kind = 'bruiser';
                    game.waveSpawnQueue.push({ kind, squadId: squad.id });
                    totalHp += RAIDER_TYPES[kind].hp;
                }
            }
            for (let i = game.waveSpawnQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [game.waveSpawnQueue[i], game.waveSpawnQueue[j]] = [game.waveSpawnQueue[j], game.waveSpawnQueue[i]];
            }

            game.waveTotalHp = totalHp;
            game.totalRaidersInWave = raiderCount;
            game.waveSpawnTimer = 0;
            announceWave(tactic);
        }

        function updateWaves(dt) {
            if (game.testMode) return;
            if (game.waveState === 'intermission') {
                game.waveTimer -= dt;
                if (game.waveTimer <= 0) startWave();
                return;
            }
            game.waveSpawnTimer -= dt;
            if (game.waveSpawnQueue.length > 0 && game.waveSpawnTimer <= 0) {
                const entry = game.waveSpawnQueue.shift();
                const squad = game.squads.get(entry.squadId);
                if (squad) {
                    const startNode = getNode(squad.spawnNodeId);
                    if (startNode) {
                        let sx = startNode.x * TILE + (Math.random() - 0.5) * TILE * 2;
                        let sy = startNode.y * TILE + (Math.random() - 0.5) * TILE;
                        sx = Math.max(TILE, Math.min(MAP_W * TILE - TILE, sx));
                        sy = Math.max(TILE, Math.min(MAP_H * TILE - TILE, sy));
                        if (!isValidPosition(sx, sy)) {
                            sx = startNode.x * TILE;
                            sy = startNode.y * TILE;
                        }
                        const r = new Raider(entry.kind, squad.spawnNodeId, squad.id, sx, sy);
                        r.goalNodeId = r.pickGoalNode();
                        r.recomputeRoute();
                        r.routeIdx = Math.min(1, r.route.length - 1);
                        game.raiders.push(r);
                    }
                }
                game.waveSpawnTimer = 0.10 + Math.random() * 0.18;
            }

            const anyLeft = game.raiders.some(r => r.alive) || game.waveSpawnQueue.length > 0;
            const moraleBroken = game.waveMoralePct <= 0;
            const routedEnough = (game.raidersDefeated / Math.max(1, game.totalRaidersInWave)) >= 0.95;

            if (moraleBroken || routedEnough) {
                game.waveSpawnQueue = [];
                for (const r of game.raiders) {
                    if (r.alive && r.state !== 'fleeing' && !r.beingArrested) { r.startFleeing(); game.routed++; }
                }
            }

            if (!anyLeft || moraleBroken || routedEnough) {
                const stillFleeing = game.raiders.some(r => r.alive);
                if (!stillFleeing) {
                    game.raiders = [];
                    game.waveState = 'intermission';
                    game.waveNumber++;
                    game.waveTimer = 8;
                    showToast('Wave cleared — raiders dispersed!');
                }
            }
            if (game.baseHp <= 0 && !game.gameOver) endGame(false);
        }

        // ========== SQUAD AI DIRECTOR ==========
        function enterWallState(squad) {
            squad.state = 'wall';
            squad.stateTimer = 3 + Math.random() * 2;
            const c = squad.centroid;
            const obj = getNode('B54');
            const ox = obj ? obj.x * TILE : c.x;
            const oy = obj ? obj.y * TILE : c.y;
            const dx = ox - c.x, dy = oy - c.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                squad.wallPerpX = 0; squad.wallPerpY = 1;
                squad.wallTravelX = Math.sign(dx) || 1; squad.wallTravelY = 0;
            } else {
                squad.wallPerpX = 1; squad.wallPerpY = 0;
                squad.wallTravelX = 0; squad.wallTravelY = Math.sign(dy) || 1;
            }
            const members = squad.members();
            members.sort((a, b) => a.id - b.id);
            const n = members.length;
            const front = Math.min(6, n);
            const rows = Math.ceil(n / front);
            let i = 0;
            for (let row = 0; row < rows; row++) {
                const countThisRow = Math.min(front, n - i);
                for (let cIdx = 0; cIdx < countThisRow; cIdx++) {
                    const off = cIdx - (countThisRow - 1) / 2;
                    members[i].wallOffset = off;
                    members[i].wallBack = row * 1.4;
                    i++;
                }
            }
        }

        function updateSquadAI(dt) {
            const officers = game.officers.filter(o => o.alive && o.state === 'active');
            for (const squad of game.squads.values()) {
                const members = squad.members();
                if (members.length === 0) continue;
                squad.stateTimer -= dt;
                const c = squad.computeCentroid();
                if (c.count === 0) continue;

                if (squad.state === 'wall') {
                    const n = members.length;
                    const front = Math.min(6, n);
                    const rows = Math.ceil(n / front);
                    let i = 0;
                    const sorted = [...members].sort((a, b) => a.id - b.id);
                    for (let row = 0; row < rows; row++) {
                        const countThisRow = Math.min(front, n - i);
                        for (let cIdx = 0; cIdx < countThisRow; cIdx++) {
                            sorted[i].wallOffset = cIdx - (countThisRow - 1) / 2;
                            sorted[i].wallBack = row * 1.4;
                            i++;
                        }
                    }
                }

                let inContact = false;
                let nearestOfficerDist = Infinity;
                for (const r of members) {
                    for (const o of officers) {
                        const d = Math.hypot(r.x - o.x, r.y - o.y);
                        if (d < nearestOfficerDist) nearestOfficerDist = d;
                        if (d < TILE * 3.5) inContact = true;
                    }
                }
                squad.contactTimer = inContact ? 2.0 : Math.max(0, squad.contactTimer - dt);
                const officerDistTiles = nearestOfficerDist / TILE;

                if (squad.stateTimer > 0) continue;

                const avgHp = squad.avgHpPct();
                const spawnNode = getNode(squad.spawnNodeId);
                const spawnDist = spawnNode ? Math.hypot(spawnNode.x * TILE - c.x, spawnNode.y * TILE - c.y) : 999;

                if (squad.role === 'distraction' && !inContact && spawnDist > TILE * 14 &&
                    officerDistTiles < 12 && officerDistTiles > 4) {
                    squad.state = 'ambush';
                    squad.stateTimer = 4 + Math.random() * 3;
                    continue;
                }

                if (avgHp < 0.15 && squad.contactTimer <= 0 && spawnNode) {
                    squad.state = 'withdraw';
                    squad.rallyX = spawnNode.x * TILE;
                    squad.rallyY = spawnNode.y * TILE;
                    squad.stateTimer = 8 + Math.random() * 5;
                    continue;
                }
                const restBias = squad.personality === 'cautious' ? 0.55 : squad.personality === 'sneaky' ? 0.45 : 0.35;
                if (avgHp < restBias && squad.contactTimer <= 0) {
                    squad.state = 'rest';
                    squad.stateTimer = 5 + Math.random() * 3;
                    squad.rallyX = c.x; squad.rallyY = c.y;
                    continue;
                }
                if (!inContact && officerDistTiles < 6 && members.length >= 2 && Math.random() < 0.5) {
                    enterWallState(squad);
                    continue;
                }
                squad.state = 'advance';
                squad.stateTimer = 9 + Math.random() * 4;
            }
        }

        function announceWave(tactic) {
            const el = document.getElementById('wave-banner');
            const objLabel = OBJECTIVE_LABELS[game.raidAI.objective] || '';
            const cfg = WAVE_TACTICS[tactic];
            const tLabel = cfg ? cfg.tone : '';
            el.innerHTML = 'WAVE ' + game.waveNumber +
                '<br><span style="font-size:15px;letter-spacing:1px;color:#ffcc33">' + objLabel + '</span>' +
                (tLabel ? '<br><span style="font-size:11px;letter-spacing:1px;color:#ff8a5c">' + tLabel + '</span>' : '');
            el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2100);
        }

        // ========== INPUT ==========
        function setupEvents() {
            const c = game.canvas;
            c.addEventListener('touchstart', e => { const t = e.touches[0]; startInput(t.clientX, t.clientY); }, { passive: true });
            c.addEventListener('touchmove', e => { const t = e.touches[0]; moveInput(t.clientX, t.clientY); }, { passive: true });
            c.addEventListener('touchend', endInput, { passive: true });
            c.addEventListener('mousedown', e => startInput(e.clientX, e.clientY));
            c.addEventListener('mousemove', e => { if (game.mouse.down) moveInput(e.clientX, e.clientY); });
            window.addEventListener('mouseup', endInput);
            const mm = document.getElementById('minimap');
            mm.addEventListener('touchstart', e => { const t = e.touches[0]; jumpCameraFromMinimap(t.clientX, t.clientY); }, { passive: true });
            mm.addEventListener('mousedown', e => jumpCameraFromMinimap(e.clientX, e.clientY));
        }
        function startInput(x, y) {
            game.mouse.down = true; game.mouse.moved = false;
            game.mouse.startX = x; game.mouse.startY = y; game.mouse.curX = x; game.mouse.curY = y;
        }
        function moveInput(x, y) {
            if (!game.mouse.down) return;
            const dx = x - game.mouse.curX, dy = y - game.mouse.curY;
            if (Math.abs(x - game.mouse.startX) > 4 || Math.abs(y - game.mouse.startY) > 4) game.mouse.moved = true;
            game.camera.x -= dx; game.camera.y -= dy;
            game.cameraUserLock = 2.5;
            clampCamera();
            game.mouse.curX = x; game.mouse.curY = y;
        }
        function endInput() {
            if (game.mouse.down && !game.mouse.moved) {
                handleTap(game.mouse.startX, game.mouse.startY);
            }
            game.mouse.down = false;
        }
        function handleTap(clientX, clientY) {
            if (game.gameOver) return;
            const wx = clientX + game.camera.x;
            const wy = clientY + game.camera.y;

            if (game.selectedSyndicate === VEHICLE_SYNDICATE) {
                let best = null, bestD = Infinity;
                for (const s of BLOCKADE_SPOTS) {
                    const d = Math.hypot(s.x - wx, s.y - wy);
                    if (d < bestD) { bestD = d; best = s; }
                }
                if (best && bestD < TILE * 5) setVehicleTarget(best);
                else showToast('Tap near a road to position the blockade.');
                return;
            }
            if (game.selectedSyndicate === STATION_INDEX) return;

            commandSyndicateTo(wx, wy);
        }
        function jumpCameraFromMinimap(x, y) {
            const rect = document.getElementById('minimap').getBoundingClientRect();
            const mx = (x - rect.left) / MINIMAP_SCALE, my = (y - rect.top) / MINIMAP_SCALE;
            game.camera.x = mx * TILE - game.width / 2;
            game.camera.y = my * TILE - game.height / 2;
            game.cameraUserLock = 2.5;
            clampCamera();
        }
        function clampCamera() {
            const maxX = Math.max(0, MAP_W * TILE - game.width);
            const maxY = Math.max(0, MAP_H * TILE - game.height);
            game.camera.x = Math.max(0, Math.min(maxX, game.camera.x));
            game.camera.y = Math.max(0, Math.min(maxY, game.camera.y));
        }

        // ========== CAMERA FOLLOW ==========
        function updateCamera(dt) {
            if (game.cameraUserLock > 0) { game.cameraUserLock -= dt; return; }
            if (game.mouse.down) return;

            const idx = game.selectedSyndicate;
            const k = Math.min(1, dt * 3.2);

            if (idx === VEHICLE_SYNDICATE && game.vehicle) {
                game.camera.x += (game.vehicle.x - game.width / 2 - game.camera.x) * k;
                game.camera.y += (game.vehicle.y - game.height / 2 - game.camera.y) * k;
                clampCamera();
                return;
            }

            let cx = 0, cy = 0, n = 0;

            for (const o of game.officers) {
                if (!o.alive || o.isAllOut) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && o.syndicateIndex !== idx) continue;
                const w = (o.state === 'active') ? 1 : 0.3;
                cx += o.x * w; cy += o.y * w; n += w;
            }
            for (const a of game.arrestOfficers) {
                if (!a.alive) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && a.syndicateIndex !== idx) continue;
                cx += a.x; cy += a.y; n += 1;
            }
            for (const h of game.handlers) {
                if (!h.alive) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && h.syndicateIndex !== idx) continue;
                cx += h.x; cy += h.y; n += 1;
            }
            for (const t of game.tearGasOfficers) {
                if (!t.alive) continue;
                if (idx === STATION_INDEX) continue;
                if (!game.mergedMode && t.syndicateIndex !== idx) continue;
                cx += t.x; cy += t.y; n += 1;
            }
            if (idx === STATION_INDEX) {
                for (const rp of game.repairOfficers) {
                    if (!rp.alive) continue;
                    cx += rp.x; cy += rp.y; n += 1;
                }
                for (const re of game.repairEscorts) {
                    if (!re.alive) continue;
                    cx += re.x; cy += re.y; n += 1;
                }
            }

            if (n <= 0) {
                for (const o of game.officers) {
                    if (o.alive && !o.isAllOut) { cx += o.x; cy += o.y; n++; }
                }
            }
            if (n <= 0) return;

            cx /= n; cy /= n;
            game.camera.x += (cx - game.width / 2 - game.camera.x) * k;
            game.camera.y += (cy - game.height / 2 - game.camera.y) * k;
            clampCamera();
        }

        // ========== LEFT PANEL UI ==========
        const FORMATION_DEFS = [
            { key: 'rest', label: '😌 Rest' },
            { key: 'wedge', label: '🔺 Wedge' },
            { key: 'closedwall', label: '🧱 Closed Wall' },
            { key: 'staggeredwall', label: '🧱 Staggered Wall' },
            { key: 'stackleft', label: '⬅️ Stack Left' },
            { key: 'stackright', label: '➡️ Stack Right' },
            { key: 'box', label: '📦 Box' },
        ];
        const ORDER_DEFS = [
            { key: 'autoDisperse', label: '⚡ Auto-Disperse' },
        ];

        function renderVehiclePanel(panel) {
            const v = game.vehicle;

            const label = document.createElement('div');
            label.className = 'section-label'; label.textContent = 'Road Blockade';
            panel.appendChild(label);

            const bMobile = document.createElement('button');
            bMobile.textContent = '🚙 Mobile';
            if (v && !v.parked && !v.targetSpot) bMobile.classList.add('active-choice');
            bMobile.addEventListener('click', () => {
                if (v) { v.clearTarget(); }
                showToast('Vehicle released — roads open.');
                renderOptionsPanel(); updateSelectionUI();
            });
            panel.appendChild(bMobile);

            const bBlock = document.createElement('button');
            bBlock.textContent = '🚧 Blockade';
            if (v && (v.parked || v.targetSpot)) bBlock.classList.add('active-choice');
            bBlock.addEventListener('click', () => {
                if (!v) return;
                if (!v.targetSpot) {
                    let best = null, bestD = Infinity;
                    for (const s of BLOCKADE_SPOTS) {
                        const d = Math.hypot(s.x - v.x, s.y - v.y);
                        if (d < bestD) { bestD = d; best = s; }
                    }
                    if (best) setVehicleTarget(best);
                } else {
                    v.setSpot(v.targetSpot);
                }
                renderOptionsPanel(); updateSelectionUI();
            });
            panel.appendChild(bBlock);

            const cLabel = document.createElement('div');
            cLabel.className = 'section-label'; cLabel.textContent = 'Vehicle Weapon';

                if (!v) return;
                v.waterCannonOn = !v.waterCannonOn;
                if (v.waterCannonOn) showToast('💧 Water cannon engaged — firing at will.');
                else showToast('💧 Water cannon off.');
                renderOptionsPanel(); updateSelectionUI();
            });
            panel.appendChild(bWater);

            const d = document.createElement('div');
            d.className = 'info-line';
            if (!v) d.textContent = 'Vehicle unavailable.';

                if (v.parked) parts.push('🚧 Road BLOCKED.');
                else if (v.targetSpot) parts.push('Driving to blockade point…');
                else parts.push('Mobile — tap the map or d-pad to place a blockade.');
                if (v.waterCannonOn) parts.push('💧 Water cannon ON — auto-firing at nearby raiders.');
                d.textContent = parts.join(' ');

            panel.appendChild(d);

        // ========== BOTTOM-RIGHT UI ==========
        function renderSyndicateTabs() {
            const tabs = document.querySelectorAll('#syndicate-tabs .syn-btn');
            tabs.forEach((b, idx) => {
                if (idx === VEHICLE_SYNDICATE) {
                    b.disabled = false;
                    b.classList.toggle('active', game.selectedSyndicate === VEHICLE_SYNDICATE);
                    return;
                }
                const exists = idx < game.syndicatesDeployed;
                let count = 0;
                if (exists) {
                    if (game.mergedMode) {
                        count = (idx === game.mergedIntoIndex)
                            ? game.officers.filter(o => o.alive && !o.isAllOut && o.state === 'active').length
                            : 0;
                    } else {
                        count = game.officers.filter(o => o.alive && !o.isAllOut && o.syndicateIndex === idx && o.state === 'active').length;
                    }
                }
                b.disabled = !exists;
                b.textContent = 'S' + (idx + 1) + (exists ? ' (' + count + ')' : '');
                b.classList.toggle('active', idx === game.selectedSyndicate && exists);
            });
            updateStationButton();
        }
        function setupBottomRightUI() {
            document.querySelectorAll('#syndicate-tabs .syn-btn').forEach(b => {
                b.addEventListener('click', () => {
                    const idx = parseInt(b.dataset.idx, 10);
                    if (idx < OFFICER_SYNDICATES && idx >= game.syndicatesDeployed) return;
                    if (game.mergedMode) {

                    }
                    game.selectedSyndicate = idx;

                });
            });
            const mergeBtn = document.getElementById('all-units-btn');
            if (mergeBtn) mergeBtn.addEventListener('click', toggleMergedMode);
            const allOutBtn = document.getElementById('all-out-btn');

            const stationBtn = document.getElementById('station-btn');
            if (stationBtn) stationBtn.addEventListener('click', () => {
                if (game.mergedMode) { game.mergedMode = false; updateMergedButton(); }
                game.selectedSyndicate = STATION_INDEX;
                renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI();
                updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
                updateStationButton();
                game.cameraUserLock = 0;

            const arrestBtn = document.getElementById('send-arrest');

            const gasBtn = document.getElementById('deploy-gas');

        function updateSelectionUI() {
            const idx = game.selectedSyndicate;
            const el = document.getElementById('selection-info');

            const topBar = document.getElementById('top-bar');
            if (topBar) topBar.style.display = (idx === VEHICLE_SYNDICATE || idx === STATION_INDEX) ? 'none' : 'flex';

            if (idx === STATION_INDEX) {
                const any = game.repairOfficers.some(r => r.alive);
                if (any) {
                    const rp = game.repairOfficers.find(r => r.alive);
                    let escorts = 0;
                    if (rp) for (const e of rp.escorts) if (e.alive) escorts++;
                    el.textContent = '🏢 Station — repair worker deployed (escort ' + escorts + '/' + REPAIR_ESCORT_COUNT + ')';
                }
                else if (game.repairCooldown > 0) el.textContent = '🏢 Station — repair team recharging (' + Math.ceil(game.repairCooldown) + 's)';
                else el.textContent = '🏢 Station — ready to deploy repair team + escort';
                updateStationButton();
                return;
            }

            if (idx === VEHICLE_SYNDICATE) {
                const v = game.vehicle;
                if (!v) { el.textContent = ''; return; }
                let txt = '🚙 Blockade Vehicle — ';
                if (v.parked) txt += 'road blocked';
                else if (v.targetSpot) txt += 'moving to position';
                else txt += 'mobile';
                if (v.waterCannonOn) txt += ' · 💧 cannon ON';
                el.textContent = txt;
                return;
            }

            const sy = game.syndicates[idx];
            if (!sy) { el.textContent = ''; return; }
            let count, prefix;
            if (game.mergedMode) {
                count = game.officers.filter(o => o.alive && !o.isAllOut && o.state === 'active').length;
                prefix = 'MERGED FORCE';
            } else {
                count = game.officers.filter(o => o.alive && !o.isAllOut && o.syndicateIndex === idx && o.state === 'active').length;
                prefix = 'Syndicate ' + (idx + 1);
            }
            if (count === 0) { el.textContent = ''; return; }
            const tacticLabel = (FORMATION_DEFS.find(t => t.key === sy.tactic) || {}).label || sy.tactic;
            const resist = Math.round(formationResistance(sy.tactic) * 100);
            const bits = [prefix + ' — ' + count + ' officers — ' + tacticLabel + ' · 🛡 ' + resist + '%'];
            if (sy.autoDisperse) bits.push('⚡ Auto');

            if (sy.path) bits.push('➤ moving');

        }

        // ========== HUD ==========
