            if (sy) { sy.commandX = v.x; sy.commandY = v.y; }
        }

        // ========== WAVES ==========
        const OBJECTIVE_LABELS = { base: 'Reach the Station', buildings: 'Vandalize the City', hunt: 'Attack the Officers' };
        const OBJECTIVE_SHORT = { base: 'Station', buildings: 'Vandalism', hunt: 'Hunt Officers' };

        // Every entrance/exit is a potential raider origin.
        const WAVE_TACTICS = {
            'single':        { exits: ['N18'], tone: 'Massed Assault' },
            'pincer':        { exits: ['N18', 'N90'], tone: 'Pincer Movement' },
            'multi_front':   { exits: ['N18', 'N90', 'S12'], tone: 'Multi-Pronged Attack' },
            'flank':         { exits: ['N30', 'N78'], tone: 'Flanking Manoeuvre' },
            'ambush':        { exits: ['N18', 'S96'], tone: 'Ambush & Probe' },
            'mass_charge':   { exits: ['N30'], tone: 'Massing For Charge' },
            'bottom_pincer': { exits: ['S12', 'S96'], tone: 'Rear Pincer' },
            'surround':      { exits: ['N18', 'N90', 'S12', 'S96'], tone: 'Surround & Close' },
            'four_ways':     { exits: ['N30', 'N78', 'S30', 'S78'], tone: 'Four-Pronged Assault' },
            'top_and_bottom':{ exits: ['N18', 'N90', 'S30'], tone: 'Top And Bottom Push' },
            'north_south':   { exits: ['N30', 'S30', 'S78'], tone: 'North-South Squeeze' },
            'all_gates':     { exits: ['N18', 'N30', 'N78', 'N90', 'S12', 'S30', 'S78', 'S96'], tone: 'All Gates Open' },
        };

        function chooseWaveTactic() {
            const wave = game.waveNumber;
            if (wave <= 1) return 'single';
            if (wave === 2) return 'pincer';
            if (wave === 3) return 'bottom_pincer';
            if (wave === 4) return 'flank';
            const roll = Math.random();
            if (roll < 0.08) return 'single';
            if (roll < 0.16) return 'pincer';
            if (roll < 0.24) return 'multi_front';
            if (roll < 0.32) return 'flank';
            if (roll < 0.40) return 'ambush';
            if (roll < 0.48) return 'bottom_pincer';
            if (roll < 0.57) return 'surround';
            if (roll < 0.64) return 'mass_charge';
            if (roll < 0.72) return 'four_ways';
            if (roll < 0.80) return 'top_and_bottom';
            if (roll < 0.89) return 'north_south';
            return 'all_gates';
        }
        function pickPersonality() {
            const r = Math.random();
            return r < 0.5 ? 'aggressive' : (r < 0.8 ? 'cautious' : 'sneaky');
        }

        function startWave() {
            game.waveState = 'active';
            game.waveMoralePct = 100;
            game.routed = 0;
            game.raidersDefeated = 0;
            game.raiderGroupMorale = 100;

            const ai = game.raidAI;
            const roll = Math.random();
            if (game.waveNumber <= 1) ai.objective = 'base';
            else if (roll < 0.44) ai.objective = 'base';
            else if (roll < 0.76) ai.objective = 'buildings';
            else ai.objective = 'hunt';

            const raiderCount = 16 + game.waveNumber * 5;
            const tactic = chooseWaveTactic();
            const cfg = WAVE_TACTICS[tactic] || WAVE_TACTICS['single'];
            const exits = cfg.exits.slice();

            game.squads = new Map();
            game.nextSquadId = 1;
            const createdSquads = [];
            let assigned = 0;
            const per = Math.floor(raiderCount / exits.length);

            for (let i = 0; i < exits.length; i++) {
                const share = (i === exits.length - 1) ? (raiderCount - assigned) : per;
                if (share <= 0) continue;
                const squad = new RaiderSquad(game.nextSquadId++, exits[i], pickPersonality());
                game.squads.set(squad.id, squad);
                createdSquads.push({ squad, count: share });
                assigned += share;
                const r = Math.random();
                squad.role = (r < 0.55) ? 'main' : (r < 0.8) ? 'flank' : 'distraction';
                squad.targetSyndicate = Math.floor(Math.random() * OFFICER_SYNDICATES);
            }

            game.waveSpawnQueue = [];
            let totalHp = 0;
            for (const { squad, count } of createdSquads) {
                for (let i = 0; i < count; i++) {
                    const roll2 = Math.random();
                    let kind = 'standard';
                    if (roll2 < 0.15) kind = 'brickthrower';
                    else if (roll2 < 0.40) kind = 'bruiser';
                    game.waveSpawnQueue.push({ kind, squadId: squad.id });
                    totalHp += RAIDER_TYPES[kind].hp;
                }
            }
            for (let i = game.waveSpawnQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [game.waveSpawnQueue[i], game.waveSpawnQueue[j]] = [game.waveSpawnQueue[j], game.waveSpawnQueue[i]];
            }

            game.waveTotalHp = totalHp;
            game.totalRaidersInWave = raiderCount;
            game.waveSpawnTimer = 0;
            announceWave(tactic);
        }

        function updateWaves(dt) {
            if (game.testMode) return;
            if (game.waveState === 'intermission') {
                game.waveTimer -= dt;
                if (game.waveTimer <= 0) startWave();
                return;
            }
            game.waveSpawnTimer -= dt;
            if (game.waveSpawnQueue.length > 0 && game.waveSpawnTimer <= 0) {
                const entry = game.waveSpawnQueue.shift();
                const squad = game.squads.get(entry.squadId);
                if (squad) {
                    const startNode = getNode(squad.spawnNodeId);
                    if (startNode) {
                        let sx = startNode.x * TILE + (Math.random() - 0.5) * TILE * 2;
                        let sy = startNode.y * TILE + (Math.random() - 0.5) * TILE;
                        sx = Math.max(TILE, Math.min(MAP_W * TILE - TILE, sx));
                        sy = Math.max(TILE, Math.min(MAP_H * TILE - TILE, sy));
                        if (!isValidPosition(sx, sy)) {
                            sx = startNode.x * TILE;
                            sy = startNode.y * TILE;
                        }
                        const r = new Raider(entry.kind, squad.spawnNodeId, squad.id, sx, sy);
                        // Immediately push inwards so the player can watch them arrive.
                        r.goalNodeId = r.pickGoalNode();
                        r.recomputeRoute();
                        r.routeIdx = Math.min(1, r.route.length - 1);
                        game.raiders.push(r);
                    }
                }
                game.waveSpawnTimer = 0.10 + Math.random() * 0.18;
            }

            const anyLeft = game.raiders.some(r => r.alive) || game.waveSpawnQueue.length > 0;
            const moraleBroken = game.waveMoralePct <= 0;
            const routedEnough = (game.raidersDefeated / Math.max(1, game.totalRaidersInWave)) >= 0.95;

            if (moraleBroken || routedEnough) {
                game.waveSpawnQueue = [];
                for (const r of game.raiders) {
                    if (r.alive && r.state !== 'fleeing' && !r.beingArrested) { r.startFleeing(); game.routed++; }
                }
            }

            if (!anyLeft || moraleBroken || routedEnough) {
                const stillFleeing = game.raiders.some(r => r.alive);
                if (!stillFleeing) {
                    game.raiders = [];
                    game.waveState = 'intermission';
                    game.waveNumber++;
                    game.waveTimer = 8;
                    showToast('Wave cleared — raiders dispersed!');
                }
            }
            if (game.baseHp <= 0 && !game.gameOver) endGame(false);
        }

        // ========== SQUAD AI DIRECTOR ==========
        function enterWallState(squad) {
            squad.state = 'wall';
            squad.stateTimer = 3 + Math.random() * 2;
            const c = squad.centroid;
            const obj = getNode('B54');
            const ox = obj ? obj.x * TILE : c.x;
            const oy = obj ? obj.y * TILE : c.y;
            const dx = ox - c.x, dy = oy - c.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                squad.wallPerpX = 0; squad.wallPerpY = 1;
                squad.wallTravelX = Math.sign(dx) || 1; squad.wallTravelY = 0;
            } else {
                squad.wallPerpX = 1; squad.wallPerpY = 0;
                squad.wallTravelX = 0; squad.wallTravelY = Math.sign(dy) || 1;
            }
            const members = squad.members();
            members.sort((a, b) => a.id - b.id);
            const n = members.length;
            const front = Math.min(6, n);
            const rows = Math.ceil(n / front);
            let i = 0;
            for (let row = 0; row < rows; row++) {
                const countThisRow = Math.min(front, n - i);
                for (let cIdx = 0; cIdx < countThisRow; cIdx++) {
                    const off = cIdx - (countThisRow - 1) / 2;
                    members[i].wallOffset = off;
                    members[i].wallBack = row * 1.4;
                    i++;
                }
            }
        }

        function updateSquadAI(dt) {
            const officers = game.officers.filter(o => o.alive && o.state === 'active');
            for (const squad of game.squads.values()) {
                const members = squad.members();
                if (members.length === 0) continue;
                squad.stateTimer -= dt;
                const c = squad.computeCentroid();
                if (c.count === 0) continue;

                if (squad.state === 'wall') {
                    const n = members.length;
                    const front = Math.min(6, n);
                    const rows = Math.ceil(n / front);
                    let i = 0;
                    const sorted = [...members].sort((a, b) => a.id - b.id);
                    for (let row = 0; row < rows; row++) {
                        const countThisRow = Math.min(front, n - i);
                        for (let cIdx = 0; cIdx < countThisRow; cIdx++) {
                            sorted[i].wallOffset = cIdx - (countThisRow - 1) / 2;
                            sorted[i].wallBack = row * 1.4;
                            i++;
                        }
                    }
                }

                let inContact = false;
                let nearestOfficerDist = Infinity;
                for (const r of members) {
                    for (const o of officers) {
                        const d = Math.hypot(r.x - o.x, r.y - o.y);
                        if (d < nearestOfficerDist) nearestOfficerDist = d;
                        if (d < TILE * 3.5) inContact = true;
                    }
                }
                squad.contactTimer = inContact ? 2.0 : Math.max(0, squad.contactTimer - dt);
                const officerDistTiles = nearestOfficerDist / TILE;

                if (squad.stateTimer > 0) continue;

                const avgHp = squad.avgHpPct();
                const spawnNode = getNode(squad.spawnNodeId);
                const spawnDist = spawnNode ? Math.hypot(spawnNode.x * TILE - c.x, spawnNode.y * TILE - c.y) : 999;

                // Never idle near the entrance — always make visible progress into the map.
                if (squad.role === 'distraction' && !inContact && spawnDist > TILE * 14 &&
                    officerDistTiles < 12 && officerDistTiles > 4) {
                    squad.state = 'ambush';
                    squad.stateTimer = 4 + Math.random() * 3;
                    continue;
                }

                if (avgHp < 0.15 && squad.contactTimer <= 0 && spawnNode) {
                    squad.state = 'withdraw';
                    squad.rallyX = spawnNode.x * TILE;
                    squad.rallyY = spawnNode.y * TILE;
                    squad.stateTimer = 8 + Math.random() * 5;
                    continue;
                }
                const restBias = squad.personality === 'cautious' ? 0.55 : squad.personality === 'sneaky' ? 0.45 : 0.35;
                if (avgHp < restBias && squad.contactTimer <= 0) {
                    squad.state = 'rest';
                    squad.stateTimer = 5 + Math.random() * 3;
                    squad.rallyX = c.x; squad.rallyY = c.y;
                    continue;
                }
                if (!inContact && officerDistTiles < 6 && members.length >= 2 && Math.random() < 0.5) {
                    enterWallState(squad);
                    continue;
                }
                squad.state = 'advance';
                squad.stateTimer = 9 + Math.random() * 4;
            }
        }

        function announceWave(tactic) {
            const el = document.getElementById('wave-banner');
            const objLabel = OBJECTIVE_LABELS[game.raidAI.objective] || '';
            const cfg = WAVE_TACTICS[tactic];
            const tLabel = cfg ? cfg.tone : '';
            el.innerHTML = 'WAVE ' + game.waveNumber +
                '<br><span style="font-size:15px;letter-spacing:1px;color:#ffcc33">' + objLabel + '</span>' +
                (tLabel ? '<br><span style="font-size:11px;letter-spacing:1px;color:#ff8a5c">' + tLabel + '</span>' : '');
            el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2100);
        }

        // ========== INPUT ==========
        function setupEvents() {
            const c = game.canvas;
            c.addEventListener('touchstart', e => { const t = e.touches[0]; startInput(t.clientX, t.clientY); }, { passive: true });
            c.addEventListener('touchmove', e => { const t = e.touches[0]; moveInput(t.clientX, t.clientY); }, { passive: true });
            c.addEventListener('touchend', endInput, { passive: true });
            c.addEventListener('mousedown', e => startInput(e.clientX, e.clientY));
            c.addEventListener('mousemove', e => { if (game.mouse.down) moveInput(e.clientX, e.clientY); });
            window.addEventListener('mouseup', endInput);
            const mm = document.getElementById('minimap');
            mm.addEventListener('touchstart', e => { const t = e.touches[0]; jumpCameraFromMinimap(t.clientX, t.clientY); }, { passive: true });
            mm.addEventListener('mousedown', e => jumpCameraFromMinimap(e.clientX, e.clientY));
        }
        function startInput(x, y) {
            game.mouse.down = true; game.mouse.moved = false;
            game.mouse.startX = x; game.mouse.startY = y; game.mouse.curX = x; game.mouse.curY = y;
        }
        function moveInput(x, y) {
            if (!game.mouse.down) return;
            const dx = x - game.mouse.curX, dy = y - game.mouse.curY;
            if (Math.abs(x - game.mouse.startX) > 4 || Math.abs(y - game.mouse.startY) > 4) game.mouse.moved = true;
            game.camera.x -= dx; game.camera.y -= dy;
            game.cameraUserLock = 2.5;
            clampCamera();
            game.mouse.curX = x; game.mouse.curY = y;
        }
        function endInput() {
            if (game.mouse.down && !game.mouse.moved) {
                handleTap(game.mouse.startX, game.mouse.startY);
            }
            game.mouse.down = false;
        }
        function handleTap(clientX, clientY) {
            if (game.gameOver) return;
            if (game.selectedSyndicate !== VEHICLE_SYNDICATE) return;
            const wx = clientX + game.camera.x;
            const wy = clientY + game.camera.y;
            let best = null, bestD = Infinity;
            for (const s of BLOCKADE_SPOTS) {
                const d = Math.hypot(s.x - wx, s.y - wy);
                if (d < bestD) { bestD = d; best = s; }
            }
            if (best && bestD < TILE * 9) setVehicleTarget(best);
            else showToast('Tap a green road marker to position the blockade.');
        }
        function jumpCameraFromMinimap(x, y) {
            const rect = document.getElementById('minimap').getBoundingClientRect();
            const mx = (x - rect.left) / MINIMAP_SCALE, my = (y - rect.top) / MINIMAP_SCALE;
            game.camera.x = mx * TILE - game.width / 2;
            game.camera.y = my * TILE - game.height / 2;
            game.cameraUserLock = 2.5;
            clampCamera();
        }
        function clampCamera() {
            const maxX = Math.max(0, MAP_W * TILE - game.width);
            const maxY = Math.max(0, MAP_H * TILE - game.height);
            game.camera.x = Math.max(0, Math.min(maxX, game.camera.x));
            game.camera.y = Math.max(0, Math.min(maxY, game.camera.y));
        }

        // ========== CAMERA FOLLOW ==========
        function updateCamera(dt) {
            if (game.cameraUserLock > 0) { game.cameraUserLock -= dt; return; }
            if (game.mouse.down) return;

            const idx = game.selectedSyndicate;
            const k = Math.min(1, dt * 3.2);

            if (idx === VEHICLE_SYNDICATE && game.vehicle) {
                game.camera.x += (game.vehicle.x - game.width / 2 - game.camera.x) * k;
                game.camera.y += (game.vehicle.y - game.height / 2 - game.camera.y) * k;
                clampCamera();
                return;
            }

            let cx = 0, cy = 0, n = 0;

            for (const o of game.officers) {
                if (!o.alive || o.isAllOut) continue;
                if (!game.mergedMode && o.syndicateIndex !== idx) continue;
                const w = (o.state === 'active') ? 1 : 0.3;
                cx += o.x * w; cy += o.y * w; n += w;
            }
            for (const a of game.arrestOfficers) {
                if (!a.alive) continue;
                if (!game.mergedMode && a.syndicateIndex !== idx) continue;
                cx += a.x; cy += a.y; n += 1;
            }
            for (const h of game.handlers) {
                if (!h.alive) continue;
                if (!game.mergedMode && h.syndicateIndex !== idx) continue;
                cx += h.x; cy += h.y; n += 1;
            }
            for (const t of game.tearGasOfficers) {
                if (!t.alive) continue;
                if (!game.mergedMode && t.syndicateIndex !== idx) continue;
                cx += t.x; cy += t.y; n += 1;
            }

            if (n <= 0) {
                for (const o of game.officers) {
                    if (o.alive && !o.isAllOut) { cx += o.x; cy += o.y; n++; }
                }
            }
            if (n <= 0) return;

            cx /= n; cy /= n;
            game.camera.x += (cx - game.width / 2 - game.camera.x) * k;
            game.camera.y += (cy - game.height / 2 - game.camera.y) * k;
            clampCamera();
        }

        // ========== LEFT PANEL UI ==========
        const FORMATION_DEFS = [
            { key: 'rest', label: '😌 Rest', desc: 'Shields down, spaced out, FASTEST movement but weakest attack. No damage resistance. Auto-shifts to Staggered Wall if a raider approaches.' },
            { key: 'wedge', label: '🔺 Wedge', desc: 'Spearhead. The healthiest officer forms the point and rows widen behind. Balanced all-rounder. 25% damage resistance.' },
            { key: 'closedwall', label: '🧱 Closed Wall', desc: 'Fills the ENTIRE road width. Extra officers backfill behind. Slower but sturdier. 45% damage resistance.' },
            { key: 'staggeredwall', label: '🧱 Staggered Wall', desc: 'Full-width line with alternate rows offset. SLOWEST but 55% extra damage. 60% damage resistance — the toughest formation.' },
            { key: 'stackleft', label: '⬅️ Stack Left', desc: 'Press up against the left kerb, fast lateral movement. 20% damage resistance.' },
            { key: 'stackright', label: '➡️ Stack Right', desc: 'Press up against the right kerb, fast lateral movement. 20% damage resistance.' },
            { key: 'box', label: '📦 Box', desc: 'Three-sided box. ARREST TEAM + K9 STAY INSIDE. 50% damage resistance.' },
        ];
        const ORDER_DEFS = [
            { key: 'autoDisperse', label: '⚡ Auto-Disperse', desc: 'When ON, Disperse (10s, triple damage) triggers automatically the instant any officer in this syndicate is hit.' },
        ];

        function renderOptionsPanel() {
            const panel = document.getElementById('options-panel');
            panel.innerHTML = '';

            if (game.selectedSyndicate === VEHICLE_SYNDICATE) {
                renderVehiclePanel(panel);
                return;
            }

            const sy = ensureSyndicateState(game.selectedSyndicate);

            const flabel = document.createElement('div');
            flabel.className = 'section-label'; flabel.textContent = 'Formation';
            panel.appendChild(flabel);
            FORMATION_DEFS.forEach(t => {
                const b = document.createElement('button');
                b.textContent = t.label;
                if (sy.tactic === t.key) b.classList.add('active-choice');
                b.addEventListener('click', () => applyTactic(t.key));
                panel.appendChild(b);
            });
            const found = FORMATION_DEFS.find(t => t.key === sy.tactic);
            if (found) {
                const d = document.createElement('div');
                d.className = 'info-line'; d.textContent = found.desc;
                panel.appendChild(d);
            }

            const olabel = document.createElement('div');
            olabel.className = 'section-label'; olabel.textContent = 'Standing Orders';
            panel.appendChild(olabel);
            ORDER_DEFS.forEach(o => {
                const b = document.createElement('button');
                b.className = 'order-btn'; b.textContent = o.label;
                if (o.key === 'autoDisperse' && sy.autoDisperse) b.classList.add('active-choice');
                b.addEventListener('click', () => applyOrder(o.key));
                panel.appendChild(b);
            });
            const od = ORDER_DEFS.find(o => o.key === 'autoDisperse');
            if (od) {
                const d = document.createElement('div');
                d.className = 'info-line'; d.textContent = od.desc;
                panel.appendChild(d);
            }

            if (sy.disperseTimer > 0) {
                const d = document.createElement('div');
                d.className = 'info-line'; d.style.color = '#ffcc33';
                d.textContent = '🔥 DISPERSE ACTIVE: ' + Math.ceil(sy.disperseTimer) + 's';
                panel.appendChild(d);
            }
            if (game.mergedMode) {
                const d = document.createElement('div');
                d.className = 'info-line'; d.style.color = '#ff8a5c'; d.style.fontWeight = 'bold';
                d.textContent = '⚠ ALL UNITS MERGED';
                panel.appendChild(d);
            }
        }

        function renderVehiclePanel(panel) {
            const v = game.vehicle;

            const label = document.createElement('div');
            label.className = 'section-label'; label.textContent = 'Road Blockade';
            panel.appendChild(label);

            const bMobile = document.createElement('button');
            bMobile.textContent = '🚙 Mobile';
            if (v && !v.parked && !v.targetSpot) bMobile.classList.add('active-choice');
            bMobile.addEventListener('click', () => {
                if (v) { v.clearTarget(); }
                showToast('Vehicle released — roads open.');
                renderOptionsPanel(); updateSelectionUI();
            });
            panel.appendChild(bMobile);

            const bBlock = document.createElement('button');
            bBlock.textContent = '🚧 Blockade';
            if (v && (v.parked || v.targetSpot)) bBlock.classList.add('active-choice');
            bBlock.addEventListener('click', () => {
                if (!v) return;
                if (!v.targetSpot) {
                    // choose the closest blockade spot to the vehicle
                    let best = null, bestD = Infinity;
                    for (const s of BLOCKADE_SPOTS) {
                        const d = Math.hypot(s.x - v.x, s.y - v.y);
                        if (d < bestD) { bestD = d; best = s; }
                    }
                    if (best) setVehicleTarget(best);
                } else {
                    v.setSpot(v.targetSpot);
                }
                renderOptionsPanel(); updateSelectionUI();
            });
            panel.appendChild(bBlock);

            const d = document.createElement('div');
            d.className = 'info-line';
            if (!v) d.textContent = 'Vehicle unavailable.';
            else if (v.parked) d.textContent = '🚧 Road BLOCKED. Raiders must find another way around.';
            else if (v.targetSpot) d.textContent = 'Driving to blockade point… ' + (v.route ? '' : '');
            else d.textContent = 'Tap a green road marker (or use the d-pad) to choose a blockade point. Only the short span of a road can be blocked — never a junction.';
            panel.appendChild(d);

            const d2 = document.createElement('div');
            d2.className = 'info-line'; d2.style.color = '#6e8fa8';
            d2.textContent = 'The vehicle ignores all damage — it is the only one of its kind.';
            panel.appendChild(d2);
        }

        // ========== BOTTOM-RIGHT UI ==========
        function renderSyndicateTabs() {
            const tabs = document.querySelectorAll('#syndicate-tabs .syn-btn');
            tabs.forEach((b, idx) => {
                if (idx === VEHICLE_SYNDICATE) {
                    b.disabled = false;
                    b.classList.toggle('active', game.selectedSyndicate === VEHICLE_SYNDICATE);
                    return;
                }
                const exists = idx < game.syndicatesDeployed;
                let count = 0;
                if (exists) {
                    if (game.mergedMode) {
                        count = (idx === game.mergedIntoIndex)
                            ? game.officers.filter(o => o.alive && !o.isAllOut && o.state === 'active').length
                            : 0;
                    } else {
                        count = game.officers.filter(o => o.alive && !o.isAllOut && o.syndicateIndex === idx && o.state === 'active').length;
                    }
                }
                b.disabled = !exists;
                b.textContent = 'S' + (idx + 1) + (exists ? ' (' + count + ')' : '');
                b.classList.toggle('active', idx === game.selectedSyndicate && exists);
            });
        }
        function setupBottomRightUI() {
            document.querySelectorAll('#syndicate-tabs .syn-btn').forEach(b => {
                b.addEventListener('click', () => {
                    const idx = parseInt(b.dataset.idx, 10);
                    if (idx < OFFICER_SYNDICATES && idx >= game.syndicatesDeployed) return;
                    if (game.mergedMode) {
                        game.mergedMode = false;
                        showToast('Units released.');
                        updateMergedButton();
                    }
                    game.selectedSyndicate = idx;
                    renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI();
                    updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
                    game.cameraUserLock = 0;
                });
            });
            const mergeBtn = document.getElementById('all-units-btn');
            if (mergeBtn) mergeBtn.addEventListener('click', toggleMergedMode);
            const allOutBtn = document.getElementById('all-out-btn');
            if (allOutBtn) allOutBtn.addEventListener('click', triggerAllOut);
            const arrestBtn = document.getElementById('send-arrest');
            if (arrestBtn) arrestBtn.addEventListener('click', sendInArrestTeam);
            const gasBtn = document.getElementById('deploy-gas');
            if (gasBtn) gasBtn.addEventListener('click', deployTearGas);
            const k9Btn = document.getElementById('deploy-k9');
            if (k9Btn) k9Btn.addEventListener('click', deployK9);
            const dispBtn = document.getElementById('disperse-btn');
            if (dispBtn) dispBtn.addEventListener('click', triggerDisperse);
            document.getElementById('btn-up').addEventListener('click', () => commandMove(0, -1));
            document.getElementById('btn-down').addEventListener('click', () => commandMove(0, 1));
            document.getElementById('btn-left').addEventListener('click', () => commandMove(-1, 0));
            document.getElementById('btn-right').addEventListener('click', () => commandMove(1, 0));
        }
        function updateMoveButtons() {
            document.getElementById('btn-up').disabled = !canMove(0, -1);
            document.getElementById('btn-down').disabled = !canMove(0, 1);
            document.getElementById('btn-left').disabled = !canMove(-1, 0);
            document.getElementById('btn-right').disabled = !canMove(1, 0);
        }
        function updateSelectionUI() {
            const idx = game.selectedSyndicate;
            const el = document.getElementById('selection-info');

            const topBar = document.getElementById('top-bar');
            if (topBar) topBar.style.display = (idx === VEHICLE_SYNDICATE) ? 'none' : 'flex';

            if (idx === VEHICLE_SYNDICATE) {
                const v = game.vehicle;
                if (!v) { el.textContent = ''; return; }
                let txt = '🚙 Blockade Vehicle — ';
                if (v.parked) txt += 'road blocked';
                else if (v.targetSpot) txt += 'moving to position';
                else txt += 'mobile';
                el.textContent = txt;
                return;
            }

            const sy = game.syndicates[idx];
            if (!sy) { el.textContent = ''; return; }
            let count, prefix;
            if (game.mergedMode) {
                count = game.officers.filter(o => o.alive && !o.isAllOut && o.state === 'active').length;
                prefix = 'MERGED FORCE';
            } else {
                count = game.officers.filter(o => o.alive && !o.isAllOut && o.syndicateIndex === idx && o.state === 'active').length;
                prefix = 'Syndicate ' + (idx + 1);
            }
            if (count === 0) { el.textContent = ''; return; }
            const tacticLabel = (FORMATION_DEFS.find(t => t.key === sy.tactic) || {}).label || sy.tactic;
            const resist = Math.round(formationResistance(sy.tactic) * 100);
            let extra = ' · 🛡 ' + resist + '%';
            if (sy.autoDisperse) extra += ' · ⚡ Auto';
            if (sy.disperseTimer > 0) extra += ' · 🔥 ' + Math.ceil(sy.disperseTimer) + 's';
            el.textContent = prefix + ' — ' + count + ' officers — ' + tacticLabel + extra;
        }

        // ========== HUD ==========
        function updateStats() {
            document.getElementById('wave').textContent = game.waveNumber;
            document.getElementById('routed').textContent = game.routed;
            document.getElementById('arrested').textContent = game.arrested;
            const objEl = document.getElementById('objective');
            if (objEl) objEl.textContent = OBJECTIVE_SHORT[game.raidAI.objective] || '—';

            const baseFill = document.getElementById('base-hp-fill');
            const basePct = game.baseHp / BASE_MAX_HP;
            baseFill.style.width = Math.round(basePct * 100) + '%';
            baseFill.className = 'stat-fill' + (basePct < 0.3 ? ' crit' : basePct < 0.6 ? ' low' : '');
            document.getElementById('base-hp-num').textContent = Math.round(basePct * 100) + '%';

            const aliveOfficers = game.officers.filter(o => o.alive).length;
            const cap = OFFICER_SYNDICATES * OFFICERS_PER_SYNDICATE;
            const troopPct = aliveOfficers / cap;
            document.getElementById('troop-fill').style.width = Math.round(troopPct * 100) + '%';
            document.getElementById('troop-num').textContent = Math.round(troopPct * 100) + '%';

            const moraleFill = document.getElementById('morale-fill');
            moraleFill.style.width = Math.round(game.waveMoralePct) + '%';
            document.getElementById('morale-num').textContent = Math.round(game.waveMoralePct) + '%';

            renderSyndicateTabs(); updateMoveButtons(); updateMergedButton(); updateAllOutButton();
            updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
        }

        // ========== RENDER ==========
        function render() {
            const ctx = game.ctx;
            ctx.clearRect(0, 0, game.width, game.height);
            if (game.terrainCanvas) {
                ctx.drawImage(game.terrainCanvas, game.camera.x, game.camera.y, game.width, game.height, 0, 0, game.width, game.height);
            }

            game.k9s.forEach(k => { if (k.alive) k.drawLead(ctx); });

            const all = [];
            game.officers.forEach(o => { if (o.alive) all.push(o); });
            game.arrestOfficers.forEach(a => { if (a.alive) all.push(a); });
            game.handlers.forEach(h => { if (h.alive) all.push(h); });
            game.tearGasOfficers.forEach(t => { if (t.alive) all.push(t); });
            game.raiders.forEach(r => { if (r.alive) all.push(r); });
            game.k9s.forEach(k => { if (k.alive) all.push(k); });
            if (game.vehicle && game.vehicle.alive) all.push(game.vehicle);
            all.sort((a, b) => a.y - b.y);
            all.forEach(u => u.draw(ctx));
            drawProjectiles(ctx);
            drawEffects(ctx);

            game.tearGasOfficers.forEach(t => { if (t.alive) t.drawGasCloud(ctx); });

            // ---- blockade spot markers (only while the vehicle tab is selected) ----
            if (game.selectedSyndicate === VEHICLE_SYNDICATE && game.vehicle) {
                for (const s of BLOCKADE_SPOTS) {
                    const sx = s.x - game.camera.x, sy = s.y - game.camera.y;
                    if (sx < -20 || sy < -20 || sx > game.width + 20 || sy > game.height + 20) continue;
                    const isTarget = game.vehicle.targetSpot === s;
                    const isBlocked = game.blockedEdges.has(s.key);
                    ctx.beginPath();
                    ctx.arc(sx, sy, isTarget ? 7 : 4, 0, Math.PI * 2);
                    ctx.fillStyle = isBlocked ? 'rgba(255,90,60,0.85)'
                        : isTarget ? 'rgba(255,204,51,0.9)'
                        : 'rgba(110,230,140,0.5)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1; ctx.stroke();
                    if (isBlocked) {
                        ctx.strokeStyle = 'rgba(255,90,60,0.9)'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(sx, sy, 10, 0, Math.PI * 2); ctx.stroke();
                    }
                }
            }

            // ---- command marker ----
            if (game.selectedSyndicate === VEHICLE_SYNDICATE) {
                const v = game.vehicle;
                if (v) {
                    const sx = (v.targetSpot ? v.targetSpot.x : v.x) - game.camera.x;
                    const sy = (v.targetSpot ? v.targetSpot.y : v.y) - game.camera.y;
                    ctx.strokeStyle = 'rgba(120,200,255,0.85)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2); ctx.stroke();
                    ctx.setLineDash([]);
                }
            } else {
                const sy = game.syndicates[game.selectedSyndicate];
                if (sy) {
                    const sx = sy.commandX - game.camera.x, sy_ = sy.commandY - game.camera.y;
                    ctx.strokeStyle = game.mergedMode ? 'rgba(255,138,92,0.9)' : 'rgba(255, 204, 51, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(sx, sy_, 12, 0, Math.PI * 2); ctx.stroke();
                    const fx = sy.facingX || 1, fy = sy.facingY || 0;
                    ctx.beginPath(); ctx.moveTo(sx, sy_); ctx.lineTo(sx + fx * 18, sy_ + fy * 18); ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }
        function drawMinimap() {
            const mm = document.getElementById('minimap');
            if (mm.width !== MINIMAP_W || mm.height !== MINIMAP_H) { mm.width = MINIMAP_W; mm.height = MINIMAP_H; }
            const ctx = game.minimapCtx;
            ctx.clearRect(0, 0, MINIMAP_W, MINIMAP_H);
            if (game.minimapTerrainCanvas) ctx.drawImage(game.minimapTerrainCanvas, 0, 0);
            game.officers.forEach(o => {
                if (!o.alive || o.state !== 'active') return;
                ctx.fillStyle = o.isAllOut ? '#ffb45c' : '#6cc4ff';
                ctx.fillRect((o.x / TILE) * MINIMAP_SCALE, (o.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.arrestOfficers.forEach(a => {
                if (!a.alive) return;
                ctx.fillStyle = '#ffcc33';
                ctx.fillRect((a.x / TILE) * MINIMAP_SCALE, (a.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.handlers.forEach(h => {
                if (!h.alive) return;
                ctx.fillStyle = '#7fd3a0';
                ctx.fillRect((h.x / TILE) * MINIMAP_SCALE, (h.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.tearGasOfficers.forEach(t => {
                if (!t.alive) return;
                ctx.fillStyle = t.state === 'spraying' ? '#f0f080' : '#c8d040';
                ctx.fillRect((t.x / TILE) * MINIMAP_SCALE, (t.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.k9s.forEach(k => {
                if (!k.alive) return;
                ctx.fillStyle = k.deployTimer > 0 ? '#ff5a30' : '#c08040';
                ctx.fillRect((k.x / TILE) * MINIMAP_SCALE, (k.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            if (game.vehicle && game.vehicle.alive) {
                ctx.fillStyle = game.vehicle.parked ? '#ff5a30' : '#5ac8ff';
                ctx.fillRect((game.vehicle.x / TILE) * MINIMAP_SCALE - 1, (game.vehicle.y / TILE) * MINIMAP_SCALE - 1, 4, 4);
            }
            game.raiders.forEach(r => {
                if (!r.alive || r.state === 'fleeing') return;
                let col = '#ff8a5c';
                if (r.beingArrested) col = '#ffcc33';
                else if (r.gasStunTimer > 0) col = '#f0f080';
                else if (r.kind === 'brickthrower') col = '#e8c08a';
                else if (r.state === 'resting' || r.state === 'holding') col = '#86cf72';
                ctx.fillStyle = col;
                ctx.fillRect((r.x / TILE) * MINIMAP_SCALE, (r.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            sceneryBuildings.forEach(b => {
                if (!b.alive || b.hp >= b.maxHp) return;
                ctx.fillStyle = '#e86858';
                ctx.fillRect((b.tx) * MINIMAP_SCALE - 1, (b.ty) * MINIMAP_SCALE - 1, 3, 3);
            });
            ctx.strokeStyle = 'rgba(255,204,51,0.8)'; ctx.lineWidth = 1;
            ctx.strokeRect(game.camera.x / TILE * MINIMAP_SCALE, game.camera.y / TILE * MINIMAP_SCALE,
                game.width / TILE * MINIMAP_SCALE, game.height / TILE * MINIMAP_SCALE);
        }

        // ========== GAME OVER ==========
        function endGame(win) {
            game.gameOver = true;
            const overlay = document.getElementById('gameover-overlay');
            document.getElementById('gameover-title').textContent = win ? '🏆 Order Restored' : '💥 Station Overrun';
            document.getElementById('gameover-stats').textContent =
                'Waves held: ' + (game.waveNumber - 1) +
                '  •  Raiders routed: ' + game.routed +
                '  •  Arrested: ' + game.arrested +
                '  •  Buildings lost: ' + game.buildingsDestroyed;
            overlay.classList.add('show');
        }
        function restartGame() {
            document.getElementById('gameover-overlay').classList.remove('show');
            initGameState();
            rebuildRoadNetwork();
            generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();
            for (let i = 0; i < OFFICER_SYNDICATES; i++) spawnSyndicate();
            spawnVehicleSyndicate();
            game.selectedSyndicate = 0;
            renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI();
            updateMergedButton(); updateAllOutButton();
            updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
        }

        // ========== MAIN LOOP ==========
        function loop(t) {
            const dt = Math.min(0.05, (t - (game.lastTime || t)) / 1000);
            game.lastTime = t;
            if (!game.gameOver) {
                updateWaves(dt);
                updateSquadAI(dt);

                if (game.allOutCooldown > 0) game.allOutCooldown = Math.max(0, game.allOutCooldown - dt);
                for (let i = 0; i < game.arrestCooldown.length; i++) {
                    if (game.arrestCooldown[i] > 0) game.arrestCooldown[i] = Math.max(0, game.arrestCooldown[i] - dt);
                }
                for (let i = 0; i < game.tearGasCooldown.length; i++) {
                    if (game.tearGasCooldown[i] > 0) game.tearGasCooldown[i] = Math.max(0, game.tearGasCooldown[i] - dt);
                }
                for (let i = 0; i < game.manualDisperseCooldown.length; i++) {
                    if (game.manualDisperseCooldown[i] > 0) game.manualDisperseCooldown[i] = Math.max(0, game.manualDisperseCooldown[i] - dt);
                }

                game.syndicates.forEach(sy => {
                    if (sy && sy.disperseTimer > 0) {
                        sy.disperseTimer -= dt;
                        if (sy.disperseTimer <= 0) {
                            sy.disperseTimer = 0;
                            renderOptionsPanel(); updateSelectionUI();
                        }
                    }
                });

                assignFormation();
                game.attackerCounts.clear();
                game.officers.forEach(o => o.update(dt));
                game.arrestOfficers.forEach(a => a.update(dt));
                game.handlers.forEach(h => h.update(dt));
                game.tearGasOfficers.forEach(t => t.update(dt));
                game.k9s.forEach(k => k.update(dt));
                game.raiders.forEach(r => r.update(dt));
                if (game.vehicle) game.vehicle.update(dt);
                updateProjectiles(dt);

                if (game.raiders.length > 0 && game.raiders.some(r => !r.alive)) {
                    game.raiders = game.raiders.filter(r => r.alive);
                }
                if (game.arrestOfficers.length > 0 && game.arrestOfficers.some(a => !a.alive)) {
                    game.arrestOfficers = game.arrestOfficers.filter(a => a.alive);
                }
                if (game.handlers.length > 0 && game.handlers.some(h => !h.alive)) {
                    game.handlers = game.handlers.filter(h => h.alive);
                }
                if (game.k9s.length > 0 && game.k9s.some(k => !k.alive)) {
                    game.k9s = game.k9s.filter(k => k.alive);
                }
                if (game.tearGasOfficers.length > 0 && game.tearGasOfficers.some(t => !t.alive)) {
                    game.tearGasOfficers = game.tearGasOfficers.filter(t => t.alive);
                }

                updateEffects(dt);
                updateCamera(dt);
                updateStats();
            }
            render();
            drawMinimap();
            requestAnimationFrame(loop);
        }

        // ========== INIT ==========
        function initGameState() {
            game.officers = []; game.raiders = []; game.effects = [];
            game.arrestOfficers = []; game.k9s = []; game.handlers = [];
            game.tearGasOfficers = [];
            game.projectiles = [];
            game.syndicates = [];
            game.selectedSyndicate = 0;
            game.baseHp = BASE_MAX_HP;
            game.syndicatesDeployed = 0;
            game.mergedMode = false;
            game.mergedIntoIndex = 0;
            game.allOutCooldown = 0;
            game.allOutActive = 0;
            game.arrestCooldown = [0, 0, 0, 0];
            game.tearGasCooldown = [0, 0, 0, 0];
            game.manualDisperseCooldown = [0, 0, 0, 0];
            game.squads = new Map();
            game.nextSquadId = 1;
            game.waveNumber = 1;
            game.waveState = 'intermission';
            game.waveTimer = 3;
            game.waveMoralePct = 100;
            game.waveTotalHp = 0;
            game.waveSpawnQueue = [];
            game.routed = 0;
            game.arrested = 0;
            game.gameOver = false;
            game.cameraUserLock = 0;
            game.attackerCounts.clear();
            game.totalRaidersInWave = 0;
            game.raidersDefeated = 0;
            game.raiderGroupMorale = 100;
            game.buildingsDestroyed = 0;
            game.raidAI = { objective: 'base' };
            game.vehicle = null;
            game.blockedEdges = new Set();
            game.blockadeVersion = 0;
        }
        function resizeCanvas() {
            const c = game.canvas;
            game.width = window.innerWidth;
            game.height = window.innerHeight - document.getElementById('ad-banner').offsetHeight;
            const dpr = window.devicePixelRatio || 1;
            c.width = game.width * dpr; c.height = game.height * dpr;
            c.style.width = game.width + 'px'; c.style.height = game.height + 'px';
            game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            clampCamera();
        }
        function setupMinimapDPR() {
            const mm = document.getElementById('minimap');
            game.minimapCtx = mm.getContext('2d');
        }
        function handleOrientationChange() { setTimeout(rebuildWorldForScreenSize, 300); }
        function rebuildWorldForScreenSize() {
            resizeCanvas();
            computeMapSize(); computeMinimapSize();
            rebuildRoadNetwork();
            generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();

            // re-anchor the vehicle to an equivalent blockade spot after a resize
            if (game.vehicle) {
                const oldKey = game.vehicle.targetSpot ? game.vehicle.targetSpot.key : null;
                if (oldKey) {
                    const s = BLOCKADE_SPOTS.find(sp => sp.key === oldKey);
                    if (s) {
                        game.vehicle.targetSpot = s;
                        game.vehicle.x = s.x; game.vehicle.y = s.y;
                        game.vehicle.parked = true;
                        game.vehicle.angle = (s.dir === 'h') ? Math.PI / 2 : 0;
                        game.vehicle.targetAngle = game.vehicle.angle;
                        game.vehicle.route = null;
                        game.blockedEdges.clear();
                        game.blockedEdges.add(s.key);
                    } else {
                        game.vehicle.clearTarget();
                    }
                }
                game.blockadeVersion++;
            }

            game.syndicates.forEach(sy => {
                if (!sy) return;
                sy.commandX = Math.max(0, Math.min(MAP_W * TILE, sy.commandX));
                sy.commandY = Math.max(0, Math.min(MAP_H * TILE, sy.commandY));
                if (!isValidOfficerPosition(sy.commandX, sy.commandY)) {
                    sy.commandX = BASE_TILE_X * TILE; sy.commandY = BASE_TILE_Y * TILE;
                }
            });
            assignFormation();
            clampCamera();
        }
        function isLandscapeReady() { return window.innerWidth > window.innerHeight; }
        function init() {
            game.canvas = document.getElementById('game');
            game.ctx = game.canvas.getContext('2d');
            setupMinimapDPR();
            setupEvents();
            setupBottomRightUI();
            document.getElementById('gameover-restart').addEventListener('click', restartGame);
            window.addEventListener('resize', () => setTimeout(rebuildWorldForScreenSize, 50));
            window.addEventListener('orientationchange', handleOrientationChange);

            initGameState();
            resizeCanvas();
            computeMapSize(); computeMinimapSize();
            rebuildRoadNetwork();
            loadAssets(() => {
                generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();
                for (let i = 0; i < OFFICER_SYNDICATES; i++) spawnSyndicate();
                spawnVehicleSyndicate();
                game.selectedSyndicate = 0;
                renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI();
                updateMergedButton(); updateAllOutButton();
                updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
                requestAnimationFrame(loop);
            });
        }
        function bootWhenReady() {
            if (isLandscapeReady()) init();
            else {
                const check = setInterval(() => {
                    if (isLandscapeReady()) { clearInterval(check); init(); }
                }, 300);
            }
        }
        bootWhenReady();
    </script>
</body>
