        // ========== BLOCKADE VEHICLE ==========
        class WaterCannonVehicle {
            constructor(syndicateIndex) {
                this.syndicateIndex = syndicateIndex;
                this.x = 44 * TILE + TILE / 2;
                this.y = ROAD_Y_BOTTOM * TILE + TILE / 2;
                this.angle = 0;
                this.targetAngle = 0;
                this.lightPhase = Math.random() * 10;
                this.alive = true;
                this.parked = false;
                this.targetSpot = null;
                this.route = null;
                this.routeIdx = 0;
                this.stuckTimer = 0;

                this.waterCannonOn = false;
                this.waterPhase = 'idle';
                this.waterTimer = 0;
                this.waterTickTimer = 0;
                this.waterAimAngle = 0;
                this.waterAimTarget = 0;
            }
            setSpot(spot) {
                if (!spot || this.targetSpot === spot) return;
                this.targetSpot = spot;
                this.parked = false;
                this.stuckTimer = 0;
                clearBlockades();
                this.recomputeRoute();
            }
            clearTarget() {
                this.targetSpot = null;
                this.route = null;
                this.routeIdx = 0;
                this.parked = false;
                this.stuckTimer = 0;
                clearBlockades();
            }
            recomputeRoute() {
                if (!this.targetSpot) { this.route = null; this.routeIdx = 0; return; }
                const spot = this.targetSpot;

                if (Math.hypot(spot.x - this.x, spot.y - this.y) < TILE * 2) {
                    this.route = [{ x: spot.x, y: spot.y }];
                    this.routeIdx = 0;
                    return;
                }

                const edge = ROAD_EDGES.find(e => e.key === spot.edgeKey);
                const goalIds = edge ? [edge.a, edge.b] : [];
                if (goalIds.length === 0) {
                    this.route = [{ x: spot.x, y: spot.y }];
                    this.routeIdx = 0;
                    return;
                }

                const starts = [];
                const near = nearestRoadNode(this.x, this.y);
                if (near) starts.push(near.id);
                const hereEdge = findEdgeForSpot({ x: this.x, y: this.y });
                if (hereEdge) {
                    const e = ROAD_EDGES.find(ed => ed.key === hereEdge);
                    if (e) {
                        if (!starts.includes(e.a)) starts.push(e.a);
                        if (!starts.includes(e.b)) starts.push(e.b);
                    }
                }
                if (starts.length === 0) starts.push('B54');

                let bestPath = null, bestCost = Infinity;
                for (const sId of starts) {
                    const sNode = getNode(sId);
                    if (!sNode) continue;
                    const toStart = Math.hypot(sNode.x * TILE - this.x, sNode.y * TILE - this.y);
                    for (const gId of goalIds) {
                        const gNode = getNode(gId);
                        if (!gNode) continue;
                        const path = findPathWeighted(sId, gId, null);
                        if (!path) continue;
                        let len = 0;
                        for (let i = 1; i < path.length; i++) {
                            const a = getNode(path[i - 1]), b = getNode(path[i]);
                            if (a && b) len += Math.hypot(b.x - a.x, b.y - a.y) * TILE;
                        }
                        const toSpot = Math.hypot(gNode.x * TILE - spot.x, gNode.y * TILE - spot.y);
                        const cost = toStart + len + toSpot;
                        if (cost < bestCost) { bestCost = cost; bestPath = path; }
                    }
                }

                if (!bestPath) {
                    this.route = [{ x: spot.x, y: spot.y }];
                    this.routeIdx = 0;
                    return;
                }

                const pts = [{ x: this.x, y: this.y }];
                for (const id of bestPath) {
                    const n = getNode(id);
                    if (n) pts.push({ x: n.x * TILE, y: n.y * TILE });
                }
                pts.push({ x: spot.x, y: spot.y });
                this.route = pts;
                this.routeIdx = 0;
            }
            partUnits() {
                const cosA = Math.cos(this.angle), sinA = Math.sin(this.angle);
                const halfL = TILE * WC_LENGTH_TILES / 2 + TILE * 0.15;
                const halfW = TILE * 0.95;

                const push = (u) => {
                    const dx = u.x - this.x, dy = u.y - this.y;
                    const lx = dx * cosA + dy * sinA;
                    const ly = -dx * sinA + dy * cosA;
                    if (Math.abs(lx) > halfL || Math.abs(ly) > halfW) return;
                    const sign = ly >= 0 ? 1 : -1;
                    const newLy = sign * halfW;
                    const wx = this.x + lx * cosA - newLy * sinA;
                    const wy = this.y + lx * sinA + newLy * cosA;
                    if (isValidPosition(wx, wy)) { u.x = wx; u.y = wy; return; }
                    if (isValidPosition(wx, u.y)) { u.x = wx; return; }
                    if (isValidPosition(u.x, wy)) { u.y = wy; return; }
                    const r = Math.hypot(dx, dy) || 1;
                    const nx = u.x + dx / r * TILE * 1.6;
                    const ny = u.y + dy / r * TILE * 1.6;
                    if (isValidPosition(nx, ny)) { u.x = nx; u.y = ny; }
                };

                for (const o of game.officers) if (o.alive && !o.isAllOut) push(o);
                for (const r of game.raiders) if (r.alive && !r.beingArrested && r.state !== 'fleeing') push(r);
                for (const a of game.arrestOfficers) if (a.alive) push(a);
                for (const h of game.handlers) if (h.alive) push(h);
                for (const t of game.tearGasOfficers) if (t.alive) push(t);
                for (const k of game.k9s) if (k.alive) push(k);
                for (const rp of game.repairOfficers) if (rp.alive) push(rp);
                for (const re of game.repairEscorts) if (re.alive) push(re);
            }
            update(dt) {
                if (!this.alive) return;
                this.lightPhase += dt;

                let da = this.targetAngle - this.angle;
                while (da > Math.PI) da -= Math.PI * 2;
                while (da < -Math.PI) da += Math.PI * 2;
                this.angle += da * Math.min(1, dt * VEHICLE_TURN_RATE);

                if (this.targetSpot) {
                    if (this.route) {
                        while (this.routeIdx < this.route.length &&
                               Math.hypot(this.route[this.routeIdx].x - this.x,
                                          this.route[this.routeIdx].y - this.y) < TILE * 0.7) {
                            this.routeIdx++;
                        }
                    }

                    let tx = this.targetSpot.x, ty = this.targetSpot.y;
                    const routeDone = !this.route || this.routeIdx >= this.route.length;
                    if (!routeDone) { tx = this.route[this.routeIdx].x; ty = this.route[this.routeIdx].y; }

                    const dx = tx - this.x, dy = ty - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (routeDone && dist < 3) {
                        this.parked = true;
                        this.stuckTimer = 0;
                    } else {
                        if (this.parked) { this.parked = false; clearBlockades(); }
                        const step = Math.min(dist, VEHICLE_SPEED * TILE * dt);
                        const ux = dx / (dist || 1), uy = dy / (dist || 1);
                        const nx = this.x + ux * step, ny = this.y + uy * step;

                        let moved = false;
                        if (isValidPosition(nx, ny) && isRoadAt(nx, ny)) { this.x = nx; this.y = ny; moved = true; }
                        else if (isValidPosition(nx, this.y) && isRoadAt(nx, this.y)) { this.x = nx; moved = true; }
                        else if (isValidPosition(this.x, ny) && isRoadAt(this.x, ny)) { this.y = ny; moved = true; }

                        if (moved) {
                            this.targetAngle = Math.atan2(uy, ux);
                            const after = Math.hypot(tx - this.x, ty - this.y);
                            if (dist - after < 0.05) this.stuckTimer += dt;
                            else this.stuckTimer = Math.max(0, this.stuckTimer - dt * 2);
                        } else {
                            this.stuckTimer += dt;
                        }

                        if (this.stuckTimer > 1.0) {
                            this.stuckTimer = 0;
                            if (this.route && this.routeIdx < this.route.length) {
                                this.routeIdx++;
                            } else {
                                this.clearTarget();
                                showToast('🚙 No clear route to that blockade point.');
                            }
                        }
                    }
                }

                this.updateWaterCannon(dt);
                this.partUnits();
            }

            frameIndex() {
                let deg = (this.angle * 180 / Math.PI) % 360; if (deg < 0) deg += 360;
                return Math.round(deg / 7.5) % 48;
            }
            turretPos() {
                const a = WC_FRAMES[this.frameIndex()][0];
                return { x: this.x + (a[0] - WC_CELL / 2) * WC_SCALE, y: this.y + (a[1] - WC_CELL / 2) * WC_SCALE };
            }
            updateWaterCannon(dt) {
                const tp = this.turretPos();
                if (!this.waterCannonOn) {
                    this.waterPhase = 'idle';
                    this.waterTimer = 0;
                    this.waterTickTimer = 0;
                    this.waterAimTarget = this.angle;
                    let da0 = this.waterAimTarget - this.waterAimAngle;
                    while (da0 > Math.PI) da0 -= Math.PI * 2;
                    while (da0 < -Math.PI) da0 += Math.PI * 2;
                    this.waterAimAngle += da0 * Math.min(1, dt * 6);
                    return;
                }

                let target = null, bestD = Infinity;
                for (const r of game.raiders) {
                    if (!r.alive || r.state === 'fleeing' || r.beingArrested) continue;
                    if (r.kind === 'crowd') continue;
                    const d = Math.hypot(r.x - tp.x, r.y - tp.y);
                    if (d > WATER_CANNON_RANGE) continue;
                    if (d < bestD) { bestD = d; target = r; }
                }
                if (target) {
                    this.waterAimTarget = Math.atan2(target.y - tp.y, target.x - tp.x);
                } else if (this.waterPhase !== 'burst') {
                    this.waterAimTarget = this.angle;
                }
                let da = this.waterAimTarget - this.waterAimAngle;
                while (da > Math.PI) da -= Math.PI * 2;
                while (da < -Math.PI) da += Math.PI * 2;
                this.waterAimAngle += da * Math.min(1, dt * 8);

                if (this.waterPhase === 'burst') {
                    this.waterTimer -= dt;
                    if (this.waterTimer <= 0) {
                        this.waterPhase = 'idle';
                        this.waterTimer = WATER_CANNON_IDLE_DURATION;
                    } else {
                        this.waterTickTimer -= dt;
                        if (this.waterTickTimer <= 0) {
                            this.waterTickTimer = WATER_CANNON_TICK_INTERVAL;
                            this.applyWaterHit();
                        }
                    }
                } else {
                    this.waterTimer -= dt;
                    if (this.waterTimer <= 0 && target) {
                        this.waterPhase = 'burst';
                        this.waterTimer = WATER_CANNON_BURST_DURATION;
                        this.waterTickTimer = 0;
                    }
                }
            }

            applyWaterHit() {
                const ang = this.waterAimAngle;
                const half = WATER_CANNON_CONE_HALF;
                const tp = this.turretPos();
                for (const r of game.raiders) {
                    if (!r.alive || r.state === 'fleeing' || r.beingArrested) continue;
                    if (r.kind === 'crowd') continue;
                    const dx = r.x - tp.x, dy = r.y - tp.y;
                    const d = Math.hypot(dx, dy);
                    if (d > WATER_CANNON_RANGE) continue;
                    let diff = Math.atan2(dy, dx) - ang;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    if (Math.abs(diff) > half) continue;
                    dealDamageToRaider(r, WATER_CANNON_DAMAGE_PER_TICK);
                    const pushX = Math.cos(ang) * WATER_CANNON_PUSH_PER_TICK;
                    const pushY = Math.sin(ang) * WATER_CANNON_PUSH_PER_TICK;
                    const nx = r.x + pushX, ny = r.y + pushY;
                    if (isValidPosition(nx, ny)) { r.x = nx; r.y = ny; }
                    else if (isValidPosition(nx, r.y)) r.x = nx;
                    else if (isValidPosition(r.x, ny)) r.y = ny;
                }
            }

            drawWaterJet(ctx) {
                if (this.waterPhase !== 'burst') return;
                const tpJet = this.turretPos();
                const sx = tpJet.x - game.camera.x;
                const sy = tpJet.y - game.camera.y;
                if (sx < -200 || sy < -200 || sx > game.width + 200 || sy > game.height + 200) return;
                const ang = this.waterAimAngle;
                const half = WATER_CANNON_CONE_HALF;
                const lifePct = Math.max(0, Math.min(1, this.waterTimer / WATER_CANNON_BURST_DURATION));
                const ramp = Math.min(1, (1 - lifePct) * 6 + 0.3) * Math.min(1, lifePct * 4 + 0.3);
                const alpha = 0.6 * ramp;
                if (alpha < 0.02) return;

                ctx.save();
                const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, WATER_CANNON_RANGE);
                grad.addColorStop(0, `rgba(160, 230, 255, ${alpha})`);
                grad.addColorStop(0.55, `rgba(90, 180, 240, ${alpha * 0.7})`);
                grad.addColorStop(1, `rgba(60, 140, 220, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.arc(sx, sy, WATER_CANNON_RANGE, ang - half, ang + half);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(220, 245, 255, ${alpha * 0.9})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + Math.cos(ang) * WATER_CANNON_RANGE * 0.92,
                           sy + Math.sin(ang) * WATER_CANNON_RANGE * 0.92);
                ctx.stroke();

                for (let i = 0; i < 12; i++) {
                    const t = ((WATER_CANNON_BURST_DURATION - this.waterTimer) * 6 + i * 0.73) % 1;
                    const dist = t * WATER_CANNON_RANGE * 0.95;
                    const spread = (seedFromXY(this.syndicateIndex * 7.3 + i, t * 13.7) - 0.5) * 2 * half * 0.9;
                    const a2 = ang + spread;
                    const px = sx + Math.cos(a2) * dist;
                    const py = sy + Math.sin(a2) * dist;
                    ctx.fillStyle = `rgba(200, 240, 255, ${alpha * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(px, py, 1.6 + (i % 3) * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            draw(ctx) {
                if (!this.alive) return;
                const sx = this.x - game.camera.x, sy = this.y - game.camera.y;
                if (sx < -200 || sy < -200 || sx > game.width + 200 || sy > game.height + 200) return;

                if (this.waterCannonOn) this.drawWaterJet(ctx);

                const sheet = assets['wc_sheet'], turret = assets['wc_turret'];
                if (!sheet) {
                    ctx.save(); ctx.translate(sx, sy); ctx.rotate(this.angle);
                    drawBlockadeVehicleFigure(ctx, this);
                    ctx.restore();
                    return;
                }
                const fi = this.frameIndex(), col = fi % 7, row = (fi / 7) | 0;
                const half = WC_CELL / 2;
                const smooth = ctx.imageSmoothingEnabled;
                ctx.imageSmoothingEnabled = false;

                ctx.fillStyle = 'rgba(0,0,0,0.28)';
                ctx.beginPath(); ctx.ellipse(sx, sy + 7, TILE * WC_LENGTH_TILES * 0.46, TILE * 0.9, 0, 0, Math.PI * 2); ctx.fill();

                ctx.drawImage(sheet, col * WC_CELL, row * WC_CELL, WC_CELL, WC_CELL,
                              sx - half * WC_SCALE, sy - half * WC_SCALE, WC_CELL * WC_SCALE, WC_CELL * WC_SCALE);

                if (turret) {
                    const tp = this.turretPos();
                    ctx.save();
                    ctx.translate(tp.x - game.camera.x, tp.y - game.camera.y);
                    ctx.rotate(this.waterAimAngle);
                    const k = WC_SCALE * 1.5;
                    ctx.scale(k, k);
                    ctx.drawImage(turret, -12, -16);
                    ctx.restore();
                }

                const f = WC_FRAMES[fi];
                const leftOn = Math.sin(this.lightPhase * 11) > 0;
                [[f[1], leftOn], [f[2], !leftOn]].forEach(([pt, on]) => {
                    if (!on) return;
                    const lx = sx + (pt[0] - half) * WC_SCALE, ly = sy + (pt[1] - half) * WC_SCALE;
                    const rad = TILE * 1.5;
                    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, rad);
                    g.addColorStop(0, 'rgba(140,195,255,0.95)');
                    g.addColorStop(0.35, 'rgba(40,110,255,0.45)');
                    g.addColorStop(1, 'rgba(0,60,255,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.arc(lx, ly, rad, 0, Math.PI * 2); ctx.fill();
                });
                ctx.imageSmoothingEnabled = smooth;
            }
        }
        function drawBlockadeVehicleFigure(ctx, v) {
            const L = (ROAD_W + 1) * TILE * 0.94;
            const W = TILE * 2.05;
            const halfL = L / 2, halfW = W / 2;
            const flash = Math.sin(v.lightPhase * 9) > 0;

            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, L * 0.62);
            glow.addColorStop(0, `rgba(90,180,255,${flash ? 0.30 : 0.18})`);
            glow.addColorStop(1, 'rgba(90,180,255,0)');
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(0, 0, L * 0.62, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'rgba(0,0,0,0.42)';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(-halfL + 4, -halfW + 5, L, W, 5);
            else ctx.rect(-halfL + 4, -halfW + 5, L, W);
            ctx.fill();

            ctx.fillStyle = '#0b0b0e';
            const wheelW = L * 0.15;
            ctx.fillRect(-L * 0.36 - wheelW / 2, -halfW - 2.5, wheelW, 7);
            ctx.fillRect(L * 0.24 - wheelW / 2, -halfW - 2.5, wheelW, 7);
            ctx.fillRect(-L * 0.36 - wheelW / 2, halfW - 4.5, wheelW, 7);
            ctx.fillRect(L * 0.24 - wheelW / 2, halfW - 4.5, wheelW, 7);

            const g = ctx.createLinearGradient(0, -halfW, 0, halfW);
            g.addColorStop(0, '#2b4f74');
            g.addColorStop(0.5, '#1d3a58');
            g.addColorStop(1, '#10233a');
            ctx.fillStyle = g;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(-halfL, -halfW, L, W, 5);
            else ctx.rect(-halfL, -halfW, L, W);
            ctx.fill();
            ctx.strokeStyle = '#08131f'; ctx.lineWidth = 1.5; ctx.stroke();

            ctx.fillStyle = '#26496c';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(-halfL * 0.60, -halfW * 0.80, L * 0.96, W * 0.80, 3);
            else ctx.rect(-halfL * 0.60, -halfW * 0.80, L * 0.96, W * 0.80);
            ctx.fill();
            ctx.strokeStyle = '#14293f'; ctx.lineWidth = 1; ctx.stroke();

            ctx.fillStyle = '#8ec8f0';
            ctx.fillRect(L * 0.26, -halfW * 0.70, L * 0.085, W * 0.70);
            ctx.fillStyle = '#6fa8d0';
            ctx.fillRect(-halfL * 0.56, -halfW * 0.70, L * 0.065, W * 0.70);
            ctx.fillRect(-L * 0.16, -halfW * 0.84, L * 0.34, 4.5);
            ctx.fillRect(-L * 0.16, halfW * 0.84 - 4.5, L * 0.34, 4.5);

            ctx.fillStyle = '#ffcc33';
            ctx.fillRect(-halfL * 0.58, -halfW * 0.88, L * 0.94, 3);
            ctx.fillRect(-halfL * 0.58, halfW * 0.88 - 3, L * 0.94, 3);

            ctx.fillStyle = '#0d1218';
            ctx.fillRect(-L * 0.035, -halfW * 0.86, L * 0.07, W * 0.86);
            ctx.fillStyle = flash ? '#59c8ff' : '#17415f';
            ctx.fillRect(-L * 0.035, -halfW * 0.86, L * 0.07, W * 0.43);
            ctx.fillStyle = flash ? '#17415f' : '#59c8ff';
            ctx.fillRect(-L * 0.035, -halfW * 0.43, L * 0.07, W * 0.43);

            ctx.fillStyle = '#ffd98a';
            ctx.beginPath(); ctx.arc(L * 0.46, -halfW * 0.62, 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(L * 0.46, halfW * 0.62, 2.4, 0, Math.PI * 2); ctx.fill();
        }

        // ========== RAIDER ==========
        const RAIDER_TYPES = {
            standard:     { name: 'Raider',        hp: 66,  damage: 6,  meleeRange: 1.2,  atkCooldown: 1.10, speed: 1.7, weight: 60, color: '#8a4a34', dark: '#4a2418' },
            bruiser:      { name: 'Bruiser',       hp: 132, damage: 12, meleeRange: 1.35, atkCooldown: 1.30, speed: 1.4, weight: 25, color: '#7a2c2c', dark: '#3f1616' },
            brickthrower: { name: 'Brick Thrower', hp: 100, damage: 5,  meleeRange: 1.1,  atkCooldown: 1.85, speed: 1.2, weight: 10, color: '#a0704a', dark: '#4a2a18' },
            crowd:        { name: 'Protester',     hp: 46,  damage: 0,  meleeRange: 1.0,  atkCooldown: 2.5,  speed: 1.55, weight: 0, color: '#b8925e', dark: '#5c452a' },
        };
        const MAX_ATTACKERS_PER_OFFICER = 3;
        let raiderIdSeq = 1;

        const STUCK_LIMIT_MOVE = 6, STUCK_LIMIT_FLEE = 3.5, STUCK_LIMIT_WAIT = 35, STUCK_FADE_TIME = 1.6;

        class Raider {
            constructor(kind, spawnNodeId, squadId, spawnX, spawnY) {
                this.id = raiderIdSeq++;
                this.kind = kind;
                this.spawnNodeId = spawnNodeId || 'N18';
                this.squadId = squadId || 0;
                const def = RAIDER_TYPES[kind];
                this.def = def;
                const intensity = game.waveIntensity || 1;
                this.maxHp = Math.round(def.hp * intensity);
                this.hp = this.maxHp;
                this.dmgMult = 1 + (game.waveNumber - 1) * 0.035;
                this.x = spawnX; this.y = spawnY;
                this.spawnX = spawnX; this.spawnY = spawnY;
                this.dir = { x: 0, y: 1 };
                this.animTimer = Math.random() * 10;
                this.isMoving = true;
                this.attackFlash = 0;
                this.atkTimer = Math.random() * def.atkCooldown;
                this.alive = true;
                this.engaged = false;
                this.surgeTimer = 1 + Math.random() * 3;
                this.state = kind === 'crowd' ? 'crowd_wait' : 'advancing';
                this.boxedInTimer = 0;
                this.fleeTimer = 0;
                this.targetBuilding = null;
                this.jitterX = (Math.random() - 0.5) * TILE * 1.6;
                this.jitterY = (Math.random() - 0.5) * TILE * 1.6;
                this.timeSinceDamage = 0;
                this.stuckTimer = 0;
                this.wallOffset = 0;
                this.wallBack = 0;
                this.beingArrested = false;
                this.arrestOfficer = null;
                this.throwTimer = Math.random() * 1.5;
                this.gasStunTimer = 0;
                this.fleeExitX = 0;
                this.fleeExitY = 0;
                this.crowdHoldX = spawnX;
                this.crowdHoldY = spawnY;
                this.crowdWander = Math.random() * 10;

                this.route = null;
                this.routeIdx = 0;
                this.goalNodeId = null;
                this.routeVersion = -1;
                this.repathTimer = Math.random() * 0.6;

                this.sepBiasX = (Math.random() - 0.5) * 0.6;
                this.sepBiasY = (Math.random() - 0.5) * 0.6;
            }
            moveToward(tx, ty, dt, speed) {
                return steerUnit(this, tx, ty, dt, speed);
            }
            nearestActiveOfficer() {
                let best = null, bestD = Infinity;
                for (const o of game.officers) {
                    if (!o.alive || o.state !== 'active') continue;
                    const d = Math.hypot(o.x - this.x, o.y - this.y);
                    if (d < bestD) { bestD = d; best = o; }
                }
                return best;
            }
            startFleeing() {
                if (this.state === 'fleeing') return;
                this.state = 'fleeing';
                this.hp = 0;
                const exit = nearestExitTo(this.x, this.y);
                this.fleeExitX = exit.x;
                this.fleeExitY = exit.y;
            }
            pickGoalNode() {
                const ai = game.raidAI;
                if (ai.objective === 'hunt') {
                    const o = this.nearestActiveOfficer();
                    if (o) { const n = nearestRoadNode(o.x, o.y); if (n) return n.id; }
                    return 'B54';
                }
                if (ai.objective === 'buildings') {
                    if (!this.targetBuilding || !this.targetBuilding.alive) this.targetBuilding = pickRaidBuilding(this);
                    if (this.targetBuilding && this.targetBuilding.frontX !== undefined) {
                        const n = nearestRoadNode(this.targetBuilding.frontX, this.targetBuilding.frontY);
                        if (n) return n.id;
                    }
                    return 'B54';
                }
                return 'B54';
            }
            recomputeRoute() {
                const start = nearestRoadNode(this.x, this.y);
                if (!start) { this.route = null; return; }
                const goal = this.goalNodeId || 'B54';
                // Blockades are a *penalty*, not a wall: if there is a way round, they take it,
                // otherwise they will push through the barricade. Dangerous roads are avoided.
                let path = findPathSmart(start.id, goal, 28, 2.4);
                if (!path) path = findPath(start.id, goal, null);
                this.route = path || [start.id];
                this.routeIdx = 1;
                this.routeVersion = game.blockadeVersion;
            }
            watchStuck(dt) {
                if (this.state === 'fading') {
                    this.fadeT += dt; this.isMoving = false;
                    if (this.fadeT >= STUCK_FADE_TIME) this.alive = false;
                    return true;
                }
                if (this._ax === undefined) { this._ax = this.x; this._ay = this.y; this.idleT = 0; this.stuckStage = 0; }
                if (this.beingArrested || this.gasStunTimer > 0) { this.idleT = 0; this._ax = this.x; this._ay = this.y; return false; }
                const active = this.engaged || this.state === 'fighting' || this.state === 'vandal' ||
                               this.state === 'attacking_base' || this.state === 'brick_kiting' ||
                               this.kind === 'crowd';
                if (active) { this.idleT = 0; this._ax = this.x; this._ay = this.y; return false; }
                if (Math.hypot(this.x - this._ax, this.y - this._ay) > TILE * 1.2) {
                    this._ax = this.x; this._ay = this.y; this.idleT = 0; this.stuckStage = 0;
                    return false;
                }
                this.idleT += dt;
                const travelling = this.state === 'advancing' || this.state === 'withdrawing' || this.state === 'fleeing';
                const limit = this.state === 'fleeing' ? STUCK_LIMIT_FLEE : (travelling ? STUCK_LIMIT_MOVE : STUCK_LIMIT_WAIT);
                if (this.idleT > limit) {
                    this.idleT = 0;
                    if (this.stuckStage < 1 && travelling) {
                        this.stuckStage = 1;
                        hopToRoad(this);
                        this.route = null; this.routeVersion = -1; this.repathTimer = 0;
                        this.goalNodeId = null; this.targetBuilding = null;
                        if (this.state === 'fleeing') { const ex = nearestExitTo(this.x, this.y); this.fleeExitX = ex.x; this.fleeExitY = ex.y; }
                        this._ax = this.x; this._ay = this.y;
                    } else {
                        this.state = 'fading'; this.fadeT = 0; this.beingArrested = false; this.isMoving = false;
                        if (this.arrestOfficer) { this.arrestOfficer = null; }
                        return true;
                    }
                }
                return false;
            }

            // ---- Peaceful protesters: they drift toward a passive police line, chant, and
            // stop dead when a cordon actually blocks their path. They never attack. ----
            updateCrowd(dt) {
                this.animTimer += dt;
                this.crowdWander += dt;
                if (this.gasStunTimer > 0) { this.gasStunTimer -= dt; this.isMoving = false; return; }

                let best = null, bestD = Infinity;
                for (const o of game.officers) {
                    if (!o.alive || o.isAllOut || o.state !== 'active') continue;
                    const sy = game.syndicates[o.syndicateIndex];
                    if (!sy || !syndicateIsPassive(sy)) continue;
                    const d = Math.hypot(o.x - this.x, o.y - this.y);
                    if (d < bestD) { bestD = d; best = o; }
                }

                // If the only thing in front of them is an alert line, they keep their distance.
                if (!best) {
                    for (const o of game.officers) {
                        if (!o.alive || o.isAllOut || o.state !== 'active') continue;
                        const d = Math.hypot(o.x - this.x, o.y - this.y);
                        if (d < TILE * 6) {
                            this.state = 'crowd_wait';
                            this.isMoving = false;
                            return;
                        }
                    }
                    this.state = 'crowd_wait';
                    // mill about aimlessly
                    const wob = Math.sin(this.crowdWander * 0.8 + this.id) * TILE * 0.6;
                    const tx = this.crowdHoldX + wob;
                    const ty = this.crowdHoldY + Math.cos(this.crowdWander * 0.6 + this.id) * TILE * 0.6;
                    if (Math.hypot(tx - this.x, ty - this.y) > TILE * 0.8) {
                        this.state = 'crowd_move';
                        this.moveToward(tx, ty, dt, this.def.speed * 0.6);
                    } else this.isMoving = false;
                    return;
                }

                const stopDist = TILE * 3.4;
                if (bestD > stopDist) {
                    this.state = 'crowd_move';
                    this.moveToward(best.x, best.y, dt, this.def.speed * 0.85);
                } else {
                    // "Encounter a cordon and stop" — they just stand there, staring.
                    this.state = 'crowd_wait';
                    this.isMoving = false;
                    const dx = best.x - this.x, dy = best.y - this.y;
                    const d = Math.hypot(dx, dy) || 1;
                    this.dir = { x: dx / d, y: dy / d };
                }
            }

            update(dt) {
                if (!this.alive) return;
                if (this.watchStuck(dt)) return;

                if (this.beingArrested) {
                    this.isMoving = false;
                    if (this.arrestOfficer && !this.arrestOfficer.alive) {
                        this.beingArrested = false;
                        this.arrestOfficer = null;
                    }
                    return;
                }

                if (this.gasStunTimer > 0) {
                    this.gasStunTimer -= dt;
                    this.animTimer += dt;
                    this.isMoving = false;
                    if (this.kind !== 'crowd') this.state = 'gas_stunned';
                    if (this.gasStunTimer <= 0) {
                        if (this.kind === 'crowd') { this.state = 'crowd_wait'; }
                        else { this.startFleeing(); game.routed++; }
                    }
                    return;
                }

                if (this.kind === 'crowd') { this.updateCrowd(dt); return; }

                this.animTimer += dt;
                if (this.attackFlash > 0) this.attackFlash = Math.max(0, this.attackFlash - dt);
                this.atkTimer = Math.max(0, this.atkTimer - dt);
                this.timeSinceDamage += dt;

                if (this.state === 'fleeing') {
                    const dist = this.moveToward(this.fleeExitX, this.fleeExitY, dt, this.def.speed * 2);
                    if (dist < TILE * 1.5) { this.alive = false; return; }
                    if (this.stuckTimer > 2) {
                        this.stuckTimer = 0;
                        const a = Math.random() * Math.PI * 2;
                        const nx = this.x + Math.cos(a) * TILE * 2;
                        const ny = this.y + Math.sin(a) * TILE * 2;
                        if (isValidPosition(nx, ny)) { this.x = nx; this.y = ny; }
                    }
                    return;
                }

                if (furnitureDetour(this, dt)) return;
                smashNearbyFurniture(this, dt);

                if (this.kind === 'brickthrower' && this.state !== 'fleeing' && !this.beingArrested) {
                    for (const r of game.raiders) {
                        if (r === this || !r.alive) continue;
                        if (r.state === 'fleeing' || r.kind === 'crowd') continue;
                        if (Math.hypot(r.x - this.x, r.y - this.y) < BRICK_MORALE_AURA) {
                            game.raiderGroupMorale = Math.min(100, game.raiderGroupMorale + BRICK_MORALE_RATE * dt);
                        }
                    }
                    this.throwTimer -= dt;
                    if (this.throwTimer <= 0) {
                        let best = null, bestD = Infinity;
                        for (const o of game.officers) {
                            if (!o.alive) continue;
                            const d = Math.hypot(o.x - this.x, o.y - this.y);
                            if (d < BRICK_THROW_RANGE && d < bestD) { bestD = d; best = o; }
                        }
                        if (best) {
                            this.throwTimer = this.def.atkCooldown + Math.random() * 0.6;
                            this.attackFlash = 0.25;
                            game.projectiles.push({
                                sx: this.x, sy: this.y - 12,
                                tx: best.x + (Math.random() - 0.5) * TILE,
                                ty: best.y + (Math.random() - 0.5) * TILE,
                                t: 0, duration: BRICK_THROW_TIME,
                                dmg: BRICK_THROW_DAMAGE, aoe: BRICK_THROW_AOE,
                            });
                        } else {
                            this.throwTimer = 0.6;
                        }
                    }
                }

                if (this.timeSinceDamage > 3 && this.hp < this.maxHp && this.state !== 'fleeing') {
                    let rate = 1.5;
                    if (this.state === 'resting' || this.state === 'holding' || this.state === 'withdrawing') rate = 3.5;
                    let restingNearby = 0;
                    for (const r of game.raiders) {
                        if (r === this || !r.alive) continue;
                        if (r.state !== 'resting' && r.state !== 'holding') continue;
                        if (Math.hypot(r.x - this.x, r.y - this.y) < TILE * 3.5) restingNearby++;
                    }
                    rate += Math.min(3, restingNearby * 0.6);
                    this.hp = Math.min(this.maxHp, this.hp + rate * dt);
                }

                if (this.state !== 'fleeing') {
                    this.fleeTimer -= dt;
                    if (this.fleeTimer <= 0) {
                        this.fleeTimer = 1.5;
                        const hpPct = this.hp / this.maxHp;
                        if (game.raiderGroupMorale < 8 && hpPct < 0.30) {
                            const fleeChance = (8 - game.raiderGroupMorale) * 0.015;
                            if (Math.random() < fleeChance) {
                                this.startFleeing(); game.routed++;
                            }
                        } else if (hpPct < 0.08 && Math.random() < 0.15) {
                            this.startFleeing(); game.routed++;
                        }
                    }
                }

                const isBrick = this.kind === 'brickthrower';
                const engageRange = this.def.meleeRange * TILE;
                let target = null, bestD = Infinity, fallbackTarget = null, fallbackD = Infinity;
                for (const o of game.officers) {
                    if (!o.alive || o.state !== 'active') continue;
                    const d = Math.hypot(o.x - this.x, o.y - this.y);
                    if (d < fallbackD) { fallbackD = d; fallbackTarget = o; }
                    const count = game.attackerCounts.get(o.id) || 0;
                    if (count >= MAX_ATTACKERS_PER_OFFICER) continue;
                    if (d < bestD) { bestD = d; target = o; }
                }
                for (const e of game.repairEscorts) {
                    if (!e.alive) continue;
                    const d = Math.hypot(e.x - this.x, e.y - this.y);
                    if (d < fallbackD) { fallbackD = d; fallbackTarget = e; }
                    const count = game.attackerCounts.get(e.id) || 0;
                    if (count >= MAX_ATTACKERS_PER_OFFICER) continue;
                    if (d < bestD) { bestD = d; target = e; }
                }
                if (game.repairOfficers.length > 0) {
                    for (const rp of game.repairOfficers) {
                        if (!rp.alive) continue;
                        const d = Math.hypot(rp.x - this.x, rp.y - this.y);
                        if (d > TILE * 8) continue;
                        const dPenalty = d + TILE * 3;
                        if (dPenalty < bestD) { bestD = dPenalty; target = rp; }
                        if (d < fallbackD) { fallbackD = d; fallbackTarget = rp; }
                    }
                }
                if (!target) { target = fallbackTarget; bestD = fallbackD; }

                if (isBrick && target && bestD < BRICK_THROW_RANGE) {
                    this.state = 'brick_kiting';
                    const dx = this.x - target.x, dy = this.y - target.y;
                    const d = Math.hypot(dx, dy) || 1;
                    if (d < BRICK_THROW_RANGE * 0.55) {
                        this.isMoving = true;
                        const step = this.def.speed * TILE * dt * 0.8;
                        const nx = this.x + (dx/d) * step, ny = this.y + (dy/d) * step;
                        if (isValidPosition(nx, ny)) { this.x = nx; this.y = ny; }
                        else if (isValidPosition(nx, this.y)) this.x = nx;
                        else if (isValidPosition(this.x, ny)) this.y = ny;
                        this.dir = { x: dx/d, y: dy/d };
                    } else {
                        this.isMoving = false;
                        this.dir = { x: -dx/d, y: -dy/d };
                    }
                    return;
                }

                this.engaged = !!(target && bestD < engageRange + TILE * 0.4);
                if (this.engaged && target.id !== undefined) {
                    game.attackerCounts.set(target.id, (game.attackerCounts.get(target.id) || 0) + 1);
                }

                let nearbyOfficers = 0;
                for (const o of game.officers) {
                    if (o.alive && o.state === 'active' && Math.hypot(o.x - this.x, o.y - this.y) < TILE * 2.5) nearbyOfficers++;
                }
                if (nearbyOfficers >= 3) {
                    this.boxedInTimer += dt;
                    if (this.boxedInTimer > 1.5) {
                        this.def = { ...RAIDER_TYPES[this.kind], damage: RAIDER_TYPES[this.kind].damage * 1.4, atkCooldown: RAIDER_TYPES[this.kind].atkCooldown * 0.8 };
                    }
                } else {
                    this.boxedInTimer = Math.max(0, this.boxedInTimer - dt);
                    if (this.boxedInTimer <= 0) this.def = RAIDER_TYPES[this.kind];
                }

                if (this.engaged && target) {
                    this.state = 'fighting';
                    this.isMoving = false;
                    const dx = target.x - this.x, dy = target.y - this.y;
                    const d = Math.hypot(dx, dy) || 1;
                    this.dir = { x: dx/d, y: dy/d };
                    if (this.atkTimer <= 0) {
                        this.atkTimer = this.def.atkCooldown;
                        this.attackFlash = 0.22;
                        dealDamageToOfficer(target, this.def.damage * this.dmgMult);
                    }
                    return;
                }

                let spd = this.def.speed;
                if (this.kind === 'bruiser') {
                    this.surgeTimer -= dt;
                    if (this.surgeTimer <= 0) { spd *= 1.8; if (this.surgeTimer < -0.6) this.surgeTimer = 2 + Math.random() * 3; }
                }

                const atBaseTarget = (game.raidAI.objective === 'base' &&
                    Math.hypot(BASE_TILE_X * TILE - this.x, BASE_TILE_Y * TILE - this.y) < TILE * 5);

                const squad = game.squads.get(this.squadId);
                if (squad && !atBaseTarget) {
                    const sState = squad.state;

                    if (sState === 'wall') {
                        const c = squad.centroid;
                        if (c.count === 0) return;
                        const spacing = TILE * 1.15;
                        const perpOff = this.wallOffset * spacing;
                        const tx = c.x + squad.wallPerpX * perpOff + squad.wallTravelX * this.wallBack * TILE;
                        const ty = c.y + squad.wallPerpY * perpOff + squad.wallTravelY * this.wallBack * TILE;
                        const d = Math.hypot(tx - this.x, ty - this.y);
                        if (d > TILE * 1.2) {
                            this.state = 'advancing';
                            this.moveToward(tx, ty, dt, spd * 0.85);
                        } else {
                            this.isMoving = false;
                            this.state = 'holding';
                        }
                        return;
                    }
                    if (sState === 'rest' || sState === 'hold' || sState === 'regroup' || sState === 'withdraw') {
                        const speedMult = sState === 'withdraw' ? 1.05 : (sState === 'regroup' ? 1.0 : 0.75);
                        const d = Math.hypot(squad.rallyX - this.x, squad.rallyY - this.y);
                        if (d > TILE * 2.5) {
                            this.state = sState === 'withdraw' ? 'withdrawing' : 'advancing';
                            this.moveToward(squad.rallyX, squad.rallyY, dt, spd * speedMult);
                        } else {
                            this.isMoving = false;
                            this.state = 'resting';
                        }
                        return;
                    }
                    if (sState === 'ambush') {
                        this.isMoving = false;
                        this.state = 'ambushing';
                        return;
                    }
                }

                this.repathTimer -= dt;
                if (this.repathTimer <= 0 || this.routeVersion !== game.blockadeVersion || !this.route) {
                    this.repathTimer = 1.4 + Math.random() * 1.2;
                    const goal = this.pickGoalNode();
                    if (goal !== this.goalNodeId || this.routeVersion !== game.blockadeVersion || !this.route) {
                        this.goalNodeId = goal;
                        this.recomputeRoute();
                    }
                }

                if (this.route && this.routeIdx < this.route.length) {
                    const node = getNode(this.route[this.routeIdx]);
                    if (node) {
                        const tx = node.x * TILE, ty = node.y * TILE;
                        const d = Math.hypot(tx - this.x, ty - this.y);
                        if (d < 12) this.routeIdx++;
                        else {
                            this.state = 'advancing';
                            this.moveToward(tx, ty, dt, spd);
                            return;
                        }
                    } else this.routeIdx++;
                }

                const ai = game.raidAI;

                if (ai.objective === 'buildings') {
                    if (!this.targetBuilding || !this.targetBuilding.alive) this.targetBuilding = pickRaidBuilding(this);
                    if (this.targetBuilding && this.targetBuilding.frontX !== undefined) {
                        const fx = this.targetBuilding.frontX, fy = this.targetBuilding.frontY;
                        const d = Math.hypot(fx - this.x, fy - this.y);
                        const strikeRange = TILE * 2.2;
                        if (d < strikeRange) {
                            this.state = 'vandal';
                            this.isMoving = false;
                            const bdx = this.targetBuilding.tx * TILE - this.x;
                            const bdy = this.targetBuilding.ty * TILE - this.y;
                            const bd = Math.hypot(bdx, bdy) || 1;
                            this.dir = { x: bdx/bd, y: bdy/bd };
                            if (this.atkTimer <= 0) {
                                this.atkTimer = this.def.atkCooldown;
                                this.attackFlash = 0.22;
                                damageBuilding(this.targetBuilding, this.def.damage * 2.2 * this.dmgMult);
                            }
                            return;
                        }
                        this.state = 'advancing';
                        this.moveToward(fx, fy, dt, spd);
                        return;
                    }
                }

                if (ai.objective === 'hunt') {
                    const o = this.nearestActiveOfficer();
                    if (o) {
                        this.state = 'advancing';
                        this.moveToward(o.x, o.y, dt, spd);
                        return;
                    }
                }

                const stX = BASE_TILE_X * TILE, stY = BASE_TILE_Y * TILE;
                const dB = Math.hypot(stX - this.x, stY - this.y);
                if (dB > TILE * 4.0) {
                    this.state = 'advancing';
                    this.moveToward(stX, stY, dt, spd);
                    return;
                }
                this.state = 'attacking_base';
                this.isMoving = false;
                const bdx = stX - this.x, bdy = stY - this.y;
                const bdd = Math.hypot(bdx, bdy) || 1;
                this.dir = { x: bdx / bdd, y: bdy / bdd };
                if (this.atkTimer <= 0) {
                    this.atkTimer = this.def.atkCooldown;
                    this.attackFlash = 0.22;
                    damageBase(this.def.damage * 0.5 * this.dmgMult);
                    spawnHitEffect(stX + (Math.random() - 0.5) * TILE * 3,
                                   stY + (Math.random() - 0.5) * TILE * 3);
                }
            }
            draw(ctx) {
                if (!this.alive) return;
                const sx = this.x - game.camera.x, sy = this.y - game.camera.y;
                if (sx < -30 || sy < -30 || sx > game.width + 30 || sy > game.height + 30) return;
                ctx.save();
                ctx.translate(sx, sy);
                if (this.state === 'fading') ctx.globalAlpha = Math.max(0, 1 - this.fadeT / STUCK_FADE_TIME);
                if (facesLeft(this)) ctx.scale(-1, 1);
                drawRaiderFigure(ctx, this);
                ctx.restore();
                if (this.state === 'fading') return;
                drawHpBar(ctx, sx, sy - 21, this.hp, this.maxHp, this.state === 'fleeing' ? '#aaaaaa' : this.beingArrested ? '#ffcc33' : this.kind === 'crowd' ? '#c8b48a' : '#ff8a5c');

                if (this.kind === 'crowd') {
                    ctx.fillStyle = '#e8d9b0'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
                    ctx.fillText(this.state === 'crowd_wait' ? '✋' : '🚶', sx, sy - 26);
                } else if (this.gasStunTimer > 0) {
                    ctx.fillStyle = '#f0f080'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('💫', sx, sy - 26);
                } else if (this.beingArrested) {
                    ctx.fillStyle = '#ffcc33'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('🔒', sx, sy - 26);
                } else if (this.state === 'fleeing') {
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('🏃', sx, sy - 26);
                } else if (this.state === 'holding' || this.state === 'resting') {
                    ctx.fillStyle = '#86cf72'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('…', sx, sy - 26);
                } else if (this.state === 'ambushing') {
                    ctx.fillStyle = '#ffcc33'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('👁', sx, sy - 26);
                } else if (this.state === 'withdrawing') {
                    ctx.fillStyle = '#a0d0ff'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('↩', sx, sy - 26);
                } else if (this.state === 'attacking_base') {
                    ctx.fillStyle = '#ff5a30'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('🏢', sx, sy - 26);
                } else if (this.state === 'vandal') {
                    ctx.fillStyle = '#ff8a5c'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('💥', sx, sy - 26);
                } else if (this.kind === 'brickthrower') {
                    ctx.fillStyle = '#e8c08a'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('🧱', sx, sy - 26);
                }
            }
        }
        function drawRaiderFigure(ctx, u) {
            const def = u.def;
            const walking = u.isMoving;
            const phase = u.animTimer * (walking ? 7 : 1.2);
            const amp = walking ? 1 : 0.12;
            const legSwing = Math.sin(phase) * amp;
            const H = 19;
            const legReach = H * 0.34;
            ctx.lineCap = 'round';
            ctx.strokeStyle = def.dark; ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(-1 - legSwing * legReach * 0.6, legReach); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(-1 + legSwing * legReach, legReach); ctx.stroke();
            ctx.strokeStyle = def.color; ctx.lineWidth = 4.4;
            ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(-1, -H * 0.6); ctx.stroke();
            ctx.fillStyle = '#caa27a';
            ctx.beginPath(); ctx.arc(0, -H * 0.72, H * 0.17, 0, Math.PI * 2); ctx.fill();

            if (u.kind === 'crowd') {
                // placard held up high
                const bob = Math.sin(u.animTimer * 2.2) * 1.2;
                ctx.strokeStyle = '#6a5030'; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.moveTo(H * 0.15, -H * 0.4); ctx.lineTo(H * 0.15, -H * 1.15 + bob); ctx.stroke();
                ctx.fillStyle = '#e8dcc0';
                ctx.fillRect(H * 0.02, -H * 1.3 + bob, H * 0.42, H * 0.2);
                ctx.strokeStyle = '#8a7a58'; ctx.lineWidth = 0.8;
                ctx.strokeRect(H * 0.02, -H * 1.3 + bob, H * 0.42, H * 0.2);
                return;
            }

            const attacking = u.attackFlash > 0;
            const swing = attacking ? (1 - u.attackFlash / 0.22) : 0;
            ctx.save();
            ctx.translate(H * 0.02, -H * 0.4);
            ctx.rotate(-0.4 + swing * 1.4);
            if (u.kind === 'bruiser') {
                ctx.strokeStyle = '#4a3322'; ctx.lineWidth = 2.2;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(H * 0.4, 0); ctx.stroke();
            } else if (u.kind === 'brickthrower') {
                ctx.fillStyle = '#a0704a';
                ctx.strokeStyle = '#4a2a18'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(-3, -3, 6, 5); ctx.fill(); ctx.stroke();
            } else {
                ctx.strokeStyle = def.dark; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(H * 0.22, 0); ctx.stroke();
            }
            if (attacking) {
                ctx.fillStyle = `rgba(255,180,140,${u.attackFlash / 0.22})`;
                ctx.beginPath(); ctx.arc(H * 0.3, 0, 2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function applyRaiderSeparation(dt) {
            const list = game.raiders;
            const n = list.length;
            if (n < 2) return;
            const r2 = RAIDER_SEPARATION_RADIUS * RAIDER_SEPARATION_RADIUS;
            const force = RAIDER_SEPARATION_STRENGTH * dt;
            for (let i = 0; i < n; i++) {
                const a = list[i];
                if (!a.alive || a.beingArrested || a.state === 'fleeing') continue;
                let fx = 0, fy = 0, count = 0;
                for (let j = 0; j < n; j++) {
                    if (i === j) continue;
                    const b = list[j];
                    if (!b.alive) continue;
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const d2 = dx*dx + dy*dy;
                    if (d2 > r2 || d2 < 0.0001) continue;
                    const d = Math.sqrt(d2);
                    const push = (RAIDER_SEPARATION_RADIUS - d) / RAIDER_SEPARATION_RADIUS;
                    fx += (dx / d) * push;
                    fy += (dy / d) * push;
                    count++;
                }
                if (count === 0) continue;
                const nx = a.x + (fx + a.sepBiasX * 0.15) * force;
                const ny = a.y + (fy + a.sepBiasY * 0.15) * force;
                if (isValidPosition(nx, ny)) { a.x = nx; a.y = ny; }
                else if (isValidPosition(nx, a.y)) a.x = nx;
                else if (isValidPosition(a.x, ny)) a.y = ny;
            }
        }

        // ========== BUILDING DAMAGE ==========
        function pickRaidBuilding(r) {
            let best = null, bestD = Infinity;
            for (const b of sceneryBuildings) {
                if (!b.alive || b.frontX === undefined || b.hp <= 0) continue;
                const d = Math.hypot(b.frontX - r.x, b.frontY - r.y);
                if (d < bestD) { bestD = d; best = b; }
            }
            return best;
        }
        function damageBuilding(b, dmg) {
            if (!b || !b.alive) return;
            b.hp -= dmg;
            spawnHitEffect(b.tx * TILE, b.ty * TILE);
            if (b.hp <= 0) {
                b.hp = 0; b.alive = false;
                game.buildingsDestroyed++;
                damageBase(6);
                markSceneryDirty();
                showToast('🏚️ A building has been wrecked!');
            }
        }

        // ========== COMBAT ==========
        function damageBase(amount) {
            game.baseHp = Math.max(0, game.baseHp - amount);
            game.baseRegenTimer = BASE_REGEN_DELAY;
        }
        function dealDamageToRaider(r, dmg, moraleMult) {
            if (r.state === 'fleeing' || r.beingArrested) return;
            // Hitting peaceful people (or raiders who are just standing around) costs public trust.
            if (raiderIsNonHostile(r)) {
                game.moraleDrain += (r.kind === 'crowd' ? 0.85 : 0.3);
            }
            const mMult = moraleMult || 1.0;
            r.hp -= dmg;
            r.timeSinceDamage = 0;
            spawnHitEffect(r.x, r.y);
            if (game.waveTotalHp > 0 && r.kind !== 'crowd') {
                game.waveMoralePct = Math.max(0, game.waveMoralePct - (dmg / game.waveTotalHp) * 100);
            }
            game.raiderGroupMorale = Math.max(0, game.raiderGroupMorale - dmg * 0.025 * mMult);
            if (r.hp <= 0 && r.alive) {
                if (r.kind === 'crowd') {
                    r.startFleeing();
                } else {
                    r.startFleeing();
                    game.routed++; game.raidersDefeated++;
                    game.raiderGroupMorale = Math.max(0, game.raiderGroupMorale - 5 * mMult);
                }
            }
        }
        function dealDamageToOfficer(o, dmg) {
            if (!o.isAllOut && o.syndicateIndex >= 0) {
                const syHit = game.syndicates[o.syndicateIndex];
                if (syHit) {
                    if (syHit.tactic === 'rest') { syHit.autoWallTimer = AUTO_WALL_SECONDS; }
                    if (tacticIsPassive(syHit.tactic)) { syHit.provokedTimer = PROVOKED_TIME; }
                    o.shieldUp = true;
                }
            }
            const shieldMult = o.shieldUp ? 0.5 : 1.15;
            let resist;
            if (o.formationResist !== undefined) {
                resist = o.formationResist;
            } else {
                const sy = game.syndicates[o.syndicateIndex];
                resist = sy ? formationResistance(activeTacticOf(sy)) : 0;
            }
            const finalDmg = dmg * shieldMult * (1 - resist);
            o.hp -= finalDmg;

            spawnHitEffect(o.x, o.y);
            if (o.hp <= 0 && o.alive) o.alive = false;
        }
        function spawnHitEffect(x, y) { game.effects.push({ x, y, t: 0, life: 0.25 }); }
        function updateEffects(dt) {
            for (let i = game.effects.length - 1; i >= 0; i--) {
                const e = game.effects[i];
                e.t += dt;
                if (e.t >= e.life) game.effects.splice(i, 1);
            }
        }
        function drawEffects(ctx) {
            for (const e of game.effects) {
                const sx = e.x - game.camera.x, sy = e.y - game.camera.y;
                if (sx < -40 || sy < -60 || sx > game.width + 40 || sy > game.height + 40) continue;
                if (e.kind === 'geyser') {
                    const fade = Math.min(1, (e.life - e.t) / 4);
                    for (let i = 0; i < 16; i++) {
                        const ph = (e.t * 1.7 + i / 16) % 1;
                        const px = sx + Math.sin(i * 7.1 + e.t * 3) * ph * 6;
                        const py = sy - ph * 30 + ph * ph * 12;
                        ctx.fillStyle = `rgba(175,215,255,${(1 - ph) * 0.75 * fade})`;
                        ctx.beginPath(); ctx.arc(px, py, 1.6 + ph * 0.8, 0, Math.PI * 2); ctx.fill();
                    }

                    const p = 1 - e.t / e.life;

                    }

        // ========== PROJECTILES ==========

        // ========== FORMATION ==========
        function orderByFrontStrength(list, sy, tactic) {
            const strongestFirst = (a, b) => {
                const ba = Math.floor(a.hp / 12), bb = Math.floor(b.hp / 12);
                if (ba !== bb) return bb - ba;
                return a.id - b.id;
            };
            if (!sy) return list.sort(strongestFirst);
            const now = performance.now() / 1000;
            const prev = sy._order || [];
            const ids = new Set(list.map(o => o.id));
            const sameSet = prev.length === list.length && prev.every(id => ids.has(id));
            const frontMatters = tactic === 'wall';
            const due = sy._orderTactic !== tactic || !sameSet || (frontMatters && now - (sy._orderT || 0) > 6);
            if (due) {
                list.sort(strongestFirst);
                sy._order = list.map(o => o.id); sy._orderTactic = tactic; sy._orderT = now;
                return list;
            }

        }
        function effectiveTactic(sy, idx) {

        }
        function assignFormation() { for (let idx = 0; idx < OFFICER_SYNDICATES; idx++) assignFormationForSyndicate(idx); }
        function assignFormationForSyndicate(idx) {
            let alive;
            if (game.mergedMode) {
                if (idx !== game.mergedIntoIndex) return;
                alive = game.officers.filter(o => o.alive && !o.isAllOut && o.state === 'active');
            } else {
                alive = game.officers.filter(o => o.alive && !o.isAllOut && o.syndicateIndex === idx && o.state === 'active');
            }
            if (alive.length === 0) return;
            const sy = game.syndicates[idx];
            if (!sy) return;
            const cx = sy.commandX, cy = sy.commandY;
            const tactic = effectiveTactic(sy, idx);
            if (tactic !== 'pulse') alive = orderByFrontStrength(alive, sy, tactic);
            let fx = sy.facingX || 1, fy = sy.facingY || 0;
            if (Math.abs(fx) > Math.abs(fy)) { fx = Math.sign(fx) || 1; fy = 0; } else { fx = 0; fy = Math.sign(fy) || 1; }
            const px = fy, py = -fx;
            const setSlot = (o, x, y) => {
                if (isValidOfficerPosition(x, y)) { o.targetX = x; o.targetY = y; o._snapRaw = null; return; }
                if (o._snapRaw && Math.hypot(x - o._snapRaw.x, y - o._snapRaw.y) < TILE * 0.6 &&
                    isValidOfficerPosition(o.targetX, o.targetY)) return;
                const c = clampOfficerTarget(x, y);
                o.targetX = c.x; o.targetY = c.y; o._snapRaw = { x, y };
            };

            // ---------- PULSE ----------
            // Five evenly spaced officers step out of the front rank; the rank behind them
            // fills the gaps so the line never breaks. When they return they go to the rear,
            // and the next five step out in their place.
            if (tactic === 'pulse') {
                const p = ensurePulse(sy);
                const aliveIds = new Set(alive.map(o => o.id));
                if (!p.order) p.order = alive.map(o => o.id);
                else {
                    p.order = p.order.filter(id => aliveIds.has(id));
                    for (const o of alive) if (p.order.indexOf(o.id) < 0) p.order.push(o.id);
                }
                const byId = new Map(alive.map(o => [o.id, o]));
                if (!p.inited || p.cycleStep !== p.step) {
                    p.cycleStep = p.step; p.inited = true;
                    pulseNewCycle(p, p.order);
                }
                const order = p.order;
                const perRow = OFFICERS_PER_ROW;
                const spacing = WALL_COL_SPACING * TILE;
                for (let i = 0; i < order.length; i++) {
                    const o = byId.get(order[i]);
                    if (!o) continue;
                    const outEntry = p.out.find(e => e.id === o.id);
                    if (outEntry) {
                        setSlot(o, cx + px * outEntry.off + fx * PULSE_DISTANCE,
                                   cy + py * outEntry.off + fy * PULSE_DISTANCE);

                    }
                    const row = Math.floor(i / perRow), col = i % perRow;
                    const cnt = Math.min(perRow, order.length - row * perRow);
                    const off = (col - (cnt - 1) / 2) * spacing;
                    const back = row * ROW_SPACING * TILE;

            if (tactic === 'rest') {
                const perRow = 5; let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * COL_SPACING * TILE;
                        const back = row * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'wedge') {
                let i = 0, row = 0;
                while (i < alive.length) {
                    const count = Math.min(row + 1, alive.length - i);
                    for (let c = 0; c < count; c++) {
                        const off = (c - (count - 1) / 2) * COL_SPACING * TILE;
                        const back = row * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'wall') {
                // The wall now spreads noticeably wider across the carriageway.
                const perRow = OFFICERS_PER_ROW, spacing = WALL_COL_SPACING * TILE;
                let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    const stagger = (row % 2 === 0) ? -spacing * 0.25 : spacing * 0.25;
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * spacing + stagger;
                        const back = row * ROW_SPACING * TILE;

                let i = 0, rank = 0;

                    }

            }
            if (tactic === 'box') {
                const frontCount = Math.min(OFFICERS_PER_ROW, alive.length);
                const remaining = alive.length - frontCount;
                const leftCount = Math.ceil(remaining / 2), rightCount = remaining - leftCount;
                let i = 0;
                for (let c = 0; c < frontCount; c++) {

                    setSlot(alive[i++], cx + px * off, cy + py * off);
                }
                const leftEndX = cx + px * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                const leftEndY = cy + py * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                for (let r = 1; r <= leftCount; r++) {
                    const back = r * ROW_SPACING * TILE;
                    setSlot(alive[i++], leftEndX - fx * back, leftEndY - fy * back);
                }
                const rightEndX = cx - px * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                const rightEndY = cy - py * ((frontCount - 1) / 2) * COL_SPACING * TILE;
                for (let r = 1; r <= rightCount; r++) {
                    const back = r * ROW_SPACING * TILE;
                    setSlot(alive[i++], rightEndX - fx * back, rightEndY - fy * back);
                }
                return;
            }
            let i = 0, row = 0;
            const perRow = 5;
            while (i < alive.length) {
                const countThisRow = Math.min(perRow, alive.length - i);
                for (let c = 0; c < countThisRow; c++) {
                    const off = (c - (countThisRow - 1) / 2) * COL_SPACING * TILE;
                    const back = row * ROW_SPACING * TILE;
                    setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                }
                row++;
            }
        }

        // ========== TACTICS & MOVEMENT ==========
        function ensureSyndicateState(idx) {
            if (!game.syndicates[idx]) {
                const startX = (SYNDICATE_START_X[idx] !== undefined) ? SYNDICATE_START_X[idx] : (BASE_TILE_X + idx * 8);
                const startY = (SYNDICATE_START_Y[idx] !== undefined) ? SYNDICATE_START_Y[idx] : ROAD_Y_BOTTOM;
                game.syndicates[idx] = {
                    tactic: 'rest', commandX: startX * TILE, commandY: startY * TILE,
                    facingX: -1, facingY: 0, disperseTimer: 0, autoWallTimer: 0, provokedTimer: 0,
                    pulse: { active: false, used: 0, cooldown: 0, timer: 0, step: 0, shown: -1, order: null, out: [], dashers: [], cycleStep: -1, inited: false },
                    path: null, pathIdx: 0, pathVersion: -1,
                    goalX: startX * TILE, goalY: startY * TILE,
                };
            }
            const sy = game.syndicates[idx];
            if (sy.facingX === undefined) sy.facingX = -1;
            if (sy.facingY === undefined) sy.facingY = 0;
            if (sy.disperseTimer === undefined) sy.disperseTimer = 0;
            if (sy.provokedTimer === undefined) sy.provokedTimer = 0;
            ensurePulse(sy);
            if (sy.path === undefined) sy.path = null;
            if (sy.pathIdx === undefined) sy.pathIdx = 0;
            if (sy.pathVersion === undefined) sy.pathVersion = -1;
            if (sy.goalX === undefined) sy.goalX = sy.commandX;
            if (sy.goalY === undefined) sy.goalY = sy.commandY;

        function ensureVehicleSyndicate() {
            game.syndicates[VEHICLE_SYNDICATE] = {

                    return;

                }
            } else {

                sy.autoWallTimer = 0;
                if (kind !== 'rest' && kind !== 'stackleft' && kind !== 'stackright') sy.provokedTimer = PROVOKED_TIME;

            assignFormation(); updateSelectionUI(); renderOptionsPanel();
        }
        function commandMove(dx, dy) {
            if (game.selectedSyndicate === VEHICLE_SYNDICATE) { commandMoveVehicle(dx, dy); return; }
            if (game.selectedSyndicate === STATION_INDEX) return;
            const sy = ensureSyndicateState(game.selectedSyndicate);
            sy.path = null;
            sy.pathIdx = 0;
            const nx = sy.commandX + dx * TILE, ny = sy.commandY + dy * TILE;
            if (isValidOfficerPosition(nx, ny)) {
                const snapped = snapToTileCenter(nx, ny);
                sy.commandX = snapped.x; sy.commandY = snapped.y;
                sy.goalX = snapped.x; sy.goalY = snapped.y;
                if (dx !== 0) { sy.facingX = dx; sy.facingY = 0; }
                else if (dy !== 0) { sy.facingX = 0; sy.facingY = dy; }
                assignFormation(); updateSelectionUI();
            }
        }
        function commandMoveVehicle(dx, dy) {
            const v = game.vehicle;
            if (!v) return;
            const cur = v.targetSpot || { x: v.x, y: v.y };
            let best = null, bestD = Infinity;
            for (const s of BLOCKADE_SPOTS) {
                const ddx = s.x - cur.x, ddy = s.y - cur.y;
                const dist = Math.hypot(ddx, ddy);
                if (dist < TILE * 0.7 || dist > VEHICLE_STEP_RANGE) continue;
                const dot = (ddx * dx + ddy * dy) / dist;
                if (dot < 0.55) continue;

        const SYNDICATE_MARCH_SPEED = 3.0;

        function pathSyndicateTo(sy, worldX, worldY) {
            if (!sy) return;
            const clamped = clampOfficerTarget(worldX, worldY);
            const goalX = clamped.x, goalY = clamped.y;
            sy.goalX = goalX; sy.goalY = goalY;

            const rawPts = [];
            const start = nearestRoadNode(sy.commandX, sy.commandY);
            const goal = nearestRoadNode(goalX, goalY);
            if (start && goal) {
                const path = findPathWeighted(start.id, goal.id, game.blockedEdges)
                          || findPathWeighted(start.id, goal.id, null);
                if (path) {

        function updateSyndicateMovement(dt) {
            for (let i = 0; i < OFFICER_SYNDICATES; i++) {

                    const step = Math.min(d, budget);
                    const ux = dx / d, uy = dy / d;

                    sy.commandY += uy * step;
                    budget -= step;

                    const ax = Math.abs(ux), ay = Math.abs(uy);
                    const wasHoriz = sy.facingY === 0;
                    const goHoriz = wasHoriz ? ax >= ay * 0.6 : ax > ay * 1.6;
                    if (goHoriz) {
                        const sx = Math.sign(ux) || sy.facingX || 1;
                        if (sy.facingX !== sx || sy.facingY !== 0) { sy.facingX = sx; sy.facingY = 0; }
                    } else {
                        const syDir = Math.sign(uy) || sy.facingY || 1;
                        if (sy.facingX !== 0 || sy.facingY !== syDir) { sy.facingX = 0; sy.facingY = syDir; }
                    }

                    if (step >= d - 0.001) sy.pathIdx++;
                }
                if (sy.pathIdx >= sy.path.length) sy.path = null;
            }
        }

        // ========== ALL UNITS ON ME ==========

        // ========== ARREST TEAM ==========
        function sendInArrestTeamFor(idx, silent) {
            const say = m => { if (!silent) showToast(m); };
            if (idx >= OFFICER_SYNDICATES) { say('The water cannon vehicle has no arrest team.'); return false; }
            if (game.arrestCooldown[idx] > 0) {
                say('Arrest team for S' + (idx + 1) + ' is regrouping.');
                return false;
            }
            const sy = ensureSyndicateState(idx);
            if (!sy) return false;

            let fx = sy.facingX || 1, fy = sy.facingY || 0;
            if (Math.abs(fx) > Math.abs(fy)) { fx = Math.sign(fx) || 1; fy = 0; }
            else { fx = 0; fy = Math.sign(fy) || 1; }
            const px = fy, py = -fx;
            const back = TILE * 4;
            const baseX = sy.commandX - fx * back;
            const baseY = sy.commandY - fy * back;

            const existing = game.arrestOfficers.filter(a => a.alive && a.syndicateIndex === idx);

            if (existing.length >= ARREST_TEAM_SIZE) {
                existing.forEach((a, i) => {

                    a.x = sx; a.y = sy2;
                    a.hp = a.maxHp;

        // ========== SPAWN ==========
        function spawnSyndicate() {

        function spawnVehicleSyndicate() {
