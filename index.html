        // ========== RENDER ==========
        // Live health bars for damaged buildings, and a fading-in "ghost" while a wrecked one is rebuilt.
        function drawBuildingStatus(ctx) {
            for (const b of sceneryBuildings) {
                if (b.hp >= b.maxHp) continue;
                const img = assets[b.key];
                if (!img) continue;
                const scale = BUILDING_DRAW_H / img.height;
                const w = img.width * scale, h = img.height * scale;
                const px = b.tx * TILE - w / 2 - game.camera.x;
                const py = b.ty * TILE - h * 0.86 - game.camera.y;
                if (px > game.width || py > game.height || px + w < 0 || py + h < 0) continue;
                const pct = Math.max(0, Math.min(1, b.hp / b.maxHp));
                if (!b.alive && pct > 0) {
                    ctx.save();
                    ctx.globalAlpha = 0.15 + 0.7 * pct;
                    ctx.drawImage(img, px, py, w, h);
                    ctx.restore();
                }
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(px + w * 0.2, py + h * 0.88, w * 0.6, 4);
                ctx.fillStyle = pct > 0.5 ? '#e8b24e' : '#e86858';
                ctx.fillRect(px + w * 0.2, py + h * 0.88, w * 0.6 * pct, 4);
            }
        }

        function render() {
            const ctx = game.ctx;
            ctx.clearRect(0, 0, game.width, game.height);
            if (game.terrainCanvas) {
                ctx.drawImage(game.terrainCanvas, game.camera.x, game.camera.y, game.width, game.height, 0, 0, game.width, game.height);
            }
            drawBuildingStatus(ctx);

            game.k9s.forEach(k => { if (k.alive) k.drawLead(ctx); });

            const all = [];
            game.officers.forEach(o => { if (o.alive) all.push(o); });
            game.arrestOfficers.forEach(a => { if (a.alive) all.push(a); });
            game.handlers.forEach(h => { if (h.alive) all.push(h); });
            game.tearGasOfficers.forEach(t => { if (t.alive) all.push(t); });
            game.repairOfficers.forEach(r => { if (r.alive) all.push(r); });
            game.repairEscorts.forEach(r => { if (r.alive) all.push(r); });
            game.raiders.forEach(r => { if (r.alive) all.push(r); });
            game.k9s.forEach(k => { if (k.alive) all.push(k); });
            all.sort((a, b) => a.y - b.y);
            all.forEach(u => u.draw(ctx));

            if (game.vehicle && game.vehicle.alive) game.vehicle.draw(ctx);

            drawProjectiles(ctx);
            drawEffects(ctx);

            game.tearGasOfficers.forEach(t => { if (t.alive) t.drawGasCloud(ctx); });

            if (game.selectedSyndicate === VEHICLE_SYNDICATE && game.vehicle) {
                for (const s of BLOCKADE_SPOTS) {
                    const sx = s.x - game.camera.x, sy = s.y - game.camera.y;
                    if (sx < -20 || sy < -20 || sx > game.width + 20 || sy > game.height + 20) continue;
                    const isTarget = game.vehicle.targetSpot === s;
                    const isBlocked = game.blockedEdges.has(s.edgeKey);
                    ctx.beginPath();
                    ctx.arc(sx, sy, isTarget ? 7 : 3, 0, Math.PI * 2);
                    ctx.fillStyle = isBlocked ? 'rgba(255,90,60,0.9)'
                        : isTarget ? 'rgba(255,204,51,0.95)'
                        : 'rgba(110,230,140,0.55)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1; ctx.stroke();
                    if (isBlocked) {
                        ctx.strokeStyle = 'rgba(255,90,60,0.9)'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2); ctx.stroke();
                    }
                }
            }

            if (game.selectedSyndicate === VEHICLE_SYNDICATE) {
                const v = game.vehicle;
                if (v) {
                    if (v.route && v.routeIdx < v.route.length) {
                        ctx.strokeStyle = 'rgba(120,200,255,0.55)';
                        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
                        ctx.beginPath();
                        ctx.moveTo(v.x - game.camera.x, v.y - game.camera.y);
                        for (let i = v.routeIdx; i < v.route.length; i++) {
                            ctx.lineTo(v.route[i].x - game.camera.x, v.route[i].y - game.camera.y);
                        }
                        ctx.stroke(); ctx.setLineDash([]);
                    }
                    const sx = (v.targetSpot ? v.targetSpot.x : v.x) - game.camera.x;
                    const sy = (v.targetSpot ? v.targetSpot.y : v.y) - game.camera.y;
                    ctx.strokeStyle = 'rgba(120,200,255,0.85)';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2); ctx.stroke();
                    ctx.setLineDash([]);
                }
            } else if (game.selectedSyndicate === STATION_INDEX) {
                for (const r of game.repairOfficers) {
                    if (!r.alive) continue;
                    if (r._route && r._routeIdx < r._route.length) {
                        ctx.strokeStyle = 'rgba(255, 200, 80, 0.55)';
                        ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(r.x - game.camera.x, r.y - game.camera.y);
                        for (let i = r._routeIdx; i < r._route.length; i++) {
                            ctx.lineTo(r._route[i].x - game.camera.x, r._route[i].y - game.camera.y);
                        }
                        ctx.stroke(); ctx.setLineDash([]);
                    }
                    if (r.targetBuilding && r.targetBuilding.hp < r.targetBuilding.maxHp) {
                        const bx = r.targetBuilding.tx * TILE - game.camera.x;
                        const by = r.targetBuilding.ty * TILE - game.camera.y;
                        ctx.strokeStyle = 'rgba(255,200,80,0.9)';
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(bx, by, 18, 0, Math.PI * 2); ctx.stroke();
                    }
                    // Draw the escort's assigned slots so the player can see the box.
                    for (const e of r.escorts) {
                        if (!e.alive) continue;
                        const sx = e.slotX - game.camera.x, sy = e.slotY - game.camera.y;
                        ctx.strokeStyle = 'rgba(168,208,96,0.30)';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.arc(sx, sy, 4, 0, Math.PI * 2); ctx.stroke();
                    }
                }
            } else {
                const sy = game.syndicates[game.selectedSyndicate];
                if (sy) {
                    if (sy.path && sy.pathIdx < sy.path.length) {
                        ctx.strokeStyle = 'rgba(255, 204, 51, 0.45)';
                        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
                        ctx.beginPath();
                        ctx.moveTo(sy.commandX - game.camera.x, sy.commandY - game.camera.y);
                        for (let i = sy.pathIdx; i < sy.path.length; i++) {
                            ctx.lineTo(sy.path[i].x - game.camera.x, sy.path[i].y - game.camera.y);
                        }
                        ctx.stroke(); ctx.setLineDash([]);

                        const dest = sy.path[sy.path.length - 1];
                        const dx2 = dest.x - game.camera.x, dy2 = dest.y - game.camera.y;
                        ctx.strokeStyle = 'rgba(255, 204, 51, 0.9)';
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(dx2, dy2, 9, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(dx2 - 13, dy2); ctx.lineTo(dx2 + 13, dy2);
                        ctx.moveTo(dx2, dy2 - 13); ctx.lineTo(dx2, dy2 + 13);
                        ctx.stroke();
                    }
                    const sx = sy.commandX - game.camera.x, sy_ = sy.commandY - game.camera.y;
                    ctx.strokeStyle = game.mergedMode ? 'rgba(255,138,92,0.9)' : 'rgba(255, 204, 51, 0.8)';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(sx, sy_, 12, 0, Math.PI * 2); ctx.stroke();
                    const fx = sy.facingX || 1, fy = sy.facingY || 0;
                    ctx.beginPath(); ctx.moveTo(sx, sy_); ctx.lineTo(sx + fx * 18, sy_ + fy * 18); ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }
        function drawMinimap() {
            const mm = document.getElementById('minimap');
            if (mm.width !== MINIMAP_W || mm.height !== MINIMAP_H) { mm.width = MINIMAP_W; mm.height = MINIMAP_H; }
            const ctx = game.minimapCtx;
            ctx.clearRect(0, 0, MINIMAP_W, MINIMAP_H);
            if (game.minimapTerrainCanvas) ctx.drawImage(game.minimapTerrainCanvas, 0, 0);
            game.officers.forEach(o => {
                if (!o.alive || o.state !== 'active') return;
                ctx.fillStyle = o.isAllOut ? '#ffb45c' : '#6cc4ff';
                ctx.fillRect((o.x / TILE) * MINIMAP_SCALE, (o.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.arrestOfficers.forEach(a => {
                if (!a.alive) return;
                ctx.fillStyle = '#ffcc33';
                ctx.fillRect((a.x / TILE) * MINIMAP_SCALE, (a.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.handlers.forEach(h => {
                if (!h.alive) return;
                ctx.fillStyle = '#7fd3a0';
                ctx.fillRect((h.x / TILE) * MINIMAP_SCALE, (h.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.tearGasOfficers.forEach(t => {
                if (!t.alive) return;
                ctx.fillStyle = t.state === 'spraying' ? '#f0f080' : '#c8d040';
                ctx.fillRect((t.x / TILE) * MINIMAP_SCALE, (t.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.repairOfficers.forEach(r => {
                if (!r.alive) return;
                ctx.fillStyle = r.state === 'repair' ? '#ffcc33' : '#e8a020';
                ctx.fillRect((r.x / TILE) * MINIMAP_SCALE, (r.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.repairEscorts.forEach(e => {
                if (!e.alive) return;
                ctx.fillStyle = '#a8d060';
                ctx.fillRect((e.x / TILE) * MINIMAP_SCALE, (e.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            game.k9s.forEach(k => {
                if (!k.alive) return;
                ctx.fillStyle = k.deployTimer > 0 ? '#ff5a30' : '#c08040';
                ctx.fillRect((k.x / TILE) * MINIMAP_SCALE, (k.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            if (game.vehicle && game.vehicle.alive) {
                ctx.fillStyle = game.vehicle.parked ? '#ff5a30' : '#5ac8ff';
                ctx.fillRect((game.vehicle.x / TILE) * MINIMAP_SCALE - 1, (game.vehicle.y / TILE) * MINIMAP_SCALE - 1, 4, 4);
                if (game.vehicle.waterCannonOn && game.vehicle.waterPhase === 'burst') {
                    ctx.fillStyle = '#a0e8ff';
                    ctx.fillRect((game.vehicle.x / TILE) * MINIMAP_SCALE - 2, (game.vehicle.y / TILE) * MINIMAP_SCALE - 2, 6, 6);
                }
            }
            game.raiders.forEach(r => {
                if (!r.alive || r.state === 'fleeing') return;
                let col = '#ff8a5c';
                if (r.beingArrested) col = '#ffcc33';
                else if (r.gasStunTimer > 0) col = '#f0f080';
                else if (r.kind === 'brickthrower') col = '#e8c08a';
                else if (r.state === 'resting' || r.state === 'holding') col = '#86cf72';
                ctx.fillStyle = col;
                ctx.fillRect((r.x / TILE) * MINIMAP_SCALE, (r.y / TILE) * MINIMAP_SCALE, 2, 2);
            });
            sceneryBuildings.forEach(b => {
                if (b.hp >= b.maxHp) return;
                ctx.fillStyle = b.alive ? '#ff8000' : '#ff3030';
                ctx.fillRect((b.tx) * MINIMAP_SCALE - 1, (b.ty) * MINIMAP_SCALE - 1, 3, 3);
            });
            ctx.strokeStyle = 'rgba(255,204,51,0.8)'; ctx.lineWidth = 1;
            ctx.strokeRect(game.camera.x / TILE * MINIMAP_SCALE, game.camera.y / TILE * MINIMAP_SCALE,
                game.width / TILE * MINIMAP_SCALE, game.height / TILE * MINIMAP_SCALE);
        }

        // ========== GAME OVER ==========
        function endGame(win) {
            game.gameOver = true;
            const overlay = document.getElementById('gameover-overlay');
            document.getElementById('gameover-title').textContent = win ? '🏆 Order Restored' : '💥 Station Overrun';
            document.getElementById('gameover-stats').textContent =
                'Waves held: ' + (game.waveNumber - 1) +
                '  •  Raiders routed: ' + game.routed +
                '  •  Arrested: ' + game.arrested +
                '  •  Buildings lost: ' + game.buildingsDestroyed;
            overlay.classList.add('show');
        }
        function restartGame() {
            document.getElementById('gameover-overlay').classList.remove('show');
            initGameState();
            rebuildRoadNetwork();
            generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();
            for (let i = 0; i < OFFICER_SYNDICATES; i++) spawnSyndicate();
            spawnVehicleSyndicate();
            game.selectedSyndicate = 0;
            game.syndicates.forEach(sy => { if (sy) { sy.path = null; sy.pathIdx = 0; } });
            renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI();
            updateMergedButton(); updateAllOutButton();
            updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
            updateStationButton();
        }

        // ========== MAIN LOOP ==========
        function loop(t) {
            const dt = Math.min(0.05, (t - (game.lastTime || t)) / 1000);
            game.lastTime = t;
            if (!game.gameOver) {
                updateWaves(dt);
                updateSquadAI(dt);

                if (game.allOutCooldown > 0) game.allOutCooldown = Math.max(0, game.allOutCooldown - dt);
                for (let i = 0; i < game.arrestCooldown.length; i++) {
                    if (game.arrestCooldown[i] > 0) game.arrestCooldown[i] = Math.max(0, game.arrestCooldown[i] - dt);
                }
                for (let i = 0; i < game.tearGasCooldown.length; i++) {
                    if (game.tearGasCooldown[i] > 0) game.tearGasCooldown[i] = Math.max(0, game.tearGasCooldown[i] - dt);
                }
                for (let i = 0; i < game.manualDisperseCooldown.length; i++) {
                    if (game.manualDisperseCooldown[i] > 0) game.manualDisperseCooldown[i] = Math.max(0, game.manualDisperseCooldown[i] - dt);
                }
                if (game.repairCooldown > 0) game.repairCooldown = Math.max(0, game.repairCooldown - dt);
                const anyRepair = game.repairOfficers.some(r => r.alive);
                if (game.repairWasActive && !anyRepair) game.repairCooldown = REPAIR_COOLDOWN;
                game.repairWasActive = anyRepair;

                game.syndicates.forEach(sy => {
                    if (sy && sy.disperseTimer > 0) {
                        sy.disperseTimer -= dt;
                        if (sy.disperseTimer <= 0) {
                            sy.disperseTimer = 0;
                            renderOptionsPanel(); updateSelectionUI();
                        }
                    }
                });

                updateSyndicateMovement(dt);
                assignFormation();
                game.attackerCounts.clear();
                const withSpeed = (u) => {
                    const px = u.x, py = u.y;
                    u.update(dt);
                    u.curSpeed = dt > 0 ? Math.hypot(u.x - px, u.y - py) / dt : 0;
                };
                game.officers.forEach(withSpeed);
                game.arrestOfficers.forEach(withSpeed);
                game.handlers.forEach(withSpeed);
                game.tearGasOfficers.forEach(withSpeed);
                game.repairOfficers.forEach(r => { withSpeed(r); r.updateEscortFormation(); });
                game.repairEscorts.forEach(withSpeed);
                game.k9s.forEach(withSpeed);
                game.raiders.forEach(r => r.update(dt));
                applyRaiderSeparation(dt);
                if (game.vehicle) game.vehicle.update(dt);
                updateProjectiles(dt);

                if (game.raiders.length > 0 && game.raiders.some(r => !r.alive)) {
                    game.raiders = game.raiders.filter(r => r.alive);
                }
                if (game.arrestOfficers.length > 0 && game.arrestOfficers.some(a => !a.alive)) {
                    game.arrestOfficers = game.arrestOfficers.filter(a => a.alive);
                }
                if (game.handlers.length > 0 && game.handlers.some(h => !h.alive)) {
                    game.handlers = game.handlers.filter(h => h.alive);
                }
                if (game.k9s.length > 0 && game.k9s.some(k => !k.alive)) {
                    game.k9s = game.k9s.filter(k => k.alive);
                }
                if (game.tearGasOfficers.length > 0 && game.tearGasOfficers.some(t => !t.alive)) {
                    game.tearGasOfficers = game.tearGasOfficers.filter(t => t.alive);
                }
                if (game.repairOfficers.length > 0 && game.repairOfficers.some(r => !r.alive)) {
                    game.repairOfficers = game.repairOfficers.filter(r => r.alive);
                }
                if (game.repairEscorts.length > 0 && game.repairEscorts.some(e => !e.alive)) {
                    game.repairEscorts = game.repairEscorts.filter(e => e.alive);
                }

                updateEffects(dt);
                updateCamera(dt);
                updateStats();
            }
            render();
            drawMinimap();
            requestAnimationFrame(loop);
        }

        // ========== INIT ==========
        function initGameState() {
            game.officers = []; game.raiders = []; game.effects = [];
            game.arrestOfficers = []; game.k9s = []; game.handlers = [];
            game.tearGasOfficers = [];
            game.projectiles = [];
            game.syndicates = [];
            game.selectedSyndicate = 0;
            game.baseHp = BASE_MAX_HP;
            game.syndicatesDeployed = 0;
            game.mergedMode = false;
            game.mergedIntoIndex = 0;
            game.allOutCooldown = 0;
            game.allOutActive = 0;
            game.arrestCooldown = [0, 0, 0, 0];
            game.tearGasCooldown = [0, 0, 0, 0];
            game.gasTargets = [null, null, null, null];
            game.manualDisperseCooldown = [0, 0, 0, 0];
            game.repairOfficers = [];
            game.repairEscorts = [];
            game.repairCooldown = 0;
            game.repairWasActive = false;
            game.squads = new Map();
            game.nextSquadId = 1;
            game.waveNumber = 1;
            game.waveState = 'intermission';
            game.waveTimer = 3;
            game.waveMoralePct = 100;
            game.waveTotalHp = 0;
            game.waveSpawnQueue = [];
            game.routed = 0;
            game.arrested = 0;
            game.gameOver = false;
            game.cameraUserLock = 0;
            game.attackerCounts.clear();
            game.totalRaidersInWave = 0;
            game.raidersDefeated = 0;
            game.raiderGroupMorale = 100;
            game.buildingsDestroyed = 0;
            game.raidAI = { objective: 'base' };
            game.vehicle = null;
            game.blockedEdges = new Set();
            game.blockadeVersion = 0;
        }
        function resizeCanvas() {
            const c = game.canvas;
            game.width = window.innerWidth;
            game.height = window.innerHeight - document.getElementById('ad-banner').offsetHeight;
            const dpr = window.devicePixelRatio || 1;
            c.width = game.width * dpr; c.height = game.height * dpr;
            c.style.width = game.width + 'px'; c.style.height = game.height + 'px';
            game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            clampCamera();
        }
        function setupMinimapDPR() {
            const mm = document.getElementById('minimap');
            game.minimapCtx = mm.getContext('2d');
        }
        function handleOrientationChange() { setTimeout(rebuildWorldForScreenSize, 300); }
        function rebuildWorldForScreenSize() {
            resizeCanvas();
            computeMapSize(); computeMinimapSize();
            rebuildRoadNetwork();
            generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();

            if (game.vehicle) {
                const oldKey = game.vehicle.targetSpot ? game.vehicle.targetSpot.key : null;
                if (oldKey) {
                    const s = BLOCKADE_SPOTS.find(sp => sp.key === oldKey);
                    if (s) {
                        game.vehicle.targetSpot = s;
                        game.vehicle.x = s.x; game.vehicle.y = s.y;
                        game.vehicle.parked = true;
                        game.vehicle.angle = (s.dir === 'h') ? Math.PI / 2 : 0;
                        game.vehicle.targetAngle = game.vehicle.angle;
                        game.vehicle.route = null;
                        game.blockedEdges.clear();
                        if (s.edgeKey) game.blockedEdges.add(s.edgeKey);
                    } else {
                        game.vehicle.clearTarget();
                    }
                }
                game.blockadeVersion++;
            }

            game.syndicates.forEach(sy => {
                if (!sy) return;
                sy.commandX = Math.max(0, Math.min(MAP_W * TILE, sy.commandX));
                sy.commandY = Math.max(0, Math.min(MAP_H * TILE, sy.commandY));
                if (!isValidOfficerPosition(sy.commandX, sy.commandY)) {
                    sy.commandX = BASE_TILE_X * TILE; sy.commandY = BASE_TILE_Y * TILE;
                }
            });
            game.syndicates.forEach(sy => { if (sy) { sy.path = null; sy.pathIdx = 0; } });
            assignFormation();
            clampCamera();
        }
        function isLandscapeReady() { return window.innerWidth > window.innerHeight; }
        function init() {
            game.canvas = document.getElementById('game');
            game.ctx = game.canvas.getContext('2d');
            setupMinimapDPR();
            setupEvents();
            setupBottomRightUI();
            document.getElementById('gameover-restart').addEventListener('click', restartGame);
            window.addEventListener('resize', () => setTimeout(rebuildWorldForScreenSize, 50));
            window.addEventListener('orientationchange', handleOrientationChange);

            initGameState();
            resizeCanvas();
            computeMapSize(); computeMinimapSize();
            rebuildRoadNetwork();
            loadAssets(() => {
                generateMap(); buildTerrainCanvas(); buildMinimapTerrainCanvas();
                for (let i = 0; i < OFFICER_SYNDICATES; i++) spawnSyndicate();
                spawnVehicleSyndicate();
                game.selectedSyndicate = 0;
                renderSyndicateTabs(); renderOptionsPanel(); updateSelectionUI();
                updateMergedButton(); updateAllOutButton();
                updateArrestButton(); updateTearGasButton(); updateK9Button(); updateDisperseButton();
                updateStationButton();
                requestAnimationFrame(loop);
            });
        }
        function bootWhenReady() {
            if (isLandscapeReady()) init();
            else {
                const check = setInterval(() => {
                    if (isLandscapeReady()) { clearInterval(check); init(); }
                }, 300);
            }
        }
        bootWhenReady();
    </script>
