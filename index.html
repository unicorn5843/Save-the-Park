                this.targetBuilding = null;
                this.jitterX = (Math.random() - 0.5) * TILE * 1.6;
                this.jitterY = (Math.random() - 0.5) * TILE * 1.6;
                this.timeSinceDamage = 0;
                this.stuckTimer = 0;
                this.wallOffset = 0;
                this.wallBack = 0;
                this.beingArrested = false;
                this.arrestOfficer = null;
                this.throwTimer = Math.random() * 1.5;
                this.gasStunTimer = 0;
                this.fleeExitX = 0;
                this.fleeExitY = 0;

                // dynamic pathing
                this.route = null;
                this.routeIdx = 0;
                this.goalNodeId = null;
                this.routeVersion = -1;
                this.repathTimer = Math.random() * 0.6;
            }
            moveToward(tx, ty, dt, speed) {
                return steerUnit(this, tx, ty, dt, speed);
            }
            nearestActiveOfficer() {
                let best = null, bestD = Infinity;
                for (const o of game.officers) {
                    if (!o.alive || o.state !== 'active') continue;
                    const d = Math.hypot(o.x - this.x, o.y - this.y);
                    if (d < bestD) { bestD = d; best = o; }
                }
                return best;
            }
            startFleeing() {
                this.state = 'fleeing';
                this.hp = 0;
                const exit = nearestExitTo(this.x, this.y);
                this.fleeExitX = exit.x;
                this.fleeExitY = exit.y;
            }
            pickGoalNode() {
                const ai = game.raidAI;
                if (ai.objective === 'hunt') {
                    const o = this.nearestActiveOfficer();
                    if (o) { const n = nearestRoadNode(o.x, o.y); if (n) return n.id; }
                    return 'B54';
                }
                if (ai.objective === 'buildings') {
                    if (!this.targetBuilding || !this.targetBuilding.alive) this.targetBuilding = pickRaidBuilding(this);
                    if (this.targetBuilding && this.targetBuilding.frontX !== undefined) {
                        const n = nearestRoadNode(this.targetBuilding.frontX, this.targetBuilding.frontY);
                        if (n) return n.id;
                    }
                    return 'B54';
                }
                return 'B54';
            }
            recomputeRoute() {
                const start = nearestRoadNode(this.x, this.y);
                if (!start) { this.route = null; return; }
                const goal = this.goalNodeId || 'B54';
                let path = findPath(start.id, goal, game.blockedEdges);
                if (!path) path = findPath(start.id, goal, null);
                this.route = path || [start.id];
                this.routeIdx = 1;
                this.routeVersion = game.blockadeVersion;
            }
            update(dt) {
                if (!this.alive) return;

                if (this.beingArrested) {
                    this.isMoving = false;
                    if (this.arrestOfficer && !this.arrestOfficer.alive) {
                        this.beingArrested = false;
                        this.arrestOfficer = null;
                    }
                    return;
                }

                if (this.gasStunTimer > 0) {
                    this.gasStunTimer -= dt;
                    this.animTimer += dt;
                    this.isMoving = false;
                    this.state = 'gas_stunned';
                    if (this.gasStunTimer <= 0) {
                        this.startFleeing();
                        game.routed++;
                    }
                    return;
                }

                this.animTimer += dt;
                if (this.attackFlash > 0) this.attackFlash = Math.max(0, this.attackFlash - dt);
                this.atkTimer = Math.max(0, this.atkTimer - dt);
                this.timeSinceDamage += dt;

                if (this.state === 'fleeing') {
                    const dist = this.moveToward(this.fleeExitX, this.fleeExitY, dt, this.def.speed * 2);
                    if (dist < TILE * 1.5) this.alive = false;
                    if (this.stuckTimer > 3) this.alive = false;
                    return;
                }

                if (this.kind === 'brickthrower' && this.state !== 'fleeing' && !this.beingArrested) {
                    for (const r of game.raiders) {
                        if (r === this || !r.alive) continue;
                        if (r.state === 'fleeing') continue;
                        if (Math.hypot(r.x - this.x, r.y - this.y) < BRICK_MORALE_AURA) {
                            game.raiderGroupMorale = Math.min(100, game.raiderGroupMorale + BRICK_MORALE_RATE * dt);
                        }
                    }
                    this.throwTimer -= dt;
                    if (this.throwTimer <= 0) {
                        let best = null, bestD = Infinity;
                        for (const o of game.officers) {
                            if (!o.alive) continue;
                            const d = Math.hypot(o.x - this.x, o.y - this.y);
                            if (d < BRICK_THROW_RANGE && d < bestD) { bestD = d; best = o; }
                        }
                        if (best) {
                            this.throwTimer = this.def.atkCooldown + Math.random() * 0.6;
                            this.attackFlash = 0.25;
                            game.projectiles.push({
                                sx: this.x, sy: this.y - 12,
                                tx: best.x + (Math.random() - 0.5) * TILE,
                                ty: best.y + (Math.random() - 0.5) * TILE,
                                t: 0, duration: BRICK_THROW_TIME,
                                dmg: BRICK_THROW_DAMAGE, aoe: BRICK_THROW_AOE,
                            });
                        } else {
                            this.throwTimer = 0.6;
                        }
                    }
                }

                if (this.timeSinceDamage > 3 && this.hp < this.maxHp && this.state !== 'fleeing') {
                    let rate = 1.5;
                    if (this.state === 'resting' || this.state === 'holding' || this.state === 'withdrawing') rate = 3.5;
                    let restingNearby = 0;
                    for (const r of game.raiders) {
                        if (r === this || !r.alive) continue;
                        if (r.state !== 'resting' && r.state !== 'holding') continue;
                        if (Math.hypot(r.x - this.x, r.y - this.y) < TILE * 3.5) restingNearby++;
                    }
                    rate += Math.min(3, restingNearby * 0.6);
                    this.hp = Math.min(this.maxHp, this.hp + rate * dt);
                }

                if (this.state !== 'fleeing') {
                    this.fleeTimer -= dt;
                    if (this.fleeTimer <= 0) {
                        this.fleeTimer = 1.5;
                        const hpPct = this.hp / this.maxHp;
                        if (game.raiderGroupMorale < 10 && hpPct < 0.4) {
                            const fleeChance = (10 - game.raiderGroupMorale) * 0.02;
                            if (Math.random() < fleeChance) {
                                this.startFleeing(); game.routed++;
                            }
                        } else if (hpPct < 0.15 && Math.random() < 0.30) {
                            this.startFleeing(); game.routed++;
                        }
                    }
                }

                const isBrick = this.kind === 'brickthrower';
                const engageRange = this.def.meleeRange * TILE;
                let target = null, bestD = Infinity, fallbackTarget = null, fallbackD = Infinity;
                for (const o of game.officers) {
                    if (!o.alive || o.state !== 'active') continue;
                    const d = Math.hypot(o.x - this.x, o.y - this.y);
                    if (d < fallbackD) { fallbackD = d; fallbackTarget = o; }
                    const count = game.attackerCounts.get(o.id) || 0;
                    if (count >= MAX_ATTACKERS_PER_OFFICER) continue;
                    if (d < bestD) { bestD = d; target = o; }
                }
                if (!target) { target = fallbackTarget; bestD = fallbackD; }

                if (isBrick && target && bestD < BRICK_THROW_RANGE) {
                    this.state = 'brick_kiting';
                    const dx = this.x - target.x, dy = this.y - target.y;
                    const d = Math.hypot(dx, dy) || 1;
                    if (d < BRICK_THROW_RANGE * 0.55) {
                        this.isMoving = true;
                        const step = this.def.speed * TILE * dt * 0.8;
                        const nx = this.x + (dx/d) * step, ny = this.y + (dy/d) * step;
                        if (isValidPosition(nx, ny)) { this.x = nx; this.y = ny; }
                        else if (isValidPosition(nx, this.y)) this.x = nx;
                        else if (isValidPosition(this.x, ny)) this.y = ny;
                        this.dir = { x: dx/d, y: dy/d };
                    } else {
                        this.isMoving = false;
                        this.dir = { x: -dx/d, y: -dy/d };
                    }
                    return;
                }

                this.engaged = !!(target && bestD < engageRange + TILE * 0.4);
                if (this.engaged) game.attackerCounts.set(target.id, (game.attackerCounts.get(target.id) || 0) + 1);

                let nearbyOfficers = 0;
                for (const o of game.officers) {
                    if (o.alive && o.state === 'active' && Math.hypot(o.x - this.x, o.y - this.y) < TILE * 2.5) nearbyOfficers++;
                }
                if (nearbyOfficers >= 3) {
                    this.boxedInTimer += dt;
                    if (this.boxedInTimer > 1.5) {
                        this.def = { ...RAIDER_TYPES[this.kind], damage: RAIDER_TYPES[this.kind].damage * 1.4, atkCooldown: RAIDER_TYPES[this.kind].atkCooldown * 0.8 };
                    }
                } else {
                    this.boxedInTimer = Math.max(0, this.boxedInTimer - dt);
                    if (this.boxedInTimer <= 0) this.def = RAIDER_TYPES[this.kind];
                }

                if (this.engaged && target) {
                    this.state = 'fighting';
                    this.isMoving = false;
                    const dx = target.x - this.x, dy = target.y - this.y;
                    const d = Math.hypot(dx, dy) || 1;
                    this.dir = { x: dx/d, y: dy/d };
                    if (this.atkTimer <= 0) {
                        this.atkTimer = this.def.atkCooldown;
                        this.attackFlash = 0.22;
                        dealDamageToOfficer(target, this.def.damage);
                    }
                    return;
                }

                let spd = this.def.speed;
                if (this.kind === 'bruiser') {
                    this.surgeTimer -= dt;
                    if (this.surgeTimer <= 0) { spd *= 1.8; if (this.surgeTimer < -0.6) this.surgeTimer = 2 + Math.random() * 3; }
                }

                const squad = game.squads.get(this.squadId);
                if (squad) {
                    const sState = squad.state;

                    if (sState === 'wall') {
                        const c = squad.centroid;
                        if (c.count === 0) return;
                        const spacing = TILE * 1.15;
                        const perpOff = this.wallOffset * spacing;
                        const tx = c.x + squad.wallPerpX * perpOff + squad.wallTravelX * this.wallBack * TILE;
                        const ty = c.y + squad.wallPerpY * perpOff + squad.wallTravelY * this.wallBack * TILE;
                        const d = Math.hypot(tx - this.x, ty - this.y);
                        if (d > TILE * 1.2) {
                            this.state = 'advancing';
                            this.moveToward(tx, ty, dt, spd * 0.85);
                        } else {
                            this.isMoving = false;
                            this.state = 'holding';
                        }
                        return;
                    }
                    if (sState === 'rest' || sState === 'hold' || sState === 'regroup' || sState === 'withdraw') {
                        const speedMult = sState === 'withdraw' ? 1.05 : (sState === 'regroup' ? 1.0 : 0.75);
                        const d = Math.hypot(squad.rallyX - this.x, squad.rallyY - this.y);
                        if (d > TILE * 2.5) {
                            this.state = sState === 'withdraw' ? 'withdrawing' : 'advancing';
                            this.moveToward(squad.rallyX, squad.rallyY, dt, spd * speedMult);
                        } else {
                            this.isMoving = false;
                            this.state = 'resting';
                        }
                        return;
                    }
                    if (sState === 'ambush') {
                        this.isMoving = false;
                        this.state = 'ambushing';
                        return;
                    }
                }

                // ---- dynamic pathing along the road graph ----
                this.repathTimer -= dt;
                if (this.repathTimer <= 0 || this.routeVersion !== game.blockadeVersion || !this.route) {
                    this.repathTimer = 1.4 + Math.random() * 1.2;
                    const goal = this.pickGoalNode();
                    if (goal !== this.goalNodeId || this.routeVersion !== game.blockadeVersion || !this.route) {
                        this.goalNodeId = goal;
                        this.recomputeRoute();
                    }
                }

                if (this.route && this.routeIdx < this.route.length) {
                    const node = getNode(this.route[this.routeIdx]);
                    if (node) {
                        const tx = node.x * TILE, ty = node.y * TILE;
                        const d = Math.hypot(tx - this.x, ty - this.y);
                        if (d < 12) this.routeIdx++;
                        else {
                            this.state = 'advancing';
                            this.moveToward(tx, ty, dt, spd);
                            return;
                        }
                    } else this.routeIdx++;
                }

                // ---- reached the end of the path: execute the objective ----
                const ai = game.raidAI;

                if (ai.objective === 'buildings') {
                    if (!this.targetBuilding || !this.targetBuilding.alive) this.targetBuilding = pickRaidBuilding(this);
                    if (this.targetBuilding && this.targetBuilding.frontX !== undefined) {
                        const fx = this.targetBuilding.frontX, fy = this.targetBuilding.frontY;
                        const d = Math.hypot(fx - this.x, fy - this.y);
                        const strikeRange = TILE * 2.2;
                        if (d < strikeRange) {
                            this.state = 'vandal';
                            this.isMoving = false;
                            const bdx = this.targetBuilding.tx * TILE - this.x;
                            const bdy = this.targetBuilding.ty * TILE - this.y;
                            const bd = Math.hypot(bdx, bdy) || 1;
                            this.dir = { x: bdx/bd, y: bdy/bd };
                            if (this.atkTimer <= 0) {
                                this.atkTimer = this.def.atkCooldown;
                                this.attackFlash = 0.22;
                                damageBuilding(this.targetBuilding, this.def.damage * 2.2);
                            }
                            return;
                        }
                        this.state = 'advancing';
                        this.moveToward(fx, fy, dt, spd);
                        return;
                    }
                }

                if (ai.objective === 'hunt') {
                    const o = this.nearestActiveOfficer();
                    if (o) {
                        this.state = 'advancing';
                        this.moveToward(o.x, o.y, dt, spd);
                        return;
                    }
                }

                // default — smash into the station
                game.baseHp = Math.max(0, game.baseHp - this.def.damage * 3);
                spawnHitEffect(this.x, this.y);
                this.alive = false;
            }
            draw(ctx) {
                if (!this.alive) return;
                const sx = this.x - game.camera.x, sy = this.y - game.camera.y;
                if (sx < -30 || sy < -30 || sx > game.width + 30 || sy > game.height + 30) return;
                ctx.save();
                ctx.translate(sx, sy);
                if (this.dir.x < -0.05) ctx.scale(-1, 1);
                drawRaiderFigure(ctx, this);
                ctx.restore();
                drawHpBar(ctx, sx, sy - 21, this.hp, this.maxHp, this.state === 'fleeing' ? '#aaaaaa' : this.beingArrested ? '#ffcc33' : '#ff8a5c');

                if (this.gasStunTimer > 0) {
                    ctx.fillStyle = '#f0f080'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('💫', sx, sy - 26);
                } else if (this.beingArrested) {
                    ctx.fillStyle = '#ffcc33'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('🔒', sx, sy - 26);
                } else if (this.state === 'fleeing') {
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('🏃', sx, sy - 26);
                } else if (this.state === 'holding' || this.state === 'resting') {
                    ctx.fillStyle = '#86cf72'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('…', sx, sy - 26);
                } else if (this.state === 'ambushing') {
                    ctx.fillStyle = '#ffcc33'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('👁', sx, sy - 26);
                } else if (this.state === 'withdrawing') {
                    ctx.fillStyle = '#a0d0ff'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('↩', sx, sy - 26);
                } else if (this.state === 'vandal') {
                    ctx.fillStyle = '#ff8a5c'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('💥', sx, sy - 26);
                } else if (this.kind === 'brickthrower') {
                    ctx.fillStyle = '#e8c08a'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('🧱', sx, sy - 26);
                }
            }
        }
        function drawRaiderFigure(ctx, u) {
            const def = u.def;
            const walking = u.isMoving;
            const phase = u.animTimer * (walking ? 7 : 1.2);
            const amp = walking ? 1 : 0.12;
            const legSwing = Math.sin(phase) * amp;
            const H = 19;
            const legReach = H * 0.34;
            ctx.lineCap = 'round';
            ctx.strokeStyle = def.dark; ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(-1 - legSwing * legReach * 0.6, legReach); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(-1 + legSwing * legReach, legReach); ctx.stroke();
            ctx.strokeStyle = def.color; ctx.lineWidth = 4.4;
            ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(-1, -H * 0.6); ctx.stroke();
            ctx.fillStyle = '#caa27a';
            ctx.beginPath(); ctx.arc(0, -H * 0.72, H * 0.17, 0, Math.PI * 2); ctx.fill();
            const attacking = u.attackFlash > 0;
            const swing = attacking ? (1 - u.attackFlash / 0.22) : 0;
            ctx.save();
            ctx.translate(H * 0.02, -H * 0.4);
            ctx.rotate(-0.4 + swing * 1.4);
            if (u.kind === 'bruiser') {
                ctx.strokeStyle = '#4a3322'; ctx.lineWidth = 2.2;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(H * 0.4, 0); ctx.stroke();
            } else if (u.kind === 'brickthrower') {
                ctx.fillStyle = '#a0704a';
                ctx.strokeStyle = '#4a2a18'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(-3, -3, 6, 5); ctx.fill(); ctx.stroke();
            } else {
                ctx.strokeStyle = def.dark; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(H * 0.22, 0); ctx.stroke();
            }
            if (attacking) {
                ctx.fillStyle = `rgba(255,180,140,${u.attackFlash / 0.22})`;
                ctx.beginPath(); ctx.arc(H * 0.3, 0, 2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        // ========== BUILDING DAMAGE ==========
        function pickRaidBuilding(r) {
            let best = null, bestD = Infinity;
            for (const b of sceneryBuildings) {
                if (!b.alive || b.frontX === undefined || b.hp <= 0) continue;
                const d = Math.hypot(b.frontX - r.x, b.frontY - r.y);
                if (d < bestD) { bestD = d; best = b; }
            }
            return best;
        }
        function damageBuilding(b, dmg) {
            if (!b || !b.alive) return;
            b.hp -= dmg;
            spawnHitEffect(b.tx * TILE, b.ty * TILE);
            if (b.hp <= 0) {
                b.hp = 0; b.alive = false;
                game.buildingsDestroyed++;
                game.baseHp = Math.max(0, game.baseHp - 15);
                buildTerrainCanvas();
                showToast('🏚️ A building has been wrecked!');
            }
        }

        // ========== COMBAT ==========
        function dealDamageToRaider(r, dmg, moraleMult) {
            if (r.state === 'fleeing' || r.beingArrested) return;
            const mMult = moraleMult || 1.0;
            r.hp -= dmg;
            r.timeSinceDamage = 0;
            spawnHitEffect(r.x, r.y);
            if (game.waveTotalHp > 0) {
                game.waveMoralePct = Math.max(0, game.waveMoralePct - (dmg / game.waveTotalHp) * 100);
            }
            game.raiderGroupMorale = Math.max(0, game.raiderGroupMorale - dmg * 0.025 * mMult);
            if (r.hp <= 0 && r.alive) {
                r.startFleeing();
                game.routed++; game.raidersDefeated++;
                game.raiderGroupMorale = Math.max(0, game.raiderGroupMorale - 5 * mMult);
            }
        }
        function dealDamageToOfficer(o, dmg) {
            // Shield up = half damage; formations then ignore a flat percentage on top.
            const shieldMult = o.shieldUp ? 0.5 : 1.15;
            const sy = game.syndicates[o.syndicateIndex];
            const resist = sy ? formationResistance(sy.tactic) : 0;
            const finalDmg = dmg * shieldMult * (1 - resist);
            o.hp -= finalDmg;

            spawnHitEffect(o.x, o.y);
            if (o.hp <= 0 && o.alive) o.alive = false;
            if (!o.isAllOut && o.syndicateIndex >= 0) {
                if (sy && sy.autoDisperse && sy.disperseTimer <= 0) {
                    sy.disperseTimer = MANUAL_DISPERSE_DURATION;
                    showToast('⚡ Auto-disperse! Triple damage for 10s.');
                }
            }
        }
        function spawnHitEffect(x, y) { game.effects.push({ x, y, t: 0, life: 0.25 }); }
        function updateEffects(dt) {
            for (let i = game.effects.length - 1; i >= 0; i--) {
                const e = game.effects[i];
                e.t += dt;
                if (e.t >= e.life) game.effects.splice(i, 1);
            }
        }
        function drawEffects(ctx) {
            for (const e of game.effects) {
                const sx = e.x - game.camera.x, sy = e.y - game.camera.y;
                const p = 1 - e.t / e.life;
                ctx.fillStyle = `rgba(255,220,120,${p * 0.8})`;
                ctx.beginPath(); ctx.arc(sx, sy, 3 + (1 - p) * 5, 0, Math.PI * 2); ctx.fill();
            }
        }

        // ========== PROJECTILES ==========
        function updateProjectiles(dt) {
            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                const p = game.projectiles[i];
                p.t += dt;
                if (p.t >= p.duration) {
                    for (const o of game.officers) {
                        if (!o.alive) continue;
                        if (Math.hypot(o.x - p.tx, o.y - p.ty) < p.aoe) {
                            dealDamageToOfficer(o, p.dmg);
                        }
                    }
                    spawnHitEffect(p.tx, p.ty);
                    game.projectiles.splice(i, 1);
                }
            }
        }
        function drawProjectiles(ctx) {
            for (const p of game.projectiles) {
                const t = p.t / p.duration;
                const px = p.sx + (p.tx - p.sx) * t;
                const py = p.sy + (p.ty - p.sy) * t - Math.sin(t * Math.PI) * TILE * 4;
                const sx = px - game.camera.x, sy = py - game.camera.y;
                const shadowY = (p.sy + (p.ty - p.sy) * t) - game.camera.y;
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath(); ctx.ellipse(px - game.camera.x, shadowY + 2, 3, 1.5, 0, 0, Math.PI*2); ctx.fill();
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(t * 8);
                ctx.fillStyle = '#a0704a';
                ctx.fillRect(-3, -2, 6, 4);
                ctx.strokeStyle = '#4a2a18'; ctx.lineWidth = 1;
                ctx.strokeRect(-3, -2, 6, 4);
                ctx.restore();
            }
        }

        // ========== FORMATION ==========
        function orderByFrontStrength(list) {
            return list.sort((a, b) => {
                const ba = Math.floor(a.hp / 12), bb = Math.floor(b.hp / 12);
                if (ba !== bb) return bb - ba;
                return a.id - b.id;
            });
        }
        function effectiveTactic(sy, idx) {
            if (sy.tactic !== 'rest') return sy.tactic;
            for (const o of game.officers) {
                if (!o.alive || o.isAllOut || o.syndicateIndex !== idx || o.state !== 'active') continue;
                for (const r of game.raiders) {
                    if (!r.alive || r.state === 'fleeing' || r.beingArrested) continue;
                    if (Math.hypot(r.x - o.x, r.y - o.y) < TILE * 4.5) return 'staggeredwall';
                }
            }
            return 'rest';
        }
        function assignFormation() { for (let idx = 0; idx < OFFICER_SYNDICATES; idx++) assignFormationForSyndicate(idx); }
        function assignFormationForSyndicate(idx) {
            let alive;
            if (game.mergedMode) {
                if (idx !== game.mergedIntoIndex) return;
                alive = game.officers.filter(o => o.alive && !o.isAllOut && o.state === 'active');
            } else {
                alive = game.officers.filter(o => o.alive && !o.isAllOut && o.syndicateIndex === idx && o.state === 'active');
            }
            if (alive.length === 0) return;
            const sy = game.syndicates[idx];
            if (!sy) return;
            orderByFrontStrength(alive);
            const cx = sy.commandX, cy = sy.commandY;
            const tactic = effectiveTactic(sy, idx);
            let fx = sy.facingX || 1, fy = sy.facingY || 0;
            if (Math.abs(fx) > Math.abs(fy)) { fx = Math.sign(fx) || 1; fy = 0; } else { fx = 0; fy = Math.sign(fy) || 1; }
            const px = fy, py = -fx;
            const setSlot = (o, x, y) => {
                const c = clampOfficerTarget(x, y);
                o.targetX = c.x; o.targetY = c.y;
            };

            if (tactic === 'rest') {
                const perRow = 5; let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * COL_SPACING * 1.4 * TILE;
                        const back = row * ROW_SPACING * 1.6 * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);

            if (tactic === 'wedge') {

                while (i < alive.length) {
                    const count = Math.min(row + 1, alive.length - i);
                    for (let c = 0; c < count; c++) {
                        const off = (c - (count - 1) / 2) * COL_SPACING * TILE;
                        const back = row * ROW_SPACING * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'closedwall') {
                const perRow = OFFICERS_PER_ROW, spacing = TILE;
                let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * spacing;
                        const back = row * ROW_SPACING * 1.05 * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'staggeredwall') {
                const perRow = OFFICERS_PER_ROW, spacing = TILE;
                let i = 0, row = 0;
                while (i < alive.length) {
                    const countThisRow = Math.min(perRow, alive.length - i);
                    const stagger = (row % 2 === 0) ? -spacing * 0.25 : spacing * 0.25;
                    for (let c = 0; c < countThisRow; c++) {
                        const off = (c - (countThisRow - 1) / 2) * spacing + stagger;
                        const back = row * ROW_SPACING * 0.8 * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    row++;
                }
                return;
            }
            if (tactic === 'stackleft' || tactic === 'stackright') {
                const sign = tactic === 'stackleft' ? -1 : 1;
                const files = 3;
                const edgeOffset = sign * (ROAD_W / 2 - 0.55) * TILE;
                let i = 0, rank = 0;
                while (i < alive.length) {
                    for (let f = 0; f < files && i < alive.length; f++) {
                        const off = edgeOffset - sign * f * COL_SPACING * TILE;
                        const back = rank * ROW_SPACING * 0.9 * TILE;
                        setSlot(alive[i++], cx + px * off - fx * back, cy + py * off - fy * back);
                    }
                    rank++;
                }
                return;
            }
            if (tactic === 'box') {
                const frontCount = Math.min(OFFICERS_PER_ROW, alive.length);
                const remaining = alive.length - frontCount;
                const leftCount = Math.ceil(remaining / 2), rightCount = remaining - leftCount;
                let i = 0;
                for (let c = 0; c < frontCount; c++) {
                    const off = (c - (frontCount - 1) / 2) * TILE;
                    setSlot(alive[i++], cx + px * off, cy + py * off);
                }
                const leftEndX = cx + px * ((frontCount - 1) / 2) * TILE;
                const leftEndY = cy + py * ((frontCount - 1) / 2) * TILE;
                for (let r = 1; r <= leftCount; r++) {
                    const back = r * ROW_SPACING * TILE;
                    setSlot(alive[i++], leftEndX - fx * back, leftEndY - fy * back);
                }
                const rightEndX = cx - px * ((frontCount - 1) / 2) * TILE;
                const rightEndY = cy - py * ((frontCount - 1) / 2) * TILE;
                for (let r = 1; r <= rightCount; r++) {
                    const back = r * ROW_SPACING * TILE;
                    setSlot(alive[i++], rightEndX - fx * back, rightEndY - fy * back);
                }
                return;
            }
            let i = 0, row = 0;
            const perRow = 5;
            while (i < alive.length) {
                const countThisRow = Math.min(perRow, alive.length - i);
                for (let c = 0; c < countThisRow; c++) {
                    const off = (c - (countThisRow - 1) / 2) * COL_SPACING * TILE;
                    const back = row * ROW_SPACING * TILE;

        // ========== TACTICS & MOVEMENT ==========
        function ensureSyndicateState(idx) {
            if (!game.syndicates[idx]) {
                const startX = (SYNDICATE_START_X[idx] !== undefined) ? SYNDICATE_START_X[idx] : (BASE_TILE_X + idx * 8);
                const startY = (SYNDICATE_START_Y[idx] !== undefined) ? SYNDICATE_START_Y[idx] : ROAD_Y_BOTTOM;
                game.syndicates[idx] = {
                    tactic: 'rest', commandX: startX * TILE, commandY: startY * TILE,
                    facingX: -1, facingY: 0, disperseTimer: 0, autoDisperse: false,
                };
            }
            const sy = game.syndicates[idx];
            if (sy.facingX === undefined) sy.facingX = -1;
            if (sy.facingY === undefined) sy.facingY = 0;
            if (sy.disperseTimer === undefined) sy.disperseTimer = 0;
            if (sy.autoDisperse === undefined) sy.autoDisperse = false;
            return sy;

        function ensureVehicleSyndicate() {

            const sy = ensureSyndicateState(game.selectedSyndicate);

            }
            renderOptionsPanel(); updateSelectionUI();
        }
        function commandMove(dx, dy) {
            if (game.selectedSyndicate === VEHICLE_SYNDICATE) { commandMoveVehicle(dx, dy); return; }
            const sy = ensureSyndicateState(game.selectedSyndicate);
            const nx = sy.commandX + dx * TILE, ny = sy.commandY + dy * TILE;
            if (isValidOfficerPosition(nx, ny)) {
                const snapped = snapToTileCenter(nx, ny);
                sy.commandX = snapped.x; sy.commandY = snapped.y;
                if (dx !== 0) { sy.facingX = dx; sy.facingY = 0; }

            }
        }
        function commandMoveVehicle(dx, dy) {
            const v = game.vehicle;
            if (!v) return;
            const cx = v.targetSpot ? v.targetSpot.x : v.x;
            const cy = v.targetSpot ? v.targetSpot.y : v.y;
            let best = null, bestScore = Infinity;
            for (const s of BLOCKADE_SPOTS) {
                if (s === v.targetSpot) continue;
                const ddx = s.x - cx, ddy = s.y - cy;
                if (dx !== 0 && Math.sign(ddx) !== dx) continue;
                if (dy !== 0 && Math.sign(ddy) !== dy) continue;
                const along = dx !== 0 ? Math.abs(ddx) : Math.abs(ddy);
                const across = dx !== 0 ? Math.abs(ddy) : Math.abs(ddx);
                if (along < TILE * 2) continue;
                const score = along + across * 3.5;
                if (score < bestScore) { bestScore = score; best = s; }
            }
            if (best) setVehicleTarget(best);
        }

            if (Math.abs(fx) > Math.abs(fy)) { fx = Math.sign(fx) || 1; fy = 0; }
            else { fx = 0; fy = Math.sign(fy) || 1; }
