                if (e.touches.length < 2) game.panning = false;
                if (!game.panning) endInput();
            }, { passive: false });

            c.addEventListener('mousedown', e => startInput(e.clientX, e.clientY));
            c.addEventListener('mousemove', e => moveInput(e.clientX, e.clientY));
            c.addEventListener('mouseup', e => endInput());
            c.addEventListener('contextmenu', e => e.preventDefault());

            const minimap = document.getElementById('minimap');
            const jumpCameraTo = (clientX, clientY) => {
                const rect = minimap.getBoundingClientRect();
                const mx = clientX - rect.left;
                const my = clientY - rect.top;
                const scale = MINIMAP_SCALE;
                const worldX = mx / scale;
                const worldY = my / scale;
                game.camera.x = worldX * TILE - game.width / 2;
                game.camera.y = worldY * TILE - game.height / 2;
                clampCamera();
            };
            minimap.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();
                jumpCameraTo(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });
            minimap.addEventListener('mousedown', e => {
                e.stopPropagation();
                jumpCameraTo(e.clientX, e.clientY);
            });
        }

        function startInput(x, y) {
            game.mouse.down = true;
            game.mouse.startX = x;
            game.mouse.startY = y;
            game.mouse.curX = x;
            game.mouse.curY = y;

            if (game.isBuildMode && game.buildType === 'wall') {
                const wx = (x + game.camera.x) / TILE;
                const wy = (y + game.camera.y) / TILE;
                game.wallDragStart = { x: Math.floor(wx), y: Math.floor(wy) };
                return;
            }
            game.wallDragStart = null;
            if (game.isBuildMode) { game.dragMode = null; return; }

            // Decide up front whether this drag pans the camera or box-selects units: starting
            // on one of your own units/buildings keeps the old box-select (handy for grabbing a
            // cluster of troops); starting on open ground pans the map instead, since that's the
            // far more common thing a one-finger drag is for. Two-finger drag still always pans.
            const wx = (x + game.camera.x) / TILE;
            const wy = (y + game.camera.y) / TILE;
            let onOwnUnit = false;
            for (const u of game.units) {
                if (u.owner === 0 && u.hp > 0 && Math.hypot(u.x - wx, u.y - wy) < 1.2) { onOwnUnit = true; break; }
            }
            game.dragMode = onOwnUnit ? 'select' : 'pan';
            game.singlePanLast = { x, y };
        }

        function moveInput(x, y) {
            if (!game.mouse.down) return;
            game.mouse.curX = x;
            game.mouse.curY = y;

            if (game.isBuildMode && game.buildType === 'wall' && game.wallDragStart) {
                const wx = (x + game.camera.x) / TILE;
                const wy = (y + game.camera.y) / TILE;
                const tiles = computeWallDragTiles(game.wallDragStart.x, game.wallDragStart.y, Math.floor(wx), Math.floor(wy));
                game.wallPreview = tiles;
                game.wallAnchor = game.wallDragStart;
                document.getElementById('selection-info').textContent = tiles.every(t => t.valid)
                    ? '✅ Clear — lift your finger to build'
                    : '⚠️ Red tiles are blocked';
                return;
            }

            if (!game.isBuildMode && game.dragMode === 'pan' && game.singlePanLast) {
                game.camera.x -= x - game.singlePanLast.x;
                game.camera.y -= y - game.singlePanLast.y;
                clampCamera();
                game.singlePanLast = { x, y };
            }
        }

        function endInput() {
            if (!game.mouse.down) return;
            game.mouse.down = false;

            if (game.isBuildMode && game.buildType === 'wall' && game.wallDragStart) {
                const dx = game.mouse.curX - game.mouse.startX;
                const dy = game.mouse.curY - game.mouse.startY;
                const movedTiles = Math.max(Math.abs(dx), Math.abs(dy)) / TILE;
                game.wallDragStart = null;
                if (movedTiles < 0.6) {
                    // Barely moved — treat it as a tap-to-anchor instead, so the orientation
                    // buttons + Place button still work for precise, no-drag placement.
                    setWallPreview(Math.floor((game.mouse.curX + game.camera.x) / TILE), Math.floor((game.mouse.curY + game.camera.y) / TILE));
                } else if (game.wallPreview && game.wallPreview.every(t => t.valid)) {
                    placeWallPreview();
                } else {
                    document.getElementById('selection-info').textContent = '⚠️ Blocked — try drawing it somewhere clear';
                    game.wallPreview = null;
                    game.wallAnchor = null;
                }
                renderOptionsPanel();
                return;
            }

            const dx = game.mouse.curX - game.mouse.startX;
            const dy = game.mouse.curY - game.mouse.startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 10) {
                handleTap(game.mouse.curX, game.mouse.curY);
            } else if (!game.isBuildMode && game.dragMode === 'select') {
                const minX = Math.min(game.mouse.startX, game.mouse.curX) + game.camera.x;
                const maxX = Math.max(game.mouse.startX, game.mouse.curX) + game.camera.x;
                const minY = Math.min(game.mouse.startY, game.mouse.curY) + game.camera.y;
                const maxY = Math.max(game.mouse.startY, game.mouse.curY) + game.camera.y;
                game.selected = game.units.filter(u => u.owner === 0 && u.x * TILE >= minX && u.x * TILE <= maxX && u.y * TILE >= minY && u.y * TILE <= maxY);
                updateSelectionUI();
            }
            game.dragMode = null;
        }

        function buildCountOf(type) {
            return game.buildings.filter(b => b.type === type && b.owner === 0 && b.hp > 0).length;
        }

        function handleTap(sx, sy) {
            const wx = (sx + game.camera.x) / TILE;
            const wy = (sy + game.camera.y) / TILE;

            if (game.isBuildMode && game.buildType === 'wall') {
                setWallPreview(Math.floor(wx), Math.floor(wy));
                return;
            }

            if (game.isBuildMode && game.buildType) {
                const type = game.buildType;
                const bx = Math.floor(wx);
                const by = Math.floor(wy);
                if (buildCountOf(type) >= BUILD_LIMITS[type]) {
                    document.getElementById('selection-info').textContent = '⚠️ Max ' + BUILDING_TYPES[type].name + ' reached (' + BUILD_LIMITS[type] + ')';
                    return;
                }
                if (isBuildable(bx, by, type)) {
                    game.buildings.push(new Building(type, bx, by, 0));
                    game.effects.push({ x: bx + 0.5, y: by + 0.5, timer: 0.3, maxTimer: 0.3, color: '#4af' });
                    document.getElementById('selection-info').textContent = '🎯 Tap to place another ' + BUILDING_TYPES[type].name +
                        ' (' + buildCountOf(type) + '/' + BUILD_LIMITS[type] + ')';
                    renderOptionsPanel();
                } else {
                    document.getElementById('selection-info').textContent = '⚠️ Cannot build there — try another spot';
                }
                return;
            }

            let found = null;
            for (const u of game.units) {
                if (u.hp <= 0) continue;
                const d = Math.sqrt((u.x - wx) ** 2 + (u.y - wy) ** 2);
                if (d < 1.2) { found = u; break; }
            }
            if (!found) {
                for (const b of game.buildings) {
                    if (b.hp <= 0) continue;
                    if (wx >= b.x - 0.5 && wx < b.x + b.size + 0.5 && wy >= b.y - 0.5 && wy < b.y + b.size + 0.5) {
                        found = b;
                        break;
                    }
                }
            }

            if (found && found.owner === 0) {
                game.selected = [found];
                updateSelectionUI();
            } else if (found && found.owner === 1) {
                const selUnits = game.selected.filter(u => u instanceof Unit && u.owner === 0);
                for (const u of selUnits) {
                    u.moveGoal = null;
                    u.path = null;
                    if (found instanceof Unit) {
                        u.targetUnit = found;
                        u.targetBuilding = null;
                    } else {
                        u.targetBuilding = found;
                        u.targetUnit = null;
                    }
                }
            } else {
                const selUnits = game.selected.filter(u => u instanceof Unit && u.owner === 0);
                for (const u of selUnits) {
                    issueMoveOrder(u, wx, wy);
                }
                if (selUnits.length > 0) {
                    game.lastTactic = null;
                    game.lastMoveTarget = { x: wx, y: wy };
                }
            }
        }

        // Trees may now be built on top of (they no longer block placement — only water and the Hub do).
        // They still block plain movement everywhere else (see tileBlocked).
        //
        // This now checks the FULL footprint of the building being placed (previously it only
        // ever checked a single tile, even for 2x2/3x3 buildings) and only blocks on a genuine
        // overlap with another structure — no extra buffer tile around existing buildings. That
        // buffer was the bug that made barricades refuse to go down in what looked like empty
        // squares right next to a wall or tower; it's gone now, so barricades can be placed
        // edge-to-edge anywhere that isn't water, the Hub, or another building's own tile(s).
        function isBuildable(x, y, type) {
            const size = (BUILDING_TYPES[type] && BUILDING_TYPES[type].size) || 1;
            for (let dy = 0; dy < size; dy++) {
                for (let dx = 0; dx < size; dx++) {
                    const tx = x + dx, ty = y + dy;
                    if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return false;
                    const tile = map[ty][tx];
                    if (tile === TILE_WATER || tile === TILE_HUB) return false;
                }
            }
            for (const b of game.buildings) {
                if (b.hp <= 0) continue;
                if (x < b.x + b.size && x + size > b.x && y < b.y + b.size && y + size > b.y) return false;
            }
            return true;
        }

        // ========== WALL PLACEMENT (tap to preview, pick orientation, place — or drag to draw) ==========
        // Builds a straight line of tiles from (startX,startY) toward (curX,curY), locked to
        // whichever axis the drag moved further along, clamped to WALL_MAX_LEN. Used by the
        // drag-to-draw gesture in moveInput/endInput below.
        function computeWallDragTiles(startX, startY, curX, curY) {
            const dx = curX - startX, dy = curY - startY;
            const horizontal = Math.abs(dx) >= Math.abs(dy);
            const rawLen = horizontal ? Math.abs(dx) : Math.abs(dy);
            const len = Math.min(WALL_MAX_LEN, Math.max(1, rawLen + 1));
            const stepX = horizontal ? (dx < 0 ? -1 : 1) : 0;
            const stepY = horizontal ? 0 : (dy < 0 ? -1 : 1);
            const tiles = [];
            for (let i = 0; i < len; i++) tiles.push({ x: startX + stepX * i, y: startY + stepY * i });
            tiles.forEach(t => { t.valid = isBuildable(t.x, t.y, 'wall'); });
            return tiles;
        }

        function setWallPreview(tileX, tileY) {
            const tiles = [];
            for (let i = 0; i < WALL_MAX_LEN; i++) {
                if (game.wallOrientation === 'horizontal') tiles.push({ x: tileX + i, y: tileY });
                else tiles.push({ x: tileX, y: tileY + i });
            }
            tiles.forEach(t => { t.valid = isBuildable(t.x, t.y, 'wall'); });
            game.wallPreview = tiles;
            game.wallAnchor = { x: tileX, y: tileY };
            document.getElementById('selection-info').textContent = tiles.every(t => t.valid)
                ? '✅ Clear — tap Place to build'
                : '⚠️ Red tiles are blocked — tap elsewhere';
        }

        function setWallOrientation(dir) {
            game.wallOrientation = dir;
            if (game.wallAnchor) setWallPreview(game.wallAnchor.x, game.wallAnchor.y);
            renderOptionsPanel();
        }

        function placeWallPreview() {
            if (!game.wallPreview || !game.wallPreview.every(t => t.valid)) {
                document.getElementById('selection-info').textContent = '⚠️ Blocked — move the preview to a clear area';
                return;
            }
            if (buildCountOf('wall') + game.wallPreview.length > BUILD_LIMITS.wall) {
                document.getElementById('selection-info').textContent = '⚠️ Max walls reached (' + BUILD_LIMITS.wall + ')';
                return;
            }
            for (const t of game.wallPreview) {
                game.buildings.push(new Building('wall', t.x, t.y, 0));
                game.effects.push({ x: t.x + 0.5, y: t.y + 0.5, timer: 0.2, maxTimer: 0.2, color: '#ccc' });
            }
            game.wallPreview = null;
            game.wallAnchor = null;
            document.getElementById('selection-info').textContent = '🎯 Tap the map to place another wall (' + buildCountOf('wall') + '/' + BUILD_LIMITS.wall + ')';
            renderOptionsPanel();
        }

        function cancelBuildMode() {
            game.isBuildMode = false;
            game.buildType = null;
            game.wallPreview = null;
            game.wallAnchor = null;
            game.wallDragStart = null;
            document.getElementById('selection-info').textContent = '';
            renderOptionsPanel();
        }

        // ========== SELECTION / TAB UI ==========
        function updateSelectionUI() {
            const sel = game.selected;
            const info = document.getElementById('selection-info');
            if (sel.length === 0) {
                info.textContent = '';
                return;
            }
            if (sel.length === 1 && sel[0] instanceof Building) {
                info.textContent = sel[0].def.icon + ' ' + sel[0].def.name + ' — HP: ' + Math.ceil(sel[0].hp) + '/' + sel[0].maxHp;
                return;
            }
            if (sel.length > 0 && sel[0] instanceof Unit) {
                info.textContent = '👥 ' + sel.length + ' unit(s) selected — tap ground to move, enemy to attack';
                return;
            }
            info.textContent = 'Selection';
        }

        function setupTabBar() {
            document.getElementById('tab-build').onclick = () => selectTab('build');
            document.getElementById('tab-tactics').onclick = () => selectTab('tactics');
            document.getElementById('tab-units').onclick = () => selectTab('units');
        }

        function selectTab(tab) {
            if (game.activeTab === tab) {
                game.activeTab = null;
                if (game.isBuildMode) cancelBuildMode();
            } else {
                game.activeTab = tab;
                if (tab !== 'build' && game.isBuildMode) cancelBuildMode();
            }
            updateTabHighlights();
            renderOptionsPanel();
        }

        function updateTabHighlights() {
            ['build', 'tactics', 'units'].forEach(t => {
                document.getElementById('tab-' + t).classList.toggle('active-tab', game.activeTab === t);
            });
        }

        function renderOptionsPanel() {
            const panel = game.optionsPanel;
            panel.innerHTML = '';
            if (!game.activeTab) { panel.classList.remove('show'); return; }
            panel.classList.add('show');
            if (game.activeTab === 'build') renderBuildOptions(panel);
            else if (game.activeTab === 'tactics') renderTacticsOptions(panel);
            else if (game.activeTab === 'units') renderUnitOptions(panel);
        }

        function addInfoLine(panel, text) {
            const info = document.createElement('div');
            info.style.cssText = 'grid-column:1/-1;width:100%;text-align:center;color:#e8d9b0;font-size:11px;margin-bottom:2px;';
            info.textContent = text;
            panel.appendChild(info);
        }

        function renderBuildOptions(panel) {
            if (game.isBuildMode && game.buildType === 'wall') {
                addInfoLine(panel, 'Drag to draw a wall (or tap for a straight run) — Walls: ' + buildCountOf('wall') + '/' + BUILD_LIMITS.wall);

                const hBtn = document.createElement('button');
                hBtn.textContent = '↔ Horizontal';
                if (game.wallOrientation === 'horizontal') hBtn.classList.add('active-build');
                hBtn.onclick = () => setWallOrientation('horizontal');
                panel.appendChild(hBtn);

                const vBtn = document.createElement('button');
                vBtn.textContent = '↕ Vertical';
                if (game.wallOrientation === 'vertical') vBtn.classList.add('active-build');
                vBtn.onclick = () => setWallOrientation('vertical');
                panel.appendChild(vBtn);

                const placeBtn = document.createElement('button');
                placeBtn.textContent = '✅ Place';
                placeBtn.onclick = placeWallPreview;
                panel.appendChild(placeBtn);

                const stopBtn = document.createElement('button');
                stopBtn.textContent = '❌ Stop Placing';
                stopBtn.onclick = cancelBuildMode;
                panel.appendChild(stopBtn);
                return;
            }

            if (game.isBuildMode && game.buildType) {
                const type = game.buildType;
                addInfoLine(panel, 'Tap the map to place ' + BUILDING_TYPES[type].name + ' (' + buildCountOf(type) + '/' + BUILD_LIMITS[type] + ')');
                const stopBtn = document.createElement('button');
                stopBtn.textContent = '❌ Stop Placing';
                stopBtn.onclick = cancelBuildMode;
                panel.appendChild(stopBtn);
                return;
            }

            const types = ['wall', 'tower', 'triage'];
            types.forEach(t => {
                const btn = document.createElement('button');
                const count = buildCountOf(t);
                const limit = BUILD_LIMITS[t];
                btn.textContent = (t === 'wall' ? '▬ Wall' : BUILDING_TYPES[t].icon + ' ' + BUILDING_TYPES[t].name) + ' (' + count + '/' + limit + ')';
                if (count >= limit) btn.disabled = true;
                btn.onclick = () => {
                    game.isBuildMode = true;
                    game.buildType = t;
                    if (t === 'wall') {
                        game.wallPreview = null;
                        game.wallAnchor = null;
                        game.wallDragStart = null;
                        document.getElementById('selection-info').textContent = '🎯 Drag to draw a wall';
                    } else {
                        document.getElementById('selection-info').textContent = '🎯 Tap a location to place ' + BUILDING_TYPES[t].name;
                    }
                    renderOptionsPanel();
                };
                panel.appendChild(btn);
            });
        }

        function renderTacticsOptions(panel) {
            const defs = [
                { key: 'withdraw', label: '↩ Withdraw' },
                { key: 'closed', label: '▣ Closed Wall' },
                { key: 'open', label: '▢ Open Wall' },
                { key: 'staggered', label: '▦ Staggered Wall' },
                { key: 'circle', label: '⭕ Ring Formation' },
                { key: 'focus', label: '🎯 Focus Fire' },
                { key: 'hold', label: '✋ Hold Position' },
            ];
            defs.forEach(d => {
                const btn = document.createElement('button');
                btn.textContent = d.label;
                btn.onclick = () => applyTactic(d.key);
                panel.appendChild(btn);
            });
            const targetBtn = document.createElement('button');
            targetBtn.textContent = game.targetMode === 'strongest' ? '💪 Target: Strongest' : '🎯 Target: Closest';
            targetBtn.onclick = () => {
                game.targetMode = game.targetMode === 'strongest' ? 'closest' : 'strongest';
                document.getElementById('selection-info').textContent = 'Targeting mode: ' + game.targetMode;
                renderOptionsPanel();
            };
            panel.appendChild(targetBtn);
        }

        function renderUnitOptions(panel) {
            const types = ['sword', 'spear', 'archer'];
            types.forEach(t => {
                const def = UNIT_TYPES[t];
                const btn = document.createElement('button');
                btn.textContent = def.icon + ' ' + def.name + ' (' + def.trainTime + 's)';
                btn.onclick = () => {
                    if (game.unitCount + game.queue.length >= game.maxUnits) {
                        document.getElementById('selection-info').textContent = '⚠️ Unit limit reached!';
                        return;
                    }
                    game.queue.push(t);
                    updateHubUI();
                };
                panel.appendChild(btn);
            });
            const info = document.createElement('div');
            info.id = 'queue-info';
            info.style.cssText = 'grid-column:1/-1;width:100%;text-align:center;color:#e8d9b0;font-size:11px;margin-top:2px;';
            panel.appendChild(info);
            updateHubUI();
        }

        function updateHubUI() {
            const q = document.getElementById('queue-info');
            if (!q) return;
            q.textContent = 'Queue: ' + (game.queue.length === 0 ? 'empty' : game.queue.map(t => UNIT_TYPES[t].icon).join(' '));
        }

        // ========== TACTICS / FORMATIONS ==========
        function applyTactic(kind) {
            game.lastTactic = kind;
            game.lastMoveTarget = null;
            const units = game.units.filter(u => u.owner === 0 && u.hp > 0);
            if (units.length === 0) return;

            if (kind === 'hold') {
                units.forEach(u => {
                    u.moveGoal = null;
                    u.path = null;
                    u.targetX = u.x;
                    u.targetY = u.y;
                    u.targetUnit = null;
                    u.targetBuilding = null;
                });
                document.getElementById('selection-info').textContent = '✋ All units holding position';
                return;
            }

            const hub = game.hub;
            const cx = hub.x + hub.size / 2;
            const cy = hub.y + hub.size / 2;

            if (kind === 'focus') {
                // Every unit switches to attacking whichever enemy is closest to the Hub — the
                // most urgent threat — instead of each fighting whatever's nearest to itself.
                let target = null, bestD = Infinity;
                for (const e of game.units) {
                    if (e.owner === 1 && e.hp > 0) {
                        const d = Math.hypot((e.x) - cx, (e.y) - cy);
                        if (d < bestD) { bestD = d; target = e; }
                    }
                }
                if (!target) {
                    document.getElementById('selection-info').textContent = '🎯 No enemies in sight to focus on';
                    return;
                }
                units.forEach(u => {
                    u.targetUnit = target;
                    u.targetBuilding = null;
                });
                document.getElementById('selection-info').textContent = '🎯 Focusing fire on the closest threat';
                return;
            }

            if (kind === 'withdraw') {
                assignPositions(units, getWithdrawPositions(cx, cy, units.length));
                document.getElementById('selection-info').textContent = '↩ Units withdrawing to the Hub';
                return;
            }
            if (kind === 'closed') {
                assignClosedWallFormation(units, cx, cy, hub.size);
                document.getElementById('selection-info').textContent = '▣ Forming a shield wall — equal unit types on each side';
                return;
            }
            if (kind === 'open') {
                assignPositions(units, getRingPositions(cx, cy, hub.size, 6));
                document.getElementById('selection-info').textContent = '▢ Forming a wide box around the Hub';
                return;
            }
            if (kind === 'staggered') {
                const half = Math.round(hub.size / 2 + 6);
                const sides = squareRingSides(Math.round(cx), Math.round(cy), half);
                const positions = staggerSides(sides).filter(p => !tileBlocked(Math.floor(p.x), Math.floor(p.y)));
                assignPositions(units, positions);
                document.getElementById('selection-info').textContent = '▦ Forming a staggered box around the Hub';
                return;
            }
            if (kind === 'circle') {
                assignCircleFormation(units, cx, cy, hub.size);
                document.getElementById('selection-info').textContent = '⭕ Ring formed — Bats & Poles outside, Armed sheltered within';
            }
        }

        // Ring Formation: swords and spears take the outer ring (facing outward, first to meet
        // anything closing in), archers take a tighter inner ring between them and the Hub so
        // they keep firing over/through the line without being the first thing an enemy reaches.
        function assignCircleFormation(units, cx, cy, hubSize) {
            const melee = units.filter(u => u.type === 'sword' || u.type === 'spear');
            const archers = units.filter(u => u.type === 'archer');
            const outerRadius = Math.round(hubSize / 2) + 5;
            const innerRadius = Math.round(hubSize / 2) + 2;
            assignPositions(melee, getCirclePositions(cx, cy, outerRadius, melee.length));
            assignPositions(archers, getCirclePositions(cx, cy, innerRadius, archers.length));
        }

        // Evenly spaced points on a true circle (not a square box) around the hub, nudged
        // outward along the same angle if a spot lands on water/a building.
        function getCirclePositions(cx, cy, radius, count) {
            if (count <= 0) return [];
            const positions = [];
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                let r = radius;
                let x = cx + Math.cos(angle) * r;
                let y = cy + Math.sin(angle) * r;
                let tries = 0;
                while (tileBlocked(Math.floor(x), Math.floor(y)) && tries < 5) {
                    r += 1;
                    x = cx + Math.cos(angle) * r;
                    y = cy + Math.sin(angle) * r;
                    tries++;
                }
                positions.push({ x, y });
            }
            return positions;
        }

        function getWithdrawPositions(cx, cy, count) {
            const positions = [];
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const ring = 2 + (i % 3); // layer units in rings so they don't all aim for one spot
                let x = cx + Math.cos(angle) * ring;
                let y = cy + Math.sin(angle) * ring;
                if (tileBlocked(Math.floor(x), Math.floor(y))) { x = cx; y = cy; }
                positions.push({ x, y });
            }
            return positions;
        }

        // Shield Wall: every unit TYPE is spread evenly across all 4 sides, so each side ends up with a
        // matching mix of swords/spears/archers rather than whichever units happened to be nearest.
        function assignClosedWallFormation(units, cx, cy, hubSize) {
            const gap = 3;
            const half = Math.round(hubSize / 2) + gap;
            const sidesOrder = ['top', 'right', 'bottom', 'left'];
            const byType = { sword: [], spear: [], archer: [] };
            units.forEach(u => { if (byType[u.type]) byType[u.type].push(u); });

            const sideGroups = { top: [], right: [], bottom: [], left: [] };
            Object.keys(byType).forEach((type, ti) => {
                byType[type].forEach((u, i) => {
                    const side = sidesOrder[(i + ti) % 4]; // stagger the starting side per type so leftovers don't stack on one side
                    sideGroups[side].push(u);
                });
            });

            sidesOrder.forEach(side => {
                const group = sideGroups[side];
                group.forEach((u, i) => {
                    const offset = i - (group.length - 1) / 2;
                    let x, y;
                    if (side === 'top') { x = cx + offset; y = cy - half; }
                    else if (side === 'bottom') { x = cx + offset; y = cy + half; }
                    else if (side === 'left') { x = cx - half; y = cy + offset; }
                    else { x = cx + half; y = cy + offset; }
                    let r = 1;
                    while (r < 5 && tileBlocked(Math.floor(x), Math.floor(y))) {
                        if (side === 'top') y -= 1; else if (side === 'bottom') y += 1;
                        else if (side === 'left') x -= 1; else x += 1;
                        r++;
                    }
                    issueMoveOrder(u, x, y);
                });
            });
        }

        // A full box ring at a given tile-gap from the hub edge (used by "open" and as the base for "staggered").
        function getRingPositions(cx, cy, hubSize, gap) {
            const half = Math.round(hubSize / 2 + gap);
            const sides = squareRingSides(Math.round(cx), Math.round(cy), half);
            return sidesToArray(sides).filter(p => !tileBlocked(Math.floor(p.x), Math.floor(p.y)));
        }

        function squareRingSides(cx, cy, half) {
            const sides = { top: [], right: [], bottom: [], left: [] };
            for (let x = -half; x <= half; x++) sides.top.push({ x: cx + x, y: cy - half });
            for (let y = -half + 1; y <= half; y++) sides.right.push({ x: cx + half, y: cy + y });
            for (let x = half - 1; x >= -half; x--) sides.bottom.push({ x: cx + x, y: cy + half });
            for (let y = half - 1; y >= -half + 1; y--) sides.left.push({ x: cx - half, y: cy + y });
            return sides;
        }

        function sidesToArray(sides) {
            return [...sides.top, ...sides.right, ...sides.bottom, ...sides.left];
        }

        // Same ring as "open" but every unit steps in/out to zig-zag around it.
        function staggerSides(sides) {
            const out = [];
            for (const key of Object.keys(sides)) {
                const arr = sides[key];
                arr.forEach((p, i) => {
                    const stepOut = Math.floor(i / 2) % 2 === 0;
                    const off = stepOut ? 1 : -1;
                    let np = { x: p.x, y: p.y };
                    if (key === 'top') np.y -= off;
                    else if (key === 'bottom') np.y += off;
                    else if (key === 'left') np.x -= off;
                    else if (key === 'right') np.x += off;
                    out.push(np);
                });
            }
            return out;
        }

        function assignPositions(units, positions) {
            if (positions.length === 0) return;
            const avail = positions.slice();
            for (const u of units) {
                let p;
                if (avail.length > 0) {
                    let bestIdx = 0, bestD = Infinity;
                    for (let i = 0; i < avail.length; i++) {
                        const d = (avail[i].x - u.x) ** 2 + (avail[i].y - u.y) ** 2;
                        if (d < bestD) { bestD = d; bestIdx = i; }
                    }
                    p = avail.splice(bestIdx, 1)[0];
                } else {
                    const src = positions[Math.floor(Math.random() * positions.length)];
                    p = { x: src.x + (Math.random() - 0.5), y: src.y + (Math.random() - 0.5) };
                }
                issueMoveOrder(u, p.x, p.y);
            }
        }

        // ========== TRAINING ==========
        function updateTraining(dt) {
            if (game.queue.length > 0) {
                game.queueTimer += dt;
                const type = game.queue[0];
                if (game.queueTimer >= UNIT_TYPES[type].trainTime) {
                    game.queue.shift();
                    game.queueTimer = 0;
                    const hx = game.hub.x + game.hub.size + 1;
                    const hy = game.hub.y + Math.floor(game.hub.size / 2) + (Math.random() - 0.5) * 2;
                    const recruit = new Unit(type, hx, hy, 0);
                    game.units.push(recruit);
                    game.unitCount = game.units.length;
                    game.totalUnitsTrained++;
                    game.effects.push({ x: hx, y: hy, timer: 0.3, maxTimer: 0.3, color: '#ffd76a' });
                    // Join whatever the army was last told to do, instead of just standing by
                    // the Hub — re-running the last tactic folds the recruit straight into the
                    // current formation alongside everyone else.
                    if (game.lastTactic) {
                        applyTactic(game.lastTactic);
                    } else if (game.lastMoveTarget) {
                        issueMoveOrder(recruit, game.lastMoveTarget.x + (Math.random() - 0.5), game.lastMoveTarget.y + (Math.random() - 0.5));
                    }
                    updateHubUI();
                }
            } else {
                game.queueTimer = 0;
            }
        }

        // ========== WAVES ==========
        // Raiders now push in from all four compass directions instead of a handful of fixed
        // points. Each wave rolls a random "pressure pattern" — sometimes even pressure on
        // every side, sometimes a heavy assault from one or two directions while the rest stay
        // quiet — so it's never predictable which side needs the strongest defence.
        const WAVE_DIR_PATTERNS = [
            { N: 1, S: 1, E: 1, W: 1 },   // even pressure from every side
            { N: 3, S: 1, E: 1, W: 1 },   // heavy north
            { N: 1, S: 3, E: 1, W: 1 },   // heavy south
            { N: 1, S: 1, E: 3, W: 1 },   // heavy east
            { N: 1, S: 1, E: 1, W: 3 },   // heavy west
            { N: 2, S: 2, E: 1, W: 1 },   // two-sided push, north+south
            { N: 1, S: 1, E: 2, W: 2 },   // two-sided push, east+west
            { N: 2, S: 1, E: 2, W: 1 },   // two-sided push, north+east
            { N: 1, S: 2, E: 1, W: 2 },   // two-sided push, south+west
            { N: 4, S: 1, E: 1, W: 1 },   // near-total focus on one side
        ];

        function pickWaveDirectionWeights() {
            return WAVE_DIR_PATTERNS[Math.floor(Math.random() * WAVE_DIR_PATTERNS.length)];
        }

        function pickWeightedDirection(weights) {
            const total = weights.N + weights.S + weights.E + weights.W;
            let r = Math.random() * total;
            for (const dir of ['N', 'S', 'E', 'W']) {
                if (r < weights[dir]) return dir;
                r -= weights[dir];
            }
            return 'N';
        }

        // A random point along the given edge, well clear of the map corners and (thanks to
        // generateMap keeping the edges dry) never inside water.
        function spawnPointForDirection(dir) {
            if (dir === 'N') return { x: 3 + Math.floor(Math.random() * (MAP_W - 6)), y: 1 };
            if (dir === 'S') return { x: 3 + Math.floor(Math.random() * (MAP_W - 6)), y: MAP_H - 2 };
            if (dir === 'E') return { x: MAP_W - 2, y: 3 + Math.floor(Math.random() * (MAP_H - 6)) };
            return { x: 1, y: 3 + Math.floor(Math.random() * (MAP_H - 6)) }; // W
        }

        // Shorter gaps between waves and noticeably bigger waves, so there's a steady, visible
        // stream of raiders rather than a trickle every 30-50 seconds.
        function updateWaves(dt) {
            game.waveTimer -= dt;
            if (game.waveTimer <= 0 && !game.gameOver) {
                const waveSize = 6 + Math.floor(game.waveNumber * 1.3);
                const weights = pickWaveDirectionWeights();
                const availableTypes = ['sword', 'spear', 'archer'];
                for (let i = 0; i < waveSize; i++) {
                    const dir = pickWeightedDirection(weights);
                    const spawn = spawnPointForDirection(dir);
                    const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
                    const e = new Unit(type, spawn.x, spawn.y, 1);
                    issueMoveOrder(e, game.hub.x + game.hub.size / 2, game.hub.y + game.hub.size / 2);
                    e.hp = e.maxHp = Math.round(e.def.hp * (1 + game.waveNumber * 0.05));
                    game.units.push(e);
                }
                game.waveNumber++;
                game.waveTimer = Math.max(9, 20 - game.waveNumber * 0.25);
                announceWave();
                if (game.waveNumber % 5 === 0) {
                    showInterstitialAd();
                }
            }
        }

        function announceWave() {
            const banner = game.waveBanner;
            banner.textContent = '🌊 WAVE ' + (game.waveNumber - 1);
            banner.classList.remove('show');
            void banner.offsetWidth;
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 1500);
        }

        // ========== PROJECTILES ==========
        function updateProjectiles(dt) {
            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                const p = game.projectiles[i];
                if (!p.target || p.target.hp <= 0) {
                    game.projectiles.splice(i, 1);
                    continue;
                }
                let tx, ty;
                if (p.target instanceof Building) {
                    tx = p.target.x + p.target.size / 2;
                    ty = p.target.y + p.target.size / 2;
                } else {
                    tx = p.target.x;
                    ty = p.target.y;
                }
                const dx = tx - p.x;
                const dy = ty - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                p.angle = Math.atan2(dy, dx);
                if (dist < 0.6) {
                    p.target.hp -= (p.dmg || 10);
                    p.target.hitFlash = 0.18;
                    game.effects.push({ x: tx, y: ty, timer: 0.15, maxTimer: 0.15, color: '#ff8' });
                    game.projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed * dt;
                    p.y += (dy / dist) * p.speed * dt;
                }
            }
        }

        // ========== EFFECTS & PULSE RINGS ==========
        function updateEffects(dt) {
            for (let i = game.effects.length - 1; i >= 0; i--) {
                game.effects[i].timer -= dt;
                if (game.effects[i].timer <= 0) game.effects.splice(i, 1);
            }
            for (let i = game.pulseRings.length - 1; i >= 0; i--) {
                const ring = game.pulseRings[i];
                ring.timer -= dt;
                ring.radius += (ring.maxRadius - ring.radius) * dt * 3;
                if (ring.timer <= 0) game.pulseRings.splice(i, 1);
            }
        }

        // ========== MAIN LOOP ==========
        function loop(t) {
            const dt = Math.min((t - game.lastTime) / 1000, 0.05);
            game.lastTime = t;

            if (!game.gameOver) {
                game.gridRebuildTimer -= dt;
                if (game.gridRebuildTimer <= 0) {
                    game.blockedGrid = buildBlockedGrid();
                    game.gridRebuildTimer = 1.0;
                }

                buildSpatialHash();
                for (const u of game.units) u.update(dt);
                for (const u of game.units) {
                    if (u.hp <= 0 && u.owner === 1) game.kills++;
                }
                game.units = game.units.filter(u => u.hp > 0);
                game.unitCount = game.units.length;

                for (const b of game.buildings) b.update(dt);
                game.buildings = game.buildings.filter(b => b.hp > 0 || b === game.hub);
                if (game.hub.hp <= 0) {
                    game.gameOver = true;
                    gameOver(false);
                }

                updateTraining(dt);
                updateWaves(dt);
                updateProjectiles(dt);
                updateEffects(dt);
                updateStats();
            }

            render();
            requestAnimationFrame(loop);
        }

        // ========== RENDER ==========
        function render() {
            const ctx = game.ctx;
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, game.width, game.height);

            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    const px = x * TILE - game.camera.x;
                    const py = y * TILE - game.camera.y;
                    if (px < -TILE || py < -TILE || px > game.width + TILE || py > game.height + TILE) continue;
                    const tile = map[y][x];
                    if (tile === TILE_TREE) {
                        ctx.drawImage(tileCanvases[TILE_GRASS], px, py);
                        drawTree(ctx, px, py, x, y);
                    } else {
                        ctx.drawImage(tileCanvases[tile], px, py);
                    }
                }
            }

            if (game.wallPreview) {
                for (const wt of game.wallPreview) {
                    const px = wt.x * TILE - game.camera.x;
                    const py = wt.y * TILE - game.camera.y;
                    ctx.fillStyle = wt.valid ? 'rgba(80,220,120,0.4)' : 'rgba(220,80,80,0.45)';
                    ctx.fillRect(px, py, TILE, TILE);
                    ctx.strokeStyle = wt.valid ? '#5adf82' : '#e05a5a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
                }
            }

            for (const ring of game.pulseRings) {
                const px = ring.x * TILE - game.camera.x;
                const py = ring.y * TILE - game.camera.y;
                const alpha = ring.timer / ring.maxTimer;
                ctx.strokeStyle = ring.color + (alpha * 0.7) + ')';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.arc(px, py, ring.radius * TILE, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = ring.color + (alpha * 0.1) + ')';
                ctx.beginPath();
                ctx.arc(px, py, ring.radius * TILE, 0, Math.PI * 2);
                ctx.fill();
            }

            for (const b of game.buildings) b.draw(ctx, game.camera);
            for (const u of game.units) u.draw(ctx, game.camera);

            for (const p of game.projectiles) {
                const px = p.x * TILE - game.camera.x;
                const py = p.y * TILE - game.camera.y;
                if (p.kind === 'bullet') drawBullet(ctx, px, py, p.angle || 0, p.tint || '#ffe9a8');
                else drawArrow(ctx, px, py, p.angle || 0, p.tint || '#e8d9b0');
            }

            for (const e of game.effects) drawEffect(ctx, e, game.camera);

            if (game.mouse.down && Math.abs(game.mouse.curX - game.mouse.startX) > 5 && !game.isBuildMode) {
                const minX = Math.min(game.mouse.startX, game.mouse.curX);
                const minY = Math.min(game.mouse.startY, game.mouse.curY);
                const w = Math.abs(game.mouse.curX - game.mouse.startX);
                const h = Math.abs(game.mouse.curY - game.mouse.startY);
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);
                ctx.strokeRect(minX, minY, w, h);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(0,255,0,0.12)';
                ctx.fillRect(minX, minY, w, h);
            }

            drawMinimap();
        }

        function drawMinimap() {
            const mctx = game.minimapCtx;
            mctx.fillStyle = '#181510';
            mctx.fillRect(0, 0, MINIMAP_W, MINIMAP_H);
            const scale = MINIMAP_SCALE;
            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    const tile = map[y][x];
                    const colors = {
                        [TILE_GRASS]: '#3d6b2e',
                        [TILE_WATER]: '#3a6a8a',
                        [TILE_TREE]: '#4a5a38',
                        [TILE_PATH]: '#a8894f',
                        [TILE_HUB]: '#c4a35a'
                    };
                    mctx.fillStyle = colors[tile] || '#333';
                    mctx.fillRect(x * scale, y * scale, scale + 0.5, scale + 0.5);
                }
            }
            for (const b of game.buildings) {
                if (b.hp <= 0) continue;
                mctx.fillStyle = b.owner === 0 ? '#ffd700' : '#cc3333';
                mctx.fillRect(b.x * scale, b.y * scale, b.size * scale, b.size * scale);
            }
            for (const u of game.units) {
                if (u.hp <= 0) continue;
                mctx.fillStyle = u.owner === 0 ? '#44cc44' : '#ee3333';
                mctx.fillRect(u.x * scale - 1.5, u.y * scale - 1.5, 3, 3);
            }
            mctx.strokeStyle = 'rgba(255,255,255,0.6)';
            mctx.lineWidth = 1.5;
            mctx.strokeRect(
                game.camera.x / TILE * scale, game.camera.y / TILE * scale,
                game.width / TILE * scale, game.height / TILE * scale
            );
        }

        // ========== GAME OVER ==========
        function gameOver(win) {
            setTimeout(() => {
                alert(win ? '🎉 Victory! Waves survived: ' + game.waveNumber :
                    '💀 Game Over — You lost! Waves survived: ' + game.waveNumber + '\nKills: ' + game.kills);
                location.reload();
            }, 100);
        }

        // ========== ADS ==========
        function showInterstitialAd() {
            console.log('📢 Interstitial ad shown (wave ' + game.waveNumber + ')');
        }

        // ========== STATS ==========
        function updateStats() {
            document.getElementById('hub-hp').textContent = Math.ceil(game.hub.hp);
            document.getElementById('unit-count').textContent = game.unitCount + '/' + game.maxUnits;
            document.getElementById('wave').textContent = game.waveNumber;
            document.getElementById('kills').textContent = game.kills;
            document.getElementById('next-wave').textContent = Math.max(0, Math.ceil(game.waveTimer));
        }

        // ========== START ==========
        window.onload = init;
    </script>
</body>
</html>
